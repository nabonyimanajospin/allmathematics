    - id: eq-1
      statement: "Three coins are tossed together. Find the probability that there are exactly $2$ heads."
      answerType: expression
      answer: "3/8"
      hints:
        - |-
          List the $8$ outcomes or count with $\dbinom32$.
      solution: |-
        There are $2^3=8$ equally likely outcomes. Exactly two heads: choose which $2$ of the $3$ coins show heads, $\dbinom32=3$ outcomes (HHT, HTH, THH). So the probability is $\dfrac38$.
    - id: eq-2a
      statement: A coin is tossed two times. Find the probability of getting at least one tail.
      answerType: expression
      answer: "3/4"
      hints:
        - |-
          Use the complement: no tail at all.
      solution: |-
        The $4$ outcomes HH, HT, TH, TT are equally likely. At least one tail: HT, TH, TT, that is $3$ outcomes. Or by the complement: $1-P(\text{no tail})=1-\dfrac14=\dfrac34$.
    - id: eq-2b
      statement: A coin is tossed two times. Find the probability of getting at most one tail.
      answerType: expression
      answer: "3/4"
      hints:
        - The excluded outcome is two tails.
      solution: |-
        At most one tail means $0$ or $1$ tail: HH, HT, TH, $3$ outcomes among $4$. So $\dfrac34$ (the only excluded outcome is TT).
      note: |-
        The sheet writes 'at least/most one tail'; both readings are asked, and both give $\dfrac34$.
    - id: eq-3
      statement: "A card is drawn at random from an ordinary pack of $52$ cards. Find the chance that it is a court card (king, queen or jack)."
      answerType: expression
      answer: "3/13"
      hints:
        - "$3$ ranks times $4$ suits."
      solution: |-
        There are $3$ court ranks with $4$ suits each: $12$ court cards among $52$. $\dfrac{12}{52}=\dfrac3{13}$.
    - id: eq-4a
      statement: "Two cards are drawn at random from a well-shuffled pack of $52$. Find the probability that each of the two cards is a king or a queen."
      answerType: expression
      answer: "14/663"
      hints:
        - "Choose both cards among the $8$ kings and queens."
      solution: |-
        There are $\dbinom{52}2=1326$ equally likely pairs. There are $8$ kings and queens, and the favorable pairs are the pairs of two of them: $\dbinom82=28$. So $\dfrac{28}{1326}=\dfrac{14}{663}$.
      note: |-
        The sheet's wording 'king or queen' is read as: each of the two cards is a king or a queen.
    - id: eq-4b
      statement: "Two cards are drawn at random from a well-shuffled pack of $52$. Find the probability that one is a king and the other a jack."
      answerType: expression
      answer: "8/663"
      hints:
        - "Choose the king, then the jack."
      solution: |-
        Favorable pairs: one of the $4$ kings and one of the $4$ jacks, $4\cdot4=16$. Total pairs $\dbinom{52}2=1326$. So $\dfrac{16}{1326}=\dfrac8{663}$.
    - id: eq-5
      statement: "Seven cards are drawn at random from a pack of $52$. Find the probability that $4$ are red and $3$ are black."
      answerType: expression
      answer: "1625/5593"
      hints:
        - Choose the red cards and the black cards separately.
      solution: |-
        The pack has $26$ red and $26$ black cards. Favorable hands: $4$ red among $26$ and $3$ black among $26$, $\dbinom{26}4\dbinom{26}3=14950\cdot2600=38870000$. All hands: $\dbinom{52}7=133784560$. The probability is $\dfrac{38870000}{133784560}=\dfrac{1625}{5593}$ after simplifying.
    - id: eq-6
      statement: "Four persons are chosen at random from a group of $3$ men, $2$ women and $4$ children. Find the chance that exactly two of them are children."
      answerType: expression
      answer: "10/21"
      hints:
        - "The two non-children come from the $5$ adults."
      solution: |-
        The group has $9$ people. Favorable choices: $2$ children among $4$, and the other $2$ among the $5$ adults, $\dbinom42\dbinom52=6\cdot10=60$. All choices: $\dbinom94=126$. So $\dfrac{60}{126}=\dfrac{10}{21}$.
    - id: eq-7
      statement: "From $3$ engineers, $4$ doctors and $5$ lawyers a sub-committee of four is selected by lots. Find the probability that it consists of $2$ engineers, $1$ doctor and $1$ lawyer."
      answerType: expression
      answer: "4/33"
      hints:
        - Multiply the choices in each group.
      solution: |-
        Favorable: $\dbinom32\cdot\dbinom41\cdot\dbinom51=3\cdot4\cdot5=60$. All sub-committees: $\dbinom{12}4=495$. So $\dfrac{60}{495}=\dfrac4{33}$.
    - id: eq-8a
      statement: "Three drivers $A,B,C$ are in a race. $A$ is twice as likely to win as $B$, and $B$ is twice as likely to win as $C$. Find the probability that $A$ wins."
      answerType: expression
      answer: "4/7"
      hints:
        - "Call the smallest probability $p$ and express the others with it."
      solution: |-
        Let $P(C)=p$. Then $P(B)=2p$ and $P(A)=2P(B)=4p$. Exactly one of them wins, so $4p+2p+p=1$, $7p=1$, $p=\dfrac17$. Hence $P(C)=\dfrac17$, $P(B)=\dfrac27$, $P(A)=\dfrac47$.
