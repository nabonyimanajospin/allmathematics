id: stat-m01-u02-l02
title: Conditional probability and independence
estMinutes: 45
version: 1
status: draft
skills:
  - conditional-probability
  - multiplication-rule
  - independence
objectives:
  - Compute $P(A\mid B)$ and use the multiplication rule for successive events.
  - Decide whether two events are independent.
sections:
  - id: idea
    type: concept
    title: Probability once something is known
    body: |
      Two dice are thrown and we are told that the sum is $8$. The sample space shrinks to the $5$ outcomes $(2,6)$, $(3,5)$, $(4,4)$, $(5,3)$, $(6,2)$, and the probability that one die shows a six is now $\dfrac25$, not $\dfrac{11}{36}$. Information changes probabilities: we restrict to the outcomes where the known event $B$ occurs, and keep the proportion in which $A$ also occurs.

  - id: definition
    type: definition
    term: Conditional probability
    body: |
      If $P(B)>0$, the **conditional probability of $A$ given $B$** is

      $$P(A\mid B)=\dfrac{P(A\cap B)}{P(B)}.$$

      Rearranged, it gives the **multiplication rule** $P(A\cap B)=P(B)\,P(A\mid B)$, and for three events $P(A\cap B\cap C)=P(A)\,P(B\mid A)\,P(C\mid A\cap B)$.
    more: |
      **Why this formula.** With equally likely outcomes, $P(A\mid B)=\dfrac{|A\cap B|}{|B|}$, the proportion of the outcomes of $B$ that are also in $A$. Dividing numerator and denominator by $|S|$ gives the formula in terms of probabilities.

  - id: ex-cards
    type: example
    title: Two aces in a row
    problem: |
      Two cards are drawn without replacement from a deck of $52$. Find the probability that both are aces.
    steps:
      - |
        $P(\text{first is an ace})=\dfrac4{52}$.
      - text: |
          Given that, $3$ aces remain among $51$ cards: $P(\text{second is an ace}\mid\text{first is an ace})=\dfrac3{51}$.
        why: |
          Without replacement the second draw depends on the first: the deck has one card fewer, and one ace fewer.
      - |
        $P=\dfrac4{52}\cdot\dfrac3{51}=\dfrac{12}{2652}=\dfrac1{221}$.
    answer: |
      $\dfrac1{221}$.
    verify:
      - expr: "4/52*3/51"
        equals: "1/221"

  - id: independence
    type: definition
    term: Independent events
    body: |
      Events $A$ and $B$ are **independent** if knowing that one occurs does not change the probability of the other:

      $$P(A\cap B)=P(A)\,P(B)\qquad(\text{equivalently }P(A\mid B)=P(A)\text{ when }P(B)>0).$$

      Independent is not the same as mutually exclusive: two mutually exclusive events of positive probability are never independent, since $P(A\cap B)=0\ne P(A)P(B)$.

  - id: ex-independent
    type: example
    title: Are they independent?
    problem: |
      A fair die is rolled. $A$ is "the result is even" and $B$ is "the result is at most $4$". Are $A$ and $B$ independent?
    steps:
      - |
        $P(A)=\dfrac12$, $P(B)=\dfrac46=\dfrac23$ and $A\cap B=\{2,4\}$ so $P(A\cap B)=\dfrac26=\dfrac13$.
      - |
        $P(A)P(B)=\dfrac12\cdot\dfrac23=\dfrac13=P(A\cap B)$: the events are independent.
    answer: |
      Yes, they are independent.
    verify:
      - expr: "1/2*2/3"
        equals: "1/3"

  - id: chk-conditional
    type: check
    prompt: |
      $P(A\cap B)=\dfrac16$ and $P(B)=\dfrac13$. Find $P(A\mid B)$.
    answerType: expression
    answer: "1/2"
    hints:
      - |
        $P(A\mid B)=\dfrac{P(A\cap B)}{P(B)}$.
    explanation: |
      $\dfrac16\div\dfrac13=\dfrac16\cdot3=\dfrac12$.

  - id: chk-hearts
    type: check
    prompt: |
      Two cards are drawn without replacement from a deck of $52$. Find the probability that both are hearts.
    answerType: expression
    answer: "1/17"
    hints:
      - |
        $\dfrac{13}{52}\cdot\dfrac{12}{51}$.
    explanation: |
      $\dfrac{13}{52}\cdot\dfrac{12}{51}=\dfrac14\cdot\dfrac4{17}=\dfrac1{17}$.

  - id: summary
    type: summary
    points:
      - |
        $P(A\mid B)=\dfrac{P(A\cap B)}{P(B)}$; multiplication rule $P(A\cap B)=P(B)P(A\mid B)$.
      - |
        Independent: $P(A\cap B)=P(A)P(B)$. Mutually exclusive events are not independent.
