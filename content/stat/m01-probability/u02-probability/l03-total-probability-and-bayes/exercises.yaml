    - id: ba-22-1
      statement: "Urn I has $1$ white, $2$ black and $3$ red balls; urn II has $2$ white, $1$ black and $1$ red; urn III has $4$ white, $5$ black and $3$ red. One urn is chosen at random and two balls are drawn. They are one white and one red. Find the probability that they come from urn I."
      answerType: expression
      answer: "33/118"
      hints:
        - Count the ways to draw one white and one red ball in each urn.
      solution: |-
        Probability of one white and one red in each urn: I: $\dfrac{1\cdot3}{\binom62}=\dfrac15$; II: $\dfrac{2\cdot1}{\binom42}=\dfrac13$; III: $\dfrac{4\cdot3}{\binom{12}2}=\dfrac2{11}$. Each urn has probability $\dfrac13$, so $P(WR)=\dfrac13\left(\dfrac15+\dfrac13+\dfrac2{11}\right)=\dfrac{118}{495}$. Bayes: $P(\text{urn I}\mid WR)=\dfrac{\frac13\cdot\dfrac{1}{5}}{\dfrac{118}{495}}=\dfrac{33}{118}$.
