    - id: ba-23
      statement: |-
        A certain item is made by three factories A, B, C. A makes twice as many items as B, and B and C make the same number. $2\%$ of the items of A and B are defective, and $4\%$ of those of C. One item is chosen at random from the stockpile. What is the probability that it is defective?
      answerType: expression
      answer: "1/40"
      hints:
        - Find the share of each factory first.
      solution: |-
        Let C make a share $s$; then B makes $s$ and A makes $2s$, so $2s+s+s=1$ and $s=\dfrac14$: A makes $\dfrac12$, B $\dfrac14$, C $\dfrac14$. $P(D)=\dfrac12\cdot0.02+\dfrac14\cdot0.02+\dfrac14\cdot0.04=0.01+0.005+0.01=0.025=\dfrac1{40}$.
      allowDecimal: true
    - id: ba-24
      statement: "Two-thirds of the students in a class are boys and the rest are girls. The probability that a girl gets a first class is $0.25$ and that a boy gets one is $0.28$. Find the probability that a student chosen at random gets first class marks."
      answerType: expression
      answer: "27/100"
      hints:
        - Split into boys and girls.
      solution: |-
        Law of total probability over boy/girl: $P(F)=P(\text{boy})P(F\mid\text{boy})+P(\text{girl})P(F\mid\text{girl})=\dfrac23\cdot0.28+\dfrac13\cdot0.25=\dfrac{14}{75}+\dfrac1{12}=\dfrac{56+25}{300}=\dfrac{81}{300}=\dfrac{27}{100}$.
      allowDecimal: true
    - id: ba-24b
      statement: |-
        In the same class (two-thirds boys; $P(\text{first class}\mid\text{girl})=0.25$, $P(\text{first class}\mid\text{boy})=0.28$), a student is chosen at random and is found to have first class marks. What is the probability that she is a girl?
      answerType: expression
      answer: "25/81"
      hints:
        - |-
          Use $P(F)=\dfrac{27}{100}$ from the previous question.
      solution: |-
        $P(\text{girl}\mid F)=\dfrac{P(\text{girl})P(F\mid\text{girl})}{P(F)}=\dfrac{\frac13\cdot\frac14}{\dfrac{27}{100}}=\dfrac{\dfrac{1}{12}}{\dfrac{27}{100}}=\dfrac{100}{324}=\dfrac{25}{81}$.
      allowDecimal: true
    - id: ba-25
      statement: "Three groups of children have respectively $3$ girls and $1$ boy; $2$ girls and $2$ boys; $1$ girl and $3$ boys. One child is chosen at random from each group. Find the probability that the three chosen children are $1$ girl and $2$ boys."
      answerType: expression
      answer: "13/32"
      hints:
        - "Choose which group gives the girl; the draws are independent."
      solution: |-
        The girl can come from the first, the second or the third group; these cases are mutually exclusive. Girl from group 1 only: $\dfrac34\cdot\dfrac24\cdot\dfrac34=\dfrac{18}{64}$. From group 2 only: $\dfrac14\cdot\dfrac24\cdot\dfrac34=\dfrac6{64}$. From group 3 only: $\dfrac14\cdot\dfrac24\cdot\dfrac14=\dfrac2{64}$. Add: $\dfrac{26}{64}=\dfrac{13}{32}$.
