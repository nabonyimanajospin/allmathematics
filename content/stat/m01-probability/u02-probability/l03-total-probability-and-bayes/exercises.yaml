        Three groups of people: $G_1$ has $3$ men and $1$ woman, $G_2$ has $2$ men and $2$ women, $G_3$ has $1$ man and $3$ women. A group is chosen at random, then a person from it. The person is a woman. Find the probability that she comes from $G_1$.
