        $P(\bar A\cap B)=P(B)-P(A\cap B)=\dfrac38-\dfrac18=\dfrac14$. $P(\bar A\mid B)=\dfrac{\dfrac{1}{4}}{\dfrac{3}{8}}=\dfrac23$.
