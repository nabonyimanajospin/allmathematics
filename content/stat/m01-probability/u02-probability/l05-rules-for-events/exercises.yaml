          value: "4"
      correctIndex: 0
      hints:
        - |-
          Compare $P(A_1\cap A_2)$ with $P(A_1)P(A_2)$.
      solution: |-
        $\dfrac23\cdot\dfrac12=\dfrac13$ equals $P(A_1\cap A_2)=\dfrac13$, which is the definition of independence.
    - id: ru-14
      statement: |-
        $A$ and $B$ are mutually exclusive with $P(A)=\dfrac15$ and $P(B)=\dfrac3{10}$. Find $P(A\mid A\cup B)$.
      answerType: expression
      answer: "2/5"
      hints:
        - |-
          For mutually exclusive events $P(A\cup B)=P(A)+P(B)$.
      solution: |-
        $A\cap(A\cup B)=A$, so $P(A\mid A\cup B)=\dfrac{P(A)}{P(A\cup B)}$. Mutually exclusive events: $P(A\cup B)=P(A)+P(B)=\dfrac15+\dfrac3{10}=\dfrac12$. So $\dfrac{\dfrac{1}{5}}{\dfrac{1}{2}}=\dfrac25$. In general this is the formula $\dfrac{P(A)}{P(A)+P(B)}$ that the sheet asks to prove.
    - id: ru-15
      statement: |-
        $P(A)=P(B)=P(C)=\dfrac14$, $P(A\cap B)=P(C\cap B)=0$ and $P(A\cap C)=\dfrac18$. Find $P(A\cup B\cup C)$.
      answerType: expression
      answer: "5/8"
      hints:
        - |-
          Inclusion–exclusion; the triple intersection is inside $A\cap B$.
      solution: |-
        Inclusion–exclusion for three events: $P(A\cup B\cup C)=P(A)+P(B)+P(C)-P(A\cap B)-P(B\cap C)-P(A\cap C)+P(A\cap B\cap C)$. Since $P(A\cap B)=0$, also $P(A\cap B\cap C)=0$. So $\dfrac34-0-0-\dfrac18+0=\dfrac58$.
    - id: ru-16a
      statement: |-
        $P(X)=a$, $P(Y)=b$ and $P(X\cap Y)=c$. Express $P(\bar X\cup Y)$ in terms of $a$, $b$, $c$.
      answerType: expression
      answer: "1-a+c"
      variables:
        [a, b, c]
      hints:
        - |-
          The complement of $\bar X\cup Y$ is $X\cap\bar Y$.
      solution: |-
        $\overline{\bar X\cup Y}=X\cap\bar Y$ (De Morgan), and $P(X\cap\bar Y)=P(X)-P(X\cap Y)=a-c$. So $P(\bar X\cup Y)=1-(a-c)=1-a+c$.
    - id: ru-16b
      statement: |-
        $P(X)=a$, $P(Y)=b$ and $P(X\cap Y)=c$. Express $P(\bar X\cup\bar Y)$ in terms of $a$, $b$, $c$.
      answerType: expression
      answer: "1-c"
      variables:
        [a, b, c]
      hints:
        - |-
          De Morgan: $\bar X\cup\bar Y=\overline{X\cap Y}$.
      solution: |-
        By De Morgan's law $\bar X\cup\bar Y=\overline{X\cap Y}$, so the probability is $1-P(X\cap Y)=1-c$.
    - id: ru-16c
      statement: |-
        $P(X)=a$, $P(Y)=b$ and $P(X\cap Y)=c$. Express $P(X\cap\bar Y)$ in terms of $a$, $b$, $c$.
      answerType: expression
      answer: a-c
      variables:
