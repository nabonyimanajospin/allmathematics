    - id: ru-9
      statement: |-
        The probability that a student passes a mathematics test is $\dfrac23$ and the probability that the student passes both mathematics and statistics is $\dfrac{14}{45}$. The probability that the student passes at least one of the tests is $\dfrac45$. What is the probability that the student passes the statistics test?
      answerType: expression
      answer: "4/9"
      hints:
        - "Solve the addition rule for $P(S)$."
      solution: |-
        Addition rule: $P(M\cup S)=P(M)+P(S)-P(M\cap S)$. So $P(S)=P(M\cup S)-P(M)+P(M\cap S)=\dfrac45-\dfrac23+\dfrac{14}{45}=\dfrac{36-30+14}{45}=\dfrac{20}{45}=\dfrac49$.
    - id: ru-9b
      statement: |-
        $A$ and $B$ are independent events with $P(A)=\dfrac25$ and $P(B)=\dfrac13$. Find $P(A\cup B)$ using $P(A\cup B)=1-P(\bar A)P(\bar B)$.
      answerType: expression
      answer: "3/5"
      hints:
        - "The complement of 'A or B' is 'neither A nor B'."
      solution: |-
        $P(\bar A)=1-\dfrac25=\dfrac35$ and $P(\bar B)=1-\dfrac13=\dfrac23$. So $P(A\cup B)=1-\dfrac35\cdot\dfrac23=1-\dfrac25=\dfrac35$. **Why the formula holds:** $A\cup B$ fails exactly when neither happens, $P(\overline{A\cup B})=P(\bar A\cap\bar B)=P(\bar A)P(\bar B)$ because the complements of independent events are independent.
    - id: ru-10a
      statement: |-
        $P(A)=\dfrac13$, $P(B)=\dfrac34$, $P(A\cup B)=\dfrac{11}{12}$. Find $P(A\mid B)$.
      answerType: expression
      answer: "2/9"
      hints:
        - |-
          Find $P(A\cap B)$ first.
      solution: |-
        First $P(A\cap B)=P(A)+P(B)-P(A\cup B)=\dfrac13+\dfrac34-\dfrac{11}{12}=\dfrac{4+9-11}{12}=\dfrac16$. Then $P(A\mid B)=\dfrac{P(A\cap B)}{P(B)}=\dfrac{\dfrac{1}{6}}{\dfrac{3}{4}}=\dfrac29$.
    - id: ru-10b
      statement: |-
        $P(A)=\dfrac13$, $P(B)=\dfrac34$, $P(A\cup B)=\dfrac{11}{12}$. Find $P(B\mid A)$.
      answerType: expression
      answer: "1/2"
      hints:
        - |-
          Divide $P(A\cap B)$ by $P(A)$.
      solution: |-
        $P(A\cap B)=\dfrac16$ (addition rule). $P(B\mid A)=\dfrac{P(A\cap B)}{P(A)}=\dfrac{\dfrac{1}{6}}{\dfrac{1}{3}}=\dfrac12$.
    - id: ru-11
      statement: |-
        $P(A)=p$, $P(A\mid B)=q$ and $P(B\mid A)=r$. Find $q$ in terms of $p$ and $r$ so that $\bar A$ and $\bar B$ are mutually exclusive, that is $P(\bar A\cap\bar B)=0$.
      answerType: expression
      answer: "p*r/(1-p+p*r)"
      variables:
        [p, r]
      hints:
        - |-
          $\bar A\cap\bar B=\overline{A\cup B}$, so $P(A\cup B)=1$.
        - |-
          $P(A\cap B)=P(A)P(B\mid A)=pr$ and $P(B)=\dfrac{P(A\cap B)}{P(A\mid B)}$.
      solution: |-
        $P(\bar A\cap\bar B)=0$ means $P(A\cup B)=1$. We know $P(A\cap B)=P(A)P(B\mid A)=pr$, and $P(A\cap B)=P(B)\,q$, so $P(B)=\dfrac{pr}q$. Addition rule: $p+\dfrac{pr}{q}-pr=1$. Solve for $q$: $\dfrac{pr}q=1-p+pr$, so $q=\dfrac{pr}{1-p+pr}$. Check with $p=\dfrac12$, $r=\dfrac13$: $q=\dfrac{\dfrac{1}{6}}{\dfrac{1}{2}+\dfrac{1}{6}}=\dfrac14$, and then $P(B)=\dfrac{\dfrac{1}{6}}{\dfrac{1}{4}}=\dfrac23$, $P(A\cup B)=\dfrac12+\dfrac23-\dfrac16=1$.
    - id: ru-12
      statement: |-
        $P(A)=0.4$, $P(B)=p$, $P(A\cup B)=0.7$ and $P(A\cap B)=0.2$. Find $p$. (Then check that $A$ and $B$ are independent.)
      answerType: expression
      answer: "1/2"
      hints:
        - Use the addition rule.
      solution: |-
        Addition rule: $0.7=0.4+p-0.2$, so $p=0.5$. Independence needs $P(A\cap B)=P(A)P(B)$: $0.4\cdot0.5=0.2$, which is the given $P(A\cap B)$. So for $p=\dfrac12$ the events are independent.
      allowDecimal: true
    - id: ru-13
      statement: |-
        $P(A_1\cup A_2)=\dfrac56$, $P(A_1\cap A_2)=\dfrac13$ and $P(\bar A_2)=\dfrac12$. Find $P(A_1)$.
      answerType: expression
      answer: "2/3"
      hints:
        - "Find $P(A_2)$ first."
      solution: |-
        $P(A_2)=1-P(\bar A_2)=\dfrac12$. Addition rule: $P(A_1)=P(A_1\cup A_2)-P(A_2)+P(A_1\cap A_2)=\dfrac56-\dfrac12+\dfrac13=\dfrac{5-3+2}{6}=\dfrac23$. Then $P(A_1)P(A_2)=\dfrac23\cdot\dfrac12=\dfrac13=P(A_1\cap A_2)$: the events are independent, as the sheet asks to show.
    - id: ru-13b
      statement: |-
        With $P(A_1)=\dfrac23$, $P(A_2)=\dfrac12$ and $P(A_1\cap A_2)=\dfrac13$, are $A_1$ and $A_2$ independent?
      answerType: multiple_choice
      answer: "1"
      choices:
