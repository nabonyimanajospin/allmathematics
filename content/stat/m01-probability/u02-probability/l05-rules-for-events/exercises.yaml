    - id: ru-m1
      statement: |-
        $P(A)=0.5$, $P(B)=0.4$ and $P(A\cup B)=0.7$. Which statement is true?
      answerType: multiple_choice
      answer: "2"
      choices:
        - text: "$A$ and $B$ are mutually exclusive"
          value: "1"
        - text: "$A$ and $B$ are independent"
          value: "2"
        - text: "$A$ and $B$ are neither mutually exclusive nor independent"
          value: "3"
        - text: |-
            $A\subset B$
          value: "4"
      correctIndex: 1
      hints:
        - |-
          Find $P(A\cap B)$ first.
      solution: |-
        $P(A\cap B)=0.5+0.4-0.7=0.2$. Mutually exclusive would need $P(A\cap B)=0$; here it is $0.2$. Independent needs $P(A\cap B)=P(A)P(B)=0.5\cdot0.4=0.2$, which is true. So $A$ and $B$ are independent. ($A\subset B$ is impossible because $P(A)>P(B)$.)
      allowDecimal: true
