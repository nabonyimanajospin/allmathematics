        Equally likely, exclusive and exhaustive: $P(A)=P(B)=\dfrac12$. Total probability: $P(C)=\dfrac12\cdot\dfrac15+\dfrac12\cdot\dfrac3{10}=\dfrac1{10}+\dfrac3{20}=\dfrac14$. Bayes: $P(A\mid C)=\dfrac{P(A)P(C\mid A)}{P(C)}=\dfrac{\dfrac{1}{10}}{\dfrac{1}{4}}=\dfrac25$.
      note: |-
        The sheet prints $p(A\mid B)$ and $p(B\mid A)$, which are $0$ because $A$ and $B$ are mutually exclusive. The intended questions, given the data on $C$, are $P(A\mid C)$ and $P(B\mid C)$.
      allowDecimal: true
    - id: ru-17b
      statement: |-
        $A$ and $B$ are equally likely, mutually exclusive and exhaustive events, and $P(C\mid A)=0.2$, $P(C\mid B)=0.3$. Find $P(B\mid C)$.
      answerType: expression
