      solution: |-
        The complement of $A\cup\bar B$ is $\bar A\cap B$, with $P(\bar A\cap B)=\dfrac13-\dfrac14=\dfrac1{12}$. So $P(A\cup\bar B)=1-\dfrac1{12}=\dfrac{11}{12}$.
