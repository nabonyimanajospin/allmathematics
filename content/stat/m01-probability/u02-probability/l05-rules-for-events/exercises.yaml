      answerType: expression
      answer: "1/4"
      hints:
        - |-
          Draw the four cells: $A\cap B$, $A$ only, $B$ only, neither.
      solution: |-
        $P(B\mid\bar A)=\dfrac{P(\bar A\cap B)}{P(\bar A)}=\dfrac{\dfrac{1}{8}}{\dfrac{1}{2}}=\dfrac14$.
    - id: ru-32a
      statement: |-
        $P(A\cup B)=\dfrac34$, $P(A)=\dfrac12$, $P(\bar B)=\dfrac58$ (so $P(B)=\dfrac38$). Find $P(A\cap B)$.
      answerType: expression
      answer: "1/8"
      hints:
        - |-
          Draw the four cells: $A\cap B$, $A$ only, $B$ only, neither.
      solution: |-
        $P(A\cap B)=P(A)+P(B)-P(A\cup B)=\dfrac12+\dfrac38-\dfrac34=\dfrac18$.
    - id: ru-32b
      statement: |-
        $P(A\cup B)=\dfrac34$, $P(A)=\dfrac12$, $P(\bar B)=\dfrac58$ (so $P(B)=\dfrac38$). Find $P(\bar A\cup B)$.
      answerType: expression
      answer: "5/8"
      hints:
        - |-
          Draw the four cells: $A\cap B$, $A$ only, $B$ only, neither.
      solution: |-
        The complement of $\bar A\cup B$ is $A\cap\bar B$. $P(A\cap\bar B)=\dfrac12-\dfrac18=\dfrac38$, so $P(\bar A\cup B)=1-\dfrac38=\dfrac58$.
    - id: ru-32c
      statement: |-
