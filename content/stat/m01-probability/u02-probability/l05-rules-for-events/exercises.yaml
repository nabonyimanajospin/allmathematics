    - id: ru-17a
      statement: |-
        $A$ and $B$ are equally likely, mutually exclusive and exhaustive events, and $P(C\mid A)=0.2$, $P(C\mid B)=0.3$. Find $P(A\mid C)$.
      answerType: expression
      answer: "2/5"
      hints:
