    - id: sq-4b
      statement: "**Q4 b.** Two-thirds of the students in a class are boys, the rest are girls. The probability that a girl gets a first class is $0.25$ and that a boy gets one is $0.28$. A student is chosen at random and found to have the first class. What is the probability that she is a girl?"
