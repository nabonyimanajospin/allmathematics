    - id: sq-4a
      statement: "**Q4 a.** The probability that a student passes a mathematics test is $0.7$, that s/he passes both mathematics and statistics is $0.2$, and that s/he passes at least one test is $0.8$. What is the probability that she fails the statistics test and passes mathematics?"
      answerType: expression
