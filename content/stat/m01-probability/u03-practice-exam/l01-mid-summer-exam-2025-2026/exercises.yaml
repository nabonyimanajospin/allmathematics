        Total probability: $P(F)=\dfrac23\cdot0.28+\dfrac13\cdot0.25=\dfrac{14}{75}+\dfrac1{12}=\dfrac{56+25}{300}=\dfrac{27}{100}$. Bayes: $P(\text{girl}\mid F)=\dfrac{\frac13\cdot0.25}{\dfrac{27}{100}}=\dfrac{\dfrac{1}{12}}{\dfrac{27}{100}}=\dfrac{100}{324}=\dfrac{25}{81}$.
