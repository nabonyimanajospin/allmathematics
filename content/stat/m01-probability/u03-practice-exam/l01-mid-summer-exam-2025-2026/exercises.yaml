      solution: |-
        We need $P(M\cap\bar S)$. The event $M$ is the union of $M\cap S$ and $M\cap\bar S$ (disjoint), so $P(M\cap\bar S)=P(M)-P(M\cap S)=0.7-0.2=0.5=\dfrac12$. (The value $P(S)=0.3$ and $P(M\cup S)=0.8$ were not even needed: the data are consistent, since $0.7+0.3-0.2=0.8$.)
