    - id: sq-3a
      statement: |-
        **Q3 a.** $A$ and $B$ are independent. To show that $A$ and $\bar B$ are independent, we use
      answerType: multiple_choice
      answer: "1"
      choices:
        - text: |-
            $P(A\cap\bar B)=P(A)-P(A\cap B)=P(A)\,(1-P(B))=P(A)P(\bar B)$
          value: "1"
        - text: |-
            $P(A\cap\bar B)=0$ because $\bar B$ is the opposite of $B$
          value: "2"
        - text: |-
            $P(A\cap\bar B)=P(A)+P(\bar B)$
          value: "3"
        - text: |-
            $P(\bar B)=P(B)$
          value: "4"
      correctIndex: 0
      hints:
        - |-
          Split $A$ into $A\cap B$ and $A\cap\bar B$.
      solution: |-
        $A$ is the union of the disjoint events $A\cap B$ and $A\cap\bar B$, so $P(A\cap\bar B)=P(A)-P(A\cap B)$. By independence $P(A\cap B)=P(A)P(B)$, hence $P(A\cap\bar B)=P(A)-P(A)P(B)=P(A)(1-P(B))=P(A)P(\bar B)$. This is exactly the definition of independence of $A$ and $\bar B$.
