    - id: gt-3iv
      statement: |-
        The identity $\displaystyle\sum_{k=0}^n3^k\dbinom nk=\left[\sum_{k=0}^n\dbinom nk\right]^2$ holds for every $n$. For $n=5$ find the value of both sides.
      answerType: number
      answer: "1024"
      hints:
        - "The left side is $(1+3)^n$, the bracket is $(1+1)^n$."
      solution: "The left side is $4^5=1024$ (binomial theorem with $a=1$, $b=3$). The bracket on the right is $2^5=32$ (binomial theorem with $a=b=1$) and $32^2=1024$. In general $4^n=(2^n)^2$, which is the identity."
