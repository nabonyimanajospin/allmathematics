    - id: gt-6
      statement: "In the expansion of $(1+x)^{20}$ the coefficients of the $r$th and the $(r+1)$th terms are in the ratio $1:6$. Find $r$."
      answerType: number
      answer: "3"
      hints:
        - |-
          $\dbinom{20}r=\dbinom{20}{r-1}\cdot\dfrac{20-(r-1)}{r}$.
      solution: |-
        The $r$th term has the coefficient $\dbinom{20}{r-1}$ and the $(r+1)$th term $\dbinom{20}r$. Their ratio is $\dfrac{\binom{20}{r-1}}{\binom{20}r}=\dfrac{r}{21-r}$ (because $\dbinom{20}{r}=\dbinom{20}{r-1}\cdot\dfrac{21-r}{r}$). Set $\dfrac r{21-r}=\dfrac16$: $6r=21-r$, so $r=3$.
    - id: gt-7a
      statement: "The coefficients of the $5$th, $6$th and $7$th terms in the expansion of $(1+x)^n$ are in arithmetic progression. Find the smaller possible value of $n$."
      answerType: number
      answer: "7"
      hints:
        - |-
          Arithmetic progression: the middle term is the average of the others.
      solution: |-
        The coefficients of the $5$th, $6$th and $7$th terms are $\dbinom n4$, $\dbinom n5$, $\dbinom n6$. They are in arithmetic progression when $2\dbinom n5=\dbinom n4+\dbinom n6$. Divide by $\dbinom n4$: $\dbinom n5=\dbinom n4\cdot\dfrac{n-4}5$ and $\dbinom n6=\dbinom n4\cdot\dfrac{(n-4)(n-5)}{30}$. So $\dfrac{2(n-4)}5=1+\dfrac{(n-4)(n-5)}{30}$, i.e. $12(n-4)=30+(n-4)(n-5)$, which gives $n^2-21n+98=0=(n-7)(n-14)$. Hence $n=7$ or $n=14$.
