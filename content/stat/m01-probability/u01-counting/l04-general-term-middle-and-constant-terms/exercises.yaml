    - id: gt-3i
      statement: |-
        The identity $\dbinom{2n}{n}=\dbinom n0^2+\dbinom n1^2+\cdots+\dbinom nn^2$ is true for every $n$. Use it with $n=5$ to find $\displaystyle\sum_{k=0}^{5}\dbinom5k^2$.
      answerType: number
      answer: "252"
      hints:
        - "Compare the coefficient of $x^n$ in $(1+x)^n(1+x)^n$."
      solution: |-
        The sum equals $\dbinom{2n}{n}=\dbinom{10}5=252$. **Why the identity holds:** compare the coefficient of $x^n$ in $(1+x)^{2n}=(1+x)^n(1+x)^n$. On the left it is $\dbinom{2n}n$. On the right, multiply $\sum\dbinom nj x^j$ by $\sum\dbinom nk x^k$: the terms with $j+k=n$ give $\sum_k\dbinom n{n-k}\dbinom nk=\sum_k\dbinom nk^2$.
    - id: gt-3ii
      statement: |-
        The identity $3^n=\dbinom n0+2\dbinom n1+4\dbinom n2+\cdots+2^n\dbinom nn$ holds for every $n$. Use it to find $\displaystyle\sum_{k=0}^{4}2^k\dbinom4k$.
      answerType: number
      answer: "81"
      hints:
        - "Binomial theorem with $a=1$ and $b=2$."
      solution: |-
        The sum is $3^4=81$. **Proof of the identity:** the binomial theorem with $a=1$, $b=2$ gives $(1+2)^n=\sum_k\dbinom nk1^{n-k}2^k=\sum_k2^k\dbinom nk$.
