    - id: gt-5i
      statement: |-
        Find the constant term in the expansion of $\left(2x^2+\dfrac1x\right)^{12}$.
      answerType: number
      answer: "7920"
      hints:
        - "Find the power of $x$ in the general term and set it equal to $0$."
      solution: |-
        $T_{k+1}=\dbinom{12}k(2x^2)^{12-k}\left(\dfrac1x\right)^k=\dbinom{12}k2^{12-k}x^{24-2k-k}=\dbinom{12}k2^{12-k}x^{24-3k}$. The term is constant when $24-3k=0$, i.e. $k=8$. Then $T_9=\dbinom{12}82^4=495\cdot16=7920$.
