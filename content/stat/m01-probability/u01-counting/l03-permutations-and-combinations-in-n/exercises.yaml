      solution: |-
        All arrangements: $7!=5040$. Those with the sisters together: $720$ (previous question). So $5040-720=4320$.
- id: sheet-counting-2
  task: "Permutations, combinations and arrangements (exercise sheet) (part 2 of 2)."
  format: "Type a whole number, a fraction, or an expression such as `2*x^3`. Use `n` for the unknown number of sides."
  source: "STAT8225 exercise sheet, T. Hakizimana"
  items:
    - id: pc-12
      statement: "How many triangles can be formed by joining the vertices of a hexagon?"
      answerType: number
      answer: "20"
      hints:
        - A triangle is a set of three vertices.
      solution: |-
        A triangle is a choice of $3$ vertices out of $6$ (no three vertices of a hexagon are on a line): $\dbinom63=20$.
    - id: pc-13
      statement: "How many diagonals has a polygon with $n$ sides? Give a formula in $n$."
      answerType: expression
      answer: "n*(n-3)/2"
      variables:
        [n]
      hints:
        - "Count all the segments joining two vertices, then remove the $n$ sides."
      solution: |-
        Two vertices determine a segment: $\dbinom n2=\dfrac{n(n-1)}2$ segments. Among them $n$ are sides of the polygon. The diagonals are the others: $\dfrac{n(n-1)}2-n=\dfrac{n(n-1)-2n}{2}=\dfrac{n(n-3)}2$. Check with the hexagon: $\dfrac{6\cdot3}2=9$.
    - id: pc-14a
      statement: "How many different selections of $4$ books can be made from $10$ different books if two particular books are always selected?"
      answerType: number
      answer: "28"
      hints:
        - Only the remaining places need choosing.
      solution: |-
        The two particular books are in. We still choose $2$ books among the other $8$: $\dbinom82=28$.
    - id: pc-14b
      statement: "How many different selections of $4$ books can be made from $10$ different books if two particular books are never selected?"
      answerType: number
      answer: "70"
      hints:
        - Remove the two books first.
      solution: |-
        The two particular books are out: choose $4$ books among the other $8$: $\dbinom84=70$.
    - id: pc-16a
      statement: "In how many ways can a committee of $4$ people be chosen from a panel of $10$ if a certain person must be on the committee?"
      answerType: number
      answer: "84"
      hints:
        - Choose the remaining places.
      solution: |-
        That person is in. Choose the other $3$ members among the remaining $9$ people: $\dbinom93=84$.
    - id: pc-16b
      statement: "In how many ways can a committee of $4$ people be chosen from a panel of $10$ if a certain person must not be on the committee?"
      answerType: number
      answer: "126"
      hints:
        - Remove that person first.
      solution: |-
        That person is out. Choose $4$ among the other $9$: $\dbinom94=126$.
    - id: pc-m1
      statement: |-
        Which value of $n$ satisfies $\dbinom n2=45$?
      answerType: multiple_choice
      answer: "3"
      choices:
        - text: "$8$"
          value: "1"
        - text: "$9$"
          value: "2"
        - text: "$10$"
          value: "3"
        - text: "$11$"
          value: "4"
      correctIndex: 2
      hints:
        - |-
          $\dbinom n2=\dfrac{n(n-1)}{2}$.
      solution: |-
        $\dfrac{n(n-1)}2=45$ gives $n(n-1)=90=10\cdot9$, so $n=10$. (For $n=9$ we get $36$, for $n=11$ we get $55$.)
    - id: pc-m2
      statement: "In how many ways can $5$ people sit in a row if two of them, Ann and Ben, must not sit next to each other?"
      answerType: multiple_choice
      answer: "2"
      choices:
        - text: "$48$"
          value: "1"
        - text: "$72$"
          value: "2"
        - text: "$96$"
          value: "3"
        - text: "$120$"
          value: "4"
      correctIndex: 1
      hints:
        - "Count all arrangements, then subtract those where Ann and Ben are together."
      solution: |-
        All arrangements: $5!=120$. With Ann and Ben together: $4!\cdot2=48$. So $120-48=72$.
