      hints:
        - "Treat the sisters as one block, then arrange the block inside."
      solution: |-
        Glue the $3$ sisters into one block. Now there are $4$ brothers and $1$ block: $5!=120$ arrangements. Inside the block the sisters can be ordered in $3!=6$ ways. Total $120\cdot6=720$.
    - id: pc-11b
      statement: |-
        The same family: in how many ways can they be seated if the sisters are not all together?
      answerType: number
      answer: "4320"
      hints:
