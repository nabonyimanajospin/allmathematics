      hints:
        - |-
          ${}_nP_r=n(n-1)\cdots(n-r+1)$: $r$ factors, starting at $n$.
      solution: |-
        ${}_{8}P_{3}=\dfrac{8!}{5!}=8\cdot7\cdot6=336$.
    - id: pc-p2
      statement: "Compute ${}_{10}P_{4}$, the number of arrangements of 4 objects taken from 10."
      answerType: number
