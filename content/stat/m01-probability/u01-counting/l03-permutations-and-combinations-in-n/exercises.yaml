    - id: pc-1ii
      statement: "Find $n$ if ${}_{56}P_{n+6}:{}_{54}P_{n+3}=30800:1$."
      answerType: number
      answer: "41"
      hints:
        - |-
          $\dfrac{56!}{54!}=56\cdot55$.
        - |-
          $\dfrac{(51-n)!}{(50-n)!}=51-n$.
      solution: |-
        Write the two arrangements with factorials: ${}_{56}P_{n+6}=\dfrac{56!}{(50-n)!}$ and ${}_{54}P_{n+3}=\dfrac{54!}{(51-n)!}$. Their ratio is $\dfrac{56!}{54!}\cdot\dfrac{(51-n)!}{(50-n)!}=56\cdot55\cdot(51-n)=3080\,(51-n)$. Set it equal to $30800$: $51-n=10$, so $n=41$. Check: $n+6=47\le56$ and $n+3=44\le54$, so both arrangements exist.
      note: "The sheet prints the ratio as $3088:1$. With $3088:1$ there is no whole number $n$ (the equation $3080(51-n)=3088$ has no integer solution); the zeros were lost in printing and the intended ratio is $30800:1$."
    - id: pc-1iii
      statement: |-
        Find $n$ if $\dbinom{n+2}{8}:{}_{n-2}P_4=57:16$.
      answerType: number
      answer: "19"
      hints:
        - Write both sides with factorials and cancel.
      solution: |-
        $\dbinom{n+2}{8}=\dfrac{(n+2)!}{8!\,(n-6)!}$ and ${}_{n-2}P_4=(n-2)(n-3)(n-4)(n-5)$. The ratio simplifies and the equation gives $n=19$.
    - id: pc-1iv
      statement: |-
        Find $n$ if $2\dbinom n3=\dfrac{20}3\dbinom n2$.
      answerType: number
      answer: "12"
      hints:
        - "Write the binomial coefficients as products and divide by $n(n-1)$."
      solution: |-
        $\dbinom n3=\dfrac{n(n-1)(n-2)}{6}$ and $\dbinom n2=\dfrac{n(n-1)}{2}$. The equation becomes $\dfrac{n(n-1)(n-2)}{3}=\dfrac{10\,n(n-1)}{3}$. Divide both sides by $\dfrac{n(n-1)}{3}$ (it is not $0$ for $n\ge3$): $n-2=10$, so $n=12$.
    - id: pc-1v
      statement: |-
        Find $n$ if $\dbinom{28}{2n}:\dbinom{24}{2n-4}=225:11$.
      answerType: number
      answer: "7"
      hints:
        - "The factor $(28-m)!$ cancels in the quotient."
        - |-
          $\dfrac{28!}{24!}=28\cdot27\cdot26\cdot25$.
      solution: |-
        With $m=2n$: $\dbinom{28}{m}=\dfrac{28!}{m!\,(28-m)!}$ and $\dbinom{24}{m-4}=\dfrac{24!}{(m-4)!\,(28-m)!}$. The ratio is $\dfrac{28\cdot27\cdot26\cdot25}{m(m-1)(m-2)(m-3)}=\dfrac{225}{11}$, so $m(m-1)(m-2)(m-3)=\dfrac{11\cdot491400}{225}=24024$, which holds for $m=14$. So $n=7$.
    - id: pc-1vi
      statement: |-
        Find $n$ if $\dbinom{n}{n-4}=70$.
      answerType: number
      answer: "8"
      hints:
        - |-
          Use $\dbinom nr=\dbinom n{n-r}$.
      solution: |-
        $\dbinom n{n-4}=\dbinom n4$ (choosing which $4$ objects to leave out). So $\dfrac{n(n-1)(n-2)(n-3)}{24}=70$, i.e. $n(n-1)(n-2)(n-3)=1680=8\cdot7\cdot6\cdot5$, hence $n=8$.
    - id: pc-2x
      statement: |-
        Solve the system $\begin{cases}{}_yP_x={}_yP_{x+1}\\[2pt]\dbinom yx=\dbinom y{x-1}\end{cases}$ Find $x$.
      answerType: number
      answer: "2"
      hints:
        - "$(y-x)!=(y-x-1)!$ only when $y-x=1$."
        - |-
          $\dbinom ya=\dbinom yb$ with $a\ne b$ needs $a+b=y$.
      solution: |-
        First equation: $\dfrac{y!}{(y-x)!}=\dfrac{y!}{(y-x-1)!}$, so $(y-x)!=(y-x-1)!$, which is true only when $y-x=1$. Second equation: $\dbinom yx=\dbinom y{x-1}$ means $x+(x-1)=y$ (two coefficients of $\dbinom y\cdot$ are equal only when the lower numbers add up to $y$), so $y=2x-1$. Then $x+1=2x-1$ gives $x=2$ and $y=3$. Check: ${}_3P_2=6={}_3P_3$ and $\dbinom32=3=\dbinom31$.
    - id: pc-2y
      statement: |-
        Solve the system $\begin{cases}{}_yP_x={}_yP_{x+1}\\[2pt]\dbinom yx=\dbinom y{x-1}\end{cases}$ Find $y$.
      answerType: number
      answer: "3"
      hints:
        - "First find $x$."
      solution: |-
        First equation: $\dfrac{y!}{(y-x)!}=\dfrac{y!}{(y-x-1)!}$, so $(y-x)!=(y-x-1)!$, which is true only when $y-x=1$. Second equation: $\dbinom yx=\dbinom y{x-1}$ means $x+(x-1)=y$ (two coefficients of $\dbinom y\cdot$ are equal only when the lower numbers add up to $y$), so $y=2x-1$. Then $x+1=2x-1$ gives $x=2$ and $y=3$. Check: ${}_3P_2=6={}_3P_3$ and $\dbinom32=3=\dbinom31$.
    - id: pc-8
      statement: "How many different $4$-letter words, with or without meaning, can be formed from the letters of the word NUMBER?"
