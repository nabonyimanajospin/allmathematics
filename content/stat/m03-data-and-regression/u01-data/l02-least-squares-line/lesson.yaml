id: stat-m03-u01-l02
title: The least-squares line
estMinutes: 45
version: 1
status: draft
skills:
  - least-squares
  - correlation
objectives:
  - Fit a straight line $y=mx+q$ to points by least squares.
  - Compute and read the correlation coefficient.
sections:
  - id: idea
    type: concept
    title: The line closest to the points
    body: |
      Given points $(x_1,y_1),\dots,(x_n,y_n)$ that are roughly aligned, which line $y=mx+q$ describes them best? For each point the **residual** is the vertical gap $y_i-(mx_i+q)$. The **least-squares line** makes the sum of the squared residuals as small as possible. Squaring prevents positive and negative gaps from cancelling and punishes large gaps.

  - id: formula
    type: theorem
    name: The least-squares line
    statement: |
      Put $\bar x$, $\bar y$ for the means and

      $$S_{xx}=\sum(x_i-\bar x)^2,\qquad S_{xy}=\sum(x_i-\bar x)(y_i-\bar y),\qquad S_{yy}=\sum(y_i-\bar y)^2.$$

      If $S_{xx}\ne0$, the line is $y=mx+q$ with

      $$m=\dfrac{S_{xy}}{S_{xx}},\qquad q=\bar y-m\,\bar x.$$

      It passes through the point of means $(\bar x,\bar y)$. The **correlation coefficient** is $r=\dfrac{S_{xy}}{\sqrt{S_{xx}S_{yy}}}$, always between $-1$ and $1$.
    proof: |
      Let $E(m,q)=\sum\left(y_i-mx_i-q\right)^2$. Setting $\dfrac{\partial E}{\partial q}=-2\sum(y_i-mx_i-q)=0$ gives $q=\bar y-m\bar x$. Setting $\dfrac{\partial E}{\partial m}=-2\sum x_i(y_i-mx_i-q)=0$ and substituting $q$ gives $\sum x_i(y_i-\bar y)=m\sum x_i(x_i-\bar x)$, which is $S_{xy}=mS_{xx}$. The function $E$ is a quadratic with a positive leading part, so this critical point is its minimum.
    more: |
      **Reading $r$.** $r=1$ means the points are exactly on a line with positive slope, $r=-1$ on a line with negative slope, and $r$ near $0$ means no linear relation. Note that $r$ measures *linear* association, not causation.

  - id: ex-fit
    type: example
    title: Fitting four points
    problem: |
      Fit a line to $(1,2)$, $(2,3)$, $(3,5)$, $(4,6)$, predict $y$ at $x=5$, and compute $r$.
    steps:
      - text: |
          $\bar x=\dfrac52$ and $\bar y=4$. Deviations of $x$: $-\dfrac32,-\dfrac12,\dfrac12,\dfrac32$; of $y$: $-2,-1,1,2$.
        why: |
          $\bar x=\dfrac{1+2+3+4}{4}=\dfrac{10}{4}=\dfrac52$ and $\bar y=\dfrac{2+3+5+6}{4}=4$.
      - |
        $S_{xx}=\dfrac94+\dfrac14+\dfrac14+\dfrac94=5$, $S_{xy}=3+\dfrac12+\dfrac12+3=7$ and $S_{yy}=4+1+1+4=10$.
      - |
        $m=\dfrac75$ and $q=4-\dfrac75\cdot\dfrac52=4-\dfrac72=\dfrac12$: the line is $y=\dfrac75x+\dfrac12$.
      - |
        At $x=5$: $y=7+\dfrac12=\dfrac{15}2$. And, since $\sqrt{S_{xx}S_{yy}}=\sqrt{50}=5\sqrt2$, $r=\dfrac{7\sqrt2}{10}$, close to $1$: a strong positive linear association.
    answer: |
      $y=\dfrac75x+\dfrac12$; prediction $\dfrac{15}2$; $r=\dfrac{7\sqrt2}{10}$.
    verify:
      - expr: "7/5"
        equals: "7/5"
      - expr: "4-7/5*5/2"
        equals: "1/2"
      - expr: "7/sqrt(50)"
        equals: "7*sqrt(2)/10"

  - id: chk-slope
    type: check
    prompt: |
      For the points $(0,1)$, $(1,3)$, $(2,4)$ find the slope $m$ of the least-squares line.
    answerType: expression
    answer: "3/2"
    hints:
      - |
        $\bar x=1$, $\bar y=\dfrac83$; compute $S_{xy}$ and $S_{xx}$.
    explanation: |
      $S_{xx}=2$. $S_{xy}=(-1)\left(-\dfrac53\right)+0+1\cdot\dfrac43=3$. So $m=\dfrac32$.

  - id: chk-point
    type: check
    prompt: |
      The least-squares line of a data set is $y=2x-1$ and $\bar x=3$. Find $\bar y$.
    answerType: number
    answer: "5"
    hints:
      - |
        The line passes through $(\bar x,\bar y)$.
    explanation: |
      $\bar y=2\cdot3-1=5$.

  - id: summary
    type: summary
    points:
      - |
        The least-squares line minimizes $\sum(y_i-mx_i-q)^2$: $m=\dfrac{S_{xy}}{S_{xx}}$, $q=\bar y-m\bar x$.
      - |
        It passes through $(\bar x,\bar y)$. The correlation $r=\dfrac{S_{xy}}{\sqrt{S_{xx}S_{yy}}}$ lies in $[-1,1]$.
