- id: sheet-discrete-moments-2
  task: "Moments, shape and the moment generating function of a discrete variable (exercise sheet) (part 2 of 3)."
  format: "Type a whole number, a fraction such as `7/19`, or an exact expression such as `exp(-5)` or `sqrt(7)/3`. Write the standard normal distribution function as `Phi(z)`. For a function of t type for example `(1+2*exp(t))/3`."
  source: "STAT8225 exercise sheet, T. Hakizimana"
  items:
    - id: rv-1i-mgf
      statement: |-
        The mass function of $X$ is $\left(2,\dfrac13\right),\left(3,\dfrac12\right),\left(5,\dfrac16\right)$. Find the moment generating function $M(t)=E\left[e^{tX}\right]$.
      answerType: expression
      answer: "(exp(3*t) + 3*exp(t) + 2)*exp(2*t)/6"
      variables:
        [t]
      hints:
        - |-
          $M(t)=\sum_x e^{tx}P(X=x)$.
      solution: |-
        $M(t)=\sum_x e^{tx}P(X=x)=\dfrac{1}{3}e^{2t} + \dfrac{1}{2}e^{3t} + \dfrac{1}{6}e^{5t}$. Check: $M(0)=\sum P(X=x)=1$.
    - id: rv-1i-mgf1
      statement: |-
        The mass function of $X$ is $\left(2,\dfrac13\right),\left(3,\dfrac12\right),\left(5,\dfrac16\right)$. Use $M(t)$ to find $E[X]=M'(0)$.
      answerType: number
      answer: "3"
      hints:
        - "Differentiate $M(t)$ and put $t=0$."
      solution: |-
        $M'(t)=\sum_x x\,e^{tx}P(X=x)$, so $M'(0)=\sum xP(X=x)=3$.
    - id: rv-1i-mgf2
      statement: |-
        The mass function of $X$ is $\left(2,\dfrac13\right),\left(3,\dfrac12\right),\left(5,\dfrac16\right)$. Use $M(t)$ to find $E[X^2]=M''(0)$.
      answerType: number
      answer: "10"
      hints:
        - "$M''(0)=E[X^2]$."
      solution: |-
        $M''(t)=\sum_x x^2e^{tx}P(X=x)$, so $M''(0)=\sum x^2P(X=x)=10$. Then $\operatorname{Var}(X)=E[X^2]-E[X]^2=10-\left(3\right)^2=1$.
    - id: rv-2-mgf
      statement: |-
        The mass function of $X$ is $f(x)=\dfrac x9$ for $x\in\{2,3,4\}$. Find the moment generating function $M(t)=E\left[e^{tX}\right]$.
      answerType: expression
      answer: "(4*exp(2*t) + 3*exp(t) + 2)*exp(2*t)/9"
      variables:
        [t]
      hints:
        - |-
          $M(t)=\sum_x e^{tx}P(X=x)$.
      solution: |-
        $M(t)=\sum_x e^{tx}P(X=x)=\dfrac{2}{9}e^{2t} + \dfrac{1}{3}e^{3t} + \dfrac{4}{9}e^{4t}$. Check: $M(0)=\sum P(X=x)=1$.
    - id: rv-2-mgf1
      statement: |-
        The mass function of $X$ is $f(x)=\dfrac x9$ for $x\in\{2,3,4\}$. Use $M(t)$ to find $E[X]=M'(0)$.
      answerType: expression
      answer: "29/9"
      hints:
        - "Differentiate $M(t)$ and put $t=0$."
      solution: |-
        $M'(t)=\sum_x x\,e^{tx}P(X=x)$, so $M'(0)=\sum xP(X=x)=\dfrac{29}{9}$.
    - id: rv-2-mgf2
      statement: |-
        The mass function of $X$ is $f(x)=\dfrac x9$ for $x\in\{2,3,4\}$. Use $M(t)$ to find $E[X^2]=M''(0)$.
      answerType: number
      answer: "11"
      hints:
        - "$M''(0)=E[X^2]$."
      solution: |-
        $M''(t)=\sum_x x^2e^{tx}P(X=x)$, so $M''(0)=\sum x^2P(X=x)=11$. Then $\operatorname{Var}(X)=E[X^2]-E[X]^2=11-\left(\dfrac{29}{9}\right)^2=\dfrac{50}{81}$.
    - id: rv-2var
      statement: |-
        The mass function of $X$ is $f(x)=\dfrac x9$ for $x\in\{2,3,4\}$. Find $\operatorname{Var}(X)$.
