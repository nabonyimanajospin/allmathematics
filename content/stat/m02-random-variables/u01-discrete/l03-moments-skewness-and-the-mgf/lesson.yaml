id: stat-m02-u01-l03
title: Moments, skewness and the moment generating function
estMinutes: 55
version: 1
status: draft
skills:
  - moments
  - skewness-kurtosis
  - moment-generating-function
objectives:
  - Describe a distribution by its location (mean, median, mode), dispersion (variance, standard deviation) and shape (skewness, kurtosis).
  - Find the missing constant of a mass function.
  - Write the moment generating function of a discrete variable and use it to find moments.
sections:
  - id: why
    type: concept
    title: Three kinds of numbers describe a distribution
    body: |
      A mass function is a whole table of numbers. Three kinds of summary say most of what matters.

      **Location:** where the distribution sits (the mean $E[X]$, the median, the mode).

      **Dispersion:** how spread out it is (the variance $\sigma^2$ and the standard deviation $\sigma$).

      **Shape:** whether it is lopsided (skewness $\gamma_1$) and how heavy its tails are (kurtosis $\beta_2$).

      All of them come from the **moments** of $X$: the raw moments $E[X^r]$ and the central moments $\mu_r=E\left[(X-\mu)^r\right]$.

  - id: defs
    type: formula
    title: The measures
    formula: |
      \begin{aligned}
      \mu&=E[X]=\sum xP(X=x), & \sigma^2&=\mu_2=E[X^2]-\mu^2,\\
      \mu_r&=\sum(x-\mu)^rP(X=x), & \gamma_1&=\dfrac{\mu_3}{\sigma^3},\qquad\beta_2=\dfrac{\mu_4}{\sigma^4}
      \end{aligned}
    note: |
      $\gamma_1>0$: the long tail is on the right; $\gamma_1<0$: on the left; $\gamma_1=0$ for a symmetric distribution. The kurtosis of the normal law is $3$; a value above $3$ means heavier tails. The **median** is the smallest value $x$ with $P(X\le x)\ge\dfrac12$ and the **mode** is the most probable value.

  - id: ex-measures
    type: example
    title: All the measures of one mass function
    problem: |
      $X$ takes the values $2$, $3$, $5$ with probabilities $\dfrac13$, $\dfrac12$, $\dfrac16$. Find the mean, the variance, the skewness, the median and the mode.
    steps:
      - text: |
          $\mu=2\cdot\dfrac13+3\cdot\dfrac12+5\cdot\dfrac16=\dfrac{4+9+5}{6}=3$.
        why: |
          A weighted average of the values, the weights being the probabilities.
      - text: |
          $\mu_2=(2-3)^2\dfrac13+0+(5-3)^2\dfrac16=\dfrac13+\dfrac23=1$, so $\sigma^2=1$ and $\sigma=1$.
        why: |
          Squared distances to the mean, weighted by the probabilities. The middle value $3$ is at distance $0$.
      - text: |
          $\mu_3=(-1)^3\dfrac13+0+2^3\dfrac16=-\dfrac13+\dfrac43=1$, so $\gamma_1=\dfrac{\mu_3}{\sigma^3}=1$.
        why: |
          Cubes keep the sign: the value $5$ is far to the right and pulls the third moment up, so the distribution has a tail on the right (positive skewness).
      - text: |
          $F(2)=\dfrac13$, $F(3)=\dfrac13+\dfrac12=\dfrac56\ge\dfrac12$: the median is $3$. The largest probability is $\dfrac12$, so the mode is $3$.
        why: |
          The median is the first value where the cumulative probability reaches one half.
    answer: |
      $\mu=3$, $\sigma^2=1$, $\gamma_1=1$, median $3$, mode $3$.
    verify:
      - expr: "2/3+3/2+5/6"
        equals: "3"
      - expr: "(1/3)+(4/6)"
        equals: "1"
      - expr: "-1/3+8/6"
        equals: "1"

  - id: constant
    type: concept
    title: A missing constant in a mass function
    body: |
      If a mass function contains an unknown constant $a$, use the one rule every mass function obeys: **the probabilities add up to $1$**. Example: $f(x)=a(x+1)^2$ for $x\in\{0,1,2,3\}$ gives $a(1+4+9+16)=30a=1$, so $a=\dfrac1{30}$. Check that all the probabilities are between $0$ and $1$ afterwards.

  - id: mgf
    type: theorem
    name: The moment generating function
    statement: |
      The moment generating function (mgf) of $X$ is $M(t)=E\left[e^{tX}\right]=\sum_xe^{tx}P(X=x)$. If it exists near $t=0$, then

      $$E[X^r]=M^{(r)}(0),\qquad\text{in particular }E[X]=M'(0),\quad E[X^2]=M''(0).$$
    proof: |
      Expand $e^{tx}=\sum_r\dfrac{t^rx^r}{r!}$. Then $M(t)=\sum_r\dfrac{t^r}{r!}E[X^r]$, a power series in $t$ whose $r$th derivative at $t=0$ is $E[X^r]$. For a finite mass function it is simply a finite sum of exponentials, and $M'(t)=\sum xe^{tx}P(X=x)$, $M'(0)=\sum xP(X=x)$.
    more: |
      **Why it is useful.** The mgf packs all the moments into one function. It also identifies the distribution: the mgf of a binomial $B(n,p)$ is $(q+pe^t)^n$, of a Poisson variable $e^{\lambda(e^t-1)}$. And $M(0)=1$ is a quick check on your work.

  - id: ex-mgf
    type: example
    title: The mgf of a small mass function
    problem: |
      $f(x)=\dfrac x9$ for $x\in\{2,3,4\}$. Find the mgf, then $E[X]$ and $\operatorname{Var}(X)$.
    steps:
      - text: |
          $M(t)=\dfrac29e^{2t}+\dfrac39e^{3t}+\dfrac49e^{4t}=\dfrac{2e^{2t}+3e^{3t}+4e^{4t}}9$.
        why: |
          One term $e^{tx}P(X=x)$ for each value. Check: $M(0)=\dfrac{2+3+4}9=1$.
      - text: |
          $M'(0)=\dfrac{2\cdot2+3\cdot3+4\cdot4}{9}=\dfrac{29}9$.
        why: |
          Differentiating $e^{kt}$ gives $ke^{kt}$, and at $t=0$ the exponentials equal $1$.
      - text: |
          $M''(0)=\dfrac{2\cdot4+3\cdot9+4\cdot16}9=\dfrac{99}9=11$, so $\operatorname{Var}(X)=11-\left(\dfrac{29}9\right)^2=\dfrac{891-841}{81}=\dfrac{50}{81}$.
        why: |
          $M''(0)=E[X^2]$. The variance is $E[X^2]-E[X]^2$.
    answer: |
      $M(t)=\dfrac{2e^{2t}+3e^{3t}+4e^{4t}}{9}$, $E[X]=\dfrac{29}9$, $\operatorname{Var}(X)=\dfrac{50}{81}$.
    verify:
      - expr: "(2*2+3*3+4*4)/9"
        equals: "29/9"
      - expr: "(2*4+3*9+4*16)/9-(29/9)^2"
        equals: "50/81"

  - id: chk-a
    type: check
    prompt: |
      Find $a$ if $f(x)=a(x+1)^2$ for $x\in\{0,1,2,3\}$ is a mass function.
    answerType: expression
    answer: "1/30"
    hints:
      - |
        The probabilities add up to $1$.
    explanation: |
      $a(1^2+2^2+3^2+4^2)=30a=1$, so $a=\dfrac1{30}$.

  - id: chk-mean
    type: check
    prompt: |
      $X$ takes the values $0,1,2$ with probabilities $\dfrac16,\dfrac12,\dfrac13$. Find $E[X]$.
    answerType: expression
    answer: "7/6"
    hints:
      - |
        $E[X]=\sum xP(X=x)$.
    explanation: |
      $0\cdot\dfrac16+1\cdot\dfrac12+2\cdot\dfrac13=\dfrac12+\dfrac23=\dfrac76$.

  - id: summary
    type: summary
    points:
      - |
        Location: mean $\sum xP$, median, mode. Dispersion: $\sigma^2=E[X^2]-\mu^2$. Shape: $\gamma_1=\mu_3/\sigma^3$, $\beta_2=\mu_4/\sigma^4$.
      - |
        A missing constant is found from "the probabilities add up to $1$".
      - |
        $M(t)=\sum e^{tx}P(X=x)$; $M(0)=1$, $E[X]=M'(0)$, $E[X^2]=M''(0)$.
