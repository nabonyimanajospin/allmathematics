    - id: co-6a
      statement: |-
        The density of $X$ is $f(x)=2a(10-x)$ for $0\le x\le10$ and $0$ elsewhere. Determine $a$.
      answerType: expression
      answer: "1/100"
      hints:
        - "The integral of a density over its whole range is $1$."
      solution: |-
        The area under the density must be $1$: $\int_0^{10}2a(10-x)\,dx=2a\left[10x-\dfrac{x^2}2\right]_0^{10}=2a\cdot50=100a=1$, so $a=\dfrac1{100}$. The density is $f(x)=\dfrac{10-x}{50}$.
    - id: co-6b1
      statement: |-
        The density of $X$ is $f(x)=\dfrac{10-x}{50}$ on $[0,10]$. Find $P(X<2)$.
      answerType: expression
      answer: "9/25"
      hints:
        - "Integrate the density from $0$ to $2$."
      solution: |-
        $P(X<2)=\int_0^2\dfrac{10-x}{50}dx=\dfrac1{50}\left[10x-\dfrac{x^2}2\right]_0^2=\dfrac{18}{50}=\dfrac{9}{25}$.
    - id: co-6b2
      statement: |-
        The density of $X$ is $f(x)=\dfrac{10-x}{50}$ on $[0,10]$. Find $P(X>5)$.
      answerType: expression
      answer: "1/4"
      hints:
        - "Integrate from $5$ to $10$."
      solution: |-
        $P(X>5)=\int_5^{10}\dfrac{10-x}{50}dx=\dfrac1{50}\left[10x-\dfrac{x^2}2\right]_5^{10}=\dfrac{50-37.5}{50}=\dfrac{1}{4}$.
      allowDecimal: true
    - id: co-6b3
      statement: |-
        The density of $X$ is $f(x)=\dfrac{10-x}{50}$ on $[0,10]$. Find $P(4\le X\le8)$.
      answerType: expression
      answer: "8/25"
      hints:
        - "Integrate from $4$ to $8$."
      solution: |-
        $P(4\le X\le8)=\int_4^8\dfrac{10-x}{50}dx=\dfrac1{50}\left[10x-\dfrac{x^2}2\right]_4^8=\dfrac{(80-32)-(40-8)}{50}=\dfrac{8}{25}$.
    - id: co-6c
      statement: |-
        The density of $X$ is $f(x)=\dfrac{10-x}{50}$ on $[0,10]$. Find the cumulative function $F(x)$ for $0\le x\le10$.
      answerType: expression
      answer: "x*(20 - x)/100"
      variables:
        [x]
      hints:
        - |-
          $F(x)=\int_0^xf(s)\,ds$.
      solution: |-
        $F(x)=\int_0^x\dfrac{10-s}{50}\,ds=\dfrac1{50}\left[10s-\dfrac{s^2}2\right]_0^x=\dfrac{20x-x^2}{100}$. Check: $F(10)=\dfrac{200-100}{100}=1$.
    - id: co-6c2
      statement: |-
        The density of $X$ is $f(x)=\dfrac{10-x}{50}$ on $[0,10]$. Find $F(6)$.
      answerType: expression
      answer: "21/25"
      hints:
        - |-
          Use $F(x)=\dfrac{20x-x^2}{100}$.
      solution: |-
        $F(6)=\dfrac{20\cdot6-36}{100}=\dfrac{84}{100}=\dfrac{21}{25}$.
    - id: co-6d1
      statement: |-
        The density of $X$ is $f(x)=\dfrac{10-x}{50}$ on $[0,10]$. Find the mean $E[X]$.
      answerType: expression
      answer: "10/3"
      hints:
        - |-
          $E[X]=\int xf(x)\,dx$.
      solution: |-
        $E[X]=\int_0^{10}x\,\dfrac{10-x}{50}dx=\dfrac{10}{3}$. $E[X^2]=\dfrac{50}{3}$, so $\operatorname{Var}(X)=E[X^2]-E[X]^2=\dfrac{50}{9}$. Third central moment $\mu_3=\int(x-\mu)^3f(x)dx=\dfrac{200}{27}$ and the skewness is $\gamma_1=\mu_3/\sigma^3=\dfrac{2 \sqrt{2}}{5}$.
    - id: co-6d2
      statement: |-
        The density of $X$ is $f(x)=\dfrac{10-x}{50}$ on $[0,10]$. Find the variance.
      answerType: expression
      answer: "50/9"
      hints:
        - "$E[X^2]-E[X]^2$."
      solution: |-
        $E[X]=\int_0^{10}x\,\dfrac{10-x}{50}dx=\dfrac{10}{3}$. $E[X^2]=\dfrac{50}{3}$, so $\operatorname{Var}(X)=E[X^2]-E[X]^2=\dfrac{50}{9}$. Third central moment $\mu_3=\int(x-\mu)^3f(x)dx=\dfrac{200}{27}$ and the skewness is $\gamma_1=\mu_3/\sigma^3=\dfrac{2 \sqrt{2}}{5}$.
    - id: co-6d3
      statement: |-
        The density of $X$ is $f(x)=\dfrac{10-x}{50}$ on $[0,10]$. Find the skewness $\gamma_1$ (a positive value means a long tail on the right).
      answerType: expression
      answer: "2*sqrt(2)/5"
      hints:
        - |-
          $\mu_3=\int(x-\mu)^3f(x)\,dx$.
      solution: |-
        $E[X]=\int_0^{10}x\,\dfrac{10-x}{50}dx=\dfrac{10}{3}$. $E[X^2]=\dfrac{50}{3}$, so $\operatorname{Var}(X)=E[X^2]-E[X]^2=\dfrac{50}{9}$. Third central moment $\mu_3=\int(x-\mu)^3f(x)dx=\dfrac{200}{27}$ and the skewness is $\gamma_1=\mu_3/\sigma^3=\dfrac{2 \sqrt{2}}{5}$.
    - id: co-6e
      statement: |-
        The density of $X$ is $f(x)=\dfrac{10-x}{50}$ on $[0,10]$. Find the median $m$, defined by $F(m)=\dfrac12$.
      answerType: expression
      answer: "10 - 5*sqrt(2)"
      hints:
        - |-
          Solve $F(m)=\dfrac12$ and keep the root in $[0,10]$.
      solution: |-
        $F(m)=\dfrac{20m-m^2}{100}=\dfrac12$ gives $m^2-20m+50=0$, so $m=10\pm5\sqrt2$. Only $m=10-5\sqrt2$ lies in $[0,10]$.
    - id: co-7a
      statement: |-
        The density of $X$ is $f(x)=\dfrac k{x^2}$ for $x\ge400$ and $0$ elsewhere. Determine $k$.
      answerType: number
      answer: "400"
      hints:
        - "The total area is $1$."
      solution: |-
        $\int_{400}^{\infty}\dfrac k{x^2}dx=k\left[-\dfrac1x\right]_{400}^{\infty}=\dfrac k{400}=1$, so $k=400$.
    - id: co-7b
      statement: |-
        The density of $X$ is $f(x)=\dfrac{400}{x^2}$ for $x\ge400$. Find the cumulative function $F(x)$ for $x\ge400$.
      answerType: expression
      answer: "(x - 400)/x"
      variables:
        [x]
      hints:
        - |-
          $F(x)=\int_{400}^xf(s)\,ds$.
      solution: |-
        $F(x)=\int_{400}^x\dfrac{400}{s^2}ds=400\left[-\dfrac1s\right]_{400}^x=400\left(\dfrac1{400}-\dfrac1x\right)=1-\dfrac{400}x$.
    - id: co-7c1
      statement: |-
        The density of $X$ is $f(x)=\dfrac{400}{x^2}$ for $x\ge400$. Find $P(X<500)$.
      answerType: expression
      answer: "1/5"
      hints:
        - "Use $F$."
      solution: |-
        $F(500)=1-\dfrac{400}{500}=\dfrac15$.
    - id: co-7c2
      statement: |-
        The density of $X$ is $f(x)=\dfrac{400}{x^2}$ for $x\ge400$. Find $P(X>600)$.
      answerType: expression
      answer: "2/3"
      hints:
        - "The complement of $F$."
      solution: |-
        $P(X>600)=1-F(600)=\dfrac{400}{600}=\dfrac23$.
    - id: co-7c3
      statement: |-
        The density of $X$ is $f(x)=\dfrac{400}{x^2}$ for $x\ge400$. Find $P(400\le X\le800)$.
      answerType: expression
      answer: "1/2"
      hints:
        - "$F(400)=0$."
      solution: |-
        $F(800)-F(400)=\left(1-\dfrac12\right)-0=\dfrac12$.
    - id: co-7d
      statement: |-
        The density of $X$ is $f(x)=\dfrac{400}{x^2}$ for $x\ge400$. What can be said about the mean $E[X]$?
      answerType: multiple_choice
      answer: "3"
      choices:
        - text: "$E[X]=400$"
          value: "1"
        - text: "$E[X]=800$"
          value: "2"
        - text: |-
            $E[X]$ does not exist: the integral diverges
          value: "3"
        - text: "$E[X]=1200$"
          value: "4"
      correctIndex: 2
      hints:
        - |-
          $E[X]=\int_{400}^\infty x\cdot\dfrac{400}{x^2}\,dx$.
      solution: |-
        $E[X]=\int_{400}^{\infty}x\cdot\dfrac{400}{x^2}dx=400\int_{400}^{\infty}\dfrac{dx}x=400\left[\ln x\right]_{400}^{\infty}=\infty$. The integral diverges, so the mean (and therefore the variance and the skewness) does not exist. A density can be perfectly valid and still have no mean.
    - id: co-7e
      statement: |-
        The density of $X$ is $f(x)=\dfrac{400}{x^2}$ for $x\ge400$. Find the median $m$ with $F(m)=\dfrac12$.
      answerType: number
      answer: "800"
      hints:
        - |-
          Solve $F(m)=\dfrac12$.
      solution: |-
        $1-\dfrac{400}m=\dfrac12$ gives $\dfrac{400}m=\dfrac12$, so $m=800$.
