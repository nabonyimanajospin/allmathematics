- id: sheet-exp-normal
  task: "Exponential and normal distributions (exercise sheet)."
  format: "Type a whole number, a fraction such as `7/19`, or an exact expression such as `exp(-5)` or `sqrt(7)/3`. Write the standard normal distribution function as `Phi(z)`. For a function of t type for example `(1+2*exp(t))/3`."
  source: "STAT8225 exercise sheet, T. Hakizimana"
  items:
    - id: ex-12k
      statement: "The length of a phone call has the density $f(x)=ke^{-\\frac{x}{6}}$ for $x>0$ (and $0$ otherwise). Find $k$."
      answerType: expression
      answer: "1/6"
      hints:
        - |-
          $\int_0^\infty e^{-\frac{x}{6}}dx=6$.
      solution: |-
        $\int_0^{\infty}ke^{-\frac{x}{6}}dx=k\cdot6=1$, so $k=\dfrac16$ (an exponential distribution with mean $6$ minutes).
    - id: ex-12a
      statement: |-
        The length of a call has the density $f(x)=\dfrac16e^{-\frac{x}{6}}$ for $x>0$. Find the probability that the person talks more than $8$ minutes.
      answerType: expression
      answer: "exp(-4/3)"
      hints:
        - "$P(X>a)=e^{-\\frac{a}{6}}$."
      solution: |-
        $P(X>8)=\int_8^\infty\dfrac16e^{-\frac{x}{6}}dx=e^{-\frac{8}{6}}=e^{-\frac{4}{3}}$.
    - id: ex-12b
      statement: |-
        The length of a call has the density $f(x)=\dfrac16e^{-\frac{x}{6}}$ for $x>0$. Find the probability that the person talks less than $4$ minutes.
      answerType: expression
      answer: "1 - exp(-2/3)"
      hints:
        - "$P(X<a)=1-e^{-\\frac{a}{6}}$."
      solution: "$P(X<4)=1-e^{-\\frac{4}{6}}=1-e^{-\\frac{2}{3}}$."
    - id: ex-12c
      statement: |-
        The length of a call has the density $f(x)=\dfrac16e^{-\frac{x}{6}}$ for $x>0$. Find the probability that the person talks between $5$ and $10$ minutes.
      answerType: expression
      answer: "-exp(-5/3) + exp(-5/6)"
      hints:
        - "$P(X>5)-P(X>10)$."
      solution: "$P(5<X<10)=P(X>5)-P(X>10)=e^{-\\frac{5}{6}}-e^{-\\frac{10}{6}}=e^{-\\frac{5}{6}}-e^{-\\frac{5}{3}}$."
    - id: ex-13a
      statement: "The waiting time $X$ in hours between two speeders has the distribution function $F(x)=1-e^{-8x}$ for $x>0$. Find the probability of waiting more than $12$ minutes."
      answerType: expression
      answer: "exp(-8/5)"
      hints:
        - Convert the minutes to hours first.
      solution: |-
        $12$ minutes $=\dfrac15$ hour. $P(X>\tfrac15)=1-F\left(\tfrac15\right)=e^{-\frac{8}{5}}$.
    - id: ex-13b
      statement: "The waiting time $X$ in hours between two speeders has the distribution function $F(x)=1-e^{-8x}$ for $x>0$. Find the probability of waiting less than $5$ minutes."
      answerType: expression
      answer: "1 - exp(-2/3)"
      hints:
        - |-
          $5$ minutes is $\dfrac{5}{60}=\dfrac1{12}$ hour.
      solution: |-
        $5$ minutes $=\dfrac1{12}$ hour. $P(X<\tfrac1{12})=F\left(\tfrac1{12}\right)=1-e^{-\frac{8}{12}}=1-e^{-\frac{2}{3}}$.
    - id: no-14z
      statement: "Speeds of cars are normally distributed with mean $90$ km/h and standard deviation $10$ km/h. Find the standardized value $z$ of the speed $100$ km/h."
      answerType: number
