id: geo-m03-u02-l03
title: "The tetrahedron: centroid, medians, circumsphere and insphere"
estMinutes: 50
version: 1
status: draft
skills:
  - tetrahedron-centroid
  - circumsphere
  - insphere
objectives:
  - Find the centroid of a tetrahedron, its medians and bimedians.
  - Find the circumsphere (center and radius).
  - Find the insphere with $r=\dfrac{3V}{S}$.
sections:
  - id: centers-idea
    type: concept
    title: Centers of a tetrahedron
    body: |
      A triangle has a centroid, a circumcircle and an incircle. A tetrahedron has the same three objects one dimension higher: a **centroid**, a **circumsphere** through the four vertices, and an **insphere** touching the four faces.
      The centroid is an average of the vertices; the circumcenter is found from the planes that are equidistant from two vertices; the radius of the insphere comes from a volume computed in two ways.

  - id: centroid-theorem
    type: theorem
    name: The centroid of a tetrahedron
    statement: |
      The **centroid** (barycenter) of the tetrahedron $ABCD$ is

      $$G=\dfrac{A+B+C+D}{4}=\left(\dfrac{x_A+x_B+x_C+x_D}{4},\ \dfrac{y_A+y_B+y_C+y_D}{4},\ \dfrac{z_A+z_B+z_C+z_D}{4}\right).$$

      A **median** joins a vertex to the centroid of the opposite face. The four medians meet at $G$, which divides each of them in the ratio $3:1$ counted from the vertex. A **bimedian** joins the midpoints of two opposite edges; the three bimedians also pass through $G$, and $G$ is the midpoint of each.
    proof: |
      The centroid of the face $BCD$ is $G_A=\dfrac{B+C+D}{3}$. The point of $AG_A$ with $\overrightarrow{AG}=3\,\overrightarrow{GG_A}$ is $\dfrac{A+3G_A}{4}=\dfrac{A+B+C+D}{4}$, which is symmetric in the four vertices, so it is on all medians.
      The midpoint of the midpoints $\dfrac{A+B}2$ and $\dfrac{C+D}2$ is also $\dfrac{A+B+C+D}4$.

  - id: ex-centroid
    type: example
    title: Centroid, median and bimedian
    problem: |
      For $A(0,0,0)$, $B(4,0,0)$, $C(1,3,0)$, $D(2,1,5)$ find the centroid, the length of the median from $A$ and the bimedian joining the midpoints of $AB$ and $CD$.
    steps:
      - |
        $G=\dfrac{(0+4+1+2,\ 0+0+3+1,\ 0+0+0+5)}{4}=\left(\dfrac74,1,\dfrac54\right)$.
      - |
        The centroid of $BCD$ is $G_A=\left(\dfrac73,\dfrac43,\dfrac53\right)$, and $AG_A=\dfrac13\sqrt{49+16+25}=\dfrac{\sqrt{90}}3=\sqrt{10}$.
      - |
        The midpoints of $AB$ and $CD$ are $(2,0,0)$ and $\left(\dfrac32,2,\dfrac52\right)$. Their midpoint is $\left(\dfrac74,1,\dfrac54\right)=G$.
    answer: |
      $G\left(\dfrac74,1,\dfrac54\right)$; the median from $A$ has length $\sqrt{10}$.
    verify:
      - expr: "(0+4+1+2)/4"
        equals: "7/4"
      - expr: "sqrt(49+16+25)/3"
        equals: "sqrt(10)"
      - expr: "(2+3/2)/2"
        equals: "7/4"

  - id: chk-centroid
    type: check
    prompt: |
      Find the centroid of the tetrahedron with vertices $(0,0,0)$, $(4,0,0)$, $(0,8,0)$, $(0,0,12)$.
    answerType: vector
    answer: "(1, 2, 3)"
    hints:
      - |
        Add the four $x$-coordinates and divide by $4$, and so on.
    explanation: |
      $\left(\dfrac{4}{4},\dfrac{8}{4},\dfrac{12}{4}\right)=(1,2,3)$.

  - id: circumsphere
    type: theorem
    name: The circumsphere
    statement: |
      The four vertices are on one sphere, the **circumsphere**, whose center $O$ is equidistant from them and lies on the perpendicular bisector plane of each edge. It is found by solving the linear system
      $OA^2=OB^2=OC^2=OD^2$, which reduces to three equations (the planes of $AB$, $AC$, $AD$):

      $$2\,\dotp{\overrightarrow{AX}}{\overrightarrow{AO}}=AX^2,\qquad X=B,C,D.$$

      The radius is $R=OA$.
    proof: |
      $OA^2=OX^2$ means $\norm{O-A}^2=\norm{O-X}^2$, that is $\norm{\overrightarrow{AO}}^2=\norm{\overrightarrow{AO}-\overrightarrow{AX}}^2$, and expanding gives $2\dotp{\overrightarrow{AX}}{\overrightarrow{AO}}=AX^2$. The three vectors $\overrightarrow{AB},\overrightarrow{AC},\overrightarrow{AD}$ are independent, so the system has exactly one solution.

  - id: ex-circumsphere
    type: example
    title: The circumsphere of the running example
    problem: |
      Find the circumsphere of $A(0,0,0)$, $B(4,0,0)$, $C(1,3,0)$, $D(2,1,5)$.
    steps:
      - |
        Write $O=(p,q,r)$. The three equations are: for $B$, $2\cdot4p=16$, so $p=2$; for $C$, $2(p+3q)=10$, so $q=1$; for $D$, $2(2p+q+5r)=30$, so $2p+q+5r=15$ and $r=2$.
      - |
        $O=(2,1,2)$ and $R=OA=\sqrt{4+1+4}=3$.
      - |
        The sphere is $(x-2)^2+(y-1)^2+(z-2)^2=9$. Check with $D$: $0+0+9=9$.
    answer: |
      $O(2,1,2)$, $R=3$; $\ (x-2)^2+(y-1)^2+(z-2)^2=9$.
    verify:
      - expr: "(4-2)^2+(0-1)^2+(0-2)^2"
        equals: "9"
      - expr: "(1-2)^2+(3-1)^2+(0-2)^2"
        equals: "9"
      - expr: "(2-2)^2+(1-1)^2+(5-2)^2"
        equals: "9"

  - id: chk-circumsphere
    type: check
    prompt: |
      Find the radius of the sphere through $A(0,0,0)$, $B(2,0,0)$, $C(0,2,0)$ and $D(0,0,2)$.
    answerType: expression
    answer: "sqrt(3)"
    hints:
      - |
        By symmetry the center is $(1,1,1)$.
    explanation: |
      $O=(1,1,1)$ is at distance $\sqrt3$ from $A$, and also from $B$: $\sqrt{1+1+1}$. So $R=\sqrt3$.

  - id: insphere
    type: theorem
    name: The insphere
    statement: |
      The **insphere** is the sphere inside the tetrahedron that touches the four faces. Its center is

      $$I=\dfrac{S_A\,A+S_B\,B+S_C\,C+S_D\,D}{S},\qquad S=S_A+S_B+S_C+S_D,$$

      where $S_A$ is the area of the face opposite $A$, and its radius is

      $$r=\dfrac{3V}{S}.$$
    proof: |
      The segments from $I$ to the four vertices cut the tetrahedron into four tetrahedra with the faces of $ABCD$ as bases and the common height $r$, so $V=\dfrac13r\,(S_A+S_B+S_C+S_D)=\dfrac13rS$.
      For the position: $I$ is a weighted mean with weights proportional to the volumes of the four tetrahedra that it makes with the faces, which are proportional to the face areas.

  - id: ex-insphere
    type: example
    title: The insphere of a corner tetrahedron
    problem: |
      Find the insphere of the tetrahedron $A(0,0,0)$, $B(2,0,0)$, $C(0,4,0)$, $D(0,0,6)$.
    steps:
      - |
        $V=8$. The areas are $S_D=S_{ABC}=\dfrac12\cdot2\cdot4=4$, $S_C=S_{ABD}=\dfrac12\cdot2\cdot6=6$, $S_B=S_{ACD}=\dfrac12\cdot4\cdot6=12$ and $S_A=S_{BCD}=14$ (half of the norm of the cross product of $(-2,4,0)$ and $(-2,0,6)$, which is $(24,12,8)$ with norm $28$).
      - |
        $S=4+6+12+14=36$, so $r=\dfrac{3\cdot8}{36}=\dfrac23$.
      - |
        $I=\dfrac{14A+12B+6C+4D}{36}=\dfrac{(24,24,24)}{36}=\left(\dfrac23,\dfrac23,\dfrac23\right)$. Check: $I$ is at distance $\dfrac23$ from the three coordinate planes, as $r$ requires.
    answer: |
      $r=\dfrac23$ and $I\left(\dfrac23,\dfrac23,\dfrac23\right)$.
    verify:
      - expr: "3*8/36"
        equals: "2/3"
      - expr: "(12*2)/36"
        equals: "2/3"
      - expr: "(6*4)/36"
        equals: "2/3"
      - expr: "(4*6)/36"
        equals: "2/3"
      - expr: "sqrt(24^2+12^2+8^2)/2"
        equals: "14"

  - id: chk-insphere
    type: check
    prompt: |
      A tetrahedron has volume $V=12$ and total surface area $S=36$. Find the radius of its insphere.
    answerType: number
    answer: "1"
    hints:
      - |
        $r=\dfrac{3V}{S}$.
    explanation: |
      $r=\dfrac{36}{36}=1$.

  - id: summary
    type: summary
    points:
      - |
        $G=\dfrac{A+B+C+D}{4}$; the medians are divided $3:1$ from the vertex, and the three bimedians meet at $G$.
      - |
        The circumcenter solves $2\dotp{\overrightarrow{AX}}{\overrightarrow{AO}}=AX^2$ for $X=B,C,D$; $R=OA$.
      - |
        $r=\dfrac{3V}{S}$ and $I=\dfrac{\sum S_XX}{S}$.
