id: geo-m03-u02-l06
title: A complete study of a tetrahedron - edge and face angle, distance between edges, circumsphere
estMinutes: 60
version: 1
status: draft
skills:
  - angle-edge-face
  - distance-between-edges
  - circumsphere-four-points
objectives:
  - Find the angle between an edge and a face of a tetrahedron from the normal vector of the face.
  - Find the distance between two opposite edges with the box product and the cross product.
  - Find the equation, the area and the volume of the circumsphere by solving four linear equations.
sections:
  - id: why
    type: concept
    title: Three more questions about one tetrahedron
    body: |
      A complete study of a tetrahedron asks, for the same four vertices, for the edges, the faces, the volume and the altitudes (the previous lessons), and then for three more things: the **angle between an edge and a face**, the **distance between two opposite edges**, and the **circumsphere** (its equation, its area and its volume).

      We work with one tetrahedron through the whole lesson: $A(2,3,-3)$, $B(1,3,-2)$, $C(2,2,-2)$, $D(2,3,-2)$. Its numbers are small, so you can follow every step.

  - id: formulas
    type: formula
    title: Angle between an edge and a face, distance between two edges
    formula: |
      \begin{aligned}
      \vec N_{ABC}&=\crossp{\overrightarrow{AB}}{\overrightarrow{AC}},\qquad \sin\theta=\dfrac{\left|\dotp{\vec N_{ABC}}{\overrightarrow{AD}}\right|}{\norm{\vec N_{ABC}}\,\norm{\overrightarrow{AD}}}\quad(\theta\text{ between the edge }AD\text{ and the face }ABC),\\
      d(AD,BC)&=\dfrac{\left|\boxp{\overrightarrow{AB}}{\overrightarrow{AD}}{\overrightarrow{BC}}\right|}{\norm{\crossp{\overrightarrow{AD}}{\overrightarrow{BC}}}}\quad(\text{distance between the opposite edges }AD\text{ and }BC).
      \end{aligned}
    note: |
      The angle between a line and a plane is the angle between the line and its projection on the plane, so it is the complement of the angle between the line and the normal vector: this is why a **sine** appears. The two edges $AD$ and $BC$ have no common vertex; they are skew lines (or, at best, parallel), and the distance between them is the height of the parallelepiped built on $\overrightarrow{AB}$, $\overrightarrow{AD}$, $\overrightarrow{BC}$ over its base, the parallelogram of $\overrightarrow{AD}$ and $\overrightarrow{BC}$.

  - id: ex-vectors
    type: example
    title: The edges, the volume and the area of the face ABC
    problem: |
      For $A(2,3,-3)$, $B(1,3,-2)$, $C(2,2,-2)$, $D(2,3,-2)$ find the edge vectors from $A$, the volume and the area of the face $ABC$.
    steps:
      - text: |
          $\overrightarrow{AB}=(-1,0,1)$, $\overrightarrow{AC}=(0,-1,1)$, $\overrightarrow{AD}=(0,0,1)$ and $\overrightarrow{BC}=(1,-1,0)$.
        why: |
          Each vector is the end point minus the starting point: for example $\overrightarrow{BC}=(2-1,\ 2-3,\ -2-(-2))$.
      - text: |
          $\vec N_{ABC}=\crossp{\overrightarrow{AB}}{\overrightarrow{AC}}=(1,1,1)$, so $S_{ABC}=\dfrac12\norm{(1,1,1)}=\dfrac{\sqrt3}2$ squ.
        why: |
          $\crossp{(-1,0,1)}{(0,-1,1)}=(0\cdot1-1\cdot(-1),\ 1\cdot0-(-1)\cdot1,\ (-1)(-1)-0\cdot0)=(1,1,1)$.
      - text: |
          $\boxp{\overrightarrow{AB}}{\overrightarrow{AC}}{\overrightarrow{AD}}=\dotp{(1,1,1)}{(0,0,1)}=1$, so $V=\dfrac16$ cu.
        why: |
          The volume of a tetrahedron is one sixth of the absolute value of the box product of three edges from one vertex.
    answer: |
      $\overrightarrow{AB}=(-1,0,1)$, $\overrightarrow{AC}=(0,-1,1)$, $\overrightarrow{AD}=(0,0,1)$; $S_{ABC}=\dfrac{\sqrt3}2$ squ; $V=\dfrac16$ cu.
    verify:
      - expr: "norm(cross((-1,0,1),(0,-1,1)))/2"
        equals: "sqrt(3)/2"
      - expr: "box((-1,0,1),(0,-1,1),(0,0,1))/6"
        equals: "1/6"

  - id: ex-angle
    type: example
    title: The angle between the edge AD and the face ABC
    problem: |
      For the same tetrahedron find the angle between the edge $AD$ and the face $ABC$.
    steps:
      - text: |
          The normal vector of the face is $\vec N_{ABC}=(1,1,1)$, found above, and $\overrightarrow{AD}=(0,0,1)$.
        why: |
          The normal vector is perpendicular to the face, so it gives the direction that the edge is compared with.
      - text: |
          $\dotp{\vec N_{ABC}}{\overrightarrow{AD}}=1$, $\norm{\vec N_{ABC}}=\sqrt3$ and $\norm{\overrightarrow{AD}}=1$.
        why: |
          $\norm{(1,1,1)}=\sqrt{1+1+1}$ and $\norm{(0,0,1)}=1$.
      - text: |
          $\sin\theta=\dfrac{|1|}{\sqrt3\cdot1}$. After rationalizing the denominator, $\sin\theta=\dfrac{\sqrt3}3$ and $\theta=\arcsin\dfrac{\sqrt3}3$.
        why: |
          Multiplying the top and the bottom by $\sqrt3$ gives $\dfrac{\sqrt3}{3}$. The angle is not a familiar one, so we keep it as an arcsine: this is exact. (The cosine of the angle with the normal is the same number, because the edge makes an angle $\dfrac\pi2-\theta$ with the normal.)
    answer: |
      $\sin\theta=\dfrac{\sqrt3}3$, that is $\theta=\arcsin\dfrac{\sqrt3}3$.
    verify:
      - expr: "1/(sqrt(3)*1)"
        equals: "sqrt(3)/3"

  - id: ex-distance
    type: example
    title: The distance between the opposite edges AD and BC
    problem: |
      For the same tetrahedron find the distance between the edges $AD$ and $BC$.
    steps:
      - text: |
          $\overrightarrow{AB}=(-1,0,1)$, $\overrightarrow{AD}=(0,0,1)$ and $\overrightarrow{BC}=(1,-1,0)$.
        why: |
          The lines $AD$ and $BC$ have no common vertex: they are opposite edges.
      - text: |
          $\crossp{\overrightarrow{AD}}{\overrightarrow{BC}}=(1,1,0)$, so $\norm{\crossp{\overrightarrow{AD}}{\overrightarrow{BC}}}=\sqrt2$.
        why: |
          $\crossp{(0,0,1)}{(1,-1,0)}=(0\cdot0-1\cdot(-1),\ 1\cdot1-0\cdot0,\ 0\cdot(-1)-0\cdot1)=(1,1,0)$.
      - text: |
          $\boxp{\overrightarrow{AB}}{\overrightarrow{AD}}{\overrightarrow{BC}}=\dotp{\overrightarrow{AB}}{\crossp{\overrightarrow{AD}}{\overrightarrow{BC}}}=(-1)\cdot1+0\cdot1+1\cdot0=-1$.
        why: |
          A non-zero box product shows that the two edges are skew lines (they are not in one plane). Only its absolute value is used.
      - text: |
          $d(AD,BC)=\dfrac{|-1|}{\sqrt2}$; after rationalizing the denominator, $d=\dfrac{\sqrt2}2$ lu.
        why: |
          Multiplying the top and the bottom by $\sqrt2$ gives $\dfrac{\sqrt2}{2}$.
    answer: |
      $d(AD,BC)=\dfrac{\sqrt2}2$ lu.
    verify:
      - expr: "box((-1,0,1),(0,0,1),(1,-1,0))"
        equals: "-1"
      - expr: "norm(cross((0,0,1),(1,-1,0)))"
        equals: "sqrt(2)"
      - expr: "1/sqrt(2)"
        equals: "sqrt(2)/2"

  - id: ex-circumsphere
    type: example
    title: The circumsphere - equation, area and volume
    problem: |
      For the same tetrahedron find the sphere through its four vertices: its equation, its center, its radius, its area and its volume.
    steps:
      - text: |
          Put the four vertices in $x^2+y^2+z^2+2mx+2ny+2pz+q=0$: $A$: $4m+6n-6p+q=-22$; $B$: $2m+6n-4p+q=-14$; $C$: $4m+4n-4p+q=-12$; $D$: $4m+6n-4p+q=-17$.
        why: |
          For $A(2,3,-3)$ the squares add to $4+9+9=22$ and the terms $2mx,2ny,2pz$ become $4m+6n-6p$. The squares of $B$, $C$, $D$ add to $14$, $12$, $17$.
      - text: |
          Subtract the equation of $A$ from the one of $D$: $2p=5$, so $p=\dfrac52$. Subtract the equation of $B$ from the one of $D$: $2m=-3$, so $m=-\dfrac32$. Subtract the equation of $C$ from the one of $D$: $2n=-5$, so $n=-\dfrac52$.
        why: |
          $D$ differs from each of the other points in one coordinate only, so each subtraction leaves one unknown. For example $(4m+6n-4p+q)-(4m+6n-6p+q)=2p$ and $-17-(-22)=5$.
      - text: |
          The equation of $D$ gives $q$: $-6-15-10+q=-17$, so $q=14$.
        why: |
          $4m=-6$, $6n=-15$ and $-4p=-10$.
      - text: |
          The equation is $x^2+y^2+z^2-3x-5y+5z+14=0$. The center is $(-m,-n,-p)=\left(\dfrac32,\dfrac52,-\dfrac52\right)$ and $\rho^2=m^2+n^2+p^2-q=\dfrac94+\dfrac{25}4+\dfrac{25}4-14=\dfrac34$, so $\rho=\dfrac{\sqrt3}2$.
        why: |
          $\dfrac{59}4-14=\dfrac{59-56}4=\dfrac34$. Check with $A(2,3,-3)$: $\left(\dfrac12\right)^2+\left(\dfrac12\right)^2+\left(-\dfrac12\right)^2=\dfrac34$.
      - text: |
          Area $4\pi\rho^2=3\pi$ squ. Volume $\dfrac43\pi\rho^3=\dfrac{\sqrt3}2\pi$ cu.
        why: |
          $\rho^3=\dfrac34\cdot\dfrac{\sqrt3}2=\dfrac{3\sqrt3}8$ and $\dfrac43\cdot\dfrac{3\sqrt3}8=\dfrac{\sqrt3}2$.
    answer: |
      $x^2+y^2+z^2-3x-5y+5z+14=0$; center $\left(\dfrac32,\dfrac52,-\dfrac52\right)$; $\rho=\dfrac{\sqrt3}2$; area $3\pi$ squ; volume $\dfrac{\sqrt3}2\pi$ cu.
    verify:
      - expr: "(2-3/2)^2+(3-5/2)^2+(-3+5/2)^2"
        equals: "3/4"
      - expr: "(1-3/2)^2+(3-5/2)^2+(-2+5/2)^2"
        equals: "3/4"
      - expr: "(2-3/2)^2+(2-5/2)^2+(-2+5/2)^2"
        equals: "3/4"
      - expr: "(2-3/2)^2+(3-5/2)^2+(-2+5/2)^2"
        equals: "3/4"
      - expr: "4*pi*3/4"
        equals: "3*pi"
      - expr: "4/3*pi*(sqrt(3)/2)^3"
        equals: "sqrt(3)*pi/2"

  - id: chk-angle
    type: check
    prompt: |
      A face of a tetrahedron has the normal vector $\vec N=(0,0,2)$ and an edge has the direction $\vec d=(1,0,1)$. Find the sine of the angle between the edge and the face.
    answerType: expression
    answer: "sqrt(2)/2"
    hints:
      - |
        $\sin\theta=\dfrac{|\dotp{\vec N}{\vec d}|}{\norm{\vec N}\norm{\vec d}}$.
    explanation: |
      $\dotp{\vec N}{\vec d}=2$, $\norm{\vec N}=2$ and $\norm{\vec d}=\sqrt2$, so $\sin\theta=\dfrac{2}{\norm{\vec N}\norm{\vec d}}$ with $\norm{\vec N}\norm{\vec d}=2\sqrt2$, which simplifies to $\dfrac{\sqrt2}2$; hence $\theta=\dfrac\pi4$.

  - id: chk-distance
    type: check
    prompt: |
      The opposite edges $AD$ and $BC$ of a tetrahedron have $\boxp{\overrightarrow{AB}}{\overrightarrow{AD}}{\overrightarrow{BC}}=12$ and $\norm{\crossp{\overrightarrow{AD}}{\overrightarrow{BC}}}=6$. Find the distance between them (the unit is lu: give the number only).
    answerType: expression
    answer: "2"
    hints:
      - |
        $d=\dfrac{|\boxp{\overrightarrow{AB}}{\overrightarrow{AD}}{\overrightarrow{BC}}|}{\norm{\crossp{\overrightarrow{AD}}{\overrightarrow{BC}}}}$.
    explanation: |
      $d=\dfrac{12}{6}=2$ lu.

  - id: summary
    type: summary
    points:
      - |
        Edge and face: $\sin\theta=\dfrac{|\dotp{\vec N}{\overrightarrow{AD}}|}{\norm{\vec N}\norm{\overrightarrow{AD}}}$ with $\vec N=\crossp{\overrightarrow{AB}}{\overrightarrow{AC}}$ (a sine, because the normal is perpendicular to the face).
      - |
        Distance between opposite edges: $d(AD,BC)=\dfrac{|\boxp{\overrightarrow{AB}}{\overrightarrow{AD}}{\overrightarrow{BC}}|}{\norm{\crossp{\overrightarrow{AD}}{\overrightarrow{BC}}}}$.
      - |
        Circumsphere: put the four vertices in $x^2+y^2+z^2+2mx+2ny+2pz+q=0$, solve the four linear equations (subtract equations to eliminate $q$), then the center is $(-m,-n,-p)$, the area $4\pi\rho^2$ and the volume $\dfrac43\pi\rho^3$.
