- id: add-study-2
  task: "Edge and face angle, distance between opposite edges, circumsphere (part 2 of 2)."
  format: "Type a point as `(x, y, z)`, an exact value such as `sqrt(7)/4`, or an equation with `=`."
  items:
    - id: st-m1
      statement: |-
        The box product $\boxp{\overrightarrow{AB}}{\overrightarrow{AD}}{\overrightarrow{BC}}$ of two opposite edges of a tetrahedron is never $0$ because
      answerType: multiple_choice
      answer: "2"
      choices:
        - text: The edges are perpendicular
          value: "1"
        - text: The four vertices are not in one plane
          value: "2"
        - text: The edges have the same length
          value: "3"
        - text: The edges are parallel
          value: "4"
      correctIndex: 1
      hints:
        - The two opposite edges are not coplanar.
      solution: |-
        If the box product were $0$, the lines $AD$ and $BC$ would lie in one plane, and the four vertices would be coplanar: there would be no tetrahedron.
