id: geo-m03-u02-l01
title: "The tetrahedron: vertices, edges, faces and angles"
estMinutes: 45
version: 1
status: draft
skills:
  - tetrahedron-edges
  - face-areas
  - face-angles
objectives:
  - Define a tetrahedron by its vertices, and name its edges, faces and the opposite elements.
  - Compute the edge lengths, the angles of a face, the area of a face and the total surface area.
sections:
  - id: definition
    type: definition
    term: Tetrahedron
    body: |
      A **tetrahedron** $ABCD$ is given by four points $A,B,C,D$, its **vertices**, that are **not in one plane**. It has

      - $6$ **edges**: $AB,\ AC,\ AD,\ BC,\ BD,\ CD$. Two edges that have no common vertex are **opposite** (for example $AB$ and $CD$);
      - $4$ **faces**, which are triangles: $BCD$ (opposite to $A$), $ACD$, $ABD$, $ABC$.

      The vertices are not coplanar exactly when the box product $\boxp{\overrightarrow{AB}}{\overrightarrow{AC}}{\overrightarrow{AD}}\neq0$. In this unit the running example is $A(0,0,0)$, $B(4,0,0)$, $C(1,3,0)$, $D(2,1,5)$.

  - id: ex-edges
    type: example
    title: The six edges
    problem: |
      Find the lengths of the edges of the tetrahedron $A(0,0,0)$, $B(4,0,0)$, $C(1,3,0)$, $D(2,1,5)$.
    steps:
      - |
        $AB=\sqrt{16}=4$, $AC=\sqrt{1+9}=\sqrt{10}$, $AD=\sqrt{4+1+25}=\sqrt{30}$.
      - |
        $\overrightarrow{BC}=(-3,3,0)$, so $BC=\sqrt{18}=3\sqrt2$. $\overrightarrow{BD}=(-2,1,5)$, so $BD=\sqrt{30}$. $\overrightarrow{CD}=(1,-2,5)$, so $CD=\sqrt{30}$.
    answer: |
      $AB=4$, $AC=\sqrt{10}$, $AD=BD=CD=\sqrt{30}$, $BC=3\sqrt2$.
    verify:
      - expr: "sqrt(1+9)"
        equals: "sqrt(10)"
      - expr: "sqrt((-2)^2+1+25)"
        equals: "sqrt(30)"
      - expr: "sqrt(1+4+25)"
        equals: "sqrt(30)"

  - id: chk-edge
    type: check
    prompt: |
      Find the length of the edge $CD$ of the tetrahedron with $C(1,3,0)$ and $D(5,0,12)$.
    answerType: number
    answer: "13"
    hints:
      - |
        $\overrightarrow{CD}=(4,-3,12)$.
    explanation: |
      $CD=\sqrt{16+9+144}=\sqrt{169}=13$.

  - id: face-theorem
    type: theorem
    name: Angles and area of a face
    statement: |
      Each face is a triangle, and the formulas of the triangle hold with vectors of space. For the face $ABC$:

      $$\cos\hat A=\dfrac{\dotp{\overrightarrow{AB}}{\overrightarrow{AC}}}{\norm{\overrightarrow{AB}}\,\norm{\overrightarrow{AC}}},\qquad\text{area}=\dfrac12\norm{\crossp{\overrightarrow{AB}}{\overrightarrow{AC}}}.$$

      The same formulas, with the vertex at the angle, give $\cos\hat B$ and $\cos\hat C$. The **total surface area** is the sum of the areas of the four faces.
    proof: |
      The angle formula is the one of the dot product. The cross product $\crossp{\overrightarrow{AB}}{\overrightarrow{AC}}$ has the norm of the area of the parallelogram built on the two vectors, and the triangle is half of it.

  - id: ex-face
    type: example
    title: The face $ABC$
    problem: |
      For the face $ABC$ of the running tetrahedron find the perimeter, the angles and the area.
    steps:
      - |
        $AB=4$, $AC=\sqrt{10}$, $BC=3\sqrt2$: the perimeter is $4+\sqrt{10}+3\sqrt2$.
      - |
        At $A$: $\overrightarrow{AB}=(4,0,0)$, $\overrightarrow{AC}=(1,3,0)$, so the dot product is $4$, the product of the norms is $4\sqrt{10}$, and $\cos\hat A=\dfrac{\sqrt{10}}{10}$.
      - |
        At $B$: $\overrightarrow{BA}=(-4,0,0)$, $\overrightarrow{BC}=(-3,3,0)$, so the dot product is $12$, the product of the norms is $4\cdot3\sqrt2=12\sqrt2$, and $\cos\hat B=\dfrac{\sqrt2}2$, that is $\hat B=\dfrac\pi4$.
      - |
        At $C$: $\overrightarrow{CA}=(-1,-3,0)$, $\overrightarrow{CB}=(3,-3,0)$, so the dot product is $6$, the product of the norms is $\sqrt{10}\cdot3\sqrt2=6\sqrt5$, and $\cos\hat C=\dfrac{\sqrt5}{5}$.
      - |
        The cross product $\crossp{\overrightarrow{AB}}{\overrightarrow{AC}}$ is $(0,0,12)$, so the area is $\dfrac12\cdot12=6$.
    answer: |
      Perimeter $4+\sqrt{10}+3\sqrt2$; $\cos\hat A=\dfrac{\sqrt{10}}{10}$, $\hat B=\dfrac\pi4$, $\cos\hat C=\dfrac{\sqrt5}5$; area $6$.
    verify:
      - expr: "4/(4*sqrt(10))"
        equals: "sqrt(10)/10"
      - expr: "12/(4*3*sqrt(2))"
        equals: "sqrt(2)/2"
      - expr: "6/(sqrt(10)*3*sqrt(2))"
        equals: "sqrt(5)/5"
      - expr: "cross((4,0,0),(1,3,0))"
        equals: "(0,0,12)"

  - id: chk-face-area
    type: check
    prompt: |
      Find the area of the triangle $ABD$ of the running tetrahedron, with $A(0,0,0)$, $B(4,0,0)$, $D(2,1,5)$.
    answerType: expression
    answer: "2*sqrt(26)"
    hints:
      - |
        $\crossp{\overrightarrow{AB}}{\overrightarrow{AD}}=(0,-20,4)$.
    explanation: |
      $\norm{(0,-20,4)}=\sqrt{416}=4\sqrt{26}$, so the area is $2\sqrt{26}$.

  - id: surface
    type: concept
    title: The total surface area
    body: |
      The four faces of the running tetrahedron have the areas

      $$S_{ABC}=6,\qquad S_{ABD}=2\sqrt{26},\qquad S_{ACD}=\dfrac{5\sqrt{11}}2,\qquad S_{BCD}=\dfrac{3\sqrt{51}}2,$$

      each from half of the norm of a cross product (for $BCD$ use $\overrightarrow{BC}=(-3,3,0)$ and $\overrightarrow{BD}=(-2,1,5)$: their cross product is $(15,15,3)$, with norm $\sqrt{459}=3\sqrt{51}$).
      The total surface area is $S=6+2\sqrt{26}+\dfrac{5\sqrt{11}}2+\dfrac{3\sqrt{51}}2$.

  - id: summary
    type: summary
    points:
      - |
        A tetrahedron has $4$ non-coplanar vertices, $6$ edges and $4$ triangular faces; opposite edges have no common vertex.
      - |
        Edges: norms of the vectors between vertices. Face angles: the dot product. Face area: half the norm of a cross product.
      - |
        The total surface area is the sum of the four face areas.
