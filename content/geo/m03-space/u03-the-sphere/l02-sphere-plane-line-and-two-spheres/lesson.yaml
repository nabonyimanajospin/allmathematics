id: geo-m03-u03-l02
title: "The sphere: tangent planes, sections and two spheres"
estMinutes: 45
version: 1
status: draft
skills:
  - tangent-plane-sphere
  - plane-section-of-sphere
  - two-spheres
objectives:
  - Decide whether a plane cuts, touches or misses a sphere, and find the circle of intersection.
  - Write the tangent plane at a point of a sphere.
  - Find the radical plane and the circle common to two spheres.
sections:
  - id: plane-position
    type: concept
    title: A plane and a sphere
    body: |
      Let $\delta$ be the distance from the center of a sphere of radius $\rho$ to a plane.

      - $\delta<\rho$: the plane **cuts** the sphere in a circle.
      - $\delta=\rho$: the plane is **tangent** to the sphere, in one point.
      - $\delta>\rho$: the plane does not meet the sphere.

      When the plane cuts the sphere, the circle has its center at the **foot of the perpendicular** from the center of the sphere to the plane, and its radius is $\sqrt{\rho^2-\delta^2}$ (by Pythagoras in the right triangle formed by the center of the sphere, the center of the circle, and a point of the circle).

  - id: fig-tangent-plane
    type: visual
    kind: figure
    title: A sphere and a tangent plane
    caption: |
      The sphere with center $C(1,-2,3)$ and radius $5$ lu touches the plane $x=6$ at the point $T(6,-2,3)$: the distance from $C$ to the plane is $5$ lu, equal to the radius. Drag the figure to turn it.
    figure:
      dim: 3
      alt: "A sphere with its center C and a flat plane touching it at one point T, drawn in three dimensions."
      view: [8]
      items:
        - {t: point, id: C, at: [1, -2, 3], color: warning}
        - {t: point, id: T, at: [6, -2, 3], color: accent}
