  format: "Type a point as `(x, y, z)`, an exact value such as `sqrt(7)/4`, or an equation with `=`."
  items:
    - id: sf-pp1
      statement: |-
        The sphere has center $\left(1,\,-2,\,3\right)$ and radius $5$. Its point for $\varphi=\frac{\pi}{2}$, $\theta=0$ in the parametric equations $x=p+\rho\sin\varphi\cos\theta$, $y=q+\rho\sin\varphi\sin\theta$, $z=r_0+\rho\cos\varphi$ is
      answerType: vector
      answer: "(6, -2, 3)"
      hints:
        - |-
          Replace the center, $\rho$ and the two angles.
      solution: "$x=6$, $y=-2$, $z=3$."
    - id: sf-pp2
      statement: |-
        The sphere has center $\left(0,\,0,\,0\right)$ and radius $3$. Its point for $\varphi=\frac{\pi}{3}$, $\theta=\frac{\pi}{2}$ in the parametric equations $x=p+\rho\sin\varphi\cos\theta$, $y=q+\rho\sin\varphi\sin\theta$, $z=r_0+\rho\cos\varphi$ is
      answerType: vector
      answer: "(0, 3*sqrt(3)/2, 3/2)"
      hints:
        - |-
          Replace the center, $\rho$ and the two angles.
      solution: |-
        $x=0$, $y=\frac{3 \sqrt{3}}{2}$, $z=\frac{3}{2}$.
    - id: sf-pp3
      statement: |-
        The sphere has center $\left(2,\,1,\,-1\right)$ and radius $4$. Its point for $\varphi=\frac{\pi}{6}$, $\theta=\frac{\pi}{3}$ in the parametric equations $x=p+\rho\sin\varphi\cos\theta$, $y=q+\rho\sin\varphi\sin\theta$, $z=r_0+\rho\cos\varphi$ is
      answerType: vector
      answer: "(3, 1 + sqrt(3), -1 + 2*sqrt(3))"
      hints:
        - |-
          Replace the center, $\rho$ and the two angles.
      solution: |-
        $x=3$, $y=1 + \sqrt{3}$, $z=-1 + 2 \sqrt{3}$.
    - id: sf-av1
      statement: |-
        The volume of the sphere $x^2+y^2+z^2-2x+4y-6z-11=0$ (unit cu: number only) is
      answerType: expression
      answer: "500*pi/3"
      hints:
        - |-
          Find $\rho$ first.
      solution: |-
        Completing the squares: $\rho^2=1+4+9+11=25$, $\rho=5$. $V=\dfrac43\pi\cdot125=\dfrac{500\pi}3$.
    - id: sf-av2
      statement: |-
        The surface area of the sphere $x^2+y^2+z^2-6z=0$ (unit squ: number only) is
      answerType: expression
      answer: "36*pi"
      hints:
        - "Complete the square in $z$."
      solution: |-
        $x^2+y^2+(z-3)^2=9$: $\rho=3$ and the area is $4\pi\cdot9=36\pi$.
    - id: sf-m1
      statement: |-
        In the parametric equations of a sphere, the curve obtained for a constant $\varphi=\dfrac\pi2$ is
      answerType: multiple_choice
      answer: "2"
      choices:
        - text: A meridian
          value: "1"
        - text: The equator
          value: "2"
        - text: A pole
          value: "3"
        - text: A tangent line
          value: "4"
      correctIndex: 1
      hints:
        - |-
          $z=r_0+\rho\cos\varphi$ is then constant.
      solution: |-
        For $\varphi=\dfrac\pi2$ we have $z=r_0$ and the point goes around the horizontal great circle: the equator.
