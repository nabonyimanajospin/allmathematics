    caption: |
      The sphere $x^2+y^2+z^2=9$ with its center at the origin. The tangent plane (green) touches it at $P_0$ and is perpendicular to the radius; the normal line is the line of the radius, through the center. Drag the figure to turn it.
    figure:
      dim: 3
