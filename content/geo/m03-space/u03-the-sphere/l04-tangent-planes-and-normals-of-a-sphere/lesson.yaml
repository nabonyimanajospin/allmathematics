id: geo-m03-u03-l04
title: Applications - tangent planes (TpS) and normals (NpS) of a sphere
estMinutes: 55
version: 1
status: draft
skills:
  - tangent-plane-sphere
  - normal-line-sphere
  - tangent-length
objectives:
  - Write the tangent plane at a point of a sphere and the normal line (the line of the radius) at that point.
  - Find the tangent planes of a sphere that are parallel to a given plane.
  - Find the length of the tangent segments from an outside point, and decide whether a point is outside, on or inside a sphere.
sections:
  - id: why
    type: concept
    title: Two lines of questions about a point of a sphere
    body: |
      At a point $P_0$ of a sphere there are two special objects. The **tangent plane** (TpS) touches the sphere only at $P_0$. The **normal** (NpS) is the line perpendicular to the tangent plane at $P_0$: it is the line of the radius $CP_0$, so it passes through the center $C$.

      Both are built from the radius vector $\overrightarrow{CP_0}$. The tangent plane has it as **normal vector**, and the normal line has it as **direction vector**. The questions of this lesson are variations of these two facts.

