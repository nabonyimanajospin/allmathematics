id: geo-m03-u01-l03
title: The equations of a plane
estMinutes: 45
version: 1
status: draft
skills:
  - plane-equations
  - plane-through-three-points
objectives:
  - Write a plane in point-normal, general, vector (parametric), intercept and normal (Hesse) form.
  - Find the plane through three points.
  - Read the normal vector, the intercepts and the distance from the origin from an equation.
sections:
  - id: determined
    type: concept
    title: What determines a plane
    body: |
      A plane is determined by **a point** $A$ and a **normal vector** $\vec n\neq\vec0$ perpendicular to it: a point $P$ is on the plane exactly when $\overrightarrow{AP}\perp\vec n$.
      It is also determined by a point and **two non-collinear direction vectors** $\vec u$, $\vec v$ lying in the plane, or by **three non-collinear points**.

      The first description gives the most useful equation, because the dot product turns "perpendicular" into an equation.

  - id: general-theorem
    type: theorem
    name: Point-normal and general equation
    statement: |
      The plane through $A(x_0,y_0,z_0)$ with normal vector $\vec n=(a,b,c)$ is

      $$a(x-x_0)+b(y-y_0)+c(z-z_0)=0,\qquad\text{that is}\qquad ax+by+cz+d=0\ \text{ with }\ d=-ax_0-by_0-cz_0.$$

      Every equation $ax+by+cz+d=0$ with $(a,b,c)\neq(0,0,0)$ is a plane with normal vector $(a,b,c)$.
    proof: |
      $P(x,y,z)$ is on the plane when $\dotp{\overrightarrow{AP}}{\vec n}=0$, which written with the coordinates is $a(x-x_0)+b(y-y_0)+c(z-z_0)=0$.

  - id: other-forms
    type: definition
    term: The five equations of a plane
    body: |
      A plane has five standard equations: **vector, parametric, analytic implicit (general), normal and intercept.** The general (implicit) equation $ax+by+cz+d=0$ was found above; here are the others, for a point $A(x_0,y_0,z_0)$ and two non-parallel direction vectors $\vec u=(u_1,u_2,u_3)$ and $\vec v=(v_1,v_2,v_3)$ of the plane. The normal vector is the cross product $\crossp{\vec u}{\vec v}$.

      - **Vector equation.** $\overrightarrow{OP}=\overrightarrow{OA}+s\,\vec u+t\,\vec v$ with $s,t\in\mathbb R$, that is
        $$\begin{pmatrix}x\\y\\z\end{pmatrix}=\begin{pmatrix}x_0\\y_0\\z_0\end{pmatrix}+s\begin{pmatrix}u_1\\u_2\\u_3\end{pmatrix}+t\begin{pmatrix}v_1\\v_2\\v_3\end{pmatrix}.$$
      - **Parametric equations.** The same equation, coordinate by coordinate:
        $$\begin{cases}x=x_0+s\,u_1+t\,v_1\\ y=y_0+s\,u_2+t\,v_2\\ z=z_0+s\,u_3+t\,v_3\end{cases}\qquad s,t\in\mathbb R.$$
      - **Three points.** For non-collinear $A,B,C$ use $\vec u=\overrightarrow{AB}$ and $\vec v=\overrightarrow{AC}$; the normal is $\crossp{\overrightarrow{AB}}{\overrightarrow{AC}}$, and $P$ is on the plane when $\boxp{\overrightarrow{AP}}{\overrightarrow{AB}}{\overrightarrow{AC}}=0$.
      - **Intercept form.** If $a,b,c,d$ are all non-zero, the plane meets the axes at $(p,0,0)$, $(0,q,0)$, $(0,0,r)$ with $p=-\dfrac da$, $q=-\dfrac db$, $r=-\dfrac dc$, and $\ \dfrac xp+\dfrac yq+\dfrac zr=1$.
      - **Normal (Hesse) form.** $x\cos\alpha+y\cos\beta+z\cos\gamma-p=0$, where $(\cos\alpha,\cos\beta,\cos\gamma)$ is the unit normal pointing from the origin towards the plane and $p\ge0$ is the distance from the origin to the plane. It is obtained by dividing $ax+by+cz+d=0$ by $\varepsilon\sqrt{a^2+b^2+c^2}$, with $\varepsilon=-1$ if $d>0$ and $\varepsilon=1$ otherwise; then $p=\dfrac{|d|}{\sqrt{a^2+b^2+c^2}}$.

  - id: fig-plane
    type: visual
    kind: figure
    title: The plane $5x-4y+3z=11$ and its intercepts
    caption: |
      The plane meets the axes at $\left(\dfrac{11}{5},0,0\right)$, $\left(0,-\dfrac{11}{4},0\right)$ and $\left(0,0,\dfrac{11}{3}\right)$; the triangle shows the part of the plane between them. Drag to turn the figure.
    figure:
      dim: 3
      alt: "The three axes in space and the triangle cut from the plane 5x minus 4y plus 3z equals 11 between its intercepts on the axes."
      view: [4]
      items:
        - {t: point, id: P, at: [11/5, 0, 0], color: warning, label: P}
        - {t: point, id: Q, at: [0, -11/4, 0], color: warning, label: Q}
        - {t: point, id: R, at: [0, 0, 11/3], color: warning, label: R}
        - {t: polygon, pts: [P, Q, R], fill: accent}

  - id: ex-three-points
    type: example
    title: The plane through three points
    problem: |
      Find the plane through $A(1,0,2)$, $B(3,1,0)$ and $C(2,2,3)$.
    steps:
      - |
        $\overrightarrow{AB}=(2,1,-2)$ and $\overrightarrow{AC}=(1,2,1)$. The cross product is $\vec n=(1\cdot1-(-2)\cdot2,\ (-2)\cdot1-2\cdot1,\ 2\cdot2-1\cdot1)=(5,-4,3)$.
      - |
        $5(x-1)-4(y-0)+3(z-2)=0$, that is $5x-4y+3z-11=0$.
      - |
        Check with $B$: $15-4+0-11=0$, and with $C$: $10-8+9-11=0$.
    answer: |
      $5x-4y+3z-11=0$.
    verify:
      - expr: "cross((2,1,-2),(1,2,1))"
        equals: "(5,-4,3)"
      - expr: "5*3-4*1+3*0-11"
        equals: "0"
      - expr: "5*2-4*2+3*3-11"
        equals: "0"


  - id: ex-five-equations
    type: example
    title: The five equations of one plane
    problem: |
      Write the five equations of the plane through $A(1,0,2)$, $B(3,1,0)$ and $C(2,2,3)$.
    steps:
      - |
        Direction vectors: $\vec u=\overrightarrow{AB}=(2,1,-2)$ and $\vec v=\overrightarrow{AC}=(1,2,1)$. Their cross product is $\vec n=(5,-4,3)$, as above.
      - |
        **Vector:** $\begin{pmatrix}x\\y\\z\end{pmatrix}=\begin{pmatrix}1\\0\\2\end{pmatrix}+s\begin{pmatrix}2\\1\\-2\end{pmatrix}+t\begin{pmatrix}1\\2\\1\end{pmatrix}$.
      - |
        **Parametric:** $\begin{cases}x=1+2s+t\\ y=s+2t\\ z=2-2s+t\end{cases}$
      - |
        **Analytic implicit:** $5x-4y+3z-11=0$.
      - text: |
          **Normal:** $\dfrac{\sqrt2}{2}x-\dfrac{2\sqrt2}{5}y+\dfrac{3\sqrt2}{10}z-\dfrac{11\sqrt2}{10}=0$, with distance $p=\dfrac{11\sqrt2}{10}$ lu from the origin.
        why: |
          Divide the general equation by $\sqrt{5^2+(-4)^2+3^2}=\sqrt{50}=5\sqrt2$, and rationalize: $\dfrac{5}{5\sqrt2}=\dfrac{\sqrt2}{2}$, $\dfrac{4}{5\sqrt2}=\dfrac{2\sqrt2}{5}$, $\dfrac{3}{5\sqrt2}=\dfrac{3\sqrt2}{10}$. The constant term is negative, so the sign is already the right one: $p=\dfrac{11}{5\sqrt2}=\dfrac{11\sqrt2}{10}$.
      - |
        **Intercept:** $5x-4y+3z=11$ gives $\dfrac{x}{\frac{11}{5}}+\dfrac{y}{-\frac{11}{4}}+\dfrac{z}{\frac{11}{3}}=1$: the plane meets the axes at $\left(\dfrac{11}5,0,0\right)$, $\left(0,-\dfrac{11}4,0\right)$, $\left(0,0,\dfrac{11}3\right)$.
    answer: |
      The five equations are the ones above.
    verify:
      - expr: "sqrt(2)/2*3-2*sqrt(2)/5*1-11*sqrt(2)/10"
        equals: "0"
      - expr: "sqrt(2)/2*2-2*sqrt(2)/5*2+3*sqrt(2)/10*3-11*sqrt(2)/10"
        equals: "0"
      - expr: "5*(11/5)-11"
        equals: "0"

  - id: chk-three-points
    type: check
    prompt: |
      Find an equation of the plane through $A(1,0,0)$, $B(0,2,0)$ and $C(0,0,3)$.
    answerType: equation
    coordinates: [x, y, z]
    answer: "6*x+3*y+2*z-6=0"
    hints:
      - |
        The points are on the axes: use the intercept form $\dfrac x1+\dfrac y2+\dfrac z3=1$.
    explanation: |
      $x+\dfrac y2+\dfrac z3=1$. Multiply by $6$: $6x+3y+2z-6=0$.

  - id: ex-forms
    type: example
    title: Intercept and normal form
    problem: |
      For the plane $3x+2y+z-6=0$ find the intercepts, and the normal form.
    steps:
      - |
        Intercepts: $y=z=0$ gives $x=2$; $x=z=0$ gives $y=3$; $x=y=0$ gives $z=6$. The intercept form is $\dfrac x2+\dfrac y3+\dfrac z6=1$.
      - |
        $\sqrt{a^2+b^2+c^2}=\sqrt{14}$ and $d=-6<0$, so $\varepsilon=1$: $\dfrac{3\sqrt{14}}{14}x+\dfrac{\sqrt{14}}{7}y+\dfrac{\sqrt{14}}{14}z-\dfrac{3\sqrt{14}}{7}=0$ (each coefficient is divided by $\sqrt{14}$ and rationalized).
      - |
        The distance from the origin is $p=6$ divided by $\sqrt{14}$, that is $p=\dfrac{3\sqrt{14}}7$.
    answer: |
      Intercepts $2,3,6$; distance from the origin $p=\dfrac{3\sqrt{14}}{7}$.
    verify:
      - expr: "3*2+2*0+0-6"
        equals: "0"
      - expr: "6/sqrt(14)"
        equals: "3*sqrt(14)/7"

  - id: chk-distance-origin
    type: check
    prompt: |
      Find the distance from the origin to the plane $2x-2y+z-9=0$.
    answerType: number
    answer: "3"
    hints:
      - |
        $p=\dfrac{|d|}{\sqrt{a^2+b^2+c^2}}$ with $\sqrt{4+4+1}=3$.
    explanation: |
      $p=\dfrac93=3$.

  - id: summary
    type: summary
    points:
      - |
        $a(x-x_0)+b(y-y_0)+c(z-z_0)=0$: normal vector $(a,b,c)$. Through three points: the normal is $\crossp{\overrightarrow{AB}}{\overrightarrow{AC}}$.
      - |
        Vector form $\overrightarrow{OP}=\overrightarrow{OA}+s\vec u+t\vec v$; intercept form $\dfrac xp+\dfrac yq+\dfrac zr=1$.
      - |
        Normal form: divide by $\varepsilon\sqrt{a^2+b^2+c^2}$; $p=\dfrac{|d|}{\sqrt{a^2+b^2+c^2}}$.
