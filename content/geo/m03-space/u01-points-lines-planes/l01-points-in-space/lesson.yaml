id: geo-m03-u01-l01
title: Points in space, distance, midpoint and division
estMinutes: 30
version: 1
status: draft
skills:
  - space-distance
  - space-midpoint
  - space-section
objectives:
  - Compute the distance between two points of space and the direction cosines of a segment.
  - Find the midpoint of a segment and the point that divides it in a given ratio.
sections:
  - id: coordinates
    type: concept
    title: Three coordinates for a point
    body: |
      A point of space is given by three coordinates $(x,y,z)$ with respect to three perpendicular axes. The vector from $A(x_1,y_1,z_1)$ to $B(x_2,y_2,z_2)$ is
      $\overrightarrow{AB}=(x_2-x_1,\,y_2-y_1,\,z_2-z_1)$. Everything of the plane carries over, with one more coordinate: the formulas of the plane are the same with a third term.

      The distance is obtained by applying Pythagoras twice. In the plane of $x$ and $y$ the projection of $AB$ has length $\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}$, and this is a leg of a right triangle whose other leg is the vertical difference $|z_2-z_1|$.

  - id: distance-theorem
    type: theorem
    name: Distance and direction cosines
    statement: |
      $$AB=\norm{\overrightarrow{AB}}=\sqrt{(x_2-x_1)^2+(y_2-y_1)^2+(z_2-z_1)^2}.$$

      The **direction cosines** of $\overrightarrow{AB}=(u_1,u_2,u_3)$ are the cosines of the angles $\alpha,\beta,\gamma$ that it makes with the axes:

      $$\cos\alpha=\dfrac{u_1}{AB},\quad\cos\beta=\dfrac{u_2}{AB},\quad\cos\gamma=\dfrac{u_3}{AB},\qquad\cos^2\alpha+\cos^2\beta+\cos^2\gamma=1.$$
    proof: |
      The first formula is Pythagoras applied twice, as explained above. The angle between $\overrightarrow{AB}$ and the axis vector $\vec i=(1,0,0)$ has cosine $\dfrac{\dotp{\overrightarrow{AB}}{\vec i}}{\norm{\overrightarrow{AB}}}=\dfrac{u_1}{AB}$, and similarly for the other axes.
      The sum of the squares is $\dfrac{u_1^2+u_2^2+u_3^2}{AB^2}=1$.

  - id: ex-distance
    type: example
    title: A distance and its direction cosines
    problem: |
      Find the distance between $A(1,2,3)$ and $B(4,6,15)$, and the direction cosines of $\overrightarrow{AB}$.
    steps:
      - |
        $\overrightarrow{AB}=(3,4,12)$.
      - |
        $AB=\sqrt{9+16+144}=\sqrt{169}=13$.
      - |
        The direction cosines are $\dfrac3{13}$, $\dfrac4{13}$, $\dfrac{12}{13}$; indeed $\dfrac{9+16+144}{169}=1$.
    answer: |
      $AB=13$, with direction cosines $\dfrac3{13},\dfrac4{13},\dfrac{12}{13}$.
    verify:
      - expr: "sqrt(3^2+4^2+12^2)"
        equals: "13"
      - expr: "(3/13)^2+(4/13)^2+(12/13)^2"
        equals: "1"

  - id: chk-distance
    type: check
    prompt: |
      Find the distance between $A(-1,2,0)$ and $B(3,-2,2)$.
    answerType: number
    answer: "6"
    hints:
      - |
        $\overrightarrow{AB}=(4,-4,2)$.
    explanation: |
      $AB=\sqrt{16+16+4}=\sqrt{36}=6$.

  - id: section-theorem
    type: theorem
    name: Midpoint and division of a segment
    statement: |
      The point $P$ of the line $AB$ with $\overrightarrow{AP}=k\,\overrightarrow{PB}$ ($k\neq-1$) has coordinates

      $$P=\dfrac{A+k\,B}{1+k}=\left(\dfrac{x_1+kx_2}{1+k},\ \dfrac{y_1+ky_2}{1+k},\ \dfrac{z_1+kz_2}{1+k}\right).$$

      For $k=1$ this is the midpoint $\left(\dfrac{x_1+x_2}2,\dfrac{y_1+y_2}2,\dfrac{z_1+z_2}2\right)$. If $AP:PB=m:n$, then $k=\dfrac mn$ for a point on the segment (internal division) and $k=-\dfrac mn$ outside it (external division).
    proof: |
      The vector equation $P-A=k(B-P)$ gives $(1+k)P=A+kB$. Read it coordinate by coordinate.

  - id: ex-section
    type: example
    title: Internal and external division
    problem: |
      For $A(1,2,3)$ and $B(4,6,15)$ find the point $P$ with $AP:PB=2:1$ on the segment, and the point $Q$ outside the segment with $AQ:QB=3:1$.
    steps:
      - |
        $P$: $k=2$, so $P=\dfrac{A+2B}{3}=\left(\dfrac{9}{3},\dfrac{14}{3},\dfrac{33}{3}\right)=\left(3,\dfrac{14}3,11\right)$.
      - |
        $Q$: $k=-3$, so $Q=\dfrac{A-3B}{-2}=\left(\dfrac{-11}{-2},\dfrac{-16}{-2},\dfrac{-42}{-2}\right)=\left(\dfrac{11}2,8,21\right)$.
    answer: |
      $P\left(3,\dfrac{14}3,11\right)$ and $Q\left(\dfrac{11}2,8,21\right)$.
    verify:
      - expr: "(1+2*4)/3"
        equals: "3"
      - expr: "(2+2*6)/3"
        equals: "14/3"
      - expr: "(3+2*15)/3"
        equals: "11"
      - expr: "(1-3*4)/(1-3)"
        equals: "11/2"
      - expr: "(3-3*15)/(1-3)"
        equals: "21"

  - id: chk-midpoint
    type: check
    prompt: |
      Find the midpoint of the segment with ends $A(2,-4,6)$ and $B(-2,0,2)$.
    answerType: vector
    answer: "(0, -2, 4)"
    hints:
      - |
        Average each pair of coordinates.
    explanation: |
      $\left(\dfrac{2-2}2,\dfrac{-4+0}2,\dfrac{6+2}2\right)=(0,-2,4)$.

  - id: chk-ratio
    type: check
    prompt: |
      Find the point $P$ of the segment $AB$ with $A(0,0,0)$, $B(8,4,-12)$ and $AP:PB=1:3$.
    answerType: vector
    answer: "(2, 1, -3)"
    hints:
      - |
        $k=\dfrac13$: $P$ is one quarter of the way from $A$ to $B$.
    explanation: |
      $P=\dfrac{A+\frac13B}{1+\frac13}=\dfrac14B=(2,1,-3)$.

  - id: summary
    type: summary
    points:
      - |
        $AB=\sqrt{(x_2-x_1)^2+(y_2-y_1)^2+(z_2-z_1)^2}$, and the direction cosines satisfy $\cos^2\alpha+\cos^2\beta+\cos^2\gamma=1$.
      - |
        $P=\dfrac{A+kB}{1+k}$ with $\overrightarrow{AP}=k\overrightarrow{PB}$; the midpoint has $k=1$.
