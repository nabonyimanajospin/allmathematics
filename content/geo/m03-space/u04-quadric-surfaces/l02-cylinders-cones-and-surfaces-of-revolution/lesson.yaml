id: geo-m03-u04-l02
title: Cylinders, cones and surfaces of revolution
estMinutes: 45
version: 1
status: draft
skills:
  - cylinders
  - surfaces-of-revolution
  - quadric-reduction
objectives:
  - Recognize a cylinder from an equation with a missing variable.
  - Write the equation of a surface of revolution.
  - Bring a quadric to canonical form by completing squares.
sections:
  - id: cylinder
    type: definition
    term: Cylinder
    body: |
      A **cylindrical surface** (or cylinder) is generated by a line, the **generator**, that moves parallel to a fixed direction along a plane curve, the **directrix**.

      If an equation does not contain one of the variables, the surface is a cylinder whose generators are parallel to the corresponding axis. For example $x^2+y^2=4$ does not contain $z$: it is the circular cylinder of radius $2$ around the $z$-axis, since for every $z$ the point $(x,y)$ stays on the same circle.

      The usual cylinders are the elliptic cylinder $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$, the hyperbolic cylinder $\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1$ and the parabolic cylinder $y=x^2$.

  - id: revolution
    type: theorem
    name: Surface of revolution
    statement: |
      Rotate a curve of the plane $xy$ about the $y$-axis. Each point of the curve at height $y$ and distance $\lvert x\rvert$ from the axis becomes a circle of radius $\lvert x\rvert$. So the equation of the surface is obtained from that of the curve by replacing $x^2$ with $x^2+z^2$ (and $\lvert x\rvert$ with $\sqrt{x^2+z^2}$).

      In the same way, rotating about the $x$-axis replaces $y^2$ with $y^2+z^2$, and about the $z$-axis replaces $x^2$ with $x^2+y^2$ when the curve is in the plane $xz$.
    proof: |
      A point $(x,y,z)$ is on the surface exactly when its distance to the axis, $\sqrt{x^2+z^2}$, is the distance $\lvert x_0\rvert$ of some point $(x_0,y)$ of the curve at the same height $y$. So $(x,y,z)$ is on the surface exactly when $\left(\pm\sqrt{x^2+z^2},y\right)$ is on the curve.

  - id: ex-revolution
    type: example
    title: Two surfaces of revolution
    problem: |
      Find the surface obtained by rotating (a) the parabola $y=x^2$ about the $y$-axis; (b) the line $z=2x$ about the $z$-axis.
    steps:
      - text: |
          (a) Replace $x^2$ by $x^2+z^2$: $y=x^2+z^2$, an elliptic paraboloid (here circular).
        why: |
          The parabola $y=x^2$ contains the point $(x,y)$ at distance $\lvert x\rvert$ from the axis. The traces $y=k$ are the circles $x^2+z^2=k$, as expected for a surface of revolution about the $y$-axis.
      - |
        (b) The line $z=2x$ is in the plane $xz$. Squaring gives $z^2=4x^2$, and about the $z$-axis we replace $x^2$ by $x^2+y^2$: $z^2=4\left(x^2+y^2\right)$, a circular cone.
    answer: |
      (a) $y=x^2+z^2$. (b) $z^2=4\left(x^2+y^2\right)$.
    verify:
      - expr: "2^2"
        equals: "4"

  - id: chk-revolution
    type: check
    prompt: |
      The parabola $z^2=4x$ of the plane $xz$ is rotated about the $x$-axis. Write the equation of the surface (in $x,y,z$).
    answerType: equation
    coordinates: [x, y, z]
    answer: "y^2+z^2=4*x"
    hints:
      - |
        The $x$-axis is the axis: replace $z^2$ by $y^2+z^2$.
    explanation: |
      Rotating about the $x$-axis replaces $z^2$ by $y^2+z^2$: $y^2+z^2=4x$, a paraboloid.

  - id: reduction
    type: concept
    title: Completing the squares in space
    body: |
      When the quadric has no cross terms $xy$, $xz$, $yz$, we recognize it by completing squares in each variable, as for the circle and the sphere. The signs of the squares then give the surface as in the table, and the constants give its center.

  - id: ex-reduction
    type: example
    title: A translated ellipsoid
    problem: |
      Identify $x^2+4y^2+z^2-2x+8y-2z-2=0$, and find its center.
    steps:
      - text: |
          Group: $\left(x^2-2x\right)+4\left(y^2+2y\right)+\left(z^2-2z\right)=2$.
        why: |
          The coefficient $4$ of $y^2$ is factored out before completing the square, since $4y^2+8y=4\left(y^2+2y\right)$.
      - |
        Complete the squares: $(x-1)^2-1+4(y+1)^2-4+(z-1)^2-1=2$, so $(x-1)^2+4(y+1)^2+(z-1)^2=8$.
      - |
        Divide by $8$: $\dfrac{(x-1)^2}{8}+\dfrac{(y+1)^2}{2}+\dfrac{(z-1)^2}{8}=1$: an ellipsoid with center $(1,-1,1)$ and semi-axes $2\sqrt2$, $\sqrt2$, $2\sqrt2$.
    answer: |
      An ellipsoid with center $(1,-1,1)$.
    verify:
      - expr: "2+1+4+1"
        equals: "8"

  - id: chk-reduction
    type: check
    prompt: |
      Find the center of the ellipsoid $9x^2+y^2+9z^2-18x+4y+18z+13=0$.
    answerType: vector
    answer: "(1, -2, -1)"
    hints:
      - |
        Complete the squares in each variable.
    explanation: |
      $9(x-1)^2+(y+2)^2+9(z+1)^2=9+4+9-13=9$, so the center is $(1,-2,-1)$.

  - id: chk-cylinder
    type: check
    prompt: |
      What is the radius of the circular cylinder $y^2+z^2=25$?
    answerType: number
    answer: "5"
    hints:
      - |
        The variable $x$ is missing: the axis is the $x$-axis.
    explanation: |
      The cross sections $x=k$ are circles of radius $\sqrt{25}=5$.

  - id: summary
    type: summary
    points:
      - |
        A missing variable means a cylinder parallel to that axis.
      - |
        Rotation about an axis replaces the square of the transverse variable by the sum of the squares of the two others.
      - |
        Complete the squares to find the center and the type of a quadric without cross terms.
