id: geo-m02-u04-l02
title: Lines and circles in polar form
estMinutes: 40
version: 1
status: draft
skills:
  - polar-line
  - polar-circle
  - polar-cartesian-curves
objectives:
  - Write a line and a circle as equations in $r$ and $\theta$.
  - Convert an equation from Cartesian to polar form and back.
sections:
  - id: substitution
    type: concept
    title: Changing the coordinates in an equation
    body: |
      A curve is a set of points, and its equation depends on the coordinates used. To change from Cartesian to polar coordinates we substitute $x=r\cos\theta$ and $y=r\sin\theta$ in the equation and simplify.
      To go back, three relations are useful: $x^2+y^2=r^2$, $\ r\cos\theta=x$ and $r\sin\theta=y$. Each factor $r$ that appears together with a $\cos\theta$ or $\sin\theta$ can be replaced by $x$ or $y$.

  - id: polar-lines
    type: theorem
    name: Lines in polar form
    statement: |
      - A line through the pole with direction angle $\alpha$: $\ \theta=\alpha$.
      - A line at distance $p>0$ from the pole, whose perpendicular from the pole has the direction $\alpha$: $\ r\cos(\theta-\alpha)=p$, that is $\ r=\dfrac{p}{\cos(\theta-\alpha)}$.
      - The vertical line $x=a$ is $r\cos\theta=a$; the horizontal line $y=b$ is $r\sin\theta=b$.
    proof: |
      The foot of the perpendicular from the pole is the point $P(p,\alpha)$. A point $M(r,\theta)$ is on the line exactly when the projection of $OM$ on $OP$ equals $OP$, that is $r\cos(\theta-\alpha)=p$. This is the normal form of the line, written in polar coordinates.

  - id: ex-line
    type: example
    title: A line in polar form
    problem: |
      Write the line $x+\sqrt3\,y=4$ in polar form.
    steps:
      - |
        Substitute: $r\cos\theta+\sqrt3\,r\sin\theta=4$, that is $r\left(\cos\theta+\sqrt3\sin\theta\right)=4$.
      - text: |
          Divide by $2$ to write the bracket as a single cosine: $\dfrac12\cos\theta+\dfrac{\sqrt3}2\sin\theta=\cos\left(\theta-\dfrac\pi3\right)$, so $r\cos\left(\theta-\dfrac\pi3\right)=2$.
        why: |
          We want $\cos\theta\cos\alpha+\sin\theta\sin\alpha$, which is $\cos(\theta-\alpha)$. Here $\cos\alpha=\dfrac12$ and $\sin\alpha=\dfrac{\sqrt3}2$, which is $\alpha=\dfrac\pi3$. The factor $\dfrac12$ and $\dfrac{\sqrt3}{2}$ comes from dividing the coefficients $1$ and $\sqrt3$ by $\sqrt{1+3}=2$, so the right side $4$ is divided by $2$ as well.
      - |
        The line is at distance $p=2$ from the pole, and its perpendicular from the pole has direction $\dfrac\pi3$.
    answer: |
      $r\cos\left(\theta-\dfrac\pi3\right)=2$.
    verify:
      - expr: "1/2*cos(pi/6)+sqrt(3)/2*sin(pi/6)"
        equals: "cos(pi/6-pi/3)"

  - id: polar-circles
    type: theorem
    name: Circles in polar form
    statement: |
      - Center at the pole, radius $R$: $\ r=R$.
      - Through the pole, with center $(a,0)$ and radius $|a|$: $\ r=2a\cos\theta$. With center $(0,a)$: $\ r=2a\sin\theta$.
      - Center $C(r_0,\theta_0)$ and radius $R$: $\ r^2-2rr_0\cos(\theta-\theta_0)+r_0^2=R^2$.
    proof: |
      The third formula is the distance formula between $M(r,\theta)$ and $C(r_0,\theta_0)$: $CM^2=R^2$. For the circle with center $(a,0)$ and radius $|a|$, Cartesian equation $(x-a)^2+y^2=a^2$, that is $x^2+y^2=2ax$; with $x^2+y^2=r^2$ and $x=r\cos\theta$ this is $r^2=2ar\cos\theta$, so $r=2a\cos\theta$ (the pole itself corresponds to $r=0$, which is a point of the circle and is included for $\theta=\dfrac\pi2$).

  - id: visual-circles
    type: visual
    kind: plot
    title: Two circles through the pole
    caption: |
      The circle $r=4\cos\theta$ has its center on the $x$-axis and the circle $r=4\sin\theta$ has its center on the $y$-axis. Both pass through the pole.
    config:
      mode: polar
      r: "4*cos(t)"
      l1: "r=4\\cos\\theta"
      r2: "4*sin(t)"
      l2: "r=4\\sin\\theta"
      tmin: "0"
      tmax: "pi"
      range: 5
      alt: "Two circles of radius 2 that touch the origin, one with center (2,0) and one with center (0,2)."

  - id: ex-circle
    type: example
    title: A circle from Cartesian to polar and back
    problem: |
      (a) Write $x^2+y^2-4x=0$ in polar form. (b) Identify the curve $r=6\sin\theta$.
    steps:
      - |
        (a) $r^2-4r\cos\theta=0$, so $r(r-4\cos\theta)=0$: either $r=0$ (the pole) or $r=4\cos\theta$. The pole is on the second curve (for $\theta=\dfrac\pi2$), so the circle is $r=4\cos\theta$.
      - text: |
          (b) Multiply by $r$: $r^2=6r\sin\theta$, that is $x^2+y^2=6y$, so $x^2+(y-3)^2=9$: the circle with center $(0,3)$ and radius $3$.
        why: |
          Multiplying $r=6\sin\theta$ by $r$ lets us use $r^2=x^2+y^2$ and $r\sin\theta=y$. The factor $r$ can be introduced without changing the curve because the only new solution, $r=0$, is the pole, which is already on the circle.
    answer: |
      (a) $r=4\cos\theta$. (b) The circle $x^2+(y-3)^2=9$.
    verify:
      - expr: "4*cos(pi/3)"
        equals: "2"

  - id: chk-polar-circle
    type: check
    prompt: |
      Write the circle $x^2+y^2=10y$ in polar form (the form $r=\dots$).
    answerType: expression
    answer: "10*sin(theta)"
    hints:
      - |
        $x^2+y^2=r^2$ and $y=r\sin\theta$. Divide by $r$.
    explanation: |
      $r^2=10r\sin\theta$ gives $r=10\sin\theta$.
    variables: [theta]

  - id: chk-polar-line
    type: check
    prompt: |
      Write the line $y=3$ in polar form (the form $r=\dots$).
    answerType: expression
    answer: "3/sin(theta)"
    hints:
      - |
        $y=r\sin\theta$.
    explanation: |
      $r\sin\theta=3$, so $r=\dfrac{3}{\sin\theta}$.
    variables: [theta]

  - id: summary
    type: summary
    points:
      - |
        Lines: $\theta=\alpha$ (through the pole) and $r\cos(\theta-\alpha)=p$.
      - |
        Circles: $r=R$; $\ r=2a\cos\theta$ and $r=2a\sin\theta$ (through the pole); in general $r^2-2rr_0\cos(\theta-\theta_0)+r_0^2=R^2$.
      - |
        To convert, use $x=r\cos\theta$, $y=r\sin\theta$, $x^2+y^2=r^2$.
