      solution: "$(x-2)^2+(y+3)^2=12+4+9=25$, so with $x'=x-2$ and $y'=y+3$ the equation is $x'^2+y'^2=25$."
    - id: ca-04
      statement: |-
        The axes are rotated by $\dfrac\pi2$. The new coordinates of $M(3,4)$.
      answerType: vector
