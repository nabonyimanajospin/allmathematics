        The equation of $x^2-y^2=8$ after a rotation of the axes by $\dfrac\pi4$ (in the letters $x$ and $y$ for the new coordinates).
      answerType: equation
      answer: "x*y=-4"
      coordinates:
        [x, y]
      hints:
        - |-
          $x=\dfrac{\sqrt2}{2}(x'-y')$ and $y=\dfrac{\sqrt2}{2}(x'+y')$.
      solution: |-
