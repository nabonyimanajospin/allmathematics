          $x'=x\cos\varphi+y\sin\varphi$, $y'=-x\sin\varphi+y\cos\varphi$.
      solution: "$x'=4$, $y'=-3$."
    - id: ca-05
      statement: |-
        The axes are rotated by $\dfrac\pi6$. The new coordinates of $M(2,0)$.
      answerType: vector
      answer: "(sqrt(3), -1)"
      hints:
        - |-
          $\cos\dfrac\pi6=\dfrac{\sqrt3}2$, $\sin\dfrac\pi6=\dfrac12$.
      solution: |-
        $x'=2\cdot\dfrac{\sqrt3}2=\sqrt3$, $y'=-2\cdot\dfrac12=-1$.
    - id: ca-06
      statement: |-
        The equation of $x^2-y^2=8$ after a rotation of the axes by $\dfrac\pi4$ (in the letters $x$ and $y$ for the new coordinates).
      answerType: equation
      answer: "x*y=-4"
      coordinates:
        [x, y]
      hints:
        - |-
          $x=\dfrac{\sqrt2}{2}(x'-y')$ and $y=\dfrac{\sqrt2}{2}(x'+y')$.
      solution: |-
        $x^2-y^2=\dfrac12\left[(x'-y')^2-(x'+y')^2\right]=-2x'y'$, so $-2x'y'=8$, that is $x'y'=-4$.
    - id: ca-07
