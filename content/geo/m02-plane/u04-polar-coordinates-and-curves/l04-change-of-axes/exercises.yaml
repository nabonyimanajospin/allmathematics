      answerType: equation
      answer: "x^2-y^2=2"
      coordinates:
        [x, y]
      hints:
        - "Replace $x$ and $y$ by the rotation formulas."
      solution: |-
        $xy=\dfrac12(x'^2-y'^2)=1$, so $x'^2-y'^2=2$.
