id: geo-m02-u05-l05
title: The general second-degree equation
estMinutes: 55
version: 1
status: draft
skills:
  - conic-classification
  - conic-reduction
objectives:
  - Classify a second-degree curve with the invariants $\delta$, $\Delta$ and $S$.
  - Reduce an equation to canonical form with a rotation followed by a translation.
sections:
  - id: general
    type: definition
    term: Second-degree curve
    body: |
      A **second-degree curve** (or **conic**) is the set of points of the plane whose coordinates satisfy

      $$Ax^2+2Bxy+Cy^2+2Dx+2Ey+F=0,$$

      with $A$, $B$, $C$ not all zero. The term $2Bxy$ is the **cross term**. The numbers
      $$\delta=AC-B^2,\qquad \Delta=\begin{vmatrix}A&B&D\\B&C&E\\D&E&F\end{vmatrix},\qquad S=A+C$$
      do not change under a translation or a rotation of the axes: they are the **invariants**.

  - id: classification
    type: theorem
    name: Classification
    statement: |
      - $\delta>0$ (**elliptic type**): if $\Delta\ne0$, a real ellipse when $\Delta S<0$ (and no real point when $\Delta S>0$); if $\Delta=0$, a single point.
      - $\delta<0$ (**hyperbolic type**): a hyperbola if $\Delta\ne0$; two intersecting lines if $\Delta=0$.
      - $\delta=0$ (**parabolic type**): a parabola if $\Delta\ne0$; if $\Delta=0$, two parallel lines, one line, or no point.
    proof: |
      A rotation by $\varphi$ with $\tan2\varphi=\dfrac{2B}{A-C}$ removes the cross term and gives $A'x'^2+C'y'^2+2D'x'+2E'y'+F=0$, where $A'$ and $C'$ are the roots of $\lambda^2-S\lambda+\delta=0$, so $A'C'=\delta$. The sign of $\delta$ therefore tells whether $A'$ and $C'$ have the same sign (ellipse), opposite signs (hyperbola) or one is $0$ (parabola). Completing squares then gives the cases according to $\Delta$.
    more: |
      **Why the invariants do not change.** The quadratic part has the matrix $\begin{pmatrix}A&B\\B&C\end{pmatrix}$; a rotation replaces it by $Q^{T}MQ$ with $Q$ orthogonal, which keeps the determinant $\delta$ and the trace $S$. The determinant $\Delta$ of the $3\times3$ matrix is likewise unchanged by rotations and translations.

  - id: rotation
    type: theorem
    name: The angle of rotation
    statement: |
      The rotation that removes the cross term has the angle $\varphi$ given by

      $$\tan2\varphi=\dfrac{2B}{A-C}\qquad(\varphi=\dfrac\pi4\text{ if }A=C).$$

      The new coefficients $A'$, $C'$ are the roots of $\lambda^2-S\lambda+\delta=0$.
    proof: |
      Substitute $x=x'\cos\varphi-y'\sin\varphi$, $y=x'\sin\varphi+y'\cos\varphi$: the coefficient of $x'y'$ is $2B\cos2\varphi-(A-C)\sin2\varphi$, which is $0$ exactly when $\tan2\varphi=\dfrac{2B}{A-C}$.

  - id: ex-ellipse
    type: example
    title: A rotated ellipse
    problem: |
      Reduce $3x^2+2xy+3y^2-8=0$ to canonical form.
    steps:
      - |
        $A=C=3$, $B=1$, $F=-8$. Then $\delta=9-1=8>0$, $\Delta=-64$, $S=6$, so $\Delta S<0$: a real ellipse.
      - text: |
          Since $A=C$ the rotation angle is $\dfrac\pi4$. The new coefficients are the roots of $\lambda^2-6\lambda+8=0$, that is $4$ and $2$.
        why: |
          $\lambda^2-S\lambda+\delta=\lambda^2-6\lambda+8=(\lambda-2)(\lambda-4)$. Directly: with $x=\dfrac{\sqrt2}2(x'-y')$ and $y=\dfrac{\sqrt2}2(x'+y')$ we get $xy=\dfrac12(x'^2-y'^2)$ and $x^2+y^2=x'^2+y'^2$, so $3(x^2+y^2)+2xy=4x'^2+2y'^2$.
      - |
        The equation becomes $4x'^2+2y'^2=8$, that is $\dfrac{x'^2}{2}+\dfrac{y'^2}{4}=1$: an ellipse with semi-axes $\sqrt2$ and $2$, the longer one along the $y'$-axis.
    answer: |
      $\dfrac{x'^2}{2}+\dfrac{y'^2}{4}=1$ after a rotation by $\dfrac\pi4$.
    verify:
      - expr: "3*3-1"
        equals: "8"
      - expr: "(3*3-1)*0-0"
        equals: "0"

  - id: ex-hyperbola
    type: example
    title: A rotated hyperbola
    problem: |
      Reduce $x^2+6xy+y^2-8=0$ to canonical form.
    steps:
      - |
        $A=C=1$, $B=3$, $F=-8$: $\delta=1-9=-8<0$ and $\Delta=64\ne0$, a hyperbola.
      - |
        $A=C$, so $\varphi=\dfrac\pi4$. The roots of $\lambda^2-2\lambda-8=0$ are $4$ and $-2$.
      - |
        The equation is $4x'^2-2y'^2=8$, that is $\dfrac{x'^2}{2}-\dfrac{y'^2}{4}=1$.
    answer: |
      $\dfrac{x'^2}{2}-\dfrac{y'^2}{4}=1$ after a rotation by $\dfrac\pi4$.
    verify:
      - expr: "1*1-3^2"
        equals: "-8"
      - expr: "4*(-2)"
        equals: "-8"

  - id: ex-parabola
    type: example
    title: A rotated parabola
    problem: |
      Reduce $x^2-2xy+y^2-4x-4y=0$ to canonical form.
    steps:
      - |
        $A=C=1$, $B=-1$, $D=E=-2$, $F=0$: $\delta=1-1=0$ and $\Delta=-16\ne0$, a parabola.
      - text: |
          $\varphi=\dfrac\pi4$. The quadratic part is $(x-y)^2=2y'^2$ and $-4(x+y)=-4\sqrt2\,x'$.
        why: |
          With $x'=\dfrac{\sqrt2}2(x+y)$ and $y'=\dfrac{\sqrt2}2(y-x)$: $(x-y)^2=2y'^2$ because $y'^2=\dfrac12(x-y)^2$, and $x+y=\sqrt2\,x'$.
      - |
        The equation is $2y'^2=4\sqrt2\,x'$, that is $y'^2=2\sqrt2\,x'$: a parabola with $p=\sqrt2$ and vertex at the origin.
    answer: |
      $y'^2=2\sqrt2\,x'$ after a rotation by $\dfrac\pi4$.
    verify:
      - expr: "1*1-(-1)^2"
        equals: "0"
      - expr: "4*sqrt(2)/2"
        equals: "2*sqrt(2)"

  - id: chk-delta
    type: check
    prompt: |
      Compute $\delta=AC-B^2$ for $5x^2+4xy+2y^2-6=0$. (Here $2B=4$.)
    answerType: number
    answer: "6"
    hints:
      - |
        Read the coefficients $A$, $B$, $C$ of the terms of degree two.
      - |
        Then compute the discriminant $\delta$ as defined in the lesson.
    explanation: |
      $\delta=5\cdot2-2^2=6>0$: elliptic type.

  - id: chk-type
    type: check
    prompt: |
      What kind of curve is $x^2+4xy+y^2=3$? Choose one.
    answerType: multiple_choice
    choices:
      - text: "An ellipse"
        value: "ellipse"
      - text: "A hyperbola"
        value: "hyperbola"
      - text: "A parabola"
        value: "parabola"
    correctIndex: 1
    answer: "hyperbola"
    hints:
      - |
        $A=C=1$, $B=2$: compute $\delta$.
    explanation: |
      $\delta=1-4=-3<0$ and $\Delta=-3\cdot(-3)\ne0$: a hyperbola.

  - id: summary
    type: summary
    points:
      - |
        $Ax^2+2Bxy+Cy^2+2Dx+2Ey+F=0$ has invariants $\delta=AC-B^2$, $\Delta$ (the $3\times3$ determinant) and $S=A+C$.
      - |
        $\delta>0$ ellipse, $\delta<0$ hyperbola, $\delta=0$ parabola (when $\Delta\ne0$).
      - |
        Rotate by $\tan2\varphi=\dfrac{2B}{A-C}$ to remove $xy$, then translate by completing squares.
