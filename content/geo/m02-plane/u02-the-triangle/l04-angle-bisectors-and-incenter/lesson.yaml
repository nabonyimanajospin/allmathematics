id: geo-m02-u02-l04
title: Angle bisectors and the incenter
estMinutes: 45
version: 1
status: draft
skills:
  - bisector-equation
  - bisector-length
  - incenter
objectives:
  - Write the equation of the internal bisector of an angle, choosing the right sign.
  - Compute the length of a bisector with $l_a=\dfrac{1}{b+c}\sqrt{bc\left[(b+c)^2-a^2\right]}$.
  - Find the incenter and the inradius.
sections:
  - id: bisector-def
    type: definition
    term: Angle bisector
    body: |
      The **internal bisector** of the angle $\hat A$ is the line through $A$ that cuts the angle in two equal angles. The segment $AD_a$ from $A$ to the point $D_a$ where it meets $BC$ has length $l_a$.
      A point is on the bisector exactly when it is at the same distance from the two sides $AB$ and $AC$ of the angle.

      Two lines through $A$ are equidistant from $AB$ and $AC$: the internal bisector and the **external bisector**, which is perpendicular to it. The equation of both is found from the distances.

