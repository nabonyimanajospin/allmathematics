  - id: incenter-formulas
    type: formula
    title: Incenter and incircle, the formulas to remember
    formula: |
      \begin{aligned}
      I&\left(\dfrac{ax_1+bx_2+cx_3}{a+b+c},\ \dfrac{ay_1+by_2+cy_3}{a+b+c}\right),\qquad r=\dfrac{S}{s}\quad\left(s=\dfrac{a+b+c}{2}\right)\\
      AI&=\dfrac{r}{\sin\dfrac{\hat A}{2}},\qquad AI^2=\dfrac{bc\,(s-a)}{s}\\
      r&=\dfrac{a+b-c}{2}\quad\text{in a right triangle with hypotenuse }c
      \end{aligned}
    note: |
      The weight of a vertex is the length of the **opposite** side: $A$ is weighted by $a=BC$. The incenter is always inside the triangle, and in an equilateral triangle it is the centroid.

  - id: bisector-equation
    type: theorem
    name: Equation of a bisector
    statement: |
      Let $AB:\ a_1x+b_1y+c_1=0$ and $AC:\ a_2x+b_2y+c_2=0$. The two bisectors of the angle at $A$ are

      $$\dfrac{a_1x+b_1y+c_1}{\sqrt{a_1^2+b_1^2}}=\pm\dfrac{a_2x+b_2y+c_2}{\sqrt{a_2^2+b_2^2}}.$$

      The **internal** one is the line through $A$ with direction vector

      $$\vec w=\dfrac{\overrightarrow{AB}}{c}+\dfrac{\overrightarrow{AC}}{b}\qquad(\text{the sum of the unit vectors along the sides}),$$

      and it meets $BC$ at $D_a=\dfrac{b\,B+c\,C}{b+c}$, with $BD_a:D_aC=c:b$.
    proof: |
      The distance from $P(x,y)$ to a line $a_ix+b_iy+c_i=0$ is $\dfrac{|a_ix+b_iy+c_i|}{\sqrt{a_i^2+b_i^2}}$, and equal distances give the equation, with either sign.
      The sum of two unit vectors is the diagonal of a rhombus, which bisects the angle between them: that is the internal bisector. For the foot, the bisector theorem states $BD_a:D_aC=AB:\norm{\overrightarrow{AC}}=c:b$,
      and the section formula with $k=\dfrac cb$ gives $D_a=\dfrac{B+\frac cbC}{1+\frac cb}=\dfrac{bB+cC}{b+c}$.
    more: |
      **Why the sum of the unit vectors?** Two vectors of the same length span a **rhombus**, and the diagonal of a rhombus bisects its angles. Dividing $\overrightarrow{AB}$ by $c$ and $\overrightarrow{AC}$ by $b$ makes both vectors of length $1$, so their sum is the diagonal, and it points along the internal bisector.
      If we used the difference of the unit vectors we would get the other diagonal, which is the direction of the **external** bisector. This is also why the equation with the two signs $\pm$ gives two lines: one is the internal and the other the external bisector, and they are perpendicular.

  - id: ex-bisector-equation
    type: example
    title: The bisector from $A$
    problem: |
      Find the internal bisector from $A$ in the triangle $A(0,0)$, $B(14,0)$, $C(5,12)$, with $a=15$, $b=13$, $c=14$.
    steps:
      - text: |
          Unit vectors along the sides: $\dfrac{\overrightarrow{AB}}{14}=(1,0)$ and $\dfrac{\overrightarrow{AC}}{13}=\left(\dfrac5{13},\dfrac{12}{13}\right)$. Their sum is $\vec w=\left(\dfrac{18}{13},\dfrac{12}{13}\right)$, parallel to $(3,2)$.
        why: |
          $\overrightarrow{AB}=(14,0)$ has length $c=14$, so dividing by $14$ gives $(1,0)$. $\overrightarrow{AC}=(5,12)$ has length $b=13$, so dividing by $13$ gives $\left(\dfrac5{13},\dfrac{12}{13}\right)$.
          The sum is $\left(\dfrac{18}{13},\dfrac{12}{13}\right)$. Multiplying by $\dfrac{13}{6}$ gives the simpler direction $(3,2)$, which has the same direction.
      - |
        The bisector passes through $A(0,0)$ with direction $(3,2)$, so its normal vector is $(2,-3)$: $2x-3y=0$.
      - |
        Check with the foot $D_a=\dfrac{13B+14C}{27}=\left(\dfrac{252}{27},\dfrac{168}{27}\right)=\left(\dfrac{28}3,\dfrac{56}9\right)$: $2\cdot\dfrac{28}3-3\cdot\dfrac{56}9=\dfrac{56}3-\dfrac{56}3=0$.
      - |
        The two signs of the formula give the other bisector too; the internal one is the one that passes between $B$ and $C$. With the unit vectors we get it directly, without choosing a sign.
    answer: |
      $l_a:\ 2x-3y=0$, meeting $BC$ at $D_a\left(\dfrac{28}3,\dfrac{56}9\right)$.
    verify:
      - expr: "2*(28/3)-3*(56/9)"
        equals: "0"
      - expr: "(13*14+14*5)/27"
        equals: "28/3"
      - expr: "(14*12)/27"
        equals: "56/9"

  - id: chk-bisector-equation
    type: check
    prompt: |
      For the triangle $A(0,0)$, $B(4,0)$, $C(0,4)$ find an equation of the internal bisector of the angle at $A$.
    answerType: equation
    coordinates: [x, y]
    answer: "x-y=0"
    hints:
      - |
        The angle at $A$ is a right angle between the axes.
    explanation: |
      The unit vectors along the sides are $(1,0)$ and $(0,1)$; their sum $(1,1)$ is the direction. The bisector is $y=x$, that is $x-y=0$.

  - id: bisector-length
    type: theorem
    name: Length of a bisector
    statement: |
      $$l_a=\dfrac{1}{b+c}\sqrt{bc\left[(b+c)^2-a^2\right]}=\dfrac{2bc\cos\dfrac{\hat A}{2}}{b+c}.$$

      The same formula holds for $l_b$ and $l_c$ with the letters exchanged.
    proof: |
      From $D_a=\dfrac{bB+cC}{b+c}$ we get $\overrightarrow{AD_a}=\dfrac{b\,\overrightarrow{AB}+c\,\overrightarrow{AC}}{b+c}$. Then
      $l_a^2=\dfrac{b^2c^2+c^2b^2+2bc\,\dotp{\overrightarrow{AB}}{\overrightarrow{AC}}}{(b+c)^2}$, and $2\dotp{\overrightarrow{AB}}{\overrightarrow{AC}}=b^2+c^2-a^2$, so
      $l_a^2=\dfrac{bc\left(2bc+b^2+c^2-a^2\right)}{(b+c)^2}=\dfrac{bc\left[(b+c)^2-a^2\right]}{(b+c)^2}$.

  - id: ex-bisector-length
    type: example
    title: Length of the bisector from $A$
    problem: |
      Find $l_a$ for $a=15$, $b=13$, $c=14$.
    steps:
      - |
        $bc=182$ and $(b+c)^2-a^2=729-225=504$, so $bc\left[(b+c)^2-a^2\right]=182\cdot504=91728=144\cdot637=144\cdot49\cdot13$.
      - |
        $\sqrt{91728}=12\cdot7\sqrt{13}=84\sqrt{13}$, so $l_a=\dfrac{84\sqrt{13}}{27}=\dfrac{28\sqrt{13}}9$.
      - |
        Check with the coordinates: $AD_a=\sqrt{\left(\dfrac{28}3\right)^2+\left(\dfrac{56}9\right)^2}=\dfrac{28}9\sqrt{9+4}=\dfrac{28\sqrt{13}}9$.
    answer: |
      $l_a=\dfrac{28\sqrt{13}}9$.
    verify:
      - expr: "sqrt(13*14*((13+14)^2-15^2))/(13+14)"
        equals: "28*sqrt(13)/9"
      - expr: "sqrt((28/3)^2+(56/9)^2)"
        equals: "28*sqrt(13)/9"

  - id: chk-bisector-length
    type: check
    prompt: |
      An equilateral triangle has side $2$. Find the length of the bisector from one vertex.
    answerType: expression
    answer: "sqrt(3)"
    hints:
      - |
        $a=b=c=2$.
    explanation: |
      $l_a=\dfrac14\sqrt{4\cdot(16-4)}=\dfrac14\sqrt{48}=\sqrt3$. In an equilateral triangle the bisector is also the altitude: $h=\dfrac{\sqrt3}{2}\cdot2=\sqrt3$.

  - id: incenter-theorem
    type: theorem
    name: The incenter
    statement: |
      The three internal bisectors meet at one point, the **incenter** $I$, at the same distance $r$ (the **inradius**) from the three sides. With $a$, $b$, $c$ opposite $A$, $B$, $C$,

      $$I\left(\dfrac{ax_1+bx_2+cx_3}{a+b+c},\ \dfrac{ay_1+by_2+cy_3}{a+b+c}\right),\qquad r=\dfrac{S}{s}.$$

      In vector form, each coordinate is a weighted average with the weights $a,b,c$: $I=\dfrac{a\,A+b\,B+c\,C}{a+b+c}$.

      Moreover $AI:ID_a=(b+c):a$.
    proof: |
      In the triangle $ABD_a$, the segment $BI$ bisects the angle at $B$, so $AI:ID_a=\norm{\overrightarrow{AB}}:BD_a=c:\dfrac{ac}{b+c}=(b+c):a$, where $BD_a=\dfrac{ac}{b+c}$ from $BD_a:D_aC=c:b$.
      The section formula gives $I=\dfrac{aA+(b+c)D_a}{a+b+c}=\dfrac{aA+bB+cC}{a+b+c}$. For the radius, the segments $IA$, $IB$, $IC$ cut the triangle into three triangles of height $r$ and bases $a,b,c$, so $S=\dfrac12r(a+b+c)=rs$.

  - id: ex-incenter
    type: example
    title: The incenter and the inradius
    problem: |
      Find $I$ and $r$ for $A(0,0)$, $B(14,0)$, $C(5,12)$.
    steps:
      - |
        $a+b+c=42$. $x_I=\dfrac{15\cdot0+13\cdot14+14\cdot5}{42}=\dfrac{252}{42}=6$ and $y_I=\dfrac{15\cdot0+13\cdot0+14\cdot12}{42}=\dfrac{168}{42}=4$.
      - |
        $r=\dfrac{84}{21}=4$. Check: the distance from $I(6,4)$ to $AB$ (the $x$-axis) is $4$, and the point $I$ is on the bisector $2x-3y=0$: $12-12=0$.
    answer: |
      $I(6,4)$ and $r=4$.
    verify:
      - expr: "(13*14+14*5)/42"
        equals: "6"
      - expr: "(14*12)/42"
        equals: "4"
      - expr: "84/21"
        equals: "4"
      - expr: "abs(4*6+3*4-56)/5"
        equals: "4"

  - id: chk-incenter
    type: check
    prompt: |
      Find the incenter of the triangle $A(0,0)$, $B(4,0)$, $C(0,3)$.
    answerType: vector
    answer: "(1, 1)"
    hints:
      - |
        The weights are the opposite sides: $a=BC$, $b=CA$, $c=AB$.
      - |
        Compute the three side lengths, then use the coordinate formula of the incenter.
    explanation: |
      $I=\dfrac{5A+3B+4C}{12}=\left(\dfrac{12}{12},\dfrac{12}{12}\right)=(1,1)$.

  - id: summary
    type: summary
    points:
      - |
        The internal bisector from $A$ has direction $\dfrac{\overrightarrow{AB}}c+\dfrac{\overrightarrow{AC}}b$ and meets $BC$ at $D_a=\dfrac{bB+cC}{b+c}$.
      - |
        $l_a=\dfrac1{b+c}\sqrt{bc\left[(b+c)^2-a^2\right]}$.
      - |
        $I\left(\dfrac{ax_1+bx_2+cx_3}{a+b+c},\ \dfrac{ay_1+by_2+cy_3}{a+b+c}\right)$ and $r=\dfrac Ss$: each vertex is weighted by the opposite side.
