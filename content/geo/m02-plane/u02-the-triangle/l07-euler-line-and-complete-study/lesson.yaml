id: geo-m02-u02-l07
title: The Euler line and a complete study of a triangle
estMinutes: 50
version: 1
status: draft
skills:
  - euler-line
  - complete-triangle-study
objectives:
  - Use the Euler line to check the centroid, the orthocenter and the circumcenter against each other.
  - Carry out a complete study of a triangle in the usual order of an examination.
sections:
  - id: three-centers
    type: concept
    title: Three centers on one line
    body: |
      A triangle has four classical centers: the centroid $G$ (medians), the orthocenter $H$ (altitudes), the incenter $I$ (angle bisectors) and the circumcenter $O$ (perpendicular bisectors).
      They are different points in general, and in an equilateral triangle they coincide.

      Three of them, $O$, $G$ and $H$, are always on one line with a fixed ratio. This gives a check on a long computation: after finding the three centers from their own formulas, we test the relation between them.
      The fourth center $I$ is not on this line, except for isosceles triangles.

  - id: fig-euler
    type: visual
    kind: figure
    title: The Euler line
    caption: |
      The centroid $G\left(\dfrac{19}{3},4\right)$, the orthocenter $H\left(5,\dfrac{15}{4}\right)$ and the circumcenter $O\left(7,\dfrac{33}{8}\right)$ lie on one line, the Euler line, and $G$ is between $H$ and $O$ with $HG=2\,GO$.
    figure:
      dim: 2
      alt: "The triangle ABC with its centroid G, orthocenter H and circumcenter O lying on one straight line, the Euler line."
      view: [-3, 17, -5, 14]
      items:
        - {t: point, id: A, at: [0, 0]}
        - {t: point, id: B, at: [14, 0]}
        - {t: point, id: C, at: [5, 12]}
        - {t: point, id: G, at: [19/3, 4], color: success}
        - {t: point, id: H, at: [5, 15/4], color: danger}
        - {t: point, id: O, at: [7, 33/8], color: warning}
        - {t: polygon, pts: [A, B, C], fill: accent}
        - {t: line, through: [H, O], color: ink, dashed: true, label: Euler}

  - id: euler-theorem
    type: theorem
    name: The Euler line
    statement: |
      In every triangle the circumcenter $O$, the centroid $G$ and the orthocenter $H$ are on one line, the **Euler line**, and

      $$\overrightarrow{HG}=2\,\overrightarrow{GO},\qquad\text{that is}\qquad\overrightarrow{OH}=3\,\overrightarrow{OG},\qquad H=3G-2O.$$
    proof: |
      Put $\vec a=\overrightarrow{OA}$, $\vec b=\overrightarrow{OB}$, $\vec c=\overrightarrow{OC}$, so that $\norm{\vec a}=\norm{\vec b}=\norm{\vec c}=R$, and let $H'$ be the point with $\overrightarrow{OH'}=\vec a+\vec b+\vec c$.
      Then $\overrightarrow{AH'}=\vec b+\vec c$, and $\dotp{\vec b+\vec c}{\vec c-\vec b}=\norm{\vec c}^2-\norm{\vec b}^2=0$, so $\overrightarrow{AH'}\perp\overrightarrow{BC}$: $H'$ is on the altitude from $A$.
      In the same way $H'$ is on the other two altitudes, so $H'=H$. Finally $\overrightarrow{OG}=\dfrac{\vec a+\vec b+\vec c}{3}$ gives $\overrightarrow{OH}=3\,\overrightarrow{OG}$, and $\overrightarrow{HG}=\overrightarrow{OG}-\overrightarrow{OH}=-2\,\overrightarrow{OG}=2\,\overrightarrow{GO}$.

  - id: ex-euler
    type: example
    title: Checking three centers
    problem: |
      For $A(0,0)$, $B(14,0)$, $C(5,12)$ we found $G\left(\dfrac{19}3,4\right)$, $H\left(5,\dfrac{15}4\right)$ and $O\left(7,\dfrac{33}8\right)$. Verify $\overrightarrow{HG}=2\,\overrightarrow{GO}$.
    steps:
      - |
        $\overrightarrow{HG}=\left(\dfrac{19}3-5,\ 4-\dfrac{15}4\right)=\left(\dfrac43,\dfrac14\right)$.
      - |
        $\overrightarrow{GO}=\left(7-\dfrac{19}3,\ \dfrac{33}8-4\right)=\left(\dfrac23,\dfrac18\right)$, and $2\overrightarrow{GO}=\left(\dfrac43,\dfrac14\right)$.
      - |
        The vectors are equal, so the three points are on one line, with $G$ between $H$ and $O$ and $HG=2\,GO$.
    answer: |
      $\overrightarrow{HG}=\left(\dfrac43,\dfrac14\right)=2\,\overrightarrow{GO}$.
    verify:
      - expr: "(19/3-5, 4-15/4)"
        equals: "(4/3,1/4)"
      - expr: "2*(7-19/3, 33/8-4)"
        equals: "(4/3,1/4)"

  - id: chk-euler
    type: check
    prompt: |
      In a triangle $O=(0,0)$ and $G=(1,2)$. Where is the orthocenter $H$?
    answerType: vector
    answer: "(3, 6)"
    hints:
      - |
        Start from the relation between the three centers: the vector from $O$ to $H$ is three times the vector from $O$ to $G$.
    explanation: |
      $H=3(1,2)-2(0,0)=(3,6)$.

  - id: centers-at-a-glance
    type: formula
    title: The centers of a triangle on one page
    formula: |
      \begin{aligned}
      G&\left(\dfrac{x_1+x_2+x_3}3,\ \dfrac{y_1+y_2+y_3}3\right),\\
      I&\left(\dfrac{ax_1+bx_2+cx_3}{a+b+c},\ \dfrac{ay_1+by_2+cy_3}{a+b+c}\right),\qquad r=\dfrac Ss\ \left(s=\dfrac{a+b+c}2\right),\\
      O&:\ \text{intersection of the perpendicular bisectors},\qquad R=\dfrac{abc}{4S},\\
      x_O&=\dfrac{(x_1^2+y_1^2)(y_2-y_3)+(x_2^2+y_2^2)(y_3-y_1)+(x_3^2+y_3^2)(y_1-y_2)}{D},\\
      D&=2\bigl[x_1(y_2-y_3)+x_2(y_3-y_1)+x_3(y_1-y_2)\bigr]
      \end{aligned}
    note: |
      The coordinates $y_O$ are obtained from the same formula with the roles of $x$ and $y$ exchanged (see the lesson on the circumcenter, where the determinant form is also given).

  - id: centers-relations
    type: formula
    title: The relations between the centers
    formula: |
      \begin{aligned}
      H&=A+B+C-2O=3G-2O,\qquad\overrightarrow{HG}=2\,\overrightarrow{GO},\\
      OI^2&=R^2-2Rr\quad(\text{Euler's formula}),\qquad OH^2=9R^2-(a^2+b^2+c^2).
      \end{aligned}
    note: |
      Here $a=BC$, $b=CA$, $c=AB$ are the sides opposite $A$, $B$, $C$, and $S$ is the area. The weights of the incenter are the **opposite** sides; the centroid has equal weights. In an equilateral triangle $G=I=O=H$.
  - id: ex-centers-glance
    type: example
    title: The incenter, the radii and Euler's formula for the running triangle
    problem: |
      For $A(0,0)$, $B(14,0)$, $C(5,12)$ find $I$, $r$, $R$ and check $OI^2=R^2-2Rr$, with $O\left(7,\dfrac{33}8\right)$.
    steps:
      - text: |
          $a=BC=15$, $b=CA=13$, $c=AB=14$, so $a+b+c=42$ and $s=21$. The area is $S=\dfrac12\cdot14\cdot12=84$.
        why: |
          $BC=\sqrt{(14-5)^2+12^2}=\sqrt{225}=15$ and $CA=\sqrt{25+144}=13$. The base $AB=14$ is horizontal and the height of $C$ is $12$.
      - |
        $I=\dfrac{15A+13B+14C}{42}=\dfrac{(0+182+70,\ 0+0+168)}{42}=(6,4)$, and $r=\dfrac Ss=\dfrac{84}{21}=4$.
      - |
        $R=\dfrac{abc}{4S}=\dfrac{15\cdot13\cdot14}{336}=\dfrac{65}8$.
      - text: |
          $OI^2=(7-6)^2+\left(\dfrac{33}8-4\right)^2=1+\dfrac1{64}=\dfrac{65}{64}$ and $R^2-2Rr=\dfrac{4225}{64}-2\cdot\dfrac{65}8\cdot4=\dfrac{4225-4160}{64}=\dfrac{65}{64}$.
        why: |
          Euler's formula links the distance between the circumcenter and the incenter to the two radii: it is a check that is easy to remember and that the center coordinates are right.
    answer: |
      $I(6,4)$, $r=4$, $R=\dfrac{65}8$, and $OI^2=R^2-2Rr=\dfrac{65}{64}$.
    verify:
      - expr: "(15*0+13*14+14*5)/42"
        equals: "6"
      - expr: "(14*12)/42"
        equals: "4"
      - expr: "15*13*14/(4*84)"
        equals: "65/8"
      - expr: "(7-6)^2+(33/8-4)^2"
        equals: "65/64"
      - expr: "(65/8)^2-2*(65/8)*4"
        equals: "65/64"

  - id: study-plan
    type: concept
    title: A complete study of a triangle
    body: |
      An examination question on a triangle with given vertices usually follows this order. Keep it as a checklist.

      1. **The sides:** the vectors, the lengths, and the eight equations of one side.
      2. **Perimeter, area, angles** (by the dot product), and the four centers: **centroid** $G$, **orthocenter** $H$, **incenter** $I$, **circumcenter** $O$. Check with $\overrightarrow{HG}=2\overrightarrow{GO}$.
      3. **From one vertex:** the equations of the median, the altitude and the angle bisector.
      4. **From the same vertex:** the lengths $m_a=\dfrac12\sqrt{2b^2+2c^2-a^2}$, $h_a=\dfrac{2S}{a}$, $l_a=\dfrac1{b+c}\sqrt{bc\left[(b+c)^2-a^2\right]}$.
      5. **The circles:** analytic and parametric equations of the incircle and of the circumcircle, and their perimeters and areas.
      6. **The figure:** plot the triangle with its two circles (a drawing tool such as GeoGebra is useful to check the result).

      Exact values only: leave radicals and fractions as they are, and give $\arccos$ of an exact number for an angle.

  - id: ex-table
    type: example
    title: The complete results for the running triangle
    problem: |
      Collect the results for $A(0,0)$, $B(14,0)$, $C(5,12)$.
    steps:
      - |
        **Sides:** $a=15$, $b=13$, $c=14$; perimeter $42$; area $84$. **Angles:** $\arccos\dfrac5{13}$, $\arccos\dfrac35$, $\arccos\dfrac{33}{65}$.
      - |
        **Centers:** $G\left(\dfrac{19}3,4\right)$, $H\left(5,\dfrac{15}4\right)$, $I(6,4)$, $O\left(7,\dfrac{33}8\right)$.
      - |
        **From $A$:** median $12x-19y=0$ (length $\dfrac{\sqrt{505}}2$); altitude $3x-4y=0$ (length $\dfrac{56}5$); bisector $2x-3y=0$ (length $\dfrac{28\sqrt{13}}9$).
      - |
        **Circles:** incircle $(x-6)^2+(y-4)^2=16$ with perimeter $8\pi$ and area $16\pi$; circumcircle $(x-7)^2+\left(y-\dfrac{33}8\right)^2=\dfrac{4225}{64}$ with perimeter $\dfrac{65\pi}4$ and area $\dfrac{4225\pi}{64}$.
      - |
        **Consistency checks:** $r=\dfrac Ss=4$ equals the $y$-coordinate of $I$ (the side $AB$ is on the $x$-axis); $\overrightarrow{HG}=2\overrightarrow{GO}$; the three lines from $A$ are different, because the triangle is scalene.
    answer: |
      $G\left(\dfrac{19}3,4\right)$, $H\left(5,\dfrac{15}4\right)$, $I(6,4)$, $O\left(7,\dfrac{33}8\right)$, $m_a=\dfrac{\sqrt{505}}2$, $h_a=\dfrac{56}5$, $l_a=\dfrac{28\sqrt{13}}9$.
    verify:
      - expr: "84/21"
        equals: "4"

  - id: chk-study
    type: check
    prompt: |
      For the triangle $A(0,0)$, $B(4,0)$, $C(0,3)$, find the inradius $r$.
    answerType: number
    answer: "1"
    hints:
      - |
        This is a right triangle with sides $3,4,5$ and area $6$.
    explanation: |
      $r=\dfrac Ss=\dfrac66=1$.

  - id: summary
    type: summary
    points:
      - |
        $O$, $G$, $H$ are collinear, with $\overrightarrow{HG}=2\overrightarrow{GO}$ and $H=3G-2O$.
      - |
        A complete study: sides and equations, perimeter, area, angles, the four centers, median, altitude and bisector (equations and lengths), the two circles (equations, perimeters, areas).
      - |
        Always check a result by a second method: a point on its line, a distance, or the Euler relation.
