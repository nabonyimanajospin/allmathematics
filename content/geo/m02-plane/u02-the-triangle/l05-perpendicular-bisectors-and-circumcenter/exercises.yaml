        The triangle has the vertices $A\left(1,\,1\right)$, $B\left(5,\,1\right)$ and $C\left(1,\,4\right)$. The equation of the perpendicular bisector of the side $AB$ is
      answerType: equation
      answer: "8*x - 24=0"
      coordinates:
        [x, y]
      hints:
        - It passes through the midpoint of the side and its normal vector is the side itself.
      solution: |-
        The midpoint of $AB$ is $\left(3,\,1\right)$ and the normal vector is $\overrightarrow{AB}=\left(4,\,0\right)$, so the line is $4 x - 12=0$, that is $8 x - 24=0$.
