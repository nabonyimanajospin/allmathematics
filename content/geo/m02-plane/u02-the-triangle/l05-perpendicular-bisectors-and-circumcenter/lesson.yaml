        - {t: point, id: B, at: [14, 0]}
        - {t: point, id: C, at: [5, 12]}
        - {t: point, id: M_a, at: [19/2, 6], color: success}
        - {t: point, id: M_b, at: [5/2, 6], color: success}
        - {t: point, id: M_c, at: [7, 0], color: success}
        - {t: point, id: O, at: [7, 33/8], color: warning}
        - {t: polygon, pts: [A, B, C], fill: accent}
        - {t: line, through: [M_a, O], color: success, dashed: true}
        - {t: line, through: [M_b, O], color: success, dashed: true}
        - {t: line, through: [M_c, O], color: success, dashed: true}
        - {t: circle, center: O, r: 65/8, color: warning}

  - id: circumcenter-formulas
    type: formula
    title: Circumcenter and circumcircle, the formulas to remember
    formula: |
      \begin{aligned}
      x_O&=\dfrac{(x_1^2+y_1^2)(y_2-y_3)+(x_2^2+y_2^2)(y_3-y_1)+(x_3^2+y_3^2)(y_1-y_2)}{D}\\
      y_O&=\dfrac{(x_1^2+y_1^2)(x_3-x_2)+(x_2^2+y_2^2)(x_1-x_3)+(x_3^2+y_3^2)(x_2-x_1)}{D}\\
      D&=2\left[x_1(y_2-y_3)+x_2(y_3-y_1)+x_3(y_1-y_2)\right]
      \end{aligned}
    note: |
      These are the coordinates of the point at equal distance from $A$, $B$, $C$. If $D=0$ the three points are on one line and there is no circumcircle.

  - id: circumcenter-determinants
    type: formula
    title: The circumcenter with determinants
    formula: |
      O\left(\dfrac{1}{4S}\begin{vmatrix}x_1^2+y_1^2&y_1&1\\x_2^2+y_2^2&y_2&1\\x_3^2+y_3^2&y_3&1\end{vmatrix},\ \dfrac{1}{4S}\begin{vmatrix}x_1&x_1^2+y_1^2&1\\x_2&x_2^2+y_2^2&1\\x_3&x_3^2+y_3^2&1\end{vmatrix}\right),\qquad S=\dfrac12\begin{vmatrix}x_1&y_1&1\\x_2&y_2&1\\x_3&y_3&1\end{vmatrix}
    note: |
      Keep the **sign** of $S$ and of the two determinants: if the vertices are written clockwise, $S$ is negative and so are the determinants, and the signs cancel in the quotient. The first column of each determinant is what changes: it holds $x_i^2+y_i^2$ for $x_O$ and $x_i$ for $y_O$.

  - id: ex-perp-bisector
    type: example
    title: The perpendicular bisector of $BC$
    problem: |
      Find the perpendicular bisector of $BC$ for $B(14,0)$, $C(5,12)$.
    steps:
      - |
        $M=\left(\dfrac{19}2,6\right)$ and $\overrightarrow{BC}=(-9,12)$, so the normal vector is $(-9,12)\parallel(-3,4)$.
      - |
        $-3\left(x-\dfrac{19}2\right)+4(y-6)=0$, that is $-6x+57+8y-48=0$, so $6x-8y-9=0$.
      - |
        Check with $PB^2=PC^2$: the point $\left(\dfrac32,0\right)$ is on the line ($9-9=0$), and $PB^2=\left(\dfrac{25}{2}\right)^2$, $PC^2=\left(\dfrac72\right)^2+144=\dfrac{49+576}{4}=\dfrac{625}{4}$. Both equal $\dfrac{625}4$.
    answer: |
      $6x-8y-9=0$.
    verify:
      - expr: "6*(19/2)-8*6-9"
        equals: "0"
      - expr: "(14-3/2)^2"
        equals: "(5-3/2)^2+12^2"

  - id: chk-perp-bisector
    type: check
    prompt: |
      Find an equation of the perpendicular bisector of the segment with ends $A(1,2)$ and $B(5,6)$.
    answerType: equation
    coordinates: [x, y]
    answer: "x+y-7=0"
    hints:
      - |
        The perpendicular bisector passes through the midpoint of $AB$.
      - |
        Its normal vector is the vector $\overrightarrow{AB}$.
    explanation: |
      $4(x-3)+4(y-4)=0$, that is $x+y-7=0$.

  - id: length-theorem
    type: theorem
    name: Length inside the triangle
    statement: |
      The perpendicular bisector of $BC$ starts at the midpoint $M_a$ and leaves the triangle through one of the other two sides. Let $\hat B$ and $\hat C$ be the angles at $B$ and $C$.

      - If $b>c$ (so $\hat B>\hat C$) it leaves through $AC$, and its length inside the triangle is $\dfrac a2\tan\hat C$.
      - If $c>b$ it leaves through $AB$, and the length is $\dfrac a2\tan\hat B$.
      - If $b=c$ it passes through $A$, and the length is the altitude $h_a$.
    proof: |
      Suppose $b>c$. Then $A$ is nearer to $B$ than to $C$, so $A$ and $C$ are on opposite sides of the perpendicular bisector, which therefore crosses the side $AC$ at a point $P$ with $PB=PC$.
      In the right triangle $M_aCP$, the angle at $C$ is $\hat C$ and $CM_a=\dfrac a2$, so $M_aP=\dfrac a2\tan\hat C$. The angle $\hat C$ is acute, since $\hat B>\hat C$ and two angles of a triangle cannot both be $\ge\dfrac\pi2$.
      The case $c>b$ is the same with $B$ and $C$ exchanged.

  - id: ex-perp-length
    type: example
    title: A length of a perpendicular bisector
    problem: |
      Find the length of the perpendicular bisector of $BC$ inside the triangle $A(0,0)$, $B(14,0)$, $C(5,12)$.
    steps:
      - |
        $b=13<c=14$, so it leaves through $AB$ and the length is $\dfrac a2\tan\hat B$.
      - |
        $\cos\hat B=\dfrac35$, so $\sin\hat B=\dfrac45$ and $\tan\hat B=\dfrac43$. The length is $\dfrac{15}{2}\cdot\dfrac43=10$.
      - |
        Check: the line $6x-8y-9=0$ meets $AB$ ($y=0$) at $P\left(\dfrac32,0\right)$, and $M_aP=\sqrt{\left(\dfrac{19}2-\dfrac32\right)^2+6^2}=\sqrt{64+36}=10$.
    answer: |
      The length is $10$.
    verify:
      - expr: "15/2*(4/5)/(3/5)"
        equals: "10"
      - expr: "sqrt((19/2-3/2)^2+6^2)"
        equals: "10"

  - id: chk-perp-length
    type: check
    prompt: |
      A triangle has a side $\norm{\overrightarrow{BC}}=6$ with $\hat B=\dfrac\pi4$ and $c>b$ (so the perpendicular bisector of $BC$ leaves through $AB$). Find its length inside the triangle.
    answerType: number
    answer: "3"
    hints:
      - |
        Draw the right triangle formed by half of the side, the bisector and the side from the vertex.
      - |
        Use the tangent of the angle in that right triangle.
    explanation: |
      $\dfrac62\tan\dfrac\pi4=3\cdot1=3$.

  - id: circumcenter-theorem
    type: theorem
    name: The circumcenter and the circumradius
    statement: |
      The three perpendicular bisectors meet at one point, the **circumcenter** $O$, at the same distance $R$ (the **circumradius**) from the three vertices. With the signed area
      $S=\dfrac12\begin{vmatrix}x_1&y_1&1\\x_2&y_2&1\\x_3&y_3&1\end{vmatrix}$,

      $$x_O=\dfrac{1}{4S}\begin{vmatrix}x_1^2+y_1^2&y_1&1\\x_2^2+y_2^2&y_2&1\\x_3^2+y_3^2&y_3&1\end{vmatrix},\qquad
      y_O=\dfrac{1}{4S}\begin{vmatrix}x_1&x_1^2+y_1^2&1\\x_2&x_2^2+y_2^2&1\\x_3&x_3^2+y_3^2&1\end{vmatrix},\qquad R=\dfrac{abc}{4S}=\dfrac{a}{2\sin\hat A}.$$

      In a right triangle $O$ is the midpoint of the hypotenuse and $R$ is half of it.
    proof: |
      $O$ satisfies $OA^2=OB^2=OC^2$. Subtracting the equations of $OA^2=OB^2$ and $OA^2=OC^2$ gives two linear equations in $x_O$ and $y_O$, which Cramer's rule solves with the determinants above.
      By the law of sines $a=2R\sin\hat A$, and $S=\dfrac12bc\sin\hat A=\dfrac{abc}{4R}$, so $R=\dfrac{abc}{4S}$.
    more: |
      **Why $a=2R\sin\hat A$ (the law of sines).** Draw the circumcircle and the diameter $BA'$ through $B$. The angle $\hat{BCA'}$ is a right angle (it is inscribed in a semicircle), and the angle at $A'$ equals $\hat A$ (both are inscribed angles on the arc $BC$).
      In the right triangle $BCA'$ the hypotenuse is $2R$ and the side opposite $\hat A$ is $a$, so $\sin\hat A=\dfrac{a}{2R}$, that is $a=2R\sin\hat A$.

  - id: ex-circumcenter-det
    type: example
    title: The circumcenter with the determinants
    problem: |
      Find the circumcenter of the triangle $A(-3,2)$, $B(1,5)$, $C(5,-7)$.
    steps:
      - text: |
          $x_1^2+y_1^2=13$, $x_2^2+y_2^2=26$, $x_3^2+y_3^2=74$. The signed area is $S=\dfrac12\begin{vmatrix}-3&2&1\\1&5&1\\5&-7&1\end{vmatrix}=-30$, so $4S=-120$.
        why: |
          The vertices are clockwise, so the signed area is negative; the area is $30$ squ. The determinant is $-3(5+7)-2(1-5)+(-7-25)=-36+8-32=-60$, and half of it is $-30$.
      - text: |
          $x_O=\dfrac{1}{-120}\begin{vmatrix}13&2&1\\26&5&1\\74&-7&1\end{vmatrix}=\dfrac{-300}{-120}=\dfrac52$.
        why: |
          The determinant is $13(5+7)-2(26-74)+(-182-370)=156+96-552=-300$.
      - text: |
          $y_O=\dfrac{1}{-120}\begin{vmatrix}-3&13&1\\1&26&1\\5&74&1\end{vmatrix}=\dfrac{140}{-120}=-\dfrac76$.
        why: |
          The determinant is $-3(26-74)-13(1-5)+(74-130)=144+52-56=140$.
      - text: |
          Check: $OA^2=\left(\dfrac52+3\right)^2+\left(-\dfrac76-2\right)^2=\dfrac{121}4+\dfrac{361}{36}=\dfrac{725}{18}$, and $OB^2$ and $OC^2$ give the same value.
        why: |
          $OB^2=\left(\dfrac52-1\right)^2+\left(-\dfrac76-5\right)^2=\dfrac94+\dfrac{1369}{36}=\dfrac{1450}{36}=\dfrac{725}{18}$.
    answer: |
      $O\left(\dfrac52,-\dfrac76\right)$, with $R=\dfrac{5\sqrt{58}}{6}$ lu.
    verify:
      - expr: "(13*(5+7)-2*(26-74)+(-182-370))/(-120)"
        equals: "5/2"
      - expr: "(-3*(26-74)-13*(1-5)+(74-130))/(-120)"
        equals: "-7/6"
      - expr: "(5/2+3)^2+(-7/6-2)^2"
        equals: "725/18"
      - expr: "(5/2-1)^2+(-7/6-5)^2"
        equals: "725/18"

  - id: circumcircle-formulas
    type: formula
    title: Radius and the relations with the other centers
    formula: |
      R=\dfrac{abc}{4S}=\dfrac{a}{2\sin\hat A},\qquad OI^2=R^2-2Rr,\qquad OH^2=9R^2-\left(a^2+b^2+c^2\right),\qquad H=A+B+C-2O
    note: |
      $I$ is the incenter with inradius $r$ and $H$ the orthocenter. The first relation (Euler's) shows $R\ge2r$, with equality only for the equilateral triangle. The last one puts $O$, $G$, $H$ on one line, the Euler line.

  - id: ex-circumcenter
    type: example
    title: The circumcenter and the circumradius
    problem: |
      Find $O$ and $R$ for $A(0,0)$, $B(14,0)$, $C(5,12)$.
    steps:
      - text: |
          The perpendicular bisector of $AB$ is $x=7$. So $O=(7,y)$ with $OA^2=OC^2$: $49+y^2=4+(y-12)^2$, that is $49=148-24y$, so $y=\dfrac{99}{24}=\dfrac{33}8$.
        why: |
          $AB$ lies on the $x$-axis from $0$ to $14$, so its midpoint is $(7,0)$ and the perpendicular bisector is the vertical line $x=7$.
          For the point $O=(7,y)$ the condition $OA^2=OC^2$ reads $(7-0)^2+(y-0)^2=(7-5)^2+(y-12)^2$, that is $49+y^2=4+y^2-24y+144$. The terms $y^2$ cancel, leaving $24y=99$, so $y=\dfrac{33}8$.
      - |
        $R=\dfrac{abc}{4S}=\dfrac{15\cdot13\cdot14}{4\cdot84}=\dfrac{2730}{336}=\dfrac{65}8$. Check: $OA^2=49+\dfrac{1089}{64}=\dfrac{4225}{64}=\left(\dfrac{65}8\right)^2$.
      - |
        Check with the determinants: $S=84$ and $4S=336$; the first determinant is $2352$, so $x_O=\dfrac{2352}{336}=7$.
    answer: |
      $O\left(7,\dfrac{33}8\right)$ and $R=\dfrac{65}8$.
    verify:
      - expr: "49+(33/8)^2"
        equals: "(65/8)^2"
      - expr: "15*13*14/(4*84)"
        equals: "65/8"
      - expr: "2352/336"
        equals: "7"

  - id: chk-circumcenter
    type: check
    prompt: |
      Find the circumcenter of the triangle $A(0,0)$, $B(6,0)$, $C(0,8)$.
    answerType: vector
    answer: "(3, 4)"
    hints:
      - |
        The circumcenter is on the perpendicular bisectors of the sides.
      - |
        Write the perpendicular bisectors of two sides, then find their intersection.
    explanation: |
      The perpendicular bisector of $AB$ is $x=3$ and that of $AC$ is $y=4$, so $O=(3,4)$. It is the midpoint of the hypotenuse $BC$.

  - id: chk-circumradius
    type: check
    prompt: |
      Find the circumradius of the right triangle with sides $3$, $4$, $5$.
    answerType: number
    answer: "5/2"
    hints:
      - |
        Use $R=\dfrac{abc}{4S}$.
      - |
        Find the three sides and the area $S$ first.
    explanation: |
      $R=\dfrac{3\cdot4\cdot5}{4\cdot6}=\dfrac{60}{24}=\dfrac52$, half of the hypotenuse.

  - id: summary
    type: summary
    points:
      - |
        The perpendicular bisector of $BC$: through $M_a$, with normal vector $\overrightarrow{BC}$; its points satisfy $PB=PC$.
      - |
        Its length inside the triangle is $\dfrac a2\tan\hat C$ if $b>c$, $\dfrac a2\tan\hat B$ if $c>b$, and $h_a$ if $b=c$.
      - |
        The circumcenter $O$ is where the perpendicular bisectors meet; $R=\dfrac{abc}{4S}$.
