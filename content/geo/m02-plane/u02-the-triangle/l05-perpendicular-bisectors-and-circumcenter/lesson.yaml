id: geo-m02-u02-l05
title: Perpendicular bisectors and the circumcenter
estMinutes: 45
version: 1
status: draft
skills:
  - perpendicular-bisector
  - circumcenter
  - circumradius
objectives:
  - Write the equation of the perpendicular bisector of a side.
  - Compute the length of the part of a perpendicular bisector inside the triangle.
  - Find the circumcenter and the circumradius.
sections:
  - id: bisector-def
    type: definition
    term: Perpendicular bisector of a side
    body: |
      The **perpendicular bisector** of the side $BC$ is the line through the midpoint $M_a$ of $BC$ perpendicular to $BC$. A point is on it exactly when it is at the same distance from $B$ and from $C$.

      Its normal vector is $\overrightarrow{BC}$, so its equation is

      $$(x_C-x_B)\left(x-x_{M}\right)+(y_C-y_B)\left(y-y_{M}\right)=0,\qquad M=\dfrac{B+C}{2}.$$

      Equivalent form: $PB^2=PC^2$ with $P(x,y)$. Its direction vector is $\overrightarrow{BC}$ turned by a right angle.

  - id: fig-circumcenter
    type: visual
    kind: figure
    title: The perpendicular bisectors and the circumcircle
    caption: |
      The perpendicular bisectors of the sides meet at the circumcenter $O\left(7,\dfrac{33}{8}\right)$, the center of the circle through $A$, $B$, $C$, whose radius is $R=\dfrac{65}{8}$ lu.
    figure:
      dim: 2
      alt: "The triangle ABC with the perpendicular bisectors of its sides meeting at the circumcenter O, and the circumscribed circle through the three vertices."
      view: [-3, 17, -5, 14]
      items:
