id: geo-m01-u01-l01
title: Points, coordinates and the vector AB
estMinutes: 25
version: 1
status: draft
skills:
  - vector-from-two-points
  - vector-equality
objectives:
  - Describe a vector as a displacement from a start point to an end point.
  - Compute the components of $\overrightarrow{AB}$ from the coordinates of $A$ and $B$.
  - Decide when two vectors are equal and use it to find the missing vertex of a parallelogram.
sections:
  - id: why-vectors
    type: concept
    title: Some quantities need a direction
    body: |
      A number is enough to say how hot a room is. It is not enough to say how a ship moves: *how fast*
      and *in which direction* both matter. A quantity described by a size and a direction is a
      **vector**.

      The simplest picture of a vector is an arrow. To go from the point $A$ to the point $B$, you
      follow the arrow that starts at $A$ and ends at $B$. We call it $\overrightarrow{AB}$.

      Two different journeys can be the same displacement. Walking 3 steps east and 4 steps north from
      the school, or from the market, is the same movement even though the starting points differ.
      This is why a vector is not tied to one place: only its direction and its size matter.

      In this lesson we describe vectors with numbers (their **components**), so that we can compute
      with them.

  - id: vector-ab
    type: definition
    term: The vector from A to B
    body: |
      Let $A$ and $B$ be two points. The vector $\overrightarrow{AB}$ is the displacement that takes
      $A$ to $B$. The point $A$ is its **start** (origin) and $B$ is its **end** (tip).

      The vector from a point to itself is the **zero vector**, written $\vec 0$.

      The vector $\overrightarrow{BA}$ goes the opposite way: it is the **opposite** of
      $\overrightarrow{AB}$.

  - id: components-formula
    type: formula
    title: Components of a vector from two points
    formula: |
      \begin{gathered}
      \overrightarrow{AB}=\overrightarrow{OB}-\overrightarrow{OA}=\left(x_B-x_A,\; y_B-y_A\right)\quad\text{in the plane}\\[1ex]
      \overrightarrow{AB}=\overrightarrow{OB}-\overrightarrow{OA}=\left(x_B-x_A,\; y_B-y_A,\; z_B-z_A\right)\quad\text{in space}
      \end{gathered}
    note: |
      Remember it as **end minus start**: the position vector of the end, $\overrightarrow{OB}$, minus the position vector
      of the start, $\overrightarrow{OA}$. Here $O$ is the origin and $\overrightarrow{OA}$ is the vector whose components are the
      coordinates of $A$. Vectors are written as columns; points are written in a row, $A(x_A,y_A)$.

  - id: ex-components-plane
    type: example
    title: Components in the plane
    problem: |
      Find $\overrightarrow{AB}$ and $\overrightarrow{BA}$ for $A(1,2)$ and $B(4,6)$.
    steps:
      - |
        The position vectors are $\overrightarrow{OA}=(1,2)$ and $\overrightarrow{OB}=(4,6)$: their components are the coordinates of the points.
      - |
        Subtract, one component at a time:
        $\overrightarrow{AB}=\overrightarrow{OB}-\overrightarrow{OA}=(4-1,\,6-2)=(3,4)$.
      - |
        For $\overrightarrow{BA}$ the start is $B$ and the end is $A$:
        $\overrightarrow{BA}=\overrightarrow{OA}-\overrightarrow{OB}=(1-4,\,2-6)=(-3,-4)$.
        Each component of $\overrightarrow{BA}$ is the opposite of the one of $\overrightarrow{AB}$.
        Each component of $\overrightarrow{BA}$ is the opposite of the one of $\overrightarrow{AB}$.
    answer: |
      $\overrightarrow{AB}=(3,4)$ and $\overrightarrow{BA}=(-3,-4)$.
    verify:
      - expr: "(4,6)-(1,2)"
        equals: "(3,4)"
      - expr: "(1,2)-(4,6)"
        equals: "(-3,-4)"

  - id: chk-components
    type: check
    prompt: |
      Let $A(-2,3)$ and $B(1,-1)$. Find $\overrightarrow{AB}$.
    answerType: vector
    answer: "(3, -4)"
    hints:
      - |
        Use end minus start: the first component is $x_B-x_A$.
      - |
        Be careful with the minus signs when a coordinate is negative.
    explanation: |
      $\overrightarrow{AB}=\overrightarrow{OB}-\overrightarrow{OA}=(1-(-2),\,-1-3)=(3,-4)$.
    mistakes:
      - expr: "(-3, 4)"
        hint: "You subtracted in the wrong order. The components of $\\overrightarrow{AB}$ are end minus start."
      - expr: "(-1, 2)"
        hint: "You added the coordinates. A displacement is found by subtracting: end minus start."

  - id: equality-free
    type: concept
    title: Equal vectors and free vectors
    body: |
      Two vectors are **equal** when they have the same direction and the same size. In coordinates
      this is simple: two vectors are equal exactly when their components are equal.

      So $\overrightarrow{AB}=\overrightarrow{CD}$ does *not* mean that $A=C$. It means that going from
      $A$ to $B$ is the same displacement as going from $C$ to $D$. The two arrows are parallel, point
      the same way and have the same length.

      Because only the components matter, we may draw the same vector starting from any point. A vector
      understood this way is a **free vector**, and we usually name it with a single letter with an
      arrow, such as $\vec u$. We write $\vec u=(u_1,u_2)$ in the plane and
      $\vec u=(u_1,u_2,u_3)$ in space.

      A very useful fact: in a quadrilateral $ABCD$ (vertices taken in order), the figure is a
      parallelogram exactly when $\overrightarrow{AB}=\overrightarrow{DC}$.

  - id: opposite-and-origin
    type: theorem
    name: Opposite vector and position vector
    statement: |
      For all points $A$ and $B$ and for the origin $O$:

      1. $\overrightarrow{BA}=-\overrightarrow{AB}$.
      2. $\overrightarrow{AB}=\overrightarrow{OB}-\overrightarrow{OA}$.

      The vector $\overrightarrow{OA}$ is the **position vector** of $A$; its components are the
      coordinates of $A$.
    proof: |
      Work with components in space; the plane case is the same without the third line.

      1. The components of $\overrightarrow{BA}$ are $(x_A-x_B,\,y_A-y_B,\,z_A-z_B)$, which are the
         opposites of $(x_B-x_A,\,y_B-y_A,\,z_B-z_A)$.
      2. Since $O$ is the origin, $\overrightarrow{OA}=(x_A,y_A,z_A)$ and $\overrightarrow{OB}=(x_B,y_B,z_B)$.
         Their difference is $(x_B-x_A,\,y_B-y_A,\,z_B-z_A)=\overrightarrow{AB}$.

  - id: ex-parallelogram
    type: example
    title: Finding the fourth vertex of a parallelogram
    problem: |
      The points $A(1,0,2)$, $B(3,1,0)$ and $C(0,2,1)$ are three consecutive vertices of a
      parallelogram $ABCD$. Find $D$.
    steps:
      - |
        In the parallelogram $ABCD$ we have $\overrightarrow{AB}=\overrightarrow{DC}$.
      - |
        Compute $\overrightarrow{AB}=(3-1,\,1-0,\,0-2)=(2,1,-2)$.
      - |
        Write $D(x,y,z)$. Then $\overrightarrow{DC}=(0-x,\,2-y,\,1-z)$. Setting
        $(-x,\,2-y,\,1-z)=(2,1,-2)$ gives $x=-2$, $y=1$ and $z=3$.
      - |
        Check: $\overrightarrow{DC}=(0-(-2),\,2-1,\,1-3)=(2,1,-2)=\overrightarrow{AB}$. ✓
    answer: |
      $D(-2,1,3)$.
    verify:
      - expr: "(3,1,0)-(1,0,2)"
        equals: "(2,1,-2)"
      - expr: "(0,2,1)-((3,1,0)-(1,0,2))"
        equals: "(-2,1,3)"
      - expr: "(0,2,1)-(-2,1,3)"
        equals: "(2,1,-2)"

  - id: explorer
    type: visual
    kind: vector2d
    title: Drag the points A and B
    caption: |
      Move $A$ and $B$ and watch the components of $\overrightarrow{AB}$. The arrow can be drawn from any
      other start point: its components do not change.
    config:
      mode: components

  - id: chk-parallelogram
    type: check
    prompt: |
      In the plane, $A(0,0)$, $B(4,1)$ and $C(5,4)$ are consecutive vertices of a parallelogram $ABCD$.
      Find the point $D$.
    answerType: point
    answer: "(1, 3)"
    hints:
      - |
        In a parallelogram $ABCD$ the sides $\overrightarrow{AB}$ and $\overrightarrow{DC}$ are equal vectors.
      - |
        Write $D=(x,y)$. Then $\overrightarrow{DC}=(5-x,\,4-y)$ must equal $\overrightarrow{AB}=(4,1)$.
    explanation: |
      From $(5-x,\,4-y)=(4,1)$ we get $x=1$ and $y=3$, so $D=(1,3)$.
      Check: $\overrightarrow{DC}=(5-1,\,4-3)=(4,1)=\overrightarrow{AB}$.
    mistakes:
      - expr: "(9, 5)"
        hint: "$B+C-A$ would be the vertex opposite to $A$. In $ABCD$ the vertex $D$ is opposite to $B$, so use $\\overrightarrow{AB}=\\overrightarrow{DC}$."

  - id: chk-opposite
    type: check
    prompt: |
      Let $\overrightarrow{AB}=(2,-1)$. Which vector is $\overrightarrow{BA}$?
    answerType: multiple_choice
    answer: "(-2, 1)"
    choices:
      - text: "$(-2,1)$"
        value: "(-2, 1)"
      - text: "$(2,-1)$"
        value: "(2, -1)"
      - text: "$(1,-2)$"
        value: "(1, -2)"
      - text: "$(-2,-1)$"
        value: "(-2, -1)"
    correctIndex: 0
    hints:
      - |
        $\overrightarrow{BA}$ is the opposite of $\overrightarrow{AB}$.
    explanation: |
      Reversing a vector changes the sign of every component, so $\overrightarrow{BA}=-\overrightarrow{AB}=(-2,1)$.

  - id: space-coordinates
    type: concept
    title: Coordinates in space
    body: |
      To locate a point in space we use three axes through an origin $O$: the $x$-axis, the $y$-axis
      and the $z$-axis, at right angles to each other. We use a **right-handed** system: if the fingers
      of your right hand turn from the $x$-axis towards the $y$-axis, your thumb points along the
      $z$-axis.

      A point is written $A(x_A,y_A,z_A)$. Its position vector $\overrightarrow{OA}$ has the same three
      numbers as components.

      Everything you learned in the plane works unchanged in space: add a third coordinate. For example
      $A(1,-1,2)$ and $B(4,3,-4)$ give $\overrightarrow{AB}=(3,4,-6)$.

  - id: chk-space
    type: check
    prompt: |
      Let $A(2,0,-1)$ and $B(-1,5,3)$. Find $\overrightarrow{AB}$.
    answerType: vector
    answer: "(-3, 5, 4)"
    hints:
      - |
        Subtract each coordinate of the start from the matching coordinate of the end.
    explanation: |
      $\overrightarrow{AB}=(-1-2,\,5-0,\,3-(-1))=(-3,5,4)$.
    mistakes:
      - expr: "(3, -5, -4)"
        hint: "That is $\\overrightarrow{BA}$. Compute end minus start, with $B$ as the end."

  - id: summary
    type: summary
    points:
      - |
        $\overrightarrow{AB}$ is the displacement from $A$ to $B$; its components are *end minus start*.
      - |
        $\overrightarrow{BA}=-\overrightarrow{AB}$, and $\overrightarrow{AB}=\overrightarrow{OB}-\overrightarrow{OA}$.
      - |
        Two vectors are equal exactly when their components are equal; a vector can be drawn from any point (free vector).
      - |
        $ABCD$ is a parallelogram exactly when $\overrightarrow{AB}=\overrightarrow{DC}$.
