id: geo-m01-u02-l02
title: Orthogonal projection and the main inequalities
estMinutes: 40
version: 1
status: draft
skills:
  - orthogonal-projection
  - cauchy-schwarz
  - triangle-inequality
objectives:
  - Compute the orthogonal projection of a vector on another, and the scalar component.
  - Split a vector into a part along a direction and a perpendicular part.
  - State and use the Cauchy–Schwarz and the triangle inequalities.
sections:
  - id: shadow
    type: concept
    title: The shadow of a vector
    body: |
      Shine a light perpendicular to the line of $\vec v$ on the vector $\vec u$: the shadow of $\vec u$ on the line of $\vec v$ is the **orthogonal projection** of $\vec u$ on $\vec v$.
      It is a vector parallel to $\vec v$, and the difference $\vec u-\text{shadow}$ is perpendicular to $\vec v$. So the projection splits $\vec u$ into a part **along** $\vec v$ and a part **across** it.

  - id: projection-theorem
    type: theorem
    name: Projection and component
    statement: |
      For $\vec v\neq\vec0$, the orthogonal projection of $\vec u$ on $\vec v$ is

      $$\text{proj}_{\vec v}\,\vec u=\dfrac{\dotp{\vec u}{\vec v}}{\norm{\vec v}^2}\,\vec v,$$

      and the **scalar component** of $\vec u$ along $\vec v$ (a signed length) is $\ \text{comp}_{\vec v}\,\vec u=\dfrac{\dotp{\vec u}{\vec v}}{\norm{\vec v}}$.
      The vector $\vec u-\text{proj}_{\vec v}\,\vec u$ is orthogonal to $\vec v$.
    proof: |
      Look for the projection as $t\vec v$ with $\vec u-t\vec v\perp\vec v$, that is $\dotp{\vec u-t\vec v}{\vec v}=0$. This gives $\dotp{\vec u}{\vec v}=t\norm{\vec v}^2$, so $t=\dfrac{\dotp{\vec u}{\vec v}}{\norm{\vec v}^2}$.
      The scalar component is $t\norm{\vec v}$ when $t>0$, which is $\dfrac{\dotp{\vec u}{\vec v}}{\norm{\vec v}}$; it is negative when the projection points opposite to $\vec v$.

  - id: ex-projection
    type: example
    title: Splitting a vector
    problem: |
      Split $\vec u=(3,4,5)$ into a part along $\vec v=(1,2,2)$ and a part orthogonal to $\vec v$.
    steps:
      - |
        $\dotp{\vec u}{\vec v}=3+8+10=21$ and $\norm{\vec v}^2=9$.
      - |
        $\text{proj}_{\vec v}\,\vec u=\dfrac{21}{9}(1,2,2)=\left(\dfrac73,\dfrac{14}3,\dfrac{14}3\right)$.
      - |
        The orthogonal part is $\vec u-\text{proj}=\left(\dfrac23,-\dfrac23,\dfrac13\right)$.
      - |
        Check: $\dotp{\left(\frac23,-\frac23,\frac13\right)}{(1,2,2)}=\dfrac23-\dfrac43+\dfrac23=0$.
    answer: |
      $\left(\dfrac73,\dfrac{14}3,\dfrac{14}3\right)+\left(\dfrac23,-\dfrac23,\dfrac13\right)$.
    verify:
      - expr: "21/9*(1,2,2)"
        equals: "(7/3,14/3,14/3)"
      - expr: "dot((2/3,-2/3,1/3),(1,2,2))"
        equals: "0"

  - id: chk-component
    type: check
    prompt: |
      Find the scalar component of $\vec u=(2,-1,2)$ along $\vec v=(0,3,4)$.
    answerType: number
    answer: "1"
    hints:
      - |
        $\dotp{\vec u}{\vec v}=-3+8$ and $\norm{\vec v}=5$.
    explanation: |
      $\dfrac{5}{5}=1$.

  - id: chk-projection
    type: check
    prompt: |
      Find the orthogonal projection of $\vec u=(4,2)$ on $\vec v=(1,1)$.
    answerType: vector
    answer: "(3, 3)"
    hints:
      - |
        $\dotp{\vec u}{\vec v}=6$ and $\norm{\vec v}^2=2$.
    explanation: |
      $\dfrac62(1,1)=(3,3)$.

  - id: cs
    type: theorem
    name: The Cauchy–Schwarz inequality
    statement: |
      For all vectors $\vec u$ and $\vec v$,

      $$\left|\dotp{\vec u}{\vec v}\right|\le\norm{\vec u}\,\norm{\vec v},$$

      with equality if and only if $\vec u$ and $\vec v$ are collinear.
    proof: |
      If $\vec v=\vec0$ both sides are $0$. Otherwise, for every number $t$, $\ 0\le\norm{\vec u-t\vec v}^2=\norm{\vec u}^2-2t\dotp{\vec u}{\vec v}+t^2\norm{\vec v}^2$.
      This quadratic in $t$ is never negative, so its discriminant is at most $0$: $4\dotp{\vec u}{\vec v}^2-4\norm{\vec u}^2\norm{\vec v}^2\le0$. Equality means the quadratic has a root $t$, that is $\vec u=t\vec v$.
    more: |
      **Geometric meaning.** The formula $\dotp{\vec u}{\vec v}=\norm{\vec u}\norm{\vec v}\cos\theta$ and the fact that $|\cos\theta|\le1$ give the inequality at once; the proof above does not use angles, so it also proves that the angle formula is meaningful: the number $\dfrac{\dotp{\vec u}{\vec v}}{\norm{\vec u}\norm{\vec v}}$ always lies in $[-1,1]$.

  - id: triangle
    type: theorem
    name: The triangle inequality
    statement: |
      $$\norm{\vec u+\vec v}\le\norm{\vec u}+\norm{\vec v}.$$

      Equality holds if and only if $\vec u$ and $\vec v$ have the same direction (or one is zero).
    proof: |
      $\norm{\vec u+\vec v}^2=\norm{\vec u}^2+2\dotp{\vec u}{\vec v}+\norm{\vec v}^2\le\norm{\vec u}^2+2\norm{\vec u}\norm{\vec v}+\norm{\vec v}^2=\left(\norm{\vec u}+\norm{\vec v}\right)^2$, using Cauchy–Schwarz. Take square roots (both sides are non-negative).

  - id: ex-inequality
    type: example
    title: Checking the inequalities
    problem: |
      For $\vec u=(1,2,3)$ and $\vec v=(3,-1,2)$ check both inequalities.
    steps:
      - |
        $\dotp{\vec u}{\vec v}=3-2+6=7$, $\ \norm{\vec u}=\sqrt{14}$, $\ \norm{\vec v}=\sqrt{14}$. So $|7|\le14$.
      - |
        $\vec u+\vec v=(4,1,5)$ has norm $\sqrt{42}$, and $\sqrt{42}\le2\sqrt{14}=\sqrt{56}$.
    answer: |
      $7\le14$ and $\sqrt{42}\le2\sqrt{14}$.
    verify:
      - expr: "dot((1,2,3),(3,-1,2))"
        equals: "7"
      - expr: "4^2+1^2+5^2"
        equals: "42"

  - id: summary
    type: summary
    points:
      - |
        $\text{proj}_{\vec v}\,\vec u=\dfrac{\dotp{\vec u}{\vec v}}{\norm{\vec v}^2}\vec v$, and $\vec u-\text{proj}_{\vec v}\,\vec u\perp\vec v$.
      - |
        Cauchy–Schwarz: $|\dotp{\vec u}{\vec v}|\le\norm{\vec u}\norm{\vec v}$.
      - |
        Triangle inequality: $\norm{\vec u+\vec v}\le\norm{\vec u}+\norm{\vec v}$.
