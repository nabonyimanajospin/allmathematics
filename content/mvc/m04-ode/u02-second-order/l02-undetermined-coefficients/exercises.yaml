      answerType: ode_solution
      answer: "y = C1 + C2*e^(2*x) - x^3/6 - x^2/4 + x/4"
      ode:
        order: 2
        equation: "y2 - 2*y1 - x^2 + 1"
      hints:
        - "The polynomial $Ax^2+Bx+D$ is not enough, because the constant is a solution of the homogeneous equation. Try $x(Ax^2+Bx+D)$."
      solution: |-
        $r^2-2r=0$ gives $r=0,2$, so $y_h=C_1+C_2e^{2x}$. A constant is a homogeneous solution, so a polynomial guess needs an extra factor $x$: $y_p=Ax^3+Bx^2+Dx$. Then $y_p''-2y_p'=-6Ax^2+(6A-4B)x+(2B-2D)=x^2-1$ gives $A=-\dfrac16$, $B=-\dfrac14$, $D=\dfrac14$.
