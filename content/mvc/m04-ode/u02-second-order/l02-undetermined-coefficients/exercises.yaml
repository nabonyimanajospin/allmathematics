    - id: uc-a
      statement: "$y''-7y'+12y=-e^{4x}$"
      answerType: ode_solution
      answer: "y = C1*e^(3*x) + C2*e^(4*x) - x*e^(4*x)"
      ode:
        order: 2
        equation: "y2 - 7*y1 + 12*y + e^(4*x)"
      hints:
        - |-
          Resonance: $4$ is a root, so multiply the guess by $x$.
      solution: |-
        $r^2-7r+12=0$ gives $r=3,4$. The right side contains $e^{4x}$ with $4$ a root, so try $y_p=Axe^{4x}$: $y_p''-7y_p'+12y_p=A(2\cdot4-7)e^{4x}=Ae^{4x}$. So $A=-1$ and $y=C_1e^{3x}+C_2e^{4x}-xe^{4x}$.
