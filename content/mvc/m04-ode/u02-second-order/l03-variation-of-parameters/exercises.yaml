- id: variation
  task: Solve with variation of parameters.
  format: "Type $y$ as a function of $x$ with `C1` and `C2`."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: var-a
      statement: |-
        $y''+y=\tan x$
      answerType: ode_solution
      answer: "y = C1*cos(x) + C2*sin(x) - cos(x)*ln(sec(x) + tan(x))"
      ode:
        order: 2
        equation: "y2 + y - tan(x)"
        sample:
          [0.2, 1.3]
      hints:
        - |-
          $W=1$. Use $\int\sec x\,dx=\ln(\sec x+\tan x)$.
      solution: |-
        $y_1=\cos x$, $y_2=\sin x$, $W=1$. $u_1'=-\sin x\tan x=\cos x-\sec x$ and $u_2'=\sin x$, so $u_1=\sin x-\ln(\sec x+\tan x)$ and $u_2=-\cos x$. Then $y_p=u_1\cos x+u_2\sin x=-\cos x\,\ln(\sec x+\tan x)$.
    - id: var-b
      statement: |-
        $y''+y=\cot x$
      answerType: ode_solution
      answer: "y = C1*cos(x) + C2*sin(x) + sin(x)*ln(tan(x/2))"
      ode:
        order: 2
        equation: "y2 + y - cot(x)"
        sample:
          [0.4, 2.6]
      hints:
        - |-
          $\int\csc x\,dx=\ln\tan\dfrac x2$.
      solution: |-
        $W=1$. $u_1'=-\sin x\cot x=-\cos x$, so $u_1=-\sin x$. $u_2'=\cos x\cot x=\dfrac{\cos^2x}{\sin x}=\csc x-\sin x$, so $u_2=\ln\tan\dfrac x2+\cos x$. Then $y_p=-\sin x\cos x+\sin x\ln\tan\dfrac x2+\sin x\cos x=\sin x\,\ln\tan\dfrac x2$, for $0<x<\pi$.
      note: |-
        The sheet writes $\operatorname{cotg}x$ for $\cot x$.
    - id: var-c
      statement: |-
        $y''+2y'+y=\dfrac{e^{-x}}x$
      answerType: ode_solution
      answer: "y = (C1 + C2*x)*e^(-x) + x*e^(-x)*ln(x)"
      ode:
        order: 2
        equation: "y2 + 2*y1 + y - e^(-x)/x"
      hints:
        - |-
          Compute $W$ first: $W=e^{-2x}$.
      solution: |-
        $y_1=e^{-x}$, $y_2=xe^{-x}$, $W=e^{-2x}$. $u_1'=-\dfrac{xe^{-x}\cdot \dfrac{e^{-x}}{x}}{e^{-2x}}=-1$ and $u_2'=\dfrac{e^{-x}\cdot \dfrac{e^{-x}}{x}}{e^{-2x}}=\dfrac1x$, so $u_1=-x$ and $u_2=\ln x$. Then $y_p=-xe^{-x}+xe^{-x}\ln x$; the term $-xe^{-x}$ belongs to $y_h$, so it is absorbed in $C_2$.
    - id: var-d
      statement: |-
        $y''=-y+\sec x$
      answerType: ode_solution
      answer: "y = C1*cos(x) + C2*sin(x) + cos(x)*ln(cos(x)) + x*sin(x)"
      ode:
        order: 2
        equation: "y2 + y - sec(x)"
        sample:
          [0.2, 1.3]
      hints:
        - |-
          $u_1'=-\tan x$, $u_2'=1$.
      solution: |-
        $W=1$. $u_1'=-\sin x\sec x=-\tan x$ and $u_2'=\cos x\sec x=1$, so $u_1=\ln\cos x$ and $u_2=x$. So $y_p=\cos x\ln\cos x+x\sin x$.
      note: |-
        The sheet prints $y''=y+\sec x$, that is $y''-y=\sec x$, whose solution needs $\int e^{\pm x}\sec x\,dx$, which is not elementary. The equation is read here as $y''=-y+\sec x$, i.e. $y''+y=\sec x$, as in the other exercises of this group.
    - id: var-e
      statement: |-
        $y''+y=\csc x$
      answerType: ode_solution
      answer: "y = C1*cos(x) + C2*sin(x) - x*cos(x) + sin(x)*ln(sin(x))"
      ode:
        order: 2
        equation: "y2 + y - 1/sin(x)"
        sample:
          [0.4, 2.6]
      hints:
        - |-
          $u_1'=-1$ and $u_2'=\cot x$.
      solution: |-
        $W=1$. $u_1'=-\sin x\csc x=-1$ and $u_2'=\cos x\csc x=\cot x$, so $u_1=-x$ and $u_2=\ln\sin x$. So $y_p=-x\cos x+\sin x\ln\sin x$, for $0<x<\pi$.
      note: |-
        The sheet writes $\operatorname{cosec}x$ for $\csc x$.
    - id: var-f
      statement: "$y''-2y=4x^{2}e^{2x}$"
      answerType: ode_solution
      answer: "y = C1*e^(sqrt(2)*x) + C2*e^(-sqrt(2)*x) + e^(2*x)*(2*x^2 - 8*x + 14)"
      ode:
        order: 2
        equation: "y2 - 2*y - 4*x^2*e^(2*x)"
      hints:
        - |-
          Try $y_p=e^{2x}(Ax^2+Bx+D)$: the right side has this form.
      solution: |-
        $r^2-2=0$ gives $r=\pm\sqrt2$, so $y_h=C_1e^{\sqrt2x}+C_2e^{-\sqrt2x}$. Variation of parameters leads to the integrals $\int x^2e^{(2\mp\sqrt2)x}\,dx$, which are long. Because the right side is $e^{2x}$ times a polynomial and $2$ is not a root, a shortcut gives the same $y_p$: $y_p=e^{2x}q(x)$ with $q=Ax^2+Bx+D$. Then $y_p''-2y_p=e^{2x}\left(q''+4q'+2q\right)=4x^2e^{2x}$, so $2A=4$, $8A+2B=0$, $2A+4B+2D=0$: $A=2$, $B=-8$, $D=14$.
      note: "Both methods give the same particular solution; here undetermined coefficients is shorter."
