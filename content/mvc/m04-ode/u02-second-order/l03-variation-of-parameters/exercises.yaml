      solution: |-
        Homogeneous solutions $y_1=e^{x}$, $y_2=x e^{x}$ with Wronskian $W=e^{2 x}$. Then $u_1'=-\dfrac{y_2g}{W}=-1$ and $u_2'=\dfrac{y_1g}{W}=\frac{1}{x}$, so $u_1=- x$, $u_2=\ln{\left(x \right)}$ (constants of integration go into $C_1,C_2$), $y_p=u_1y_1+u_2y_2=x \left(\ln{\left(x \right)} - 1\right) e^{x}$ and $y=C_1y_1+C_2y_2+y_p=\left(C_{1} + x \left(C_{2} + \ln{\left(x \right)}\right)\right) e^{x}$.
