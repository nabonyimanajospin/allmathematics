  items:
    - id: mp-vp-1
      statement: |-
        $y'' + y=\frac{1}{\cos{\left(x \right)}}$
      answerType: ode_solution
      answer: "y = (C1 + x)*sin(x) + (C2 + ln(cos(x)))*cos(x)"
      ode:
        order: 2
        equation: "y + y2 - 1/cos(x)"
        sample:
          [0.2, 1.2]
      hints:
        - |-
          Compute the Wronskian $W=y_1y_2'-y_2y_1'$ and $u_1'=-\dfrac{y_2g}{W}$, $u_2'=\dfrac{y_1g}{W}$.
      solution: |-
        Homogeneous solutions $y_1=\cos{\left(x \right)}$, $y_2=\sin{\left(x \right)}$ with Wronskian $W=1$. Then $u_1'=-\dfrac{y_2g}{W}=- \tan{\left(x \right)}$ and $u_2'=\dfrac{y_1g}{W}=1$, so $u_1=\ln{\left(\cos{\left(x \right)} \right)}$, $u_2=x$ (constants of integration go into $C_1,C_2$), $y_p=u_1y_1+u_2y_2=x \sin{\left(x \right)} + \ln{\left(\cos{\left(x \right)} \right)} \cos{\left(x \right)}$ and $y=C_1y_1+C_2y_2+y_p=\left(C_{1} + x\right) \sin{\left(x \right)} + \left(C_{2} + \ln{\left(\cos{\left(x \right)} \right)}\right) \cos{\left(x \right)}$.
    - id: mp-vp-2
      statement: |-
        $y'' - 2 y' + y=\frac{e^{x}}{x}$
      answerType: ode_solution
      answer: "y = (C1 + x*(C2 + ln(x)))*exp(x)"
