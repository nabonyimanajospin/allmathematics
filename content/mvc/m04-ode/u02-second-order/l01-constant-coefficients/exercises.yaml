            derivative: 1
      hints:
        - "Solve the characteristic equation $r^2+ar+b=0$."
      solution: |-
        The characteristic equation $r^2+(1)r+(-6)=0$ has the roots $2, -3$. The general solution fitted to the conditions is $y=\left(e^{5 x} - 1\right) e^{- 3 x}$.
    - id: mp-cc-8
