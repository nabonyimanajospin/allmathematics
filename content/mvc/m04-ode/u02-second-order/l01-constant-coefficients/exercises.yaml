- id: general
  task: Find the general solution.
  format: "Type $y$ as a function of $x$ with arbitrary constants `C1` and `C2`."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: cc-a
      statement: "$y''-5y'+6y=0$"
      answerType: ode_solution
      answer: "y = C1*e^(2*x) + C2*e^(3*x)"
      ode:
        order: 2
        equation: "y2 - 5*y1 + 6*y"
      hints:
        - "Factor $r^2-5r+6$."
      solution: "$r^2-5r+6=(r-2)(r-3)=0$ gives $r=2,3$. So $y=C_1e^{2x}+C_2e^{3x}$."
    - id: cc-b
      statement: "$y''-9y=0$"
      answerType: ode_solution
      answer: "y = C1*e^(3*x) + C2*e^(-3*x)"
      ode:
        order: 2
        equation: "y2 - 9*y"
      hints:
        - "$r^2=9$."
      solution: |-
        $r^2-9=0$ gives $r=\pm3$. So $y=C_1e^{3x}+C_2e^{-3x}$.
    - id: cc-c
      statement: "$y''-y'=0$"
      answerType: ode_solution
      answer: "y = C1 + C2*e^x"
      ode:
        order: 2
        equation: y2 - y1
      hints:
        - "One root is $0$; recall $e^{0x}=1$."
      solution: "$r^2-r=r(r-1)=0$ gives $r=0,1$. So $y=C_1+C_2e^{x}$."
    - id: cc-d
      statement: "$y''-2y'+2y=0$"
      answerType: ode_solution
      answer: "y = e^x*(C1*cos(x) + C2*sin(x))"
      ode:
        order: 2
        equation: "y2 - 2*y1 + 2*y"
      hints:
        - The discriminant is negative.
      solution: |-
        $r^2-2r+2=0$ gives $r=1\pm i$, so $\alpha=1$, $\beta=1$ and $y=e^{x}(C_1\cos x+C_2\sin x)$.
- id: conditions
  task: Solve with the given conditions.
  format: "Type $y$ as a function of $x$."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: cc-i
      statement: |-
        $y''-5y'+4y=0$, $\ y(0)=5$, $y'(0)=8$
      answerType: ode_solution
      answer: "y = 4*e^x + e^(4*x)"
      ode:
        order: 2
        equation: "y2 - 5*y1 + 4*y"
        conditions:
          - at: "0"
            value: "5"
            derivative: 0
          - at: "0"
            value: "8"
            derivative: 1
      hints:
        - |-
          Two equations for $C_1$ and $C_2$: $C_1+C_2=5$ and $C_1+4C_2=8$.
      solution: |-
        $r^2-5r+4=(r-1)(r-4)=0$: $y=C_1e^x+C_2e^{4x}$. $y(0)=C_1+C_2=5$ and $y'(0)=C_1+4C_2=8$ give $C_2=1$ and $C_1=4$. So $y=4e^x+e^{4x}$.
    - id: cc-j
      statement: |-
        $y''+3y'+2y=0$, $\ y(0)=1$, $y'(0)=-1$
      answerType: ode_solution
      answer: "y = e^(-x)"
      ode:
        order: 2
        equation: "y2 + 3*y1 + 2*y"
        conditions:
          - at: "0"
            value: "1"
            derivative: 0
          - at: "0"
            value: "-1"
            derivative: 1
      hints:
        - Subtract the two equations for the constants.
      solution: |-
        $r^2+3r+2=(r+1)(r+2)=0$: $y=C_1e^{-x}+C_2e^{-2x}$. $y(0)=C_1+C_2=1$ and $y'(0)=-C_1-2C_2=-1$ give $C_2=0$ and $C_1=1$. So $y=e^{-x}$.
    - id: cc-k
      statement: |-
        $y''+3y=0$, $\ y(0)=0$, $y(3)=0$
      answerType: ode_solution
      answer: "y = 0"
      ode:
        order: 2
        equation: "y2 + 3*y"
        conditions:
          - at: "0"
            value: "0"
            derivative: 0
          - at: "3"
            value: "0"
            derivative: 0
      hints:
        - |-
          Apply $y(0)=0$ first. For the second condition, ask whether $\sin3\sqrt3$ is zero.
      solution: |-
        $r^2+3=0$ gives $r=\pm i\sqrt3$: $y=C_1\cos\sqrt3x+C_2\sin\sqrt3x$. $y(0)=0$ gives $C_1=0$. Then $y(3)=C_2\sin3\sqrt3=0$. $\sin3\sqrt3=0$ would need $3\sqrt3=k\pi$ for an integer $k\ne0$, that is $\pi=\dfrac{3\sqrt3}k$, an algebraic number; but $\pi$ is transcendental. So $\sin3\sqrt3\ne0$ and $C_2=0$. The only solution of this boundary-value problem is $y=0$.
      note: |-
        On the printed sheet this exercise is also labelled c. It is a boundary-value problem: the conditions are at two points, and the only solution is the trivial one.
- id: more-constant
  task: |-
    More practice: constant coefficients.
  format: "Type the general solution with constants `C1` and `C2`, for example `y = C1*e^x + C2*e^(-x)`."
  items:
    - id: mp-cc-1
      statement: "$y'' - 3 y' + 2 y=0$"
      answerType: ode_solution
      answer: "y = (C1 + C2*exp(x))*exp(x)"
      ode:
        order: 2
        equation: "2*y - 3*y1 + y2"
      hints:
        - "Solve the characteristic equation $r^2+ar+b=0$."
      solution: |-
        The characteristic equation $r^2+(-3)r+(2)=0$ has the roots $2, 1$, so $y=\left(C_{1} + C_{2} e^{x}\right) e^{x}$.
    - id: mp-cc-2
      statement: "$y'' + 4 y' + 4 y=0$"
      answerType: ode_solution
      answer: "y = (C1 + C2*x)*exp(-2*x)"
      ode:
        order: 2
        equation: "4*y + 4*y1 + y2"
      hints:
        - "Solve the characteristic equation $r^2+ar+b=0$."
      solution: |-
        The characteristic equation $r^2+(4)r+(4)=0$ has the roots $-2$, so $y=\left(C_{1} + C_{2} x\right) e^{- 2 x}$.
    - id: mp-cc-3
      statement: "$y'' + 4 y=0$"
      answerType: ode_solution
      answer: "y = C1*sin(2*x) + C2*cos(2*x)"
      ode:
        order: 2
        equation: "4*y + y2"
      hints:
        - "Solve the characteristic equation $r^2+ar+b=0$."
      solution: |-
        The characteristic equation $r^2+(0)r+(4)=0$ has the roots $- 2 i, 2 i$, so $y=C_{1} \sin{\left(2 x \right)} + C_{2} \cos{\left(2 x \right)}$.
    - id: mp-cc-4
      statement: "$y'' + 2 y' + 5 y=0$"
      answerType: ode_solution
      answer: "y = (C1*sin(2*x) + C2*cos(2*x))*exp(-x)"
      ode:
        order: 2
        equation: "5*y + 2*y1 + y2"
      hints:
        - "Solve the characteristic equation $r^2+ar+b=0$."
      solution: |-
        The characteristic equation $r^2+(2)r+(5)=0$ has the roots $-1 - 2 i, -1 + 2 i$, so $y=\left(C_{1} \sin{\left(2 x \right)} + C_{2} \cos{\left(2 x \right)}\right) e^{- x}$.
    - id: mp-cc-5
      statement: |-
        $y'' - 4 y=0$, $\ y(0)=1$, $y'(0)=2$
      answerType: ode_solution
      answer: "y = exp(2*x)"
      ode:
        order: 2
        equation: "-4*y + y2"
        conditions:
          - at: "0"
            value: "1"
            derivative: 0
          - at: "0"
            value: "2"
            derivative: 1
      hints:
        - "Solve the characteristic equation $r^2+ar+b=0$."
      solution: "The characteristic equation $r^2+(0)r+(-4)=0$ has the roots $-2, 2$. The general solution fitted to the conditions is $y=e^{2 x}$."
    - id: mp-cc-6
      statement: |-
        $y'' + 6 y' + 9 y=0$, $\ y(0)=1$, $y'(0)=0$
      answerType: ode_solution
      answer: "y = (3*x + 1)*exp(-3*x)"
      ode:
        order: 2
        equation: "9*y + 6*y1 + y2"
        conditions:
          - at: "0"
            value: "1"
            derivative: 0
          - at: "0"
            value: "0"
            derivative: 1
      hints:
        - "Solve the characteristic equation $r^2+ar+b=0$."
      solution: |-
        The characteristic equation $r^2+(6)r+(9)=0$ has the roots $-3$. The general solution fitted to the conditions is $y=\left(3 x + 1\right) e^{- 3 x}$.
    - id: mp-cc-7
      statement: |-
        $y'' + y' - 6 y=0$, $\ y(0)=0$, $y'(0)=5$
      answerType: ode_solution
      answer: "y = (exp(5*x) - 1)*exp(-3*x)"
      ode:
        order: 2
        equation: "-6*y + y1 + y2"
        conditions:
