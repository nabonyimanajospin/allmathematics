- id: prove
  task: "Show that the function is a solution. Enter the derivatives you need; the substitution is in the worked solution."
  format: "For several derivatives type a vector, for example `(2*x, 2)`."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: sol-1
      statement: "Prove that $y=c_1e^{x}+c_2e^{2x}$ is a solution of $y''-3y'+2y=0$."
      answerType: vector
      answer: "((c1 + 2*c2*exp(x))*exp(x), (c1 + 4*c2*exp(x))*exp(x))"
      variables:
        [x, c1, c2]
      hints:
        - "Differentiate twice, then collect the terms in $e^{x}$ and in $e^{2x}$ separately."
      solution: |-
        Differentiate: $y'=\left(c_{1} + 2 c_{2} e^{x}\right) e^{x},\quad y''=\left(c_{1} + 4 c_{2} e^{x}\right) e^{x}$. Substituting into the left-hand side of $y''-3y'+2y=0$ gives $$\left(\left(c_{1} + 4 c_{2} e^{x}\right) e^{x}\right)-3\left(\left(c_{1} + 2 c_{2} e^{x}\right) e^{x}\right)+2\left(c_{1} e^{x} + c_{2} e^{2 x}\right)=0$$ for every value of the constants, so $y$ is a solution. Enter the derivatives used in the substitution as a vector $(y',\,y'')$.
    - id: sol-2
      statement: "Prove that $y=ce^{-3x}$ is a solution of $y'+3y=0$."
      answerType: expression
      answer: "-3*c*exp(-3*x)"
      variables:
        [x, c]
      hints:
        - "The derivative of $e^{-3x}$ is $-3e^{-3x}$."
      solution: |-
        Differentiate: $y'=- 3 c e^{- 3 x}$. Substituting into the left-hand side of $y'+3y=0$ gives $$\left(- 3 c e^{- 3 x}\right)+3\left(c e^{- 3 x}\right)=0$$ for every value of the constants, so $y$ is a solution. Enter the derivatives used in the substitution.
    - id: sol-3
      statement: |-
        Prove that $y=e^{x}(c_1\cos x+c_2\sin x)$ is a solution of $y''-2y'+2y=0$.
      answerType: vector
      answer: "(sqrt(2)*(c1*cos(x + pi/4) + c2*sin(x + pi/4))*exp(x), 2*(-c1*sin(x) + c2*cos(x))*exp(x))"
      variables:
        [x, c1, c2]
      hints:
        - |-
          Use the product rule. The terms with $\cos x$ and with $\sin x$ cancel separately.
      solution: |-
        Differentiate: $y'=\sqrt{2} \left(c_{1} \cos{\left(x + \frac{\pi}{4} \right)} + c_{2} \sin{\left(x + \frac{\pi}{4} \right)}\right) e^{x},\quad y''=2 \left(- c_{1} \sin{\left(x \right)} + c_{2} \cos{\left(x \right)}\right) e^{x}$. Substituting into the left-hand side of $y''-2y'+2y=0$ gives $$\left(2 \left(- c_{1} \sin{\left(x \right)} + c_{2} \cos{\left(x \right)}\right) e^{x}\right)-2\left(\sqrt{2} \left(c_{1} \cos{\left(x + \dfrac{\pi}{4} \right)} + c_{2} \sin{\left(x + \dfrac{\pi}{4} \right)}\right) e^{x}\right)+2\left(\left(c_{1} \cos{\left(x \right)} + c_{2} \sin{\left(x \right)}\right) e^{x}\right)=0$$ for every value of the constants, so $y$ is a solution. Enter the derivatives used in the substitution as a vector $(y',\,y'')$.
    - id: sol-4
      statement: "Prove that $y=(c_1+c_2x)e^{-2x}$ is a solution of $y''+4y'+4y=0$."
      answerType: vector
      answer: "((-2*c1 - 2*c2*x + c2)*exp(-2*x), 4*(c1 + c2*x - c2)*exp(-2*x))"
      variables:
        [x, c1, c2]
      hints:
        - "Write $y=c_1e^{-2x}+c_2xe^{-2x}$ and differentiate each term."
      solution: |-
        Differentiate: $y'=\left(- 2 c_{1} - 2 c_{2} x + c_{2}\right) e^{- 2 x},\quad y''=4 \left(c_{1} + c_{2} x - c_{2}\right) e^{- 2 x}$. Substituting into the left-hand side of $y''+4y'+4y=0$ gives $$\left(4 \left(c_{1} + c_{2} x - c_{2}\right) e^{- 2 x}\right)+4\left(\left(- 2 c_{1} - 2 c_{2} x + c_{2}\right) e^{- 2 x}\right)+4\left(\left(c_{1} + c_{2} x\right) e^{- 2 x}\right)=0$$ for every value of the constants, so $y$ is a solution. Enter the derivatives used in the substitution as a vector $(y',\,y'')$.
    - id: sol-5
      statement: "Prove that $y^2-x^2-xy=c$ defines solutions of $(x-2y)y'+2x+y=0$."
      answerType: expression
      answer: "(-2*x - y)/(x - 2*y)"
      variables:
        [x, y]
      hints:
        - "Differentiate both sides with respect to $x$, treating $y$ as a function of $x$, then solve for $y'$."
      solution: |-
        Differentiate $y^2-x^2-xy=c$ with respect to $x$: $2yy'-2x-y-xy'=0$, so $(2y-x)\,y'=2x+y$ and $y'=\dfrac{2x+y}{2y-x}$. Substituting into the equation: $(x-2y)\dfrac{2x+y}{2y-x}+2x+y=-(2x+y)+2x+y=0$.
      note: "Printed as exercise 7 on the sheet. The printed sheet has no exercises 5 and 6 in this part, so the three that follow are numbered 6 and 7 here (printed 8 and 9)."
    - id: sol-6
      statement: |-
        Prove that $y=c_1x+\dfrac{c_2}{x}+c_3$ is a solution of $y'''+\dfrac3x\,y''=0$.
      answerType: vector
      answer: "(c1 - c2/x^2, 2*c2/x^3, -6*c2/x^4)"
      variables:
        [x, c1, c2, c3]
      hints:
        - |-
          Write $\dfrac{c_2}{x}=c_2x^{-1}$ and differentiate three times.
      solution: |-
        $y'=c_{1} - \frac{c_{2}}{x^{2}}$, $y''=\frac{2 c_{2}}{x^{3}}$, $y'''=- \frac{6 c_{2}}{x^{4}}$. Then $y'''+\dfrac3x\,y''=-\dfrac{6c_2}{x^4}+\dfrac3x\cdot\dfrac{2c_2}{x^3}=0$. Enter the three derivatives as a vector.
    - id: sol-7
      statement: |-
        Prove that $y=c_1e^{\arcsin x}+c_2e^{-\arcsin x}$ is a solution of $(1-x^2)y''-xy'-y=0$.
      answerType: vector
      answer: "((c1*exp(2*asin(x)) - c2)*exp(-asin(x))/sqrt(1 - x^2), (-c1*x*(1 - x^2)^(7/2)*exp(2*asin(x)) - c1*(x^2 - 1)^4*exp(2*asin(x)) + c2*x*(1 - x^2)^(7/2) - c2*(x^2 - 1)^4)*exp(-asin(x))/(x^2 - 1)^5)"
      variables:
        [x, c1, c2]
      hints:
        - |-
          $\dfrac{d}{dx}\arcsin x=\dfrac1{\sqrt{1-x^2}}$, so each exponential gains the factor $\pm\dfrac1{\sqrt{1-x^2}}$ when differentiated.
      solution: |-
        With $u=\arcsin x$, $u'=\dfrac1{\sqrt{1-x^2}}$, so $y'=\dfrac{c_1e^{u}-c_2e^{-u}}{\sqrt{1-x^2}}$. Differentiating again, $y''=\dfrac{c_1e^{u}+c_2e^{-u}}{1-x^2}+\dfrac{x\,(c_1e^{u}-c_2e^{-u})}{(1-x^2)^{3/2}}$. Then $(1-x^2)y''=y+xy'$, which is the equation. Enter $(y',y'')$.
      note: "The printed sheet writes $y''$ without simplification; any equivalent form of the derivatives is accepted."
- id: form
  task: Eliminate the arbitrary constants to find the differential equation of lowest order.
  format: "Type the equation, for example `y' = 3*y` or `y'' - y = 0`."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: form-1
      statement: "Form the differential equation whose general solution is $y=cx^{2}-x$."
      answerType: ode_family
      answer: "x*y' = 2*y + x"
      ode:
        order: 1
        family: "y = c*x^2 - x"
        constants:
          [c]
      hints:
        - "Differentiate once, solve for $c$ and substitute back into $y$."
      solution: |-
        $y'=2cx-1$, so $c=\dfrac{y'+1}{2x}$. Then $y=cx^2-x=\dfrac{x(y'+1)}{2}-x$, which gives $xy'=2y+x$.
    - id: form-2
      statement: "Form the differential equation whose general solution is $y=c_1x^{3}+c_2x+c_3$."
      answerType: ode_family
      answer: "x*y''' = y''"
      ode:
        order: 3
        family: "y = c1*x^3 + c2*x + c3"
        constants:
          [c1, c2, c3]
      hints:
        - "Three constants need three derivatives. The derivatives $y''$ and $y'''$ contain $c_1$ only."
      solution: "$y''=6c_1x$ and $y'''=6c_1$, so $xy'''=y''$."
    - id: form-3
      statement: "Form the differential equation whose general solution is $y=c_1e^{x}+c_2xe^{x}$."
      answerType: ode_family
      answer: "y'' - 2*y' + y = 0"
      ode:
        order: 2
        family: "y = c1*e^x + c2*x*e^x"
        constants:
          [c1, c2]
      hints:
        - "The root $1$ of the characteristic equation is double."
      solution: "The characteristic equation has the double root $r=1$, that is $(r-1)^2=r^2-2r+1=0$. The equation is $y''-2y'+y=0$."
    - id: form-4
      statement: "Form the differential equation whose general solution is $y=c_1x^{3}+c_2x$."
      answerType: ode_family
      answer: "x^2*y'' - 3*x*y' + 3*y = 0"
      ode:
        order: 2
        family: "y = c1*x^3 + c2*x"
        constants:
          [c1, c2]
      hints:
        - "Differentiate twice, then eliminate $c_1$ and $c_2$ from the three equations for $y$, $y'$, $y''$."
      solution: |-
        $y'=3c_1x^2+c_2$ and $y''=6c_1x$. So $c_1=\dfrac{y''}{6x}$ and $c_2=y'-\dfrac{xy''}{2}$. Substituting in $y=c_1x^3+c_2x$ gives $y=\dfrac{x^2y''}{6}+xy'-\dfrac{x^2y''}{2}=xy'-\dfrac{x^2y''}{3}$, that is $x^2y''-3xy'+3y=0$.
    - id: form-5
      statement: "Form the differential equation whose general solution is $x^{2}+y^{2}=c^{2}$."
      answerType: ode_family
      answer: "x + y*y' = 0"
      ode:
        order: 1
        family: "x^2 + y^2 = c^2"
        constants:
          [c]
      hints:
        - "Differentiate both sides with respect to $x$; the constant disappears."
      solution: "$2x+2yy'=0$, so $x+yy'=0$."
    - id: form-6
      statement: "Form the differential equation whose general solution is $y=c_1e^{x}+c_2xe^{x}+c_3e^{-x}$."
      answerType: ode_family
      answer: "y''' - y'' - y' + y = 0"
      ode:
        order: 3
        family: "y = c1*e^x + c2*x*e^x + c3*e^(-x)"
        constants:
          [c1, c2, c3]
      hints:
        - |-
          Read the roots of the characteristic equation from the exponents: $1$ (double) and $-1$.
      solution: "The characteristic roots are $1,1,-1$, so $(r-1)^2(r+1)=r^3-r^2-r+1=0$ and the equation is $y'''-y''-y'+y=0$."
      note: "Printed as exercise 7 on the sheet (the sheet has no exercise 6 in this part)."
    - id: form-7
      statement: "Form the differential equation whose general solution is $y=c_1e^{x}+c_2xe^{-x}+c_3e^{-x}$."
      answerType: ode_family
      answer: "y''' + y'' - y' - y = 0"
      ode:
        order: 3
        family: "y = c1*e^x + c2*x*e^(-x) + c3*e^(-x)"
        constants:
          [c1, c2, c3]
      hints:
        - |-
          Read the roots from the exponents: $1$ and $-1$ (double).
      solution: "The roots are $1,-1,-1$, so $(r-1)(r+1)^2=r^3+r^2-r-1=0$ and the equation is $y'''+y''-y'-y=0$."
      note: Printed as exercise 8 on the sheet.
