- id: separable
  task: Solve the differential equation. Give the general solution.
  format: "Type the solution, for example `y = C*x^2` or an implicit relation such as `y^2 = x^3 + C`."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: sep-a
      statement: |-
        $\tan x\,\sin^2y\,dx+\cos x\,\cot y\,dy=0$
      answerType: ode_solution
      answer: "1/cos(x) = 1/(2*sin(y)^2) + C"
      ode:
        order: 1
        equation: "tan(x)*sin(y)^2 + cos(x)*cot(y)*y1"
        sample:
          [0.3, 1.2]
      hints:
        - |-
          Divide by $\cos x\,\sin^2y$ so that each side has one variable. Note that $\dfrac{\tan x}{\cos x}=\dfrac{\sin x}{\cos^2x}$.
      solution: |-
        Divide by $\cos x\,\sin^2y$: $\dfrac{\sin x}{\cos^2x}\,dx+\dfrac{\cos y}{\sin^3y}\,dy=0$. Integrate: $\dfrac1{\cos x}-\dfrac1{2\sin^2y}=C$.
    - id: sep-b
      statement: "$xy'-y=y^3$"
      answerType: ode_solution
      answer: "y^2/(1+y^2) = C*x^2"
      ode:
        order: 1
        equation: "x*y1 - y - y^3"
      hints:
        - |-
          Use the partial fractions $\dfrac1{y(1+y^2)}=\dfrac1y-\dfrac y{1+y^2}$.
      solution: |-
        $xy'=y(1+y^2)$, so $\dfrac{dy}{y(1+y^2)}=\dfrac{dx}x$. With $\dfrac1{y(1+y^2)}=\dfrac1y-\dfrac y{1+y^2}$: $\ln|y|-\tfrac12\ln(1+y^2)=\ln|x|+c$, that is $\dfrac{y^2}{1+y^2}=Cx^2$. The constant solution $y=0$ is the case $C=0$.
    - id: sep-c
      statement: "$xyy'=1-x^3$"
      answerType: ode_solution
      answer: "y^2/2 = ln(abs(x)) - x^3/3 + C"
      ode:
        order: 1
        equation: "x*y*y1 - (1 - x^3)"
      hints:
        - |-
          Write $y\,dy=\dfrac{1-x^3}{x}\,dx$.
      solution: |-
        $y\,dy=\left(\dfrac1x-x^2\right)dx$, so $\dfrac{y^2}2=\ln|x|-\dfrac{x^3}3+C$.
    - id: sep-d
      statement: "$y-xy'=1+x^2y'$"
      answerType: ode_solution
      answer: "y = 1 + C*x/(x+1)"
      ode:
        order: 1
        equation: "y - x*y1 - 1 - x^2*y1"
      hints:
        - |-
          Collect all the terms with $y'$ on one side: $y-1=(x+x^2)\,y'$.
      solution: |-
        Collect $y'$: $y-1=(x^2+x)\,y'$, so $\dfrac{dy}{y-1}=\dfrac{dx}{x(x+1)}=\left(\dfrac1x-\dfrac1{x+1}\right)dx$. Then $\ln|y-1|=\ln\left|\dfrac x{x+1}\right|+c$, and $y=1+C\dfrac{x}{x+1}$.
    - id: sep-e
      statement: |-
        $y'\tan x=y$
      answerType: ode_solution
      answer: "y = C*sin(x)"
      ode:
        order: 1
        equation: "y1*tan(x) - y"
        sample:
          [0.3, 1.2]
      hints:
        - |-
          Divide by $y\tan x$.
      solution: |-
        $\dfrac{dy}y=\cot x\,dx$, so $\ln|y|=\ln|\sin x|+c$ and $y=C\sin x$.
    - id: sep-f
      statement: |-
        $3e^{x}\tan y\,dx+(1-e^{x})\sec^2y\,dy=0$
      answerType: ode_solution
      answer: "tan(y) = C*(1 - e^x)^3"
      ode:
        order: 1
        equation: "3*e^x*tan(y) + (1 - e^x)*sec(y)^2*y1"
        sample:
          [0.2, 1.2]
      hints:
        - |-
          Divide by $(1-e^x)\tan y$. Note $\dfrac{d}{dy}\tan y=\sec^2y$.
      solution: |-
        Divide by $(1-e^x)\tan y$: $\dfrac{\sec^2y}{\tan y}\,dy=-\dfrac{3e^x}{1-e^x}\,dx$. Integrate: $\ln|\tan y|=3\ln|1-e^x|+c$, so $\tan y=C(1-e^x)^3$.
- id: separable-ivp
  task: Solve the initial-value problem.
  format: "Type $y$ as an explicit function of $x$."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: sep-g
      statement: |-
        $(1+e^{x})\,yy'=e^{x}$, $\ y(0)=1$
      answerType: ode_solution
      answer: "y = sqrt(2*ln(1+e^x) - 2*ln(2) + 1)"
      ode:
        order: 1
        equation: "(1 + e^x)*y*y1 - e^x"
        conditions:
          - at: "0"
            value: "1"
            derivative: 0
      hints:
        - "After integrating, use $y(0)=1$ to find $C$. Then decide the sign of the square root from $y(0)>0$."
      solution: |-
        $y\,dy=\dfrac{e^x}{1+e^x}\,dx$, so $\dfrac{y^2}2=\ln(1+e^x)+C$. From $y(0)=1$: $\dfrac12=\ln2+C$, so $C=\dfrac12-\ln2$ and $y^2=2\ln(1+e^x)-2\ln2+1$. Since $y(0)=1>0$, take the positive root.
    - id: sep-h
      statement: |-
        $(xy^{2}+x)\,dx+(x^{2}y-y)\,dy=0$, $\ y(0)=1$
      answerType: ode_solution
      answer: "y = sqrt((1+x^2)/(1-x^2))"
      ode:
        order: 1
        equation: "(x*y^2 + x) + (x^2*y - y)*y1"
        sample:
          [0.1, 0.8]
        conditions:
          - at: "0"
            value: "1"
            derivative: 0
      hints:
        - "Factor $x$ from the first bracket and $y$ from the second one, then separate."
      solution: |-
        Factor: $x(y^2+1)\,dx+y(x^2-1)\,dy=0$, so $\dfrac{x\,dx}{x^2-1}+\dfrac{y\,dy}{y^2+1}=0$. Integrate: $\tfrac12\ln|x^2-1|+\tfrac12\ln(y^2+1)=c$, so $(1-x^2)(1+y^2)=C$. $y(0)=1$ gives $C=2$, so $y^2=\dfrac2{1-x^2}-1=\dfrac{1+x^2}{1-x^2}$ (positive root, since $y(0)=1$), for $|x|<1$.
- id: more-separable
  task: |-
    More practice: separable equations.
  format: "Type the solution with an arbitrary constant `C`, for example `y = C*e^x` or `x^2 + y^2 = C`."
  items:
    - id: mp-sep-1
      statement: "$y'=y x$"
      answerType: ode_solution
      answer: "y = C*e^(x^2/2)"
      ode:
        order: 1
        equation: "-x*y + y1"
      hints:
        - |-
          Write $y'=\dfrac{dy}{dx}$ and separate: $\dfrac{dy}{y}=x\,dx$.
      solution: |-
        $\dfrac{dy}{y}=x\,dx$ gives $\ln|y|=\dfrac{x^2}2+c$, so $y=Ce^{\frac{x^2}{2}}$.
    - id: mp-sep-2
      statement: "$y'=x y^{2}$"
      answerType: ode_solution
      answer: "y = -2/(x^2 + C)"
      ode:
        order: 1
        equation: "-x*y^2 + y1"
        sample:
          [0.6, 1.9]
      hints:
        - |-
          Separate: $\dfrac{dy}{y^2}=x\,dx$.
      solution: |-
        $\dfrac{dy}{y^2}=x\,dx$ gives $-\dfrac1y=\dfrac{x^2}2+c$, so $y=-\dfrac{2}{x^2+C}$ (with $C=2c$).
    - id: mp-sep-3
      statement: "$y'=e^{x - y}$"
      answerType: ode_solution
      answer: "y = ln(e^x + C)"
      ode:
        order: 1
        equation: "y1 - exp(x - y)"
        sample:
          [0.6, 1.9]
      hints:
        - |-
          $e^{x-y}=e^xe^{-y}$: multiply by $e^y$.
      solution: |-
        $e^{y}\,dy=e^{x}\,dx$ gives $e^y=e^x+C$, so $y=\ln(e^x+C)$.
    - id: mp-sep-4
      statement: |-
        $y' x=y \ln{\left(y \right)}$
      answerType: ode_solution
      answer: "y = e^(C*x)"
      ode:
        order: 1
        equation: "x*y1 - y*ln(y)"
        sample:
          [0.6, 1.9]
      hints:
        - |-
          $\int\dfrac{dy}{y\ln y}=\ln|\ln y|$.
      solution: |-
        $\dfrac{dy}{y\ln y}=\dfrac{dx}{x}$ gives $\ln|\ln y|=\ln|x|+c$, so $\ln y=Cx$ and $y=e^{Cx}$.
    - id: mp-sep-5
      statement: |-
        $y'=2 y x$, $\ y(0)=3$
      answerType: ode_solution
      answer: "y = 3*e^(x^2)"
      ode:
        order: 1
        equation: "-2*x*y + y1"
        conditions:
          - at: "0"
            value: "3"
            derivative: 0
      hints:
        - "First find the general solution, then use $y(0)=3$."
      solution: |-
        $\dfrac{dy}y=2x\,dx$ gives $y=Ce^{x^2}$. $y(0)=3$ gives $C=3$.
    - id: mp-sep-6
      statement: |-
        $y' x=y$, $\ y(1)=2$
      answerType: ode_solution
      answer: "y = 2*x"
      ode:
        order: 1
        equation: "x*y1 - y"
        sample:
          [0.6, 1.9]
        conditions:
          - at: "1"
            value: "2"
            derivative: 0
      hints:
        - "Separate the variables; then $y(1)=2$ fixes the constant."
      solution: |-
        $\dfrac{dy}{y}=\dfrac{dx}{x}$ gives $y=Cx$. $y(1)=2$ gives $C=2$.
    - id: mp-sep-7
      statement: |-
        $y'=- y^{2}$, $\ y(0)=1$
      answerType: ode_solution
      answer: "y = 1/(x + 1)"
      ode:
        order: 1
        equation: "y^2 + y1"
        sample:
          [0.0, 1.9]
        conditions:
          - at: "0"
            value: "1"
            derivative: 0
      hints:
        - |-
          $\int y^{-2}dy=-y^{-1}$.
      solution: |-
        $\dfrac{dy}{y^2}=-dx$ gives $-\dfrac1y=-x+c$, so $y=\dfrac{1}{x+C}$. $y(0)=1$ gives $C=1$.
