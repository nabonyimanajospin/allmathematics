  items:
    - id: exa-a
      statement: |-
        $(x+y)\,dx+(x+2y)\,dy=0$
      answerType: ode_solution
      answer: "x^2/2 + x*y + y^2 = C"
      ode:
        order: 1
        equation: "(x + y) + (x + 2*y)*y1"
      hints:
        - |-
          Check $\dfrac{\partial M}{\partial y}=\dfrac{\partial N}{\partial x}$ first.
      solution: |-
        $M_y=1=N_x$. $F=\int(x+y)\,dx=\dfrac{x^2}2+xy+g(y)$, and $F_y=x+g'(y)=x+2y$ gives $g=y^2$. So $\dfrac{x^2}2+xy+y^2=C$.
    - id: exa-b
      statement: |-
        $(x^{2}+y^{2}+2x)\,dx+2xy\,dy=0$
      answerType: ode_solution
      answer: "x^3/3 + x*y^2 + x^2 = C"
      ode:
        order: 1
        equation: "(x^2 + y^2 + 2*x) + 2*x*y*y1"
      hints:
        - "Integrate $M$ with respect to $x$ and compare $F_y$ with $N$."
      solution: |-
        $M_y=2y=N_x$. $F=\int M\,dx=\dfrac{x^3}3+xy^2+x^2+g(y)$ and $F_y=2xy+g'=2xy$ gives $g'=0$. So $\dfrac{x^3}3+xy^2+x^2=C$.
    - id: exa-c
      statement: |-
        $(x^{2}+y)\,dx+(x-2y)\,dy=0$
      answerType: ode_solution
      answer: "x^3/3 + x*y - y^2 = C"
      ode:
        order: 1
        equation: "(x^2 + y) + (x - 2*y)*y1"
      hints:
        - "Integrate $M$ with respect to $x$, then find $g(y)$ from $F_y=N$."
      solution: |-
        $M_y=1=N_x$. $F=\dfrac{x^3}3+xy+g(y)$, $F_y=x+g'=x-2y$ gives $g=-y^2$. So $\dfrac{x^3}3+xy-y^2=C$.
    - id: exa-d
      statement: |-
        $(x^{3}-3xy^{2}+2)\,dx-(3x^{2}y-y^{2})\,dy=0$
      answerType: ode_solution
      answer: "x^4/4 - 3*x^2*y^2/2 + 2*x + y^3/3 = C"
      ode:
        order: 1
        equation: "(x^3 - 3*x*y^2 + 2) - (3*x^2*y - y^2)*y1"
      hints:
        - "Here $N=-(3x^2y-y^2)$; keep the minus sign when you compare $F_y$ with $N$."
      solution: |-
        $M_y=-6xy=N_x$. $F=\dfrac{x^4}4-\dfrac{3x^2y^2}2+2x+g(y)$ and $F_y=-3x^2y+g'=-3x^2y+y^2$ gives $g=\dfrac{y^3}3$. So $\dfrac{x^4}4-\dfrac32x^2y^2+2x+\dfrac{y^3}3=C$.
    - id: exa-e
      statement: |-
        $(\sin xy+xy\cos xy)\,dx+x^{2}\cos xy\,dy=0$
      answerType: ode_solution
      answer: "x*sin(x*y) = C"
      ode:
        order: 1
        equation: "(sin(x*y) + x*y*cos(x*y)) + x^2*cos(x*y)*y1"
      hints:
        - |-
          Integrate $N$ with respect to $y$: $\int x^2\cos xy\,dy=x\sin xy$.
      solution: |-
        $M_y=2x\cos xy-x^2y\sin xy=N_x$. It is easier to integrate $N$ with respect to $y$: $F=\int x^2\cos xy\,dy=x\sin xy+h(x)$. Then $F_x=\sin xy+xy\cos xy+h'=M$ gives $h'=0$. So $x\sin xy=C$.
