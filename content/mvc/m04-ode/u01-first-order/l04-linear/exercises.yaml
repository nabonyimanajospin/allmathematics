- id: linear
  task: Solve the linear equation. Give the general solution.
  format: "Type $y$ as a function of $x$ with an arbitrary constant $C$."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: lin-a
      statement: |-
        $y'-\dfrac{2y}{x+1}=(x+1)^3$
      answerType: ode_solution
      answer: "y = (x+1)^4/2 + C*(x+1)^2"
      ode:
        order: 1
        equation: "y1 - 2*y/(x+1) - (x+1)^3"
      hints:
        - |-
          The integrating factor is $\mu=(x+1)^{-2}$.
      solution: |-
        $P=-\dfrac2{x+1}$, so $\mu=e^{-2\ln|x+1|}=\dfrac1{(x+1)^2}$. Then $\left(\dfrac y{(x+1)^2}\right)'=x+1$, so $\dfrac y{(x+1)^2}=\dfrac{(x+1)^2}2+C$ and $y=\dfrac{(x+1)^4}2+C(x+1)^2$.
    - id: lin-b
      statement: |-
        $y'-\dfrac yx=\dfrac{x+1}x$
      answerType: ode_solution
      answer: "y = x*ln(abs(x)) - 1 + C*x"
      ode:
        order: 1
        equation: "y1 - y/x - (x + 1)/x"
      hints:
        - |-
          Multiply by $\mu=\dfrac{1}{x}$.
      solution: |-
        $\mu=e^{-\ln|x|}=\dfrac1x$ and $\left(\dfrac yx\right)'=\dfrac{x+1}{x^2}=\dfrac1x+\dfrac1{x^2}$. Integrate: $\dfrac yx=\ln|x|-\dfrac1x+C$, so $y=x\ln|x|-1+Cx$.
    - id: lin-c
      statement: |-
        $(x-x^{3})\,y'+(2x^{2}-1)\,y=x^{3}$
      answerType: ode_solution
      answer: "y = x + C*x*sqrt(1 - x^2)"
      ode:
        order: 1
        equation: "(x - x^3)*y1 + (2*x^2 - 1)*y - x^3"
        sample:
          [0.2, 0.8]
      hints:
        - |-
          Decompose $\dfrac{2x^2-1}{x(1-x^2)}$ into partial fractions to integrate it.
      solution: |-
        Divide by $x(1-x^2)$: $P=\dfrac{2x^2-1}{x(1-x^2)}=-\dfrac1x+\dfrac1{2(1-x)}-\dfrac1{2(1+x)}$. For $0<x<1$ this gives $\mu=\dfrac1{x\sqrt{1-x^2}}$. Then $(\mu y)'=\dfrac{x^2}{1-x^2}\cdot\dfrac1{x\sqrt{1-x^2}}=\dfrac x{(1-x^2)^{\frac{3}{2}}}$, so $\mu y=\dfrac1{\sqrt{1-x^2}}+C$ and $y=x+Cx\sqrt{1-x^2}$.
    - id: lin-d
      statement: |-
        $y'\cos x+y\sin x=-1$
      answerType: ode_solution
      answer: "y = -sin(x) + C*cos(x)"
      ode:
        order: 1
        equation: "y1*cos(x) + y*sin(x) + 1"
        sample:
          [0.2, 1.2]
      hints:
        - |-
          The integrating factor is $\mu=\sec x$.
      solution: |-
        Divide by $\cos x$: $y'+\tan x\,y=-\sec x$, with $\mu=e^{\int\tan x\,dx}=\sec x$. Then $(y\sec x)'=-\sec^2x$, so $y\sec x=-\tan x+C$ and $y=-\sin x+C\cos x$.
    - id: lin-e
      statement: |-
        $y'-\dfrac nx\,y=e^{x}x^{n}$, where $n$ is a constant
      answerType: ode_solution
      answer: "y = x^n*(e^x + C)"
      ode:
        order: 1
        equation: "y1 - n*y/x - e^x*x^n"
        parameters:
          [n]
      hints:
        - "Here $n$ is given; the integrating factor is $x^{-n}$."
      solution: |-
        $\mu=e^{-n\ln x}=x^{-n}$, so $\left(x^{-n}y\right)'=e^x$ and $x^{-n}y=e^x+C$, that is $y=x^n(e^x+C)$.
    - id: lin-f
      statement: "$y'+y=e^{-x}$"
      answerType: ode_solution
      answer: "y = (x + C)*e^(-x)"
      ode:
        order: 1
        equation: "y1 + y - e^(-x)"
      hints:
        - |-
          Multiply by $e^x$: the right-hand side becomes $1$.
      solution: |-
        $\mu=e^x$ and $(e^xy)'=1$, so $e^xy=x+C$ and $y=(x+C)e^{-x}$.
    - id: lin-g
      statement: |-
        $y'+\dfrac{1-2x}{x^{2}}\,y-1=0$
      answerType: ode_solution
      answer: "y = x^2*(1 + C*e^(1/x))"
      ode:
        order: 1
        equation: "y1 + (1 - 2*x)/x^2*y - 1"
      hints:
        - |-
          Integrate $P$ term by term: $\int\dfrac{dx}{x^2}=-\dfrac1x$.
      solution: |-
        $P=\dfrac1{x^2}-\dfrac2x$, so $\mu=e^{-\frac{1}{x}-2\ln x}=\dfrac{e^{-\frac{1}{x}}}{x^2}$. Then $(\mu y)'=\mu=\dfrac{e^{-\frac{1}{x}}}{x^2}$, and since $\dfrac d{dx}e^{-\frac{1}{x}}=\dfrac{e^{-\frac{1}{x}}}{x^2}$: $\mu y=e^{-\frac{1}{x}}+C$. Hence $y=x^2\left(1+Ce^{\frac{1}{x}}\right)$.
- id: linear-ivp
  task: Solve the initial-value problem.
  format: "Type $y$ as a function of $x$."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: ivp-a
      statement: |-
        $y'-\dfrac y{1-x^{2}}-1-x=0$, $\ y(0)=0$
      answerType: ode_solution
      answer: "y = sqrt((1+x)/(1-x))*(x*sqrt(1-x^2) + asin(x))/2"
      ode:
        order: 1
        equation: "y1 - y/(1 - x^2) - 1 - x"
        sample:
          [0.1, 0.8]
        conditions:
          - at: "0"
            value: "0"
            derivative: 0
      hints:
        - |-
          $\int\dfrac{dx}{1-x^2}=\dfrac12\ln\dfrac{1+x}{1-x}$, and $\int\sqrt{1-x^2}\,dx=\dfrac12\left(x\sqrt{1-x^2}+\arcsin x\right)$.
      solution: |-
        For $|x|<1$, $\mu=e^{-\int\frac{dx}{1-x^2}}=\sqrt{\dfrac{1-x}{1+x}}$. Then $(\mu y)'=\mu(1+x)=\sqrt{1-x^2}$, so $\mu y=\dfrac12\left(x\sqrt{1-x^2}+\arcsin x\right)+C$. $y(0)=0$ gives $C=0$, so $y=\sqrt{\dfrac{1+x}{1-x}}\cdot\dfrac{x\sqrt{1-x^2}+\arcsin x}2$.
    - id: ivp-b
      statement: |-
        $y'-y\tan x=\dfrac1{\cos x}$, $\ y(0)=0$
      answerType: ode_solution
      answer: "y = x/cos(x)"
      ode:
        order: 1
        equation: "y1 - y*tan(x) - 1/cos(x)"
        sample:
          [0.2, 1.2]
        conditions:
          - at: "0"
            value: "0"
            derivative: 0
      hints:
        - |-
          The integrating factor is $\cos x$.
      solution: |-
        $\mu=e^{-\int\tan x\,dx}=\cos x$, so $(y\cos x)'=1$ and $y\cos x=x+C$. $y(0)=0$ gives $C=0$, so $y=\dfrac x{\cos x}$.
      note: |-
        The sheet writes $\operatorname{tg}x$ for $\tan x$.
    - id: ivp-c
      statement: |-
        $xy'+y-e^{x}=0$, $\ y(1)=2$
      answerType: ode_solution
      answer: "y = (e^x + 2 - e)/x"
      ode:
        order: 1
        equation: "x*y1 + y - e^x"
        sample:
          [0.6, 1.9]
        conditions:
          - at: "1"
            value: "2"
            derivative: 0
      hints:
        - "Notice that $xy'+y=(xy)'$."
      solution: |-
        The left side of $xy'+y=e^x$ is $(xy)'$, so $xy=e^x+C$. $y(1)=2$ gives $2=e+C$, so $C=2-e$ and $y=\dfrac{e^x+2-e}x$.
    - id: ivp-d
      statement: |-
        $xy'+y-e^{x}=0$, $\ y(0)=1$
      answerType: ode_solution
      answer: "y = (e^x - 1)/x"
      ode:
        order: 1
        equation: "x*y1 + y - e^x"
        sample:
          [0.3, 1.5]
        conditions:
          - at: "0"
            value: "1"
            derivative: 0
      hints:
        - "Substitute $x=0$ into $xy=e^x+C$ before dividing by $x$."
      solution: |-
        As in (c), $xy=e^x+C$. At $x=0$ the left side is $0$, so $0=1+C$ and $C=-1$; then $y=\dfrac{e^x-1}x$, and $\lim_{x\to0}\dfrac{e^x-1}x=1=y(0)$, as required. For any other $C$ the solution is unbounded at $x=0$.
      note: |-
        The initial point is the point where the standard form $y'+\dfrac yx=\dfrac{e^x}x$ is undefined, so the usual formula does not apply; only $C=-1$ gives a solution that is finite at $0$.
- id: more-linear
  task: |-
    More practice: linear equations of the first order.
  format: "Type the solution with an arbitrary constant `C`, for example `y = C*e^x` or `x^2 + y^2 = C`."
  items:
    - id: mp-lin-1
      statement: "$y' + 2 y=e^{- x}$"
      answerType: ode_solution
      answer: "y = (C + exp(x))*exp(-2*x)"
      ode:
        order: 1
        equation: "2*y + y1 - exp(-x)"
        sample:
          [0.2, 1.9]
      hints:
        - |-
          Find $\mu=e^{\int P\,dx}$ and multiply the equation by it.
      solution: |-
        The integrating factor is $\mu=e^{\int P\,dx}=e^{2 x}$. Then $(\mu y)'=\mu Q=e^{x}$, and integrating gives $y=\left(C + e^{x}\right) e^{- 2 x}$.
    - id: mp-lin-2
      statement: |-
        $y' - \frac{y}{x}=x^{2}$
      answerType: ode_solution
      answer: "y = x*(C + x^2/2)"
      ode:
        order: 1
        equation: "-x^2 + y1 - y/x"
        sample:
          [0.6, 1.9]
      hints:
        - |-
          Find $\mu=e^{\int P\,dx}$ and multiply the equation by it.
      solution: |-
        The integrating factor is $\mu=e^{\int P\,dx}=\frac{1}{x}$. Then $(\mu y)'=\mu Q=x$, and integrating gives $y=x \left(C + \frac{x^{2}}{2}\right)$.
    - id: mp-lin-3
      statement: |-
        $y' + \frac{2 y}{x}=x$
      answerType: ode_solution
      answer: "y = (C + x^4/4)/x^2"
      ode:
        order: 1
        equation: "-x + y1 + 2*y/x"
        sample:
          [0.6, 1.9]
      hints:
        - |-
          Find $\mu=e^{\int P\,dx}$ and multiply the equation by it.
      solution: |-
        The integrating factor is $\mu=e^{\int P\,dx}=x^{2}$. Then $(\mu y)'=\mu Q=x^{3}$, and integrating gives $y=\frac{C + \frac{x^{4}}{4}}{x^{2}}$.
    - id: mp-lin-4
      statement: |-
        $y' + y=x$, $\ y(0)=1$
      answerType: ode_solution
      answer: "y = x - 1 + 2*exp(-x)"
      ode:
        order: 1
        equation: "-x + y + y1"
        sample:
          [0.0, 1.9]
        conditions:
          - at: "0"
            value: "1"
            derivative: 0
      hints:
        - |-
          Find $\mu=e^{\int P\,dx}$ and multiply the equation by it.
      solution: |-
        The integrating factor is $\mu=e^{\int P\,dx}=e^{x}$. Then $(\mu y)'=\mu Q=x e^{x}$, and integrating gives $y=x - 1 + 2 e^{- x}$.
