id: mvc-m04-u01-l03
title: Homogeneous equations and equations reducible to them
estMinutes: 40
version: 1
status: draft
skills:
  - homogeneous-ode
  - reducible-ode
objectives:
  - Recognize a homogeneous equation and solve it with the substitution $y=vx$.
  - Reduce an equation with linear coefficients to a homogeneous one by a translation.
  - Reduce the case of parallel lines to a separable equation.
sections:
  - id: homogeneous-def
    type: definition
    term: Homogeneous equation
    body: |
      A function $f(x,y)$ is **homogeneous of degree $k$** if $f(tx,ty)=t^kf(x,y)$ for all $t>0$. For example $x^2+xy$ is homogeneous of degree $2$.

      The equation $M(x,y)\,dx+N(x,y)\,dy=0$ is **homogeneous** if $M$ and $N$ are homogeneous of the same degree. Then
      $\dfrac{dy}{dx}=-\dfrac MN$ depends only on the ratio $\dfrac yx$: it can be written $\dfrac{dy}{dx}=F\!\left(\dfrac yx\right)$.

  - id: substitution
    type: concept
    title: The substitution $y=vx$
    body: |
      Put $v=\dfrac yx$, that is $y=vx$. Differentiating with respect to $x$ (product rule), $y'=v+x\,v'$. The equation
      $y'=F\!\left(\dfrac yx\right)$ becomes

      $$v+x\dfrac{dv}{dx}=F(v)\qquad\Longrightarrow\qquad\dfrac{dv}{F(v)-v}=\dfrac{dx}{x},$$

      a **separable** equation in $v$ and $x$. Solve it, then replace $v$ by $\dfrac yx$.

  - id: ex-homogeneous
    type: example
    title: A homogeneous equation
    problem: |
      Solve $y'=\dfrac{x^2+y^2}{xy}$ for $x>0$ and $y>0$.
    steps:
      - |
        Divide numerator and denominator by $x^2$: $y'=\dfrac{1+v^2}{v}$ with $v=\dfrac yx$.
      - |
        With $y'=v+xv'$: $v+xv'=\dfrac{1+v^2}{v}$, so $xv'=\dfrac1v$.
      - |
        Separate: $v\,dv=\dfrac{dx}{x}$. Integrate: $\dfrac{v^2}{2}=\ln x+C$.
      - |
        Replace $v=\dfrac yx$: $\dfrac{y^2}{2x^2}=\ln x+C$, that is $y^2=2x^2(\ln x+C)$.
    answer: |
      $y^2=2x^2(\ln x+C)$.
    verify:
      - expr: "diff(x*sqrt(2*ln(x)+C), x)"
        equals: "(x^2+x^2*(2*ln(x)+C))/(x*x*sqrt(2*ln(x)+C))"

  - id: chk-homogeneous
    type: check
    prompt: |
      Which substitution turns $y'=\dfrac{x+y}{x-y}$ into a separable equation?
    answerType: multiple_choice
    answer: "1"
    choices:
      - text: "$y=vx$"
        value: "1"
      - text: "$y=v+x$"
        value: "2"
      - text: "$u=x+y$"
        value: "3"
      - text: "$y=\\dfrac vx$"
        value: "4"
    correctIndex: 0
    hints:
      - |
        Divide the numerator and the denominator by $x$: the right side depends only on $\dfrac yx$.
    explanation: |
      $\dfrac{x+y}{x-y}=\dfrac{1+\dfrac{y}{x}}{1-\dfrac{y}{x}}$ depends only on $\dfrac yx$. The substitution $y=vx$ gives $v+xv'=\dfrac{1+v}{1-v}$, which is separable.

  - id: reducible-intro
    type: concept
    title: Equations with linear coefficients
    body: |
      Consider $\dfrac{dy}{dx}=\dfrac{a_1x+b_1y+c_1}{a_2x+b_2y+c_2}$. Two cases:

      - If the lines $a_1x+b_1y+c_1=0$ and $a_2x+b_2y+c_2=0$ **intersect** at $(x_0,y_0)$, translate the origin there: $x=X+x_0$, $y=Y+y_0$.
        The constants disappear and the equation becomes homogeneous in $X$ and $Y$.
      - If the lines are **parallel** (the coefficients of $x,y$ are proportional), put $u=a_2x+b_2y$. Then $u'=a_2+b_2y'$ depends on $u$ only, and the
        equation is separable.

  - id: ex-translate
    type: example
    title: Intersecting lines
    problem: |
      Solve $\dfrac{dy}{dx}=\dfrac{x+y-3}{x-y-1}$.
    steps:
      - |
        The lines $x+y-3=0$ and $x-y-1=0$ meet where $x=2$, $y=1$. Put $x=X+2$, $y=Y+1$; then $\dfrac{dY}{dX}=\dfrac{X+Y}{X-Y}$.
      - |
        With $Y=vX$: $v+Xv'=\dfrac{1+v}{1-v}$, so $Xv'=\dfrac{1+v^2}{1-v}$, and $\dfrac{1-v}{1+v^2}\,dv=\dfrac{dX}{X}$.
      - |
        Integrate: $\arctan v-\tfrac12\ln(1+v^2)=\ln|X|+C$. Since $\tfrac12\ln(1+v^2)+\ln|X|=\tfrac12\ln(X^2+Y^2)$, we get
        $\arctan\dfrac YX=\tfrac12\ln(X^2+Y^2)+C$.
      - |
        Return to $x,y$: $\arctan\dfrac{y-1}{x-2}=\tfrac12\ln\big((x-2)^2+(y-1)^2\big)+C$.
    answer: |
      $\arctan\dfrac{y-1}{x-2}=\tfrac12\ln\big((x-2)^2+(y-1)^2\big)+C$.
    verify:
      - expr: "2+1-3"
        equals: "0"
      - expr: "2-1-1"
        equals: "0"

  - id: summary
    type: summary
    points:
      - |
        For a homogeneous equation $y'=F\!\left(\dfrac yx\right)$ put $y=vx$: $v+xv'=F(v)$ is separable.
      - |
        For $\dfrac{a_1x+b_1y+c_1}{a_2x+b_2y+c_2}$ with intersecting lines, translate the origin to the intersection point.
      - |
        With parallel lines, put $u=a_2x+b_2y$ to get a separable equation.
      - |
        Replace the new variable by its definition at the end.
