- id: homogeneous
  task: Integrate the homogeneous equation.
  format: "Type the relation between $x$ and $y$, with an arbitrary constant $C$."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: hom-a
      statement: |-
        $(y-x)\,dx+(y+x)\,dy=0$
      answerType: ode_solution
      answer: "y^2 + 2*x*y - x^2 = C"
      ode:
        order: 1
        equation: "(y - x) + (y + x)*y1"
      hints:
        - |-
          Put $y=vx$, so $dy=v\,dx+x\,dv$, and separate $v$ and $x$.
      solution: |-
        The equation is homogeneous of degree $1$ (and also exact). With $y=vx$: $(vx-x)\,dx+(vx+x)(v\,dx+x\,dv)=0$, i.e. $(v^2+2v-1)\,dx+x(v+1)\,dv=0$. Then $\dfrac{(v+1)\,dv}{v^2+2v-1}=-\dfrac{dx}x$, so $\tfrac12\ln|v^2+2v-1|=-\ln|x|+c$ and $x^2(v^2+2v-1)=C$, that is $y^2+2xy-x^2=C$.
    - id: hom-b
      statement: |-
        $(x+y)\,dx+x\,dy=0$
      answerType: ode_solution
      answer: "y = -x/2 + C/x"
      ode:
        order: 1
        equation: "(x + y) + x*y1"
      hints:
        - |-
          Put $y=vx$. After separation the left side is $\dfrac{dv}{1+2v}$.
      solution: |-
        With $y=vx$: $(1+v)\,dx+(v\,dx+x\,dv)=0$, so $(1+2v)\,dx+x\,dv=0$ and $\dfrac{dv}{1+2v}=-\dfrac{dx}x$. Then $\tfrac12\ln|1+2v|=-\ln|x|+c$, so $x^2(1+2v)=C$, that is $x^2+2xy=C$ and $y=-\dfrac x2+\dfrac C{2x}$ (the constant $\dfrac C2$ is renamed $C$).
    - id: hom-c
      statement: |-
        $(x+y)\,dx+(y-x)\,dy=0$
      answerType: ode_solution
      answer: "atan(y/x) = ln(x^2+y^2)/2 + C"
      ode:
        order: 1
        equation: "(x + y) + (y - x)*y1"
        sample:
          [0.6, 1.9]
      hints:
        - |-
          With $y=vx$ the equation becomes $(1+v^2)\,dx+x(v-1)\,dv=0$.
      solution: |-
        With $y=vx$: $(1+v)\,dx+(v-1)(v\,dx+x\,dv)=0$, so $(1+v^2)\,dx+x(v-1)\,dv=0$ and $\dfrac{(v-1)\,dv}{1+v^2}=-\dfrac{dx}x$. Integrate: $\tfrac12\ln(1+v^2)-\arctan v=-\ln|x|+c$, so $\arctan\dfrac yx=\ln|x|+\tfrac12\ln\left(1+\dfrac{y^2}{x^2}\right)+C=\tfrac12\ln(x^2+y^2)+C$.
    - id: hom-d
      statement: |-
        $x\,dy-y\,dx=\sqrt{x^{2}+y^{2}}\;dx$
      answerType: ode_solution
      answer: "y + sqrt(x^2+y^2) = C*x^2"
      ode:
        order: 1
        equation: "x*y1 - y - sqrt(x^2 + y^2)"
      hints:
        - |-
          For $x>0$ divide by $x$: $\sqrt{x^2+y^2}=x\sqrt{1+v^2}$. The integral $\int\dfrac{dv}{\sqrt{1+v^2}}$ is $\ln\left(v+\sqrt{1+v^2}\right)$.
      solution: |-
        For $x>0$, $y'=\dfrac yx+\sqrt{1+\left(\dfrac yx\right)^2}$. With $y=vx$: $xv'=\sqrt{1+v^2}$, so $\dfrac{dv}{\sqrt{1+v^2}}=\dfrac{dx}x$ and $\ln\left(v+\sqrt{1+v^2}\right)=\ln x+c$. Hence $v+\sqrt{1+v^2}=Cx$, i.e. $y+\sqrt{x^2+y^2}=Cx^2$.
      note: |-
        The sheet prints $\sqrt{x^2+y^2\,dx}$, with $dx$ under the root. It is read here as $\sqrt{x^2+y^2}\,dx$, the only reading that gives a differential equation.
    - id: hom-e
      statement: |-
        $(8y+10x)\,dx+(5y+7x)\,dy=0$
      answerType: ode_solution
      answer: "(x+y)^2*(2*x+y)^3 = C"
      ode:
        order: 1
        equation: "(8*y + 10*x) + (5*y + 7*x)*y1"
        sample:
          [0.6, 1.9]
      hints:
        - "After $y=vx$ the factor $5v^2+15v+10$ appears; it factors as $5(v+1)(v+2)$."
      solution: |-
        With $y=vx$: $(8v+10)\,dx+(5v+7)(v\,dx+x\,dv)=0$, so $5(v+1)(v+2)\,dx+x(5v+7)\,dv=0$. Partial fractions: $\dfrac{5v+7}{(v+1)(v+2)}=\dfrac2{v+1}+\dfrac3{v+2}$. Integrate: $2\ln|v+1|+3\ln|v+2|=-5\ln|x|+c$, so $(v+1)^2(v+2)^3x^5=C$, that is $(x+y)^2(2x+y)^3=C$.
    - id: hom-f
      statement: |-
        $xy^{2}\,dy=(x^{3}+y^{3})\,dx$
      answerType: ode_solution
      answer: "y^3 = 3*x^3*ln(x) + C*x^3"
      ode:
        order: 1
        equation: "x*y^2*y1 - x^3 - y^3"
      hints:
        - |-
          With $y=vx$, $xv'=\dfrac{1+v^3}{v^2}-v=\dfrac1{v^2}$.
      solution: |-
        $y'=\dfrac{x^3+y^3}{xy^2}$. With $y=vx$: $v+xv'=\dfrac{1+v^3}{v^2}$, so $xv'=\dfrac1{v^2}$ and $v^2\,dv=\dfrac{dx}x$. Then $\dfrac{v^3}3=\ln|x|+c$, so $y^3=3x^3\ln|x|+Cx^3$.
- id: reducible
  task: Reduce to a homogeneous or a separable equation and solve.
  format: "Type the relation between $x$ and $y$, with an arbitrary constant $C$."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: red-a
      statement: |-
        $(2x+y-4)\,dy+(x-2y+5)\,dx=0$
      answerType: ode_solution
      answer: "2*atan((y - 14/5)/(x - 3/5)) + ln((x - 3/5)^2 + (y - 14/5)^2)/2 = C"
      ode:
        order: 1
        equation: "(x - 2*y + 5) + (2*x + y - 4)*y1"
        sample:
          [1.0, 2.5]
      hints:
        - "Solve $2x+y=4$, $x-2y=-5$ for the intersection point, then shift the origin to it."
      solution: |-
        The lines $2x+y-4=0$ and $x-2y+5=0$ meet at $\left(\dfrac35,\dfrac{14}5\right)$. Put $X=x-\dfrac35$ and $Y=y-\dfrac{14}5$: $(2X+Y)\,dY+(X-2Y)\,dX=0$, which is homogeneous. With $Y=vX$: $\dfrac{(2+v)\,dv}{1+v^2}=-\dfrac{dX}X$. Integrate: $2\arctan v+\tfrac12\ln(1+v^2)=-\ln|X|+c$, that is $2\arctan\dfrac YX+\tfrac12\ln(X^2+Y^2)=C$.
    - id: red-b
      statement: |-
        $y'=\dfrac{1-3x-3y}{1+x+y}$
      answerType: ode_solution
      answer: "3*x + y + 2*ln(abs(1 - x - y)) = C"
      ode:
        order: 1
        equation: "y1*(1 + x + y) - (1 - 3*x - 3*y)"
        sample:
          [1.2, 2.0]
      hints:
        - "Put $u=x+y$, so $u'=1+y'$."
      solution: |-
        The lines are parallel (the right side depends on $x+y$ only). Put $u=x+y$: $u'=1+\dfrac{1-3u}{1+u}=\dfrac{2(1-u)}{1+u}$, so $\dfrac{1+u}{1-u}\,du=2\,dx$. Since $\dfrac{1+u}{1-u}=-1+\dfrac2{1-u}$: $-u-2\ln|1-u|=2x+c$. Substituting $u=x+y$: $3x+y+2\ln|1-x-y|=C$.
    - id: red-c
      statement: |-
        $y'=\dfrac{x+2y+1}{2x+4y+3}$
      answerType: ode_solution
      answer: "8*y - 4*x + ln(abs(4*x + 8*y + 5)) = C"
      ode:
        order: 1
        equation: "y1*(2*x + 4*y + 3) - (x + 2*y + 1)"
      hints:
        - "Put $u=x+2y$; then $2x+4y+3=2u+3$."
      solution: |-
        The lines are parallel again. Put $u=x+2y$: $u'=1+2y'=1+\dfrac{2(u+1)}{2u+3}=\dfrac{4u+5}{2u+3}$, so $\dfrac{2u+3}{4u+5}\,du=dx$. Since $\dfrac{2u+3}{4u+5}=\dfrac12+\dfrac1{2(4u+5)}$: $\dfrac u2+\dfrac18\ln|4u+5|=x+c$, that is $4u+\ln|4u+5|=8x+C$. With $u=x+2y$: $8y-4x+\ln|4x+8y+5|=C$.
    - id: red-d
      statement: |-
        $(x+2y+1)\,dx-(2x+4y+3)\,dy=0$
      answerType: ode_solution
      answer: "8*y - 4*x + ln(abs(4*x + 8*y + 5)) = C"
      ode:
        order: 1
        equation: "(x + 2*y + 1) - (2*x + 4*y + 3)*y1"
      hints:
        - "Divide by $dx$ and compare with part (c)."
      solution: |-
        Solving for $y'$ gives $y'=\dfrac{x+2y+1}{2x+4y+3}$, the equation of part (c). The solution is the same: $8y-4x+\ln|4x+8y+5|=C$.
      note: "Parts (c) and (d) of the sheet are the same differential equation, written in two ways."
- id: more-homogeneous
  task: |-
    More practice: homogeneous equations.
  format: "Type the solution with an arbitrary constant `C`, for example `y = C*e^x` or `x^2 + y^2 = C`."
  items:
    - id: mp-hom-1
      statement: "$y' x=y + x$"
      answerType: ode_solution
      answer: "y = x*ln(x) + C*x"
      ode:
        order: 1
        equation: "x*y1 - x - y"
        sample:
          [0.6, 1.9]
      hints:
        - "Put $y=vx$, so $y'=v+xv'$."
      solution: |-
        Put $y=vx$: $xv'+v=1+v$, so $v'=\dfrac1x$ and $v=\ln x+C$. Hence $y=x\ln x+Cx$.
    - id: mp-hom-2
      statement: |-
        $y'=\frac{y}{x} + \tan{\left(\frac{y}{x} \right)}$
      answerType: ode_solution
      answer: "sin(y/x) = C*x"
      ode:
        order: 1
        equation: "y1 - tan(y/x) - y/x"
      hints:
        - |-
          With $y=vx$ the equation becomes $xv'=\tan v$.
      solution: |-
        Put $y=vx$: $xv'=\tan v$, so $\cot v\,dv=\dfrac{dx}{x}$ and $\ln|\sin v|=\ln|x|+c$. Hence $\sin\dfrac yx=Cx$.
    - id: mp-hom-3
      statement: |-
        $y'=\frac{y^{2} + x^{2}}{2 y x}$
      answerType: ode_solution
      answer: "y^2 = x^2 + C*x"
      ode:
        order: 1
        equation: "y1 - (x^2 + y^2)/(2*x*y)"
      hints:
        - "Put $y=vx$ and separate $v$ from $x$."
      solution: |-
        Put $y=vx$: $xv'=\dfrac{1-v^2}{2v}$, so $\dfrac{2v\,dv}{1-v^2}=\dfrac{dx}x$ and $-\ln|1-v^2|=\ln|x|+c$. Hence $x\left(1-v^2\right)=C'$, that is $y^2=x^2+Cx$.
    - id: mp-hom-4
      statement: |-
        $y'=\frac{y}{x} + \frac{y^{2}}{x^{2}}$
      answerType: ode_solution
      answer: "y = -x/(ln(x) + C)"
      ode:
        order: 1
        equation: "y1 - y/x - y^2/x^2"
        sample:
          [1.2, 1.9]
      hints:
        - |-
          With $y=vx$: $xv'=v^2$.
      solution: |-
        Put $y=vx$: $xv'=v^2$, so $-\dfrac1v=\ln x+C$ and $y=vx=-\dfrac{x}{\ln x+C}$.
    - id: mp-hom-5
      statement: |-
        $y' x=y + x$, $\ y(1)=2$
      answerType: ode_solution
      answer: "y = x*ln(x) + 2*x"
      ode:
        order: 1
        equation: "x*y1 - x - y"
        sample:
          [0.6, 1.9]
        conditions:
          - at: "1"
            value: "2"
            derivative: 0
      hints:
        - "First find the general solution, then use $y(1)=2$."
      solution: |-
        As in part 1, $y=x\ln x+Cx$. $y(1)=2$ gives $C=2$.
