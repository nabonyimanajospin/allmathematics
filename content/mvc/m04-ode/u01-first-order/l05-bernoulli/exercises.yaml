- id: bernoulli
  task: Integrate the Bernoulli equation.
  format: "Type the relation between $x$ and $y$, with an arbitrary constant $C$."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: ber-a
      statement: "$y'+xy=x^{3}y^{3}$"
      answerType: ode_solution
      answer: "1/y^2 = x^2 + 1 + C*e^(x^2)"
      ode:
        order: 1
        equation: "y1 + x*y - x^3*y^3"
      hints:
        - "Put $z=y^{-2}$. Then $z'=-2y^{-3}y'$ and the equation becomes linear in $z$."
      solution: |-
        Divide by $y^3$ and put $z=y^{-2}$, $z'=-2y^{-3}y'$: $z'-2xz=-2x^3$. With $\mu=e^{-x^2}$: $\left(ze^{-x^2}\right)'=-2x^3e^{-x^2}$, so $ze^{-x^2}=(x^2+1)e^{-x^2}+C$ and $\dfrac1{y^2}=x^2+1+Ce^{x^2}$. (The solution $y=0$ is lost when dividing by $y^3$.)
    - id: ber-b
      statement: |-
        $(1-x^{2})\,y'-xy-xy^{2}=0$
      answerType: ode_solution
      answer: "1/y = C*sqrt(1 - x^2) - 1"
      ode:
        order: 1
        equation: "(1 - x^2)*y1 - x*y - x*y^2"
        sample:
          [0.1, 0.8]
      hints:
        - "Put $z=1/y$, then $z'=-y'/y^2$."
      solution: |-
        Divide by $y^2$ and put $z=\dfrac1y$: $z'+\dfrac x{1-x^2}\,z=-\dfrac x{1-x^2}$. With $\mu=(1-x^2)^{-1/2}$: $\left(\dfrac z{\sqrt{1-x^2}}\right)'=-\dfrac x{(1-x^2)^{3/2}}$, so $\dfrac z{\sqrt{1-x^2}}=-\dfrac1{\sqrt{1-x^2}}+C$ and $\dfrac1y=C\sqrt{1-x^2}-1$.
    - id: ber-c
      statement: "$3y^{2}y'-y^{3}-x-1=0$"
      answerType: ode_solution
      answer: "y^3 = C*e^x - x - 2"
      ode:
        order: 1
        equation: "3*y^2*y1 - y^3 - x - 1"
      hints:
        - "Here $3y^2y'$ is exactly $z'$ for $z=y^3$."
      solution: |-
        Put $z=y^3$, $z'=3y^2y'$: $z'-z=x+1$. A particular solution is $z_p=-x-2$ (substitute $Ax+B$), so $z=Ce^x-x-2$ and $y^3=Ce^x-x-2$.
    - id: ber-d
      statement: |-
        $(y\ln x-2)\,y\,dx=x\,dy$
      answerType: ode_solution
      answer: "1/y = ln(x)/2 + 1/4 + C*x^2"
      ode:
        order: 1
        equation: "(y*ln(x) - 2)*y - x*y1"
      hints:
        - |-
          Put $z=1/y$. The integral of $\ln x/x^3$ is done by parts.
      solution: |-
        $xy'=y^2\ln x-2y$. Divide by $y^2$ and put $z=\dfrac1y$: $z'-\dfrac2x\,z=-\dfrac{\ln x}x$. With $\mu=x^{-2}$: $\left(\dfrac z{x^2}\right)'=-\dfrac{\ln x}{x^3}$, and $\int-\dfrac{\ln x}{x^3}\,dx=\dfrac{\ln x}{2x^2}+\dfrac1{4x^2}$ (by parts). Hence $z=\dfrac{\ln x}2+\dfrac14+Cx^2$.
      note: |-
        The sheet writes $y\,\ell nx$ for $y\ln x$.
    - id: ber-e
      statement: |-
        $y-y'\cos x=y^{2}\cos x\,(1-\sin x)$
      answerType: ode_solution
      answer: "1/y = cos(x)*(sin(x) + C)/(1 + sin(x))"
      ode:
        order: 1
        equation: "y - y1*cos(x) - y^2*cos(x)*(1 - sin(x))"
        sample:
          [0.2, 1.2]
      hints:
        - |-
          Put $z=1/y$. The integrating factor of $z'+\sec x\,z$ is $\sec x+\tan x$.
      solution: |-
        $y'=y\sec x-y^2(1-\sin x)$. Put $z=\dfrac1y$: $z'+\sec x\,z=1-\sin x$. With $\mu=\sec x+\tan x=\dfrac{1+\sin x}{\cos x}$: $(\mu z)'=\dfrac{(1+\sin x)(1-\sin x)}{\cos x}=\cos x$, so $\mu z=\sin x+C$ and $\dfrac1y=\dfrac{\cos x\,(\sin x+C)}{1+\sin x}$.
    - id: ber-f
      statement: |-
        $y'+\dfrac yx=-xy^{2}$
      answerType: ode_solution
      answer: "1/y = x^2 + C*x"
      ode:
        order: 1
        equation: "y1 + y/x + x*y^2"
      hints:
        - "Put $z=1/y$; the equation becomes $z'-z/x=x$."
      solution: |-
        Put $z=\dfrac1y$: $z'-\dfrac zx=x$. With $\mu=\dfrac1x$: $\left(\dfrac zx\right)'=1$, so $z=x(x+C)$ and $\dfrac1y=x^2+Cx$.
    - id: ber-g
      statement: "$2xyy'-y^{2}+x=0$"
      answerType: ode_solution
      answer: "y^2 = x*(C - ln(abs(x)))"
      ode:
        order: 1
        equation: "2*x*y*y1 - y^2 + x"
      hints:
        - "Here $2yy'=(y^2)'$, so put $z=y^2$ directly."
      solution: |-
        Put $z=y^2$, $z'=2yy'$: $xz'-z+x=0$, so $z'-\dfrac zx=-1$. With $\mu=\dfrac1x$: $\left(\dfrac zx\right)'=-\dfrac1x$, so $\dfrac zx=C-\ln|x|$ and $y^2=x(C-\ln|x|)$.
