  format: "Type the solution with an arbitrary constant `C`, for example `y = C*e^x` or `x^2 + y^2 = C`."
  items:
    - id: mp-ber-1
      statement: |-
        $y' + \frac{y}{x}=x y^{2}$
      answerType: ode_solution
      answer: "1/y = x*(C - x)"
      ode:
        order: 1
        equation: "-x*y^2 + y1 + y/x"
        sample:
          [0.6, 1.9]
      hints:
        - |-
          Divide by $y^{2}$ and put $v=y^{-1}$: the equation becomes linear in $v$.
      solution: |-
        Put $v=y^{-1}$. Dividing the equation by $y^{2}$ and using $v'=(-1)y^{-2}y'$ gives the linear equation $v' - \frac{v}{x}=- x$, with integrating factor $\mu=\frac{1}{x}$. Its solution is $v=x \left(C - x\right)$, that is $\frac{1}{y}=x \left(C - x\right)$.
    - id: mp-ber-2
      statement: "$y' + 2 y=y^{3}$"
      answerType: ode_solution
      answer: "y^-2 = C*exp(4*x) + 1/2"
      ode:
        order: 1
        equation: "-y^3 + 2*y + y1"
        sample:
          [0.6, 1.9]
      hints:
        - |-
          Divide by $y^{3}$ and put $v=y^{-2}$: the equation becomes linear in $v$.
      solution: |-
        Put $v=y^{-2}$. Dividing the equation by $y^{3}$ and using $v'=(-2)y^{-3}y'$ gives the linear equation $v' - 4 v=-2$, with integrating factor $\mu=e^{- 4 x}$. Its solution is $v=C e^{4 x} + \frac{1}{2}$, that is $\frac{1}{y^{2}}=C e^{4 x} + \frac{1}{2}$.
    - id: mp-ber-3
      statement: |-
        $y' - \frac{y}{x}=\frac{y^{2}}{x}$
      answerType: ode_solution
      answer: "1/y = (C - x)/x"
      ode:
        order: 1
        equation: "y1 - y^2/x - y/x"
        sample:
          [0.6, 1.9]
      hints:
        - |-
          Divide by $y^{2}$ and put $v=y^{-1}$: the equation becomes linear in $v$.
      solution: |-
        Put $v=y^{-1}$. Dividing the equation by $y^{2}$ and using $v'=(-1)y^{-2}y'$ gives the linear equation $v' + \frac{v}{x}=- \frac{1}{x}$, with integrating factor $\mu=x$. Its solution is $v=\frac{C - x}{x}$, that is $\frac{1}{y}=\frac{C - x}{x}$.
    - id: mp-ber-4
      statement: "$y' + y=y^{2} e^{x}$"
