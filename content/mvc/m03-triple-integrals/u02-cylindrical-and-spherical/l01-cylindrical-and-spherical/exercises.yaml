- id: spherical
  task: Use spherical coordinates.
  format: "Type an exact expression, for example `pi*R^3/3`."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: sph-01
      statement: |-
        $\displaystyle\iiint_Dx^2\,dx\,dy\,dz$, $\ D:\ x^2+y^2+z^2\le R^2$ (with $R>0$)
      answerType: expression
      answer: "4*pi*R^5/15"
      variables:
        [R]
      hints:
        - |-
          By symmetry $\iiint x^2\,dV=\dfrac13\iiint(x^2+y^2+z^2)\,dV$. Use spherical coordinates for the last one.
      solution: |-
        By symmetry, $\iiint x^2\,dV=\iiint y^2\,dV=\iiint z^2\,dV$, so $\iiint x^2\,dV=\dfrac13\iiint(x^2+y^2+z^2)\,dV$. In spherical coordinates:

        $$\iiint\rho^2\,dV=\int_0^{2\pi}\int_0^\pi\int_0^R\rho^4\sin\varphi\,d\rho\,d\varphi\,d\theta=2\pi\cdot2\cdot\dfrac{R^5}{5}=\dfrac{4\pi R^5}{5}.$$

        Therefore $\iiint x^2\,dV=\dfrac13\cdot\dfrac{4\pi R^5}5=\dfrac{4\pi R^5}{15}$.
      verify:
        - expr: "integrate(integrate(integrate((rho*sin(f)*cos(t))^2*rho^2*sin(f), rho, 0, R), f, 0, pi), t, 0, 2*pi)"
          equals: "4*pi*R^5/15"
    - id: sph-02
      statement: |-
        The volume of the sphere $x^2+y^2+z^2=a^2$ (that is, of the ball it bounds), with $a>0$. The unit is cu: give the number only.
      answerType: expression
      answer: "4*pi*a^3/3"
      variables:
        [a]
      hints:
        - |-
          Use spherical coordinates: $V=\iiint\rho^2\sin\varphi\,d\rho\,d\varphi\,d\theta$.
      solution: |-
        $$V=\int_0^{2\pi}\int_0^\pi\int_0^a\rho^2\sin\varphi\,d\rho\,d\varphi\,d\theta=2\pi\cdot2\cdot\dfrac{a^3}{3}=\dfrac{4\pi a^3}{3}.$$
      verify:
        - expr: "integrate(integrate(integrate(rho^2*sin(f), rho, 0, a), f, 0, pi), t, 0, 2*pi)"
          equals: "4*pi*a^3/3"
