  items:
    - id: tri-01
      statement: |-
        $\displaystyle\iiint_D(x^2+y^2+z^2)\,dx\,dy\,dz$, $\ D:\ 0\le x\le1,\ 0\le y\le1,\ 0\le z\le1$
      answerType: number
      answer: "1"
      hints:
        - |-
          Integrate each of the three terms separately: by symmetry they give the same value.
      solution: |-
        Each term gives the same integral: $\displaystyle\iiint x^2\,dV=\int_0^1x^2\,dx\cdot\int_0^1dy\cdot\int_0^1dz=\frac13$. The same holds for $y^2$ and $z^2$, so the total is $3\cdot\dfrac13=1$.
      verify:
        - expr: "integrate(integrate(integrate(x^2+y^2+z^2, z, 0, 1), y, 0, 1), x, 0, 1)"
          equals: "1"
    - id: tri-02
      statement: |-
        $\displaystyle\iiint_D(x^2+y^2+z^2)\,dx\,dy\,dz$, $\ D:\ 0\le x\le1,\ 0\le y\le1,\ 0\le z\le\sqrt{1-x^2-y^2}$
      answerType: expression
      answer: pi/10
      hints:
        - |-
          For $z$ to be real we need $x^2+y^2\le1$: the solid is one eighth of the unit ball. Use spherical coordinates.
      solution: |-
        The upper limit $\sqrt{1-x^2-y^2}$ is real only when $x^2+y^2\le1$, so $D$ is the part of the unit ball with $x,y,z\ge0$, that is one eighth of the ball: $0\le\rho\le1$, $0\le\varphi\le\dfrac\pi2$, $0\le\theta\le\dfrac\pi2$.

        $$\int_0^{\frac{\pi}{2}}\int_0^{\frac{\pi}{2}}\int_0^1\rho^2\cdot\rho^2\sin\varphi\,d\rho\,d\varphi\,d\theta=\dfrac15\cdot1\cdot\dfrac\pi2=\dfrac{\pi}{10}.$$
      verify:
        - expr: "integrate(integrate(integrate(rho^4*sin(f), rho, 0, 1), f, 0, pi/2), t, 0, pi/2)"
          equals: pi/10
    - id: tri-03
      statement: |-
        $\displaystyle\iiint_D(x^2+y^2+z^2)\,dx\,dy\,dz$, $\ D:\ 0\le x\le1,\ 0\le y\le1-x,\ 0\le z\le1-x-y$
      answerType: number
      answer: "1/20"
      hints:
        - |-
          The solid is symmetric in $x$, $y$, $z$: compute $\iiint x^2\,dV$ and multiply by $3$.
      solution: |-
        The solid is the tetrahedron bounded by the coordinate planes and $x+y+z=1$, which is symmetric in $x$, $y$, $z$. So the integral is $3\iiint x^2\,dV$. Now

        $$\iiint x^2\,dV=\int_0^1x^2\int_0^{1-x}(1-x-y)\,dy\,dx=\int_0^1x^2\cdot\dfrac{(1-x)^2}{2}\,dx=\dfrac12\left(\dfrac13-\dfrac12+\dfrac15\right)=\dfrac1{60}.$$

        The result is $3\cdot\dfrac1{60}=\dfrac1{20}$.
      verify:
        - expr: "integrate(integrate(integrate(x^2+y^2+z^2, z, 0, 1-x-y), y, 0, 1-x), x, 0, 1)"
          equals: "1/20"
    - id: tri-04
      statement: |-
        $\displaystyle\iiint_Dxyz\,dx\,dy\,dz$, $\ D:\ 0\le x\le1,\ 0\le y\le1-x,\ 0\le z\le1-x-y$
      answerType: number
      answer: "1/720"
      hints:
        - |-
          Innermost: $\int_0^{1-x-y}z\,dz=\dfrac{(1-x-y)^2}{2}$.
      solution: |-
        Innermost: $\displaystyle\int_0^{1-x-y}z\,dz=\frac{(1-x-y)^2}2$.

        Middle: $\displaystyle\int_0^{1-x}\frac{xy(1-x-y)^2}{2}\,dy=\frac{x(1-x)^4}{24}$.

        Outer: $\displaystyle\int_0^1\frac{x(1-x)^4}{24}\,dx=\frac1{24}\cdot\frac1{30}=\frac1{720}$.
      verify:
        - expr: "integrate(integrate(integrate(x*y*z, z, 0, 1-x-y), y, 0, 1-x), x, 0, 1)"
          equals: "1/720"
