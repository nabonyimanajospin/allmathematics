- id: volumes
  task: Find the volume bounded by the given surfaces.
  format: "Type an exact expression, for example `a^2*b/5`."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: vol-01
      statement: "The volume of the solid bounded by the surface $z=a^2-x^2$ and the planes $x=0$, $y=0$, $z=0$, $y=b$ (with $a,b>0$)."
      answerType: expression
      answer: "2*a^3*b/3"
      variables:
        [a, b]
      hints:
        - |-
          The surface meets $z=0$ at $x=a$ (for $x\ge0$). The solid lies over the rectangle $0\le x\le a$, $0\le y\le b$.
      solution: |-
        The surface $z=a^2-x^2$ is a parabolic cylinder; it meets the plane $z=0$ at $x=a$. The solid lies over the rectangle $0\le x\le a$, $0\le y\le b$, with height $a^2-x^2$.

        $$V=\int_0^b\int_0^a(a^2-x^2)\,dx\,dy=b\left[a^2x-\dfrac{x^3}{3}\right]_0^a=b\cdot\dfrac{2a^3}{3}=\dfrac{2a^3b}{3}.$$
      verify:
        - expr: "integrate(integrate(a^2-x^2, x, 0, a), y, 0, b)"
          equals: "2*a^3*b/3"
    - id: vol-02
      statement: "The volume of the tetrahedron bounded by the coordinate planes and the plane $x+y+z=1$."
      answerType: number
      answer: "1/6"
      hints:
        - |-
          Use the formula $\dfrac{abc}{6}$ from the lesson with $a=b=c=1$, or integrate $1-x-y$ over the triangle.
      solution: |-
        The top surface is $z=1-x-y$ over the triangle $0\le y\le1-x$, $0\le x\le1$:

        $$V=\int_0^1\int_0^{1-x}(1-x-y)\,dy\,dx=\int_0^1\dfrac{(1-x)^2}{2}\,dx=\dfrac16.$$

        Check with geometry: $\dfrac13\cdot\text{base}\cdot\text{height}=\dfrac13\cdot\dfrac12\cdot1=\dfrac16$.
      verify:
        - expr: "integrate(integrate(1-x-y, y, 0, 1-x), x, 0, 1)"
          equals: "1/6"
