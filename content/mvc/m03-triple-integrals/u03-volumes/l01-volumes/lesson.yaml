id: mvc-m03-u03-l01
title: Volumes of solids
estMinutes: 35
version: 1
status: draft
skills:
  - volume-triple-integral
objectives:
  - Compute the volume of a solid bounded by surfaces as a double or triple integral.
  - Choose the best order of integration and the best coordinates.
  - Check a volume by a formula from geometry.
sections:
  - id: volume-formulas
    type: concept
    title: Two ways to get a volume
    body: |
      The volume of a solid $E$ is the triple integral $\iiint_E dV$. When the solid lies between two surfaces
      $z=z_1(x,y)$ and $z=z_2(x,y)$ over a region $D$, the innermost integral is just the height, and

      $$V=\iint_D\big(z_2(x,y)-z_1(x,y)\big)\,dA.$$

      So a volume is often a double integral of a **height**. Use polar coordinates for $D$ when it is a disc.

  - id: ex-paraboloid
    type: example
    title: Under a paraboloid
    problem: |
      Find the volume of the solid between the paraboloid $z=4-x^2-y^2$ and the plane $z=0$.
    steps:
      - |
        The paraboloid meets $z=0$ on the circle $x^2+y^2=4$. So $D$ is the disc $x^2+y^2\le4$, and the height is $4-x^2-y^2=4-r^2$.
      - |
        In polar coordinates, $V=\displaystyle\int_0^{2\pi}\int_0^2(4-r^2)\,r\,dr\,d\theta=2\pi\left[2r^2-\frac{r^4}{4}\right]_0^2=2\pi\cdot4=8\pi$.
    answer: |
      $V=8\pi$.
    verify:
      - expr: "integrate(integrate((4-r^2)*r, r, 0, 2), t, 0, 2*pi)"
        equals: "8*pi"

  - id: ex-tetrahedron-volume
    type: example
    title: A tetrahedron
    problem: |
      Find the volume of the tetrahedron bounded by the coordinate planes and the plane $\dfrac xa+\dfrac yb+\dfrac zc=1$, with $a,b,c>0$.
    steps:
      - |
        The top surface is $z=c\left(1-\dfrac xa-\dfrac yb\right)$. The base is the triangle $0\le y\le b\left(1-\dfrac xa\right)$, $0\le x\le a$.
      - |
        $V=\displaystyle\int_0^a\int_0^{b(1-\frac{x}{a})}c\left(1-\frac xa-\frac yb\right)dy\,dx=\int_0^a\frac{bc}{2}\left(1-\frac xa\right)^2dx=\frac{abc}{6}$.
      - |
        Check with geometry: the volume of a pyramid is $\dfrac13\cdot(\text{base area})\cdot\text{height}=\dfrac13\cdot\dfrac{ab}{2}\cdot c=\dfrac{abc}6$.
    answer: |
      $V=\dfrac{abc}{6}$.
    verify:
      - expr: "integrate(integrate(c*(1-x/a-y/b), y, 0, b*(1-x/a)), x, 0, a)"
        equals: "a*b*c/6"

  - id: chk-cone
    type: check
    prompt: |
      Find the volume of the solid between the cone $z=\sqrt{x^2+y^2}$ and the plane $z=2$.
    answerType: expression
    answer: "8*pi/3"
    hints:
      - |
        The cone meets the plane $z=2$ on the circle $x^2+y^2=4$. The height above a point at distance $r$ is $2-r$.
    explanation: |
      $\displaystyle V=\int_0^{2\pi}\int_0^2(2-r)\,r\,dr\,d\theta=2\pi\left(4-\frac83\right)=\frac{8\pi}{3}$. Check: a cone of radius $2$ and height $2$ has volume $\dfrac13\pi\cdot2^2\cdot2=\dfrac{8\pi}3$.

  - id: summary
    type: summary
    points:
      - |
        $V=\iiint_EdV$, or $V=\iint_D(\text{top}-\text{bottom})\,dA$ for a solid between two surfaces over a region $D$.
      - |
        Find where the surfaces meet to determine $D$; use polar coordinates when $D$ is a disc.
      - |
        Compare with a formula of geometry (cylinder, cone, pyramid, ball) as a check.
