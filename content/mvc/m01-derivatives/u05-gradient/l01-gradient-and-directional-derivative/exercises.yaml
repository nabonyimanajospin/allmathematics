- id: level
  task: Level curves and tangent lines.
  format: "Write the line as an equation, for example `3*x + 4*y = 25`; any non-zero multiple of the equation is accepted."
  items:
    - id: lv-01
      statement: "Write the tangent line to the curve $x^2+y^2=25$ at the point $(3,4)$."
      answerType: equation
      answer: "3*x + 4*y - 25=0"
      coordinates:
        [x, y]
      hints:
        - |-
          Take $f=x^2+y^2$: its gradient is perpendicular to the curve, so it is a normal vector of the tangent line.
      solution: |-
        $\nabla f=\left(6,\,8\right)$ at the point, so the tangent line is $6(x-3)+8(y-4)=0$, that is $3 x + 4 y - 25=0$.
    - id: lv-02
      statement: "Write the tangent line to the curve $x^2-y^2=3$ at the point $(2,1)$."
      answerType: equation
      answer: "2*x - y - 3=0"
      coordinates:
        [x, y]
      hints:
        - |-
          Take $f=x^2-y^2$: its gradient is perpendicular to the curve, so it is a normal vector of the tangent line.
      solution: |-
        $\nabla f=\left(4,\,-2\right)$ at the point, so the tangent line is $4(x-2)+-2(y-1)=0$, that is $2 x - y - 3=0$.
    - id: lv-03
      statement: "Write the tangent line to the curve $xy^2=18$ at the point $(2,3)$."
      answerType: equation
      answer: "3*x + 4*y - 18=0"
      coordinates:
        [x, y]
      hints:
        - |-
          Take $f=xy^2$: its gradient is perpendicular to the curve, so it is a normal vector of the tangent line.
      solution: |-
        $\nabla f=\left(9,\,12\right)$ at the point, so the tangent line is $9(x-2)+12(y-3)=0$, that is $3 x + 4 y - 18=0$.
    - id: lv-04
      statement: "Give a normal vector of the curve $x^2+3y^2=7$ at the point $(2,1)$."
      answerType: direction
      answer: "(2, 3)"
      hints:
        - A normal vector of a level curve is the gradient.
      solution: |-
        For $f=x^2+3y^2$, $\nabla f=(2x,6y)=(4,6)$ at $(2,1)$. Dividing by $2$ gives $(2,3)$; any non-zero multiple is accepted.
