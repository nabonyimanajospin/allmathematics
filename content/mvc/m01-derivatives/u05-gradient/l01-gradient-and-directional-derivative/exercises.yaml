- id: gradient
  task: Compute the gradient at the given point.
  format: "Type the vector like `(3, -1)`; use exact values such as `sqrt(3)` and `pi`."
  items:
    - id: gr-01
      statement: |-
        Find the gradient $\nabla f$ of $f(x,y)=x^3-3xy+y^2$ at the point $(1,2)$.
      answerType: vector
      answer: "(-3, 1)"
      hints:
        - "Compute each partial derivative first, then substitute the coordinates of the point."
      solution: |-
        The partial derivatives are $f_{x}=3 x^{2} - 3 y,\ f_{y}=- 3 x + 2 y$. At the point they give $\nabla f=\left(-3,\,1\right)$.
      verify:
        - expr: "diff(x^3 - 3*x*y + y^2, x)"
          equals: "3*x^2 - 3*y"
    - id: gr-02
      statement: |-
        Find the gradient $\nabla f$ of $f(x,y)=e^{x}\sin y$ at the point $\left(\ln 2,\dfrac\pi6\right)$.
      answerType: vector
      answer: "(1, sqrt(3))"
      hints:
        - "Compute each partial derivative first, then substitute the coordinates of the point."
      solution: |-
        The partial derivatives are $f_{x}=e^{x} \sin{\left(y \right)},\ f_{y}=e^{x} \cos{\left(y \right)}$. At the point they give $\nabla f=\left(1,\,\sqrt{3}\right)$.
      verify:
        - expr: "diff(exp(x)*sin(y), x)"
          equals: "exp(x)*sin(y)"
    - id: gr-03
      statement: |-
        Find the gradient $\nabla f$ of $f(x,y)=\ln\left(x^2+y^2\right)$ at the point $(1,2)$.
      answerType: vector
      answer: "(2/5, 4/5)"
      hints:
        - "Compute each partial derivative first, then substitute the coordinates of the point."
      solution: |-
        The partial derivatives are $f_{x}=\frac{2 x}{x^{2} + y^{2}},\ f_{y}=\frac{2 y}{x^{2} + y^{2}}$. At the point they give $\nabla f=\left(\frac{2}{5},\,\frac{4}{5}\right)$.
      verify:
        - expr: "diff(ln(x^2 + y^2), x)"
          equals: "2*x/(x^2 + y^2)"
    - id: gr-04
      statement: |-
        Find the gradient $\nabla f$ of $f(x,y)=\dfrac{x}{y}$ at the point $(3,3)$.
      answerType: vector
      answer: "(1/3, -1/3)"
      hints:
        - "Compute each partial derivative first, then substitute the coordinates of the point."
      solution: |-
        The partial derivatives are $f_{x}=\frac{1}{y},\ f_{y}=- \frac{x}{y^{2}}$. At the point they give $\nabla f=\left(\frac{1}{3},\,- \frac{1}{3}\right)$.
      verify:
        - expr: "diff(x/y, x)"
          equals: "1/y"
    - id: gr-05
      statement: |-
        Find the gradient $\nabla f$ of $f(x,y,z)=xyz$ at the point $(1,2,3)$.
      answerType: vector
      answer: "(6, 3, 2)"
      hints:
        - "Compute each partial derivative first, then substitute the coordinates of the point."
      solution: |-
        The partial derivatives are $f_{x}=y z,\ f_{y}=x z,\ f_{z}=x y$. At the point they give $\nabla f=\left(6,\,3,\,2\right)$.
      verify:
        - expr: "diff(x*y*z, x)"
          equals: "y*z"
    - id: gr-06
      statement: |-
        Find the gradient $\nabla f$ of $f(x,y,z)=x^2+y^2+z^2$ at the point $(1,-2,2)$.
      answerType: vector
      answer: "(2, -4, 4)"
      hints:
        - "Compute each partial derivative first, then substitute the coordinates of the point."
      solution: |-
        The partial derivatives are $f_{x}=2 x,\ f_{y}=2 y,\ f_{z}=2 z$. At the point they give $\nabla f=\left(2,\,-4,\,4\right)$.
      verify:
        - expr: "diff(x^2 + y^2 + z^2, x)"
          equals: "2*x"
- id: directional
  task: Compute the directional derivative.
  format: "Type an exact value such as `4*sqrt(2)` or `16/5`."
  items:
    - id: dd-01
      statement: |-
        Find the directional derivative of $f(x,y)=xy^2$ at $(2,1)$ in the direction of $\vec v=(1,-1)$.
      answerType: expression
      answer: "-3*sqrt(2)/2"
      hints:
        - |-
          Use $\dirder{u}{f}=\dotp{\nabla f}{\vec u}$ with a **unit** vector $\vec u$: divide the direction by its length first.
      solution: |-
        $\nabla f=\left(1,\,4\right)$ at the point. The direction vector has length $\sqrt{2}$, so $\vec u=\left(\frac{\sqrt{2}}{2},\,- \frac{\sqrt{2}}{2}\right)$. Then $\dirder{u}{f}=\dotp{\left(1,\,4\right)}{\left(\frac{\sqrt{2}}{2},\,- \frac{\sqrt{2}}{2}\right)}=- \frac{3 \sqrt{2}}{2}$.
    - id: dd-02
      statement: |-
        Find the directional derivative of $f(x,y)=x^2-y^2$ at $(2,1)$ in the direction of $\vec v=(3,4)$.
      answerType: number
      answer: "4/5"
      hints:
        - |-
          Use $\dirder{u}{f}=\dotp{\nabla f}{\vec u}$ with a **unit** vector $\vec u$: divide the direction by its length first.
      solution: |-
        $\nabla f=\left(4,\,-2\right)$ at the point. The direction vector has length $5$, so $\vec u=\left(\frac{3}{5},\,\frac{4}{5}\right)$. Then $\dirder{u}{f}=\dotp{\left(4,\,-2\right)}{\left(\frac{3}{5},\,\frac{4}{5}\right)}=\frac{4}{5}$.
    - id: dd-03
      statement: |-
        Find the directional derivative of $f(x,y)=e^{xy}$ at $(1,0)$ in the direction of $\vec v=(1,1)$.
      answerType: expression
      answer: "sqrt(2)/2"
      hints:
        - |-
          Use $\dirder{u}{f}=\dotp{\nabla f}{\vec u}$ with a **unit** vector $\vec u$: divide the direction by its length first.
      solution: |-
        $\nabla f=\left(0,\,1\right)$ at the point. The direction vector has length $\sqrt{2}$, so $\vec u=\left(\frac{\sqrt{2}}{2},\,\frac{\sqrt{2}}{2}\right)$. Then $\dirder{u}{f}=\dotp{\left(0,\,1\right)}{\left(\frac{\sqrt{2}}{2},\,\frac{\sqrt{2}}{2}\right)}=\frac{\sqrt{2}}{2}$.
    - id: dd-04
      statement: |-
        Find the directional derivative of $f(x,y)=\sqrt{x^2+y^2}$ at $(3,4)$ in the direction of $\vec v=(1,2)$.
      answerType: expression
      answer: "11*sqrt(5)/25"
      hints:
        - |-
          Use $\dirder{u}{f}=\dotp{\nabla f}{\vec u}$ with a **unit** vector $\vec u$: divide the direction by its length first.
      solution: |-
        $\nabla f=\left(\frac{3}{5},\,\frac{4}{5}\right)$ at the point. The direction vector has length $\sqrt{5}$, so $\vec u=\left(\frac{\sqrt{5}}{5},\,\frac{2 \sqrt{5}}{5}\right)$. Then $\dirder{u}{f}=\dotp{\left(\frac{3}{5},\,\frac{4}{5}\right)}{\left(\frac{\sqrt{5}}{5},\,\frac{2 \sqrt{5}}{5}\right)}=\frac{11 \sqrt{5}}{25}$.
    - id: dd-05
      statement: |-
        Find the directional derivative of $f(x,y,z)=x^2+yz$ at $(1,2,1)$ in the direction of $\vec v=(2,1,2)$.
      answerType: number
      answer: "3"
      hints:
        - |-
          Use $\dirder{u}{f}=\dotp{\nabla f}{\vec u}$ with a **unit** vector $\vec u$: divide the direction by its length first.
      solution: |-
        $\nabla f=\left(2,\,1,\,2\right)$ at the point. The direction vector has length $3$, so $\vec u=\left(\frac{2}{3},\,\frac{1}{3},\,\frac{2}{3}\right)$. Then $\dirder{u}{f}=\dotp{\left(2,\,1,\,2\right)}{\left(\frac{2}{3},\,\frac{1}{3},\,\frac{2}{3}\right)}=3$.
    - id: dd-06
      statement: "Find the directional derivative of $f(x,y)=xy$ at $P(1,1)$ in the direction from $P$ towards $Q(4,5)$."
      answerType: number
      answer: "7/5"
      hints:
        - |-
          Use $\dirder{u}{f}=\dotp{\nabla f}{\vec u}$ with a **unit** vector $\vec u$: divide the direction by its length first.
      solution: |-
        $\nabla f=\left(1,\,1\right)$ at the point. The direction vector has length $5$, so $\vec u=\left(\frac{3}{5},\,\frac{4}{5}\right)$. Then $\dirder{u}{f}=\dotp{\left(1,\,1\right)}{\left(\frac{3}{5},\,\frac{4}{5}\right)}=\frac{7}{5}$.
    - id: dd-07
      statement: |-
        Find the directional derivative of $f(x,y)=x^2+y^2$ at $(1,1)$ in the direction that makes the angle $\dfrac\pi3$ with the positive $x$-axis.
      answerType: expression
      answer: "1 + sqrt(3)"
      hints:
        - |-
          The unit vector at the angle $\theta$ with the $x$-axis is $(\cos\theta,\ \sin\theta)$.
      solution: |-
        The unit vector is $\vec u=\left(\cos\dfrac\pi3,\ \sin\dfrac\pi3\right)=\left(\dfrac12,\dfrac{\sqrt3}{2}\right)$ and $\nabla f(1,1)=(2,2)$. So $\dirder{u}{f}=2\cdot\dfrac12+2\cdot\dfrac{\sqrt3}{2}=1+\sqrt3$.
