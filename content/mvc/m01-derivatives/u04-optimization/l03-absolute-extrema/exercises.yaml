- id: concepts
  task: "When do absolute extreme values exist?"
  items:
    - id: ae-c1
      statement: "On which of these regions is a continuous function guaranteed to have an absolute maximum and an absolute minimum?"
      answerType: multiple_choice
      answer: "2"
      choices:
        - text: "the open disc $x^2+y^2<1$"
          value: "1"
        - text: |-
            the closed square $0\le x\le1,\ 0\le y\le1$
          value: "2"
        - text: |-
            the half-plane $y\ge0$
          value: "3"
        - text: the whole plane
          value: "4"
      correctIndex: 1
      hints:
        - "The region must be closed (contain its boundary) and bounded."
      solution: "Only the closed square is both closed and bounded. The open disc is not closed, and the half-plane and the plane are not bounded."
    - id: ae-c2
      statement: "The function $f(x,y)=x^2+y^2$ has no absolute maximum on which region?"
      answerType: multiple_choice
      answer: "3"
      choices:
        - text: |-
            the closed disc $x^2+y^2\le9$
          value: "1"
        - text: |-
            the square $|x|\le2,\ |y|\le2$
          value: "2"
        - text: |-
            the half-plane $x\ge0$
          value: "3"
      correctIndex: 2
      hints:
        - "Is the region bounded?"
      solution: "On the half-plane, which is not bounded, $f$ grows without limit. On the closed disc and the closed square the extreme value theorem guarantees a maximum."
