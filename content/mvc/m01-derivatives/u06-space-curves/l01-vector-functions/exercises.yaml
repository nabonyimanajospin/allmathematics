- id: length
  task: The length of a curve.
  format: "Type an exact value such as `3*sqrt(2)*pi` or `(2*sqrt(5)-1)/3`."
  items:
    - id: ln-01
      statement: |-
        Find the length of the curve $\vec r(t)=\left(3 t,\ 4 t\right)$ for $0\le t\le2$. The unit is lu: give the number only.
      answerType: number
      answer: "10"
      hints:
        - |-
          $L=\int\norm{\vec r\,'(t)}\,dt$. Simplify the speed first.
      solution: |-
        $\vec r\,'=\left(3,\ 4\right)$ has length $5$. Then $L=\int_{0}^{2}5\,dt=10$.
    - id: ln-02
      statement: |-
        Find the length of the curve $\vec r(t)=\left(\cos{\left(t \right)},\ \sin{\left(t \right)},\ t\right)$ for $0\le t\le\pi$. The unit is lu: give the number only.
      answerType: expression
      answer: "sqrt(2)*pi"
      hints:
        - |-
          $L=\int\norm{\vec r\,'(t)}\,dt$. Simplify the speed first.
      solution: |-
        $\vec r\,'=\left(- \sin{\left(t \right)},\ \cos{\left(t \right)},\ 1\right)$ has length $\sqrt{2}$. Then $L=\int_{0}^{\pi}\sqrt{2}\,dt=\sqrt{2} \pi$.
    - id: ln-03
      statement: |-
        Find the length of the curve $\vec r(t)=\left(t^{2},\ t^{3}\right)$ for $0\le t\le1$. The unit is lu: give the number only.
      answerType: expression
      answer: "-8/27 + 13*sqrt(13)/27"
      hints:
        - |-
          $L=\int\norm{\vec r\,'(t)}\,dt$. Simplify the speed first.
      solution: |-
        $\vec r\,'=\left(2 t,\ 3 t^{2}\right)$ has length $\sqrt{9 t^{2} + 4} \left|{t}\right|$. Then $L=\int_{0}^{1}\sqrt{9 t^{2} + 4} \left|{t}\right|\,dt=- \frac{8}{27} + \frac{13 \sqrt{13}}{27}$.
    - id: ln-04
      statement: |-
        Find the length of the curve $\vec r(t)=\left(e^{t} \cos{\left(t \right)},\ e^{t} \sin{\left(t \right)}\right)$ for $0\le t\le1$. The unit is lu: give the number only.
      answerType: expression
      answer: "sqrt(2)*(-1 + e)"
      hints:
        - |-
          $L=\int\norm{\vec r\,'(t)}\,dt$. Simplify the speed first.
      solution: |-
        $\vec r\,'=\left(- e^{t} \sin{\left(t \right)} + e^{t} \cos{\left(t \right)},\ e^{t} \sin{\left(t \right)} + e^{t} \cos{\left(t \right)}\right)$ has length $\sqrt{2} e^{t}$. Then $L=\int_{0}^{1}\sqrt{2} e^{t}\,dt=\sqrt{2} \left(-1 + e\right)$.
- id: rules
  task: Rules of differentiation.
  format: Type a number.
  items:
    - id: rl-01
      statement: |-
        A point moves on a sphere centred at the origin. Which statement is true for its velocity $\vec v$ and position $\vec r$ at every time?
      answerType: multiple_choice
      answer: "2"
      choices:
        - text: |-
            $\vec v$ is parallel to $\vec r$
          value: "1"
        - text: |-
            $\vec v$ is perpendicular to $\vec r$
          value: "2"
        - text: |-
            $\vec v=\vec 0$
          value: "3"
      correctIndex: 1
      hints:
        - |-
          Differentiate $\dotp{\vec r}{\vec r}=\text{constant}$.
      solution: |-
        $\dotp{\vec r}{\vec r}$ is constant, so $2\dotp{\vec r}{\vec r\,'}=0$: the velocity is perpendicular to the position.
    - id: rl-02
      statement: |-
        Let $\vec r(t)=(t,\ 1,\ 0)$ and $\vec s(t)=(t^2,\ t,\ 1)$. Find $\dfrac{d}{dt}\dotp{\vec r}{\vec s}$ at $t=1$.
      answerType: number
      answer: "4"
      hints:
        - |-
          Either expand $\dotp{\vec r}{\vec s}$ and differentiate, or use the product rule.
      solution: |-
        $\dotp{\vec r}{\vec s}=t^3+t$, so the derivative is $3t^2+1=4$ at $t=1$.
