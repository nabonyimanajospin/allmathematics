  items:
    - id: tg-01a
      statement: |-
        Give a direction vector of the tangent line to $\vec r(t)=\left(t,\ e^{t},\ \cos{\left(t \right)}\right)$ at $t=0$.
      answerType: direction
      answer: "(1, 1, 0)"
      hints:
        - |-
          The tangent vector is $\vec r\,'(t_0)$.
      solution: |-
        $\vec r\,'(t)=\left(1,\ e^{t},\ - \sin{\left(t \right)}\right)$, so $\vec r\,'(0)=\left(1,\,1,\,0\right)$. Any non-zero multiple is accepted.
    - id: tg-01b
      statement: |-
        Find the point of the curve $\vec r(t)=\left(t,\ e^{t},\ \cos{\left(t \right)}\right)$ at $t=0$.
      answerType: vector
      answer: "(0, 1, 1)"
      hints:
        - "Substitute the value of $t$ in each coordinate."
      solution: |-
        $\vec r(0)=\left(0,\,1,\,1\right)$.
    - id: tg-02a
      statement: |-
        Give a direction vector of the tangent line to $\vec r(t)=\left(2 t,\ t^{2},\ t^{3}\right)$ at $t=2$.
      answerType: direction
      answer: "(2, 4, 12)"
      hints:
        - |-
          The tangent vector is $\vec r\,'(t_0)$.
      solution: |-
        $\vec r\,'(t)=\left(2,\ 2 t,\ 3 t^{2}\right)$, so $\vec r\,'(2)=\left(2,\,4,\,12\right)$. Any non-zero multiple is accepted.
