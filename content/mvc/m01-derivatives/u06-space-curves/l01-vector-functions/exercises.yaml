- id: motion
  task: "Velocity, acceleration and speed."
  format: "Type a vector like `(2, -1, 3)` or an exact value such as `sqrt(5)`."
  items:
    - id: mo-01a
      statement: |-
        A point moves along $\vec r(t)=\left(t^{2},\ t^{3},\ 2 t\right)$. Find its velocity at $t=1$.
      answerType: vector
      answer: "(2, 3, 2)"
      hints:
        - "Differentiate each coordinate, then substitute $t$."
      solution: |-
        $\vec v(t)=\vec r\,'(t)=\left(2 t,\ 3 t^{2},\ 2\right)$, so $\vec v(1)=\left(2,\,3,\,2\right)$.
    - id: mo-02a
      statement: |-
        A point moves along $\vec r(t)=\left(\ln{\left(t \right)},\ t,\ t^{2}\right)$. Find its velocity at $t=1$.
      answerType: vector
      answer: "(1, 1, 2)"
      hints:
        - "Differentiate each coordinate, then substitute $t$."
      solution: |-
        $\vec v(t)=\vec r\,'(t)=\left(\frac{1}{t},\ 1,\ 2 t\right)$, so $\vec v(1)=\left(1,\,1,\,2\right)$.
    - id: mo-01b
      statement: |-
        A point moves along $\vec r(t)=\left(\cos{\left(2 t \right)},\ \sin{\left(2 t \right)}\right)$. Find its acceleration at $t=\dfrac\pi4$.
      answerType: vector
      answer: "(0, -4)"
      hints:
        - |-
          Differentiate twice: $\vec a=\vec r\,''$.
      solution: |-
        $\vec r\,''(t)=\left(- 4 \cos{\left(2 t \right)},\ - 4 \sin{\left(2 t \right)}\right)$, so $\vec a(\dfrac\pi4)=\left(0,\,-4\right)$.
    - id: mo-02b
      statement: |-
        A point moves along $\vec r(t)=\left(t,\ t^{2},\ t^{3}\right)$. Find its acceleration at $t=2$.
      answerType: vector
      answer: "(0, 2, 12)"
      hints:
        - |-
          Differentiate twice: $\vec a=\vec r\,''$.
      solution: |-
        $\vec r\,''(t)=\left(0,\ 2,\ 6 t\right)$, so $\vec a(2)=\left(0,\,2,\,12\right)$.
    - id: mo-01c
      statement: |-
        A point moves along $\vec r(t)=\left(e^{t},\ e^{- t},\ \sqrt{2} t\right)$. Find its speed at $t=0$.
      answerType: number
      answer: "2"
      hints:
        - The speed is the length of the velocity vector.
      solution: |-
        $\vec v=\left(e^{t},\ - e^{- t},\ \sqrt{2}\right)$, which at $t=0$ is $\left(1,\,-1,\,\sqrt{2}\right)$. Its length is $2$.
    - id: mo-02c
      statement: |-
        A point moves along $\vec r(t)=\left(3 \cos{\left(t \right)},\ 3 \sin{\left(t \right)},\ 4 t\right)$. Find its speed at $t=\pi$.
      answerType: number
      answer: "5"
      hints:
        - The speed is the length of the velocity vector.
      solution: |-
        $\vec v=\left(- 3 \sin{\left(t \right)},\ 3 \cos{\left(t \right)},\ 4\right)$, which at $t=\pi$ is $\left(0,\,-3,\,4\right)$. Its length is $5$.
    - id: mo-03c
      statement: |-
        A point moves along $\vec r(t)=\left(t^{2},\ 2 t\right)$. Find its speed at $t=1$.
      answerType: expression
      answer: "2*sqrt(2)"
      hints:
        - The speed is the length of the velocity vector.
      solution: |-
        $\vec v=\left(2 t,\ 2\right)$, which at $t=1$ is $\left(2,\,2\right)$. Its length is $2 \sqrt{2}$.
    - id: mo-04
      statement: |-
        For which $t$ is the tangent to the curve $\vec r(t)=(t^3-3t,\ t^2)$ horizontal?
      answerType: number
      answer: "0"
      hints:
        - |-
          A horizontal tangent has velocity $(x',0)$ with $x'\ne0$.
      solution: |-
        $\vec r\,'=(3t^2-3,\ 2t)$. The second coordinate is $0$ only for $t=0$, and there $x'=-3\ne0$.
