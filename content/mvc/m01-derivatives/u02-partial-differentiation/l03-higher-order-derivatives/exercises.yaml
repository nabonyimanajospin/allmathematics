        $$\pd{u}{y}=x z^{x y} \ln{\left(z \right)}$$

        $$\pd{u}{z}=x y z^{x y - 1}$$

        Then differentiate each of them again. The mixed derivatives do not depend on the order of differentiation (Schwarz's theorem), so one order is enough:

