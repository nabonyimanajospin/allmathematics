id: mvc-m01-u02-l05
title: Differentiability, linear approximation and errors
estMinutes: 35
version: 1
status: draft
skills:
  - linear-approximation
  - differential
objectives:
  - Say what it means for a function of two variables to be differentiable.
  - Write the linear approximation of $f(x,y)$ near a point and use it to estimate values.
  - Use the differential $df=f_x\,dx+f_y\,dy$ to estimate the error of a quantity computed from measurements.
sections:
  - id: idea
    type: concept
    title: Replacing a curved surface by a flat one
    body: |
      For a function of one variable, the tangent line at $x_0$ is the best straight-line approximation of the graph near $x_0$:
      $f(x_0+\Delta x)\approx f(x_0)+f'(x_0)\,\Delta x$.

      For $z=f(x,y)$ the same idea works with a **plane**. Near a point, a smooth surface looks almost flat, and the flat piece is
      the tangent plane. Moving by $\Delta x$ and $\Delta y$ from $(x_0,y_0)$ changes $z$ by almost exactly
      $f_x\,\Delta x+f_y\,\Delta y$, and the smaller the move, the better this is.

  - id: def-differentiable
    type: definition
    term: Differentiable function
    body: |
      A function $f(x,y)$ is **differentiable** at $(x_0,y_0)$ if the change $\Delta f=f(x_0+\Delta x,\,y_0+\Delta y)-f(x_0,y_0)$ can be written

      $$\Delta f=f_x(x_0,y_0)\,\Delta x+f_y(x_0,y_0)\,\Delta y+\varepsilon,$$

      where the error $\varepsilon$ is so small that $\dfrac{\varepsilon}{\sqrt{(\Delta x)^2+(\Delta y)^2}}\to0$ as $(\Delta x,\Delta y)\to(0,0)$.
      Geometrically: the graph has a tangent plane at the point.
    more: |
      Having partial derivatives is **not** enough: a function can have $f_x$ and $f_y$ at a point and still have no tangent plane there.
      A useful sufficient condition is the next theorem.

  - id: thm-continuous
    type: theorem
    name: A sufficient condition
    statement: |
      If $f_x$ and $f_y$ exist near $(x_0,y_0)$ and are continuous at $(x_0,y_0)$, then $f$ is differentiable at $(x_0,y_0)$.
      Every polynomial, exponential, sine and cosine, and every quotient and composition of them (where defined), satisfies this
      at each point of its domain.

  - id: formula-linear
    type: formula
    title: Linear approximation and differential
    formula: |
      f(x,y)\approx f(a,b)+f_x(a,b)\,(x-a)+f_y(a,b)\,(y-b)
    note: |
      The right side is the **linearization** $L(x,y)$ of $f$ at $(a,b)$; its graph is the tangent plane. Writing
      $\Delta x=x-a$ and $\Delta y=y-b$, the change is $\Delta f\approx f_x\,\Delta x+f_y\,\Delta y$. The right side is the
      **differential** $df=f_x\,dx+f_y\,dy$.

  - id: ex-estimate
    type: example
    title: Estimating a value
    problem: |
      Use a linear approximation to estimate $f(x,y)=\sqrt{x^2+y^2}$ at $\left(3+\dfrac1{50},\ 4-\dfrac1{100}\right)$.
    steps:
      - text: |
          Choose the nearby point $(a,b)=(3,4)$, where everything is exact: $f(3,4)=5$.
        why: |
          A good base point is close to the target and gives easy values: $\sqrt{9+16}=5$.
      - |
        $f_x=\dfrac{x}{\sqrt{x^2+y^2}}$ and $f_y=\dfrac{y}{\sqrt{x^2+y^2}}$, so $f_x(3,4)=\dfrac35$ and $f_y(3,4)=\dfrac45$.
      - |
        $\Delta x=\dfrac1{50}$ and $\Delta y=-\dfrac1{100}$, so
        $f\approx5+\dfrac35\cdot\dfrac1{50}-\dfrac45\cdot\dfrac1{100}=5+\dfrac{6}{500}-\dfrac{4}{500}=5+\dfrac1{250}=\dfrac{1251}{250}$.
    answer: |
      $f\approx\dfrac{1251}{250}$.
    verify:
      - expr: "5+3/5*(1/50)-4/5*(1/100)"
        equals: "1251/250"

  - id: chk-estimate
    type: check
    prompt: |
      Let $f(x,y)=xy^2$. Use the linear approximation at $(1,2)$ to estimate $f\left(\dfrac{11}{10},\ \dfrac{39}{20}\right)$.
    answerType: number
    answer: "21/5"
    hints:
      - |
        $f(1,2)=4$, $f_x=y^2=4$ and $f_y=2xy=4$ at $(1,2)$.
    explanation: |
      $\Delta x=\dfrac1{10}$ and $\Delta y=-\dfrac1{20}$, so $f\approx4+4\cdot\dfrac1{10}-4\cdot\dfrac1{20}=4+\dfrac25-\dfrac15=\dfrac{21}{5}$.

  - id: ex-error
    type: example
    title: The error of a measured volume
    problem: |
      The radius and the height of a cylinder are measured as $r=5$ lu and $h=10$ lu, each with an error of at most $\dfrac1{100}$ lu.
      Estimate the largest error in the volume $V=\pi r^2h$.
    steps:
      - |
        $dV=V_r\,dr+V_h\,dh=2\pi rh\,dr+\pi r^2\,dh$.
      - text: |
          At $r=5$, $h=10$: $V_r=100\pi$ and $V_h=25\pi$. With $|dr|\le\dfrac1{100}$ and $|dh|\le\dfrac1{100}$:
          $|dV|\le100\pi\cdot\dfrac1{100}+25\pi\cdot\dfrac1{100}=\dfrac{5\pi}{4}$.
        why: |
          The worst case is when both errors push the volume in the same direction, so we add the absolute values of the two contributions.
    answer: |
      The volume is $250\pi$ cu with an error of about $\dfrac{5\pi}{4}$ cu at most.
    verify:
      - expr: "2*pi*5*10"
        equals: "100*pi"
      - expr: "100*pi/100+25*pi/100"
        equals: "5*pi/4"

  - id: chk-error
    type: check
    prompt: |
      The sides of a rectangle are measured as $x=10$ lu and $y=20$ lu, each with an error of at most $\dfrac1{10}$ lu. Estimate the largest error of the area $A=xy$ (in squ).
    answerType: number
    answer: "3"
    hints:
      - |
        $dA=y\,dx+x\,dy$.
    explanation: |
      $|dA|\le20\cdot\dfrac1{10}+10\cdot\dfrac1{10}=2+1=3$.

  - id: summary
    type: summary
    points:
      - |
        A function is differentiable at a point when its graph has a tangent plane there; continuous partial derivatives are enough.
      - |
        Linear approximation: $f(x,y)\approx f(a,b)+f_x(a,b)(x-a)+f_y(a,b)(y-b)$, best for points close to $(a,b)$.
      - |
        Differential: $df=f_x\,dx+f_y\,dy$. For a measured quantity, the largest error is about $|f_x|\,|dx|+|f_y|\,|dy|$.
      - |
        Choose the base point so that $f$ and its partial derivatives are easy to compute exactly.
