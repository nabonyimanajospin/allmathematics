- id: errors
  task: "Estimate the largest error of a computed quantity (the unit is in the statement; give the number only)."
  format: "Type an exact value such as `7/10` or `2*pi`."
  items:
    - id: er-01
      statement: |-
        A rectangle has sides $x=10$ lu and $y=20$ lu, each measured with an error of at most $\dfrac1{10}$ lu. Estimate the largest error of its area $A=xy$ (in squ).
      answerType: number
      answer: "3"
      hints:
        - |-
          Use $dQ=\sum \dfrac{\partial Q}{\partial x_i}\,dx_i$ and add the absolute values.
      solution: |-
        $dA=y\,dx+x\,dy$, so $|dA|\le20\cdot\dfrac1{10}+10\cdot\dfrac1{10}=3$.
    - id: er-02
      statement: |-
        The radius and height of a cylinder are $r=5$ lu and $h=10$ lu, each with an error of at most $\dfrac1{100}$ lu. Estimate the largest error of the volume $V=\pi r^2h$ (in cu).
      answerType: expression
      answer: "5*pi/4"
      hints:
        - |-
          Use $dQ=\sum \dfrac{\partial Q}{\partial x_i}\,dx_i$ and add the absolute values.
      solution: |-
        $dV=2\pi rh\,dr+\pi r^2\,dh$, so $|dV|\le100\pi\cdot\dfrac1{100}+25\pi\cdot\dfrac1{100}=\frac{5 \pi}{4}$.
    - id: er-03
      statement: |-
        The legs of a right triangle are $a=6$ lu and $b=8$ lu, each with an error of at most $\dfrac1{20}$ lu. Estimate the largest error of the hypotenuse $c=\sqrt{a^2+b^2}$ (in lu).
      answerType: number
      answer: "7/100"
      hints:
        - |-
          Use $dQ=\sum \dfrac{\partial Q}{\partial x_i}\,dx_i$ and add the absolute values.
      solution: |-
        $dc=\dfrac{a}{c}\,da+\dfrac{b}{c}\,db$ with $c=10$, so $|dc|\le\dfrac{6}{10}\cdot\dfrac1{20}+\dfrac{8}{10}\cdot\dfrac1{20}=\frac{7}{100}$.
    - id: er-04
      statement: |-
        The sides of a box are $x=2$ lu, $y=3$ lu and $z=4$ lu, each with an error of at most $\dfrac1{50}$ lu. Estimate the largest error of its volume $V=xyz$ (in cu).
      answerType: number
      answer: "13/25"
      hints:
        - |-
          Use $dQ=\sum \dfrac{\partial Q}{\partial x_i}\,dx_i$ and add the absolute values.
      solution: |-
        $dV=yz\,dx+xz\,dy+xy\,dz$, so $|dV|\le\left(12+8+6\right)\cdot\dfrac1{50}=\frac{13}{25}$.
- id: differentials
