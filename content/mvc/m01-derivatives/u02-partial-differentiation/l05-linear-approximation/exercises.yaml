    - id: df-01
      statement: |-
        Let $f(x,y)=x^2y^3$. Compute the differential $df=f_x\,dx+f_y\,dy$ at $(1,2)$ for $dx=\frac{1}{10}$ and $dy=- \frac{1}{20}$.
      answerType: number
      answer: "1"
      hints:
        - "Evaluate $f_x$ and $f_y$ at the point, then multiply by $dx$ and $dy$."
      solution: |-
        $f_x=16$ and $f_y=12$ at the point, so $df=16\cdot\frac{1}{10}+12\cdot- \frac{1}{20}=1$.
    - id: df-02
      statement: |-
        Let $f(x,y)=\ln\left(x^2+y^2\right)$. Compute the differential $df=f_x\,dx+f_y\,dy$ at $(1,1)$ for $dx=\frac{1}{10}$ and $dy=\frac{1}{20}$.
      answerType: number
      answer: "3/20"
      hints:
        - "Evaluate $f_x$ and $f_y$ at the point, then multiply by $dx$ and $dy$."
      solution: |-
        $f_x=1$ and $f_y=1$ at the point, so $df=1\cdot\frac{1}{10}+1\cdot\frac{1}{20}=\frac{3}{20}$.
    - id: df-03
      statement: "Which statement guarantees that $f(x,y)$ is differentiable at a point?"
      answerType: multiple_choice
      answer: "2"
      choices:
        - text: "$f_x$ and $f_y$ exist at the point"
          value: "1"
        - text: "$f_x$ and $f_y$ exist near the point and are continuous at it"
          value: "2"
        - text: "$f$ is defined at the point"
          value: "3"
      correctIndex: 1
      hints:
        - |-
          Having partial derivatives alone is not enough: the graph might have no tangent plane.
      solution: "Continuous partial derivatives near the point imply differentiability. The existence of $f_x$ and $f_y$ at the point alone does not."
    - id: df-04
      statement: |-
        The sides $x$ and $y$ of a rectangle are each measured with a relative error of at most $1\%$. Estimate the largest relative error of the area $A=xy$, in percent (give the number only).
      answerType: number
      answer: "2"
      hints:
        - |-
          Take the logarithm: $\ln A=\ln x+\ln y$, so $\dfrac{dA}{A}=\dfrac{dx}{x}+\dfrac{dy}{y}$.
      solution: |-
        $\dfrac{dA}{A}=\dfrac{dx}{x}+\dfrac{dy}{y}$, so the relative errors add: $1\%+1\%=2\%$.
