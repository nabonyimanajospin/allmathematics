      solution: |-
        Differentiate with respect to each variable in turn, treating the other variables as constants.

        $$\pd{z}{x}=- \dfrac{y e^{\sin{\left(\dfrac{y}{x} \right)}} \cos{\left(\dfrac{y}{x} \right)}}{x^{2}}$$

        $$\pd{z}{y}=\dfrac{e^{\sin{\left(\dfrac{y}{x} \right)}} \cos{\left(\dfrac{y}{x} \right)}}{x}$$
      verify:
