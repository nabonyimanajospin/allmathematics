      solution: |-
        Differentiate with respect to each variable in turn, treating the other variables as constants.

        $$\pd{z}{x}=\dfrac{\sqrt{2} x y^{2} \sqrt{\dfrac{x^{2} - y^{2}}{x^{2} + y^{2}}}}{\left(x^{2} - y^{2}\right) \sqrt{x^{2} + y^{2}} \left|{y}\right|}$$

        $$\pd{z}{y}=- \dfrac{\sqrt{2} x^{2} y \sqrt{\dfrac{x^{2} - y^{2}}{x^{2} + y^{2}}}}{\left(x^{2} - y^{2}\right) \sqrt{x^{2} + y^{2}} \left|{y}\right|}$$
      verify:
        - expr: "diff(asin(sqrt((x^2-y^2)/(x^2+y^2))), x)"
          equals: "sqrt(2)*x*y^2*sqrt((x^2 - y^2)/(x^2 + y^2))/((x^2 - y^2)*sqrt(x^2 + y^2)*abs(y))"
        - expr: "diff(asin(sqrt((x^2-y^2)/(x^2+y^2))), y)"
          equals: "-sqrt(2)*x^2*y*sqrt((x^2 - y^2)/(x^2 + y^2))/((x^2 - y^2)*sqrt(x^2 + y^2)*abs(y))"
    - id: par-09
      statement: "$u=(xy)^z$"
