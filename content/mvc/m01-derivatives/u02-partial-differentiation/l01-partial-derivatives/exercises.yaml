    - id: par-08
      statement: |-
        $z=\arcsin\sqrt{\dfrac{x^2-y^2}{x^2+y^2}}$
      answerType: vector
      answer: "(sqrt(2)*x*y^2*sqrt((x^2 - y^2)/(x^2 + y^2))/((x^2 - y^2)*sqrt(x^2 + y^2)*abs(y)), -sqrt(2)*x^2*y*sqrt((x^2 - y^2)/(x^2 + y^2))/((x^2 - y^2)*sqrt(x^2 + y^2)*abs(y)))"
      variables:
        [x, y]
      hints:
        - |-
