- id: differentials
  task: Find the total differential of each function.
  format: |-
    Write $dz=A\,dx+B\,dy$ and type the coefficients as a vector `(A, B)`. For a function $u$ of three variables type `(A, B, C)`.
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: dif-01
      statement: "$z=x^2y^2$"
      answerType: vector
      answer: "(2*x*y^2, 2*x^2*y)"
      variables:
        [x, y]
      hints:
        - "Find $z_x$ and $z_y$; the coefficients of $dx$ and $dy$ are exactly these."
      solution: |-
        The total differential is the sum of each partial derivative times the differential of its variable.

        $$\pd{z}{x}=2 x y^{2}$$

        $$\pd{z}{y}=2 x^{2} y$$

        Therefore $$dz=\left(2 x y^{2}\right)\,dx + \left(2 x^{2} y\right)\,dy.$$
      verify:
        - expr: "diff(x^2*y^2, x)"
          equals: "2*x*y^2"
        - expr: "diff(x^2*y^2, y)"
          equals: "2*x^2*y"
    - id: dif-02
      statement: |-
        $z=\sin^2x+\cos^2y$
      answerType: vector
      answer: "(sin(2*x), -sin(2*y))"
      variables:
        [x, y]
      hints:
        - |-
          $\dfrac{d}{dx}\sin^2x=2\sin x\cos x$.
      solution: |-
        The total differential is the sum of each partial derivative times the differential of its variable.

        $$\pd{z}{x}=\sin{\left(2 x \right)}$$

        $$\pd{z}{y}=- \sin{\left(2 y \right)}$$

        Therefore $$dz=\left(\sin{\left(2 x \right)}\right)\,dx + \left(- \sin{\left(2 y \right)}\right)\,dy.$$
      verify:
        - expr: "diff(sin(x)^2+cos(y)^2, x)"
          equals: "sin(2*x)"
        - expr: "diff(sin(x)^2+cos(y)^2, y)"
          equals: "-sin(2*y)"
    - id: dif-03
      statement: |-
        $z=\ln\tan\dfrac yx$
      answerType: vector
      answer: "(-2*y/(x^2*sin(2*y/x)), 2/(x*sin(2*y/x)))"
      variables:
        [x, y]
      hints:
        - |-
          Chain rule: $\dfrac{d}{du}\ln\tan u=\dfrac{1}{\sin u\cos u}$ with $u=\dfrac yx$.
      solution: |-
        The total differential is the sum of each partial derivative times the differential of its variable.

        $$\pd{z}{x}=- \dfrac{2 y}{x^{2} \sin{\left(\dfrac{2 y}{x} \right)}}$$

        $$\pd{z}{y}=\dfrac{2}{x \sin{\left(\dfrac{2 y}{x} \right)}}$$

        Therefore $$dz=\left(- \dfrac{2 y}{x^{2} \sin{\left(\dfrac{2 y}{x} \right)}}\right)\,dx + \left(\dfrac{2}{x \sin{\left(\dfrac{2 y}{x} \right)}}\right)\,dy.$$
      verify:
        - expr: "diff(ln(tan(y/x)), x)"
          equals: "-2*y/(x^2*sin(2*y/x))"
        - expr: "diff(ln(tan(y/x)), y)"
          equals: "2/(x*sin(2*y/x))"
    - id: dif-04
      statement: "$z=yx^y$"
      answerType: vector
      answer: "(x^(y - 1)*y^2, x^y*(y*ln(x) + 1))"
      variables:
        [x, y]
      hints:
        - "Product rule in $y$; the exponent $y$ also appears in $x^y$."
      solution: |-
        The total differential is the sum of each partial derivative times the differential of its variable.

        $$\pd{z}{x}=x^{y - 1} y^{2}$$

        $$\pd{z}{y}=x^{y} \left(y \ln{\left(x \right)} + 1\right)$$

        Therefore $$dz=\left(x^{y - 1} y^{2}\right)\,dx + \left(x^{y} \left(y \ln{\left(x \right)} + 1\right)\right)\,dy.$$
      verify:
        - expr: "diff(y*x^y, x)"
          equals: "x^(y - 1)*y^2"
        - expr: "diff(y*x^y, y)"
          equals: "x^y*(y*ln(x) + 1)"
    - id: dif-05
      statement: |-
        $z=\dfrac{x^2-y^2}{x^2+y^2}$
      answerType: vector
      answer: "(4*x*y^2/(x^2 + y^2)^2, -4*x^2*y/(x^2 + y^2)^2)"
      variables:
        [x, y]
      hints:
        - Quotient rule.
      solution: |-
        The total differential is the sum of each partial derivative times the differential of its variable.

        $$\pd{z}{x}=\dfrac{4 x y^{2}}{\left(x^{2} + y^{2}\right)^{2}}$$

        $$\pd{z}{y}=- \dfrac{4 x^{2} y}{\left(x^{2} + y^{2}\right)^{2}}$$

        Therefore $$dz=\left(\dfrac{4 x y^{2}}{\left(x^{2} + y^{2}\right)^{2}}\right)\,dx + \left(- \dfrac{4 x^{2} y}{\left(x^{2} + y^{2}\right)^{2}}\right)\,dy.$$
      verify:
        - expr: "diff((x^2-y^2)/(x^2+y^2), x)"
          equals: "4*x*y^2/(x^2 + y^2)^2"
        - expr: "diff((x^2-y^2)/(x^2+y^2), y)"
          equals: "-4*x^2*y/(x^2 + y^2)^2"
    - id: dif-06
      statement: |-
        $z=\arctan\dfrac yx+\arctan\dfrac xy$
      answerType: vector
      answer: "(0, 0)"
      variables:
        [x, y]
      hints:
        - "Compute $z_x$ and $z_y$ carefully, and compare the two arctangent terms."
      solution: |-
        The total differential is the sum of each partial derivative times the differential of its variable.

        $$\pd{z}{x}=0$$

        $$\pd{z}{y}=0$$

        Therefore $$dz=0.$$

        This is not an accident: for $x,y>0$ we have $\arctan\dfrac yx+\arctan\dfrac xy=\dfrac\pi2$, so the function is constant on each quadrant, and a constant has differential $0$.
      verify:
        - expr: "diff(atan(y/x)+atan(x/y), x)"
          equals: "0"
        - expr: "diff(atan(y/x)+atan(x/y), y)"
          equals: "0"
    - id: dif-07
      statement: |-
        $u=\dfrac{z}{\sqrt{x^2+y^2}}$
      answerType: vector
      answer: "(-x*z/(x^2 + y^2)^(3/2), -y*z/(x^2 + y^2)^(3/2), 1/sqrt(x^2 + y^2))"
      variables:
        [x, y, z]
      hints:
        - "Treat $z$ as a constant when differentiating in $x$ and $y$."
      solution: |-
        The total differential is the sum of each partial derivative times the differential of its variable.

        $$\pd{u}{x}=- \dfrac{x z}{\left(x^{2} + y^{2}\right)^{\dfrac{3}{2}}}$$

        $$\pd{u}{y}=- \dfrac{y z}{\left(x^{2} + y^{2}\right)^{\dfrac{3}{2}}}$$

        $$\pd{u}{z}=\dfrac{1}{\sqrt{x^{2} + y^{2}}}$$

        Therefore $$du=\left(- \dfrac{x z}{\left(x^{2} + y^{2}\right)^{\dfrac{3}{2}}}\right)\,dx + \left(- \dfrac{y z}{\left(x^{2} + y^{2}\right)^{\dfrac{3}{2}}}\right)\,dy + \left(\dfrac{1}{\sqrt{x^{2} + y^{2}}}\right)\,dz.$$
      verify:
        - expr: "diff(z/sqrt(x^2+y^2), x)"
          equals: "-x*z/(x^2 + y^2)^(3/2)"
        - expr: "diff(z/sqrt(x^2+y^2), y)"
          equals: "-y*z/(x^2 + y^2)^(3/2)"
        - expr: "diff(z/sqrt(x^2+y^2), z)"
          equals: "1/sqrt(x^2 + y^2)"
    - id: dif-08
      statement: "$u=yxz$"
      answerType: vector
      answer: "(y*z, x*z, x*y)"
      variables:
        [x, y, z]
      hints:
        - Each partial derivative is the product of the other two variables.
      solution: |-
        The total differential is the sum of each partial derivative times the differential of its variable.

        $$\pd{u}{x}=y z$$

        $$\pd{u}{y}=x z$$

        $$\pd{u}{z}=x y$$

        Therefore $$du=\left(y z\right)\,dx + \left(x z\right)\,dy + \left(x y\right)\,dz.$$
      verify:
        - expr: "diff(y*x*z, x)"
          equals: "y*z"
        - expr: "diff(y*x*z, y)"
          equals: "x*z"
        - expr: "diff(y*x*z, z)"
          equals: "x*y"
