- id: first-order
  task: Calculate the partial derivatives of the first order of each function.
  format: |-
    Type the partial derivatives as a vector, in the order of the variables: `(derivative in x, derivative in y)`, and a third entry for $z$ when the function has three variables. For example `(2*x, 3*y)`.
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: par-01
      statement: "$z=x^2+y^2-3xy$"
      answerType: vector
      answer: "(2*x - 3*y, -3*x + 2*y)"
      variables:
        [x, y]
      hints:
        - |-
          Differentiate term by term; in $\pd zx$ the variable $y$ is a constant.
      solution: |-
        Differentiate with respect to each variable in turn, treating the other variables as constants.

        $$\pd{z}{x}=2 x - 3 y$$

        $$\pd{z}{y}=- 3 x + 2 y$$
      verify:
        - expr: "diff(x^2+y^2-3*x*y, x)"
          equals: "2*x - 3*y"
        - expr: "diff(x^2+y^2-3*x*y, y)"
          equals: "-3*x + 2*y"
    - id: par-02
      statement: "$z=x^y$"
      answerType: vector
      answer: "(x^(y - 1)*y, x^y*ln(x))"
      variables:
        [x, y]
      hints:
        - |-
          In $\pd zx$ the exponent $y$ is a constant (power rule). In $\pd zy$ the base $x$ is a constant: $\dfrac{d}{dy}a^y=a^y\ln a$.
      solution: |-
        Differentiate with respect to each variable in turn, treating the other variables as constants.

        $$\pd{z}{x}=x^{y - 1} y$$

        $$\pd{z}{y}=x^{y} \ln{\left(x \right)}$$
      verify:
        - expr: "diff(x^y, x)"
          equals: "x^(y - 1)*y"
        - expr: "diff(x^y, y)"
          equals: "x^y*ln(x)"
    - id: par-03
      statement: |-
        $z=\arctan\dfrac yx$
