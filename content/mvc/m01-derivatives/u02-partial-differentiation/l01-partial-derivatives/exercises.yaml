      solution: |-
        Differentiate with respect to each variable in turn, treating the other variables as constants.

        $$\pd{z}{x}=- \dfrac{y}{x^{2} + y^{2}}$$

        $$\pd{z}{y}=\dfrac{x}{x^{2} + y^{2}}$$
      verify:
        - expr: "diff(atan(y/x), x)"
          equals: "-y/(x^2 + y^2)"
        - expr: "diff(atan(y/x), y)"
          equals: "x/(x^2 + y^2)"
    - id: par-04
      statement: |-
        $z=e^{\sin\frac yx}$
