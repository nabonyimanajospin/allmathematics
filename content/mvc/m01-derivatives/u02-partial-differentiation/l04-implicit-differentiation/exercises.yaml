  task: Calculate the derivatives of the functions given implicitly.
  format: "Type the derivatives as a vector in terms of the variables of the equation, for example `(y', y'')` written as `(expression, expression)`. An answer is accepted when it has the same values as the correct one on the curve (or surface). For a second derivative you may write the first derivative as `y'`."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: imp-01
      statement: |-
        $\dfrac{dy}{dx}$ and $\dfrac{d^2y}{dx^2}$ if $y=1+y^x$
      answerType: vector
      answer: "(-y^(x + 1)*ln(y)/(x*y^x - y), (-y^(x + 2)*y1*((x*y^x - y)*((x + 1)*ln(y) + 1) - (x^2*y^x - y)*ln(y)) - y^(x + 3)*(x*y^x - y)*ln(y)^2 + y^(2*x + 3)*(x*ln(y) + 1)*ln(y))/(y^2*(x*y^x - y)^2))"
      variables:
        [x, y, y1]
      constraint:
        equation: "y - y^x - 1"
        solveFor: y
        ranges:
          x:
            [0.2, 0.8]
        substitutions:
          y1: "-y^(x + 1)*ln(y)/(x*y^x - y)"
      hints:
        - |-
          Write the equation as $F(x,y)=y-1-y^x=0$. The derivative of $y^x$ with respect to $y$ is $xy^{x-1}$, and with respect to $x$ it is $y^x\ln y$.
      solution: |-
        With $F(x,y)=y - y^{x} - 1$ we get $F_x=- y^{x} \ln{\left(y \right)}$ and $F_y=\frac{- x y^{x} + y}{y}$.

        $$\dfrac{dy}{dx}=-\dfrac{F_x}{F_y}=- \dfrac{y^{x + 1} \ln{\left(y \right)}}{x y^{x} - y}.$$

        For the second derivative, differentiate $y'$ with respect to $x$. Since $y$ depends on $x$, the chain rule gives $y''=\dfrac{\partial y'}{\partial x}+\dfrac{\partial y'}{\partial y}\,y'$, that is

        $$\dfrac{d^2y}{dx^2}=\dfrac{- y^{x + 2} y' \left(\left(x y^{x} - y\right) \left(\left(x + 1\right) \ln{\left(y \right)} + 1\right) - \left(x^{2} y^{x} - y\right) \ln{\left(y \right)}\right) - y^{x + 3} \left(x y^{x} - y\right) \ln{\left(y \right)}^{2} + y^{2 x + 3} \left(x \ln{\left(y \right)} + 1\right) \ln{\left(y \right)}}{y^{2} \left(x y^{x} - y\right)^{2}}.$$

        Here $y'$ is the first derivative found above. You may leave $y'$ in the answer, or replace it by its formula: on the curve both forms have the same values, and any such form is accepted.
    - id: imp-02
      statement: |-
