      constraint:
        equation: "-1 + y^2/b^2 + x^2/a^2"
        solveFor: y
        ranges:
          x:
            [0.1, 0.5]
          a:
            [1.0, 2.0]
          b:
            [1.0, 2.0]
        substitutions:
