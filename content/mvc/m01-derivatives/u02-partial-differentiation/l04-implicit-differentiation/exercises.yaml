          y:
            [0.5, 2.0]
      hints:
        - "Take $F=x^2+y^2-z^2-xy$; note that $F_z=-2z$."
      solution: |-
        With $F(x,y,z)=x^{2} - x y + y^{2} - z^{2}$ we get $F_x=2 x - y$, $F_y=- x + 2 y$, $F_z=- 2 z$.

        $$\pd zx=-\dfrac{F_x}{F_z}=\dfrac{x - \dfrac{y}{2}}{z},\qquad \pd zy=-\dfrac{F_y}{F_z}=\dfrac{- \dfrac{x}{2} + y}{z}.$$
