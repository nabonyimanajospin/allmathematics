        - |-
          Take $F=x\cos y+y\cos z+z\cos x-1$ and compute $F_x$, $F_y$, $F_z$.
      solution: |-
        With $F(x,y,z)=x \cos{\left(y \right)} + y \cos{\left(z \right)} + z \cos{\left(x \right)} - 1$ we get $F_x=- z \sin{\left(x \right)} + \cos{\left(y \right)}$, $F_y=- x \sin{\left(y \right)} + \cos{\left(z \right)}$, $F_z=- y \sin{\left(z \right)} + \cos{\left(x \right)}$.

        $$\pd zx=-\dfrac{F_x}{F_z}=\dfrac{- z \sin{\left(x \right)} + \cos{\left(y \right)}}{y \sin{\left(z \right)} - \cos{\left(x \right)}},\qquad \pd zy=-\dfrac{F_y}{F_z}=\dfrac{- x \sin{\left(y \right)} + \cos{\left(z \right)}}{y \sin{\left(z \right)} - \cos{\left(x \right)}}.$$
