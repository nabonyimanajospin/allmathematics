      constraint:
        equation: "exp(x)*sin(y) + exp(y)*sin(x) - 1"
        solveFor: y
        ranges:
          x:
            [0.1, 0.5]
        substitutions:
          y1: "-(exp(x)*sin(y) + exp(y)*cos(x))/(exp(x)*cos(y) + exp(y)*sin(x))"
      hints:
        - |-
          Take $F=e^x\sin y+e^y\sin x-1$ and use $y'=-\dfrac{F_x}{F_y}$.
      solution: |-
        With $F(x,y)=e^{x} \sin{\left(y \right)} + e^{y} \sin{\left(x \right)} - 1$ we get $F_x=e^{x} \sin{\left(y \right)} + e^{y} \cos{\left(x \right)}$ and $F_y=e^{x} \cos{\left(y \right)} + e^{y} \sin{\left(x \right)}$.

        $$\dfrac{dy}{dx}=-\dfrac{F_x}{F_y}=- \dfrac{e^{x} \sin{\left(y \right)} + e^{y} \cos{\left(x \right)}}{e^{x} \cos{\left(y \right)} + e^{y} \sin{\left(x \right)}}.$$

        For the second derivative, differentiate $y'$ with respect to $x$. Since $y$ depends on $x$, the chain rule gives $y''=\dfrac{\partial y'}{\partial x}+\dfrac{\partial y'}{\partial y}\,y'$, that is

        $$\dfrac{d^2y}{dx^2}=\dfrac{- y' e^{2 x} - \sqrt{2} y' e^{x + y} \sin{\left(x + y + \dfrac{\pi}{4} \right)} + e^{2 y} + \sqrt{2} e^{x + y} \sin{\left(x + y + \dfrac{\pi}{4} \right)}}{\left(e^{x} \cos{\left(y \right)} + e^{y} \sin{\left(x \right)}\right)^{2}}.$$

        Here $y'$ is the first derivative found above. You may leave $y'$ in the answer, or replace it by its formula: on the curve both forms have the same values, and any such form is accepted.
