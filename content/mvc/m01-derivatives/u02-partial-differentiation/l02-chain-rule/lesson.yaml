id: mvc-m01-u02-l02
title: The chain rule
estMinutes: 35
version: 1
status: draft
skills:
  - chain-rule
objectives:
  - Differentiate a composite function $z=f(x,y)$ where $x$ and $y$ depend on one or two other variables.
  - Organize the computation with a tree of dependencies.
  - Decide when it is simpler to substitute first.
sections:
  - id: two-routes
    type: concept
    title: A change can travel along two routes
    body: |
      Let $z=f(x,y)$, where $x=x(t)$ and $y=y(t)$ both depend on a third variable $t$, for example time. When $t$
      increases a little, $x$ changes and $y$ changes, and each of these changes affects $z$.

      So $z$ depends on $t$ through **two routes**: $t\to x\to z$ and $t\to y\to z$. The rate of change of $z$ with
      respect to $t$ is the sum of the contributions of the two routes.

  - id: chain-one
    type: theorem
    name: Chain rule, one parameter
    statement: |
      If $z=f(x,y)$ has continuous partial derivatives, and $x=x(t)$, $y=y(t)$ are differentiable, then

      $$\dfrac{dz}{dt}=\pd zx\,\dfrac{dx}{dt}+\pd zy\,\dfrac{dy}{dt}.$$

      For $u=f(x,y,z)$ with $x,y,z$ depending on $t$, add a third term $\pd uz\,\dfrac{dz}{dt}$.
    proof: |
      Idea of the proof. By the total differential, $dz\approx z_x\,dx+z_y\,dy$. Divide by a small $dt$, and let
      $dt\to0$: the ratios $\frac{dx}{dt}$ and $\frac{dy}{dt}$ become derivatives. The continuity of $z_x$ and $z_y$ is
      what makes the approximation by the total differential valid.

  - id: chain-two
    type: theorem
    name: Chain rule, two parameters
    statement: |
      If $z=f(x,y)$ and $x=x(u,v)$, $y=y(u,v)$, then

      $$\pd zu=\pd zx\,\pd xu+\pd zy\,\pd yu,\qquad \pd zv=\pd zx\,\pd xv+\pd zy\,\pd yv.$$

  - id: tree
    type: concept
    title: A tree keeps track of the terms
    body: |
      Draw $z$ at the top, with a branch to each variable it depends on ($x$ and $y$), and from each of them a branch to
      the variables they depend on ($t$, or $u$ and $v$). Write the partial derivative on each branch.

      To get $\pd zu$: follow **every path** from $z$ down to $u$, **multiply** the derivatives along the path, then
      **add** the results of the different paths. With $z\to x\to u$ and $z\to y\to u$ you obtain
      $z_x\,x_u+z_y\,y_u$.

  - id: ex-chain-one
    type: example
    title: One parameter
    problem: |
      Find $\dfrac{dz}{dt}$ for $z=x^2+xy$, with $x=\cos t$ and $y=\sin t$.
    steps:
      - |
        The partial derivatives are $z_x=2x+y$ and $z_y=x$. The derivatives of the inner functions are
        $\dfrac{dx}{dt}=-\sin t$ and $\dfrac{dy}{dt}=\cos t$.
      - |
        By the chain rule, $\dfrac{dz}{dt}=(2x+y)(-\sin t)+x\cos t$.
      - |
        Replace $x$ and $y$ by $\cos t$ and $\sin t$:
        $\dfrac{dz}{dt}=-(2\cos t+\sin t)\sin t+\cos^2t$.
    answer: |
      $\dfrac{dz}{dt}=\cos^2t-2\sin t\cos t-\sin^2t$.
    verify:
      - expr: "diff(cos(t)^2+cos(t)*sin(t), t)"
        equals: "(2*cos(t)+sin(t))*(-sin(t))+cos(t)*cos(t)"
      - expr: "(2*cos(t)+sin(t))*(-sin(t))+cos(t)*cos(t)"
        equals: "cos(t)^2-2*sin(t)*cos(t)-sin(t)^2"

  - id: chk-chain
    type: check
    prompt: |
      Let $z=xy$ with $x=t^2$ and $y=1+t$. Find $\dfrac{dz}{dt}$ as a function of $t$.
    answerType: expression
    variables: [t]
    answer: "3*t^2+2*t"
    hints:
      - |
        $\dfrac{dz}{dt}=y\cdot\dfrac{dx}{dt}+x\cdot\dfrac{dy}{dt}$.
    explanation: |
      $\dfrac{dz}{dt}=(1+t)(2t)+t^2\cdot1=3t^2+2t$. (Check by substitution: $z=t^2(1+t)=t^2+t^3$, whose derivative is $2t+3t^2$.)

  - id: ex-chain-two
    type: example
    title: Two parameters
    problem: |
      Let $z=e^{xy}$ with $x=u+v$ and $y=u-v$. Find $\pd zu$ and $\pd zv$.
    steps:
      - |
        $z_x=ye^{xy}$ and $z_y=xe^{xy}$. Also $x_u=1$, $y_u=1$, $x_v=1$, $y_v=-1$.
      - |
        $\pd zu=ye^{xy}\cdot1+xe^{xy}\cdot1=(x+y)e^{xy}$, and $\pd zv=ye^{xy}\cdot1+xe^{xy}\cdot(-1)=(y-x)e^{xy}$.
      - |
        Since $x+y=2u$, $y-x=-2v$ and $xy=u^2-v^2$:
        $\pd zu=2u\,e^{u^2-v^2}$ and $\pd zv=-2v\,e^{u^2-v^2}$.
    answer: |
      $\pd zu=2u\,e^{u^2-v^2}$ and $\pd zv=-2v\,e^{u^2-v^2}$.
    verify:
      - expr: "diff(e^((u+v)*(u-v)), u)"
        equals: "2*u*e^(u^2-v^2)"
      - expr: "diff(e^((u+v)*(u-v)), v)"
        equals: "-2*v*e^(u^2-v^2)"

  - id: chk-chain-two
    type: check
    prompt: |
      Let $z=x^2+y^2$ with $x=u+v$ and $y=u-v$. Find $\left(\pd zu,\ \pd zv\right)$ as functions of $u$ and $v$.
    answerType: vector
    variables: [u, v]
    answer: "(4*u, 4*v)"
    hints:
      - |
        $z_x=2x$, $z_y=2y$; then use $x_u=1$, $y_u=1$, $x_v=1$, $y_v=-1$.
    explanation: |
      $\pd zu=2x+2y=2(u+v)+2(u-v)=4u$ and $\pd zv=2x-2y=2(u+v)-2(u-v)=4v$.

  - id: when-to-substitute
    type: concept
    title: Substitute first, or use the chain rule?
    body: |
      When the inner functions are simple, you can **substitute first**: write $z$ directly as a function of $t$ and
      differentiate once. In the check above, $z=t^2(1+t)$ gives the same answer faster.

      The chain rule is better when the formulas are complicated, when only the **values** of the derivatives are known,
      or when you need to prove a general statement. It also shows **why** the result has the form it has, which is the
      basis of the next lessons.

  - id: summary
    type: summary
    points:
      - |
        For $z=f(x,y)$ with $x=x(t)$ and $y=y(t)$: $\dfrac{dz}{dt}=z_x\,\dfrac{dx}{dt}+z_y\,\dfrac{dy}{dt}$.
      - |
        With two parameters: $\pd zu=z_x\,x_u+z_y\,y_u$ and $\pd zv=z_x\,x_v+z_y\,y_v$.
      - |
        A tree of dependencies helps: multiply along each path, add the paths.
      - |
        If the substitution is easy, substituting first gives the same result.
