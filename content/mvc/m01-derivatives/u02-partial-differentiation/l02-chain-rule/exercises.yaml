  items:
    - id: cha-01
      statement: |-
        $\dfrac{dz}{dt}$ if $z=\dfrac xy$, where $x=e^t$, $y=\ln t$
      answerType: expression
      answer: "(t*ln(t) - 1)*exp(t)/(t*ln(t)^2)"
      variables:
        [t]
      hints:
        - |-
          Write $\dfrac{dz}{dt}=z_x\,x'+z_y\,y'$ with $z_x=\dfrac1y$ and $z_y=-\dfrac{x}{y^2}$.
      solution: |-
        By the chain rule, $$\dfrac{dz}{dt}=\pd{z}{x}\,\dfrac{dx}{dt} + \pd{z}{y}\,\dfrac{dy}{dt}.$$

        The ingredients are

        $$\pd{z}{x}=\dfrac{1}{y},\qquad \dfrac{dx}{dt}=e^{t}$$

        $$\pd{z}{y}=- \dfrac{x}{y^{2}},\qquad \dfrac{dy}{dt}=\dfrac{1}{t}$$

        Substituting $x,y,z$ by their expressions in $t$ and simplifying, $$\dfrac{dz}{dt}=\dfrac{\left(t \ln{\left(t \right)} - 1\right) e^{t}}{t \ln{\left(t \right)}^{2}}.$$
      verify:
        - expr: "diff(exp(t)/ln(t), t)"
          equals: "(t*ln(t) - 1)*exp(t)/(t*ln(t)^2)"
    - id: cha-02
      statement: |-
        $\dfrac{dz}{dt}$ if $z=\ln\sin\dfrac{x}{\sqrt y}$, where $x=3t^2$, $y=\sqrt{t^2+1}$
      answerType: expression
      answer: "3*t*(3*t^2 + 4)/(2*(t^2 + 1)^(5/4)*tan(3*t^2/(t^2 + 1)^(1/4)))"
      variables:
        [t]
      hints:
        - |-
          Chain rule on $\ln\sin u$ with $u=\dfrac{x}{\sqrt y}$: $\dfrac{d}{du}\ln\sin u=\cot u$.
      solution: |-
        By the chain rule, $$\dfrac{dz}{dt}=\pd{z}{x}\,\dfrac{dx}{dt} + \pd{z}{y}\,\dfrac{dy}{dt}.$$

        The ingredients are

        $$\pd{z}{x}=\dfrac{1}{\sqrt{y} \tan{\left(\dfrac{x}{\sqrt{y}} \right)}},\qquad \dfrac{dx}{dt}=6 t$$

        $$\pd{z}{y}=- \dfrac{x}{2 y^{\dfrac{3}{2}} \tan{\left(\dfrac{x}{\sqrt{y}} \right)}},\qquad \dfrac{dy}{dt}=\dfrac{t}{\sqrt{t^{2} + 1}}$$

        Substituting $x,y,z$ by their expressions in $t$ and simplifying, $$\dfrac{dz}{dt}=\dfrac{3 t \left(3 t^{2} + 4\right)}{2 \left(t^{2} + 1\right)^{\dfrac{5}{4}} \tan{\left(\dfrac{3 t^{2}}{\sqrt[4]{t^{2} + 1}} \right)}}.$$
      verify:
        - expr: "diff(ln(sin(3*t^2/(t^2 + 1)^(1/4))), t)"
          equals: "3*t*(3*t^2 + 4)/(2*(t^2 + 1)^(5/4)*tan(3*t^2/(t^2 + 1)^(1/4)))"
    - id: cha-03
      statement: |-
        $\dfrac{dz}{dt}$ if $z=x^y$, where $x=\sin t$, $y=\cos t$
      answerType: expression
      answer: "(-ln(sin(t))*sin(t)^2 + cos(t)^2)*sin(t)^(cos(t) - 1)"
      variables:
        [t]
      hints:
        - |-
          $z_x=yx^{y-1}$ and $z_y=x^y\ln x$. Then multiply by $\cos t$ and $-\sin t$.
      solution: |-
        By the chain rule, $$\dfrac{dz}{dt}=\pd{z}{x}\,\dfrac{dx}{dt} + \pd{z}{y}\,\dfrac{dy}{dt}.$$

        The ingredients are

        $$\pd{z}{x}=x^{y - 1} y,\qquad \dfrac{dx}{dt}=\cos{\left(t \right)}$$

        $$\pd{z}{y}=x^{y} \ln{\left(x \right)},\qquad \dfrac{dy}{dt}=- \sin{\left(t \right)}$$

        Substituting $x,y,z$ by their expressions in $t$ and simplifying, $$\dfrac{dz}{dt}=\left(- \ln{\left(\sin{\left(t \right)} \right)} \sin^{2}{\left(t \right)} + \cos^{2}{\left(t \right)}\right) \sin^{\cos{\left(t \right)} - 1}{\left(t \right)}.$$
      verify:
        - expr: "diff(sin(t)^cos(t), t)"
          equals: "(-ln(sin(t))*sin(t)^2 + cos(t)^2)*sin(t)^(cos(t) - 1)"
    - id: cha-04
      statement: |-
        $\dfrac{du}{dt}$ if $u=xyz$, where $x=t+1$, $y=\ln t$, $z=\tan t$
      answerType: expression
      answer: "(t*((t + 1)/cos(t)^2 + tan(t))*ln(t) + (t + 1)*tan(t))/t"
      variables:
        [t]
      hints:
        - |-
          Product rule through the chain rule: $u_x=yz$, $u_y=xz$, $u_z=xy$.
      solution: |-
        By the chain rule, $$\dfrac{du}{dt}=\pd{u}{x}\,\dfrac{dx}{dt} + \pd{u}{y}\,\dfrac{dy}{dt} + \pd{u}{z}\,\dfrac{dz}{dt}.$$

        The ingredients are

        $$\pd{u}{x}=y z,\qquad \dfrac{dx}{dt}=1$$

        $$\pd{u}{y}=x z,\qquad \dfrac{dy}{dt}=\dfrac{1}{t}$$

        $$\pd{u}{z}=x y,\qquad \dfrac{dz}{dt}=\tan^{2}{\left(t \right)} + 1$$

        Substituting $x,y,z$ by their expressions in $t$ and simplifying, $$\dfrac{du}{dt}=\dfrac{t \left(\dfrac{t + 1}{\cos^{2}{\left(t \right)}} + \tan{\left(t \right)}\right) \ln{\left(t \right)} + \left(t + 1\right) \tan{\left(t \right)}}{t}.$$
      verify:
        - expr: "diff((t + 1)*ln(t)*tan(t), t)"
          equals: "(t*((t + 1)/cos(t)^2 + tan(t))*ln(t) + (t + 1)*tan(t))/t"
      note: |-
        On the printed sheet the second condition is mixed with a fraction symbol. It is read here as $y=\ln t$.
    - id: cha-05
      statement: |-
        $\dfrac{du}{dt}$ if $u=\dfrac{z}{\sqrt{x^2+y^2}}$, where $x=a\cos t$, $y=a\sin t$, $z=b$
      answerType: number
      answer: "0"
      variables:
        [t]
      hints:
        - |-
          Simplify first: what is $x^2+y^2$ when $x=a\cos t$ and $y=a\sin t$?
      solution: |-
        By the chain rule, $$\dfrac{du}{dt}=\pd{u}{x}\,\dfrac{dx}{dt} + \pd{u}{y}\,\dfrac{dy}{dt} + \pd{u}{z}\,\dfrac{dz}{dt}.$$

        The ingredients are

        $$\pd{u}{x}=- \dfrac{x z}{\left(x^{2} + y^{2}\right)^{\dfrac{3}{2}}},\qquad \dfrac{dx}{dt}=- a \sin{\left(t \right)}$$

        $$\pd{u}{y}=- \dfrac{y z}{\left(x^{2} + y^{2}\right)^{\dfrac{3}{2}}},\qquad \dfrac{dy}{dt}=a \cos{\left(t \right)}$$

        $$\pd{u}{z}=\dfrac{1}{\sqrt{x^{2} + y^{2}}},\qquad \dfrac{dz}{dt}=0$$

        Substituting $x,y,z$ by their expressions in $t$ and simplifying, $$\dfrac{du}{dt}=0.$$
      verify:
        - expr: "diff(b/sqrt(a^2*sin(t)^2 + a^2*cos(t)^2), t)"
          equals: "0"
      note: |-
        The printed line also contains the letters $xyz$ after the fraction. They are read here as a typing slip, and $u=\dfrac{z}{\sqrt{x^2+y^2}}$.
    - id: cha-06
      statement: |-
        $\pd zu,\ \pd zv$ if $z=\arctan\dfrac xy$, where $x=u\sin v$, $y=u\cos v$
      answerType: vector
      answer: "(0, 1)"
      variables:
        [u, v]
      hints:
        - |-
          Use the chain rule with $z_x=\dfrac{y}{x^2+y^2}$ and $z_y=-\dfrac{x}{x^2+y^2}$, or simplify $\dfrac xy$ first.
      solution: |-
        $z_x=\dfrac{y}{x^2+y^2}$ and $z_y=-\dfrac{x}{x^2+y^2}$, with $x_u=\sin v$, $x_v=u\cos v$, $y_u=\cos v$, $y_v=-u\sin v$. Since $x^2+y^2=u^2$:

        $$\pd zu=\dfrac{u\cos v}{u^2}\sin v-\dfrac{u\sin v}{u^2}\cos v=0,$$

        $$\pd zv=\dfrac{u\cos v}{u^2}\,u\cos v+\dfrac{u\sin v}{u^2}\,u\sin v=\cos^2v+\sin^2v=1.$$

        Check by substitution: $\dfrac xy=\tan v$, so $z=\arctan(\tan v)=v$ for $|v|<\dfrac\pi2$, which gives $z_u=0$ and $z_v=1$.
    - id: cha-07
      statement: |-
        $\pd xr,\ \pd yr,\ \pd zr,\ \pd xu,\ \pd yu,\ \pd zu,\ \pd xv,\ \pd yv,\ \pd zv$ if $x=r\sin u\cos v$, $y=r\sin u\sin v$, $z=r\cos u$
      answerType: vector
      answer: "(sin(u)*cos(v), sin(u)*sin(v), cos(u), r*cos(u)*cos(v), r*sin(v)*cos(u), -r*sin(u), -r*sin(u)*sin(v), r*sin(u)*cos(v), 0)"
      variables:
        [r, u, v]
      hints:
        - |-
          Each of the nine derivatives is an ordinary derivative: the other two letters are constants.
      solution: |-
        Differentiate each coordinate with respect to $r$, $u$ and $v$ in turn, treating the other two as constants:

        $\pd{x}{r}=\sin{\left(u \right)} \cos{\left(v \right)}$

        $\pd{y}{r}=\sin{\left(u \right)} \sin{\left(v \right)}$

        $\pd{z}{r}=\cos{\left(u \right)}$

        $\pd{x}{u}=r \cos{\left(u \right)} \cos{\left(v \right)}$

        $\pd{y}{u}=r \sin{\left(v \right)} \cos{\left(u \right)}$

        $\pd{z}{u}=- r \sin{\left(u \right)}$

        $\pd{x}{v}=- r \sin{\left(u \right)} \sin{\left(v \right)}$

        $\pd{y}{v}=r \sin{\left(u \right)} \cos{\left(v \right)}$

        $\pd{z}{v}=0$

        These nine numbers form the matrix of derivatives of spherical coordinates. Its determinant, $r^2\sin u$ up to sign, is the factor you will meet in triple integrals.
- id: more-chain
  task: |-
    More practice: the chain rule.
  format: "Type an exact value such as `7/4` or `e^3/10`."
  items:
    - id: mp-cha-1
      statement: |-
        Let $z=x^2y$ with $x=t^2$ and $y=t^3$. Find $\dfrac{dz}{dt}$ at $t=1$.
      answerType: number
      answer: "7"
      hints:
        - |-
          Use $\dfrac{dz}{dt}=z_x\,x' + z_y\,y'$.
      solution: |-
        The chain rule gives $\dfrac{dz}{dt}=z_x\,x' + z_y\,y'$ with $z_x=2 x y, z_y=x^{2}$ and $x'=2 t, y'=3 t^{2}$. At $t=1$ the value is $7$ (it can be checked by substituting first and differentiating in $t$).
    - id: mp-cha-2
      statement: |-
        Let $z=e^{xy}$ with $x=\cos t$ and $y=\sin t$. Find $\dfrac{dz}{dt}$ at $t=0$.
      answerType: number
      answer: "1"
      hints:
        - |-
          Use $\dfrac{dz}{dt}=z_x\,x' + z_y\,y'$.
      solution: |-
        The chain rule gives $\dfrac{dz}{dt}=z_x\,x' + z_y\,y'$ with $z_x=y e^{x y}, z_y=x e^{x y}$ and $x'=- \sin{\left(t \right)}, y'=\cos{\left(t \right)}$. At $t=0$ the value is $1$ (it can be checked by substituting first and differentiating in $t$).
    - id: mp-cha-3
      statement: |-
        Let $z=\dfrac xy$ with $x=e^t$ and $y=1+t^2$. Find $\dfrac{dz}{dt}$ at $t=2$.
      answerType: expression
      answer: "exp(2)/25"
      hints:
        - |-
          Use $\dfrac{dz}{dt}=z_x\,x' + z_y\,y'$.
      solution: |-
        The chain rule gives $\dfrac{dz}{dt}=z_x\,x' + z_y\,y'$ with $z_x=\frac{1}{y}, z_y=- \frac{x}{y^{2}}$ and $x'=e^{t}, y'=2 t$. At $t=2$ the value is $\frac{e^{2}}{25}$ (it can be checked by substituting first and differentiating in $t$).
    - id: mp-cha-4
      statement: |-
        Let $w=xyz$ with $x=t$, $y=t^2$ and $z=t^3$. Find $\dfrac{dw}{dt}$ at $t=1$.
      answerType: number
      answer: "6"
      hints:
        - |-
          Use $\dfrac{dw}{dt}=w_x\,x' + w_y\,y' + w_z\,z'$.
      solution: |-
        The chain rule gives $\dfrac{dw}{dt}=w_x\,x' + w_y\,y' + w_z\,z'$ with $w_x=y z, w_y=x z, w_z=x y$ and $x'=1, y'=2 t, z'=3 t^{2}$. At $t=1$ the value is $6$ (it can be checked by substituting first and differentiating in $t$).
    - id: mp-cha-5
      statement: |-
        Let $z=x^2+y^2$ with $x=u+v$ and $y=u-v$. Find $\dfrac{\partial z}{\partial u}$ at $u=1,\ v=2$.
      answerType: number
      answer: "4"
      hints:
        - |-
          $\dfrac{\partial z}{\partial u}=z_x\,\dfrac{\partial x}{\partial u}+z_y\,\dfrac{\partial y}{\partial u}$.
      solution: |-
        By the chain rule, $\dfrac{\partial z}{\partial u}=z_x\,x_u+z_y\,y_u$ with $z_x=2 x$, $z_y=2 y$, $x_u=1$ and $y_u=1$. At the point the result is $4$.
    - id: mp-cha-6
      statement: |-
        Let $z=xy$ with $x=u^2-v$ and $y=u+v^2$. Find $\dfrac{\partial z}{\partial v}$ at $u=2,\ v=1$.
      answerType: number
      answer: "3"
      hints:
        - |-
          $\dfrac{\partial z}{\partial v}=z_x\,\dfrac{\partial x}{\partial v}+z_y\,\dfrac{\partial y}{\partial v}$.
      solution: |-
        By the chain rule, $\dfrac{\partial z}{\partial v}=z_x\,x_v+z_y\,y_v$ with $z_x=y$, $z_y=x$, $x_v=-1$ and $y_v=2 v$. At the point the result is $3$.
    - id: mp-cha-7
      statement: |-
        Let $z=e^{x-y}$ with $x=uv$ and $y=u^2$. Find $\dfrac{\partial z}{\partial v}$ at $u=1,\ v=1$.
      answerType: number
      answer: "1"
      hints:
        - |-
          $\dfrac{\partial z}{\partial v}=z_x\,\dfrac{\partial x}{\partial v}+z_y\,\dfrac{\partial y}{\partial v}$.
      solution: |-
        By the chain rule, $\dfrac{\partial z}{\partial v}=z_x\,x_v+z_y\,y_v$ with $z_x=e^{x - y}$, $z_y=- e^{x - y}$, $x_v=u$ and $y_v=0$. At the point the result is $1$.
    - id: mp-cha-8
      statement: |-
        Let $z=\ln\left(x^2+y^2\right)$ with $x=u\cos v$ and $y=u\sin v$. Find $\dfrac{\partial z}{\partial v}$ at $u=2,\ v=1$.
      answerType: number
      answer: "0"
      hints:
        - |-
          $\dfrac{\partial z}{\partial v}=z_x\,\dfrac{\partial x}{\partial v}+z_y\,\dfrac{\partial y}{\partial v}$.
      solution: |-
        By the chain rule, $\dfrac{\partial z}{\partial v}=z_x\,x_v+z_y\,y_v$ with $z_x=\frac{2 x}{x^{2} + y^{2}}$, $z_y=\frac{2 y}{x^{2} + y^{2}}$, $x_v=- u \sin{\left(v \right)}$ and $y_v=u \cos{\left(v \right)}$. At the point the result is $0$.
