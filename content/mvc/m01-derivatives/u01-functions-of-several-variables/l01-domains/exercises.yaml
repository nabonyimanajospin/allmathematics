- id: domains
  task: Find the domain of definition of each function.
  format: "Type the conditions on the variables, for example `x > 0 and y <= 2`. Use `<=` and `>=` for ≤ and ≥, and the words `and` / `or` to combine conditions. The words true (all points) and false (no point) are accepted."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: dom-01
      statement: |-
        $z=\sqrt{4-x^2-y^2}$
      answerType: region
      answer: "x^2+y^2<=4"
      coordinates:
        [x, y]
      hints:
        - A square root needs a non-negative argument.
      solution: |-
        The square root needs a non-negative argument: $4-x^2-y^2\ge0$, that is $x^2+y^2\le4$. The domain is the closed disc of radius $2$ centred at the origin; the circle itself is included.
    - id: dom-02
      statement: |-
        $z=\ln(x+y)$
      answerType: region
      answer: "x+y>0"
      coordinates:
        [x, y]
      hints:
        - A logarithm needs a positive argument.
      solution: |-
        The logarithm needs a positive argument: $x+y>0$, that is $y>-x$. The domain is the open half-plane above the line $y=-x$; the line itself is excluded.
    - id: dom-03
      statement: |-
        $z=\arctan\dfrac{1}{x^2+y^2}$
      answerType: region
      answer: "x^2+y^2>0"
      coordinates:
        [x, y]
      hints:
        - "The arctangent accepts every real number. What can still go wrong?"
      solution: |-
        The arctangent accepts every real number, so only the denominator matters: $x^2+y^2\neq0$. Since $x^2+y^2\ge0$ always, this means $x^2+y^2>0$. The domain is the whole plane except the origin.
    - id: dom-04
      statement: |-
        $z=\sqrt{1-x^2}+\sqrt{1-y^2}$
      answerType: region
      answer: "x^2<=1 and y^2<=1"
      coordinates:
        [x, y]
      hints:
        - "Both roots need a non-negative argument, and both conditions must hold together."
      solution: |-
        Both roots need non-negative arguments: $1-x^2\ge0$ and $1-y^2\ge0$, so $-1\le x\le1$ and $-1\le y\le1$. The domain is the closed square with vertices $(\pm1,\pm1)$.
    - id: dom-05
      statement: |-
        $z=\sqrt{x^2-4}+\sqrt{4-y^2}$
      answerType: region
      answer: "x^2>=4 and y^2<=4"
      coordinates:
        [x, y]
      hints:
        - "Solve each root condition separately, then combine them with “and”."
      solution: |-
        $x^2-4\ge0$ gives $x\le-2$ or $x\ge2$. $4-y^2\ge0$ gives $-2\le y\le2$. The domain consists of the points with $|x|\ge2$ and $|y|\le2$: two closed vertical-bounded strips, one on each side of the $y$-axis.
    - id: dom-06
      statement: |-
        $z=\arctan\dfrac{x-y}{1+x^2y^2}$
      answerType: region
      answer: "true"
      coordinates:
        [x, y]
      hints:
        - "Can the denominator $1+x^2y^2$ ever be zero?"
      solution: |-
        The denominator is $1+x^2y^2\ge1$, so it is never zero, and the arctangent accepts every real number. The domain is the whole plane.
    - id: dom-07
      statement: |-
        $u=\sqrt{1-x^2-y^2-z^2}$
      answerType: region
      answer: "x^2+y^2+z^2<=1"
      coordinates:
        [x, y, z]
      hints:
        - "The argument of the root must not be negative; this time there are three variables."
      solution: |-
        The root needs $1-x^2-y^2-z^2\ge0$, that is $x^2+y^2+z^2\le1$. The domain is the closed ball of radius $1$ centred at the origin.
    - id: dom-08
      statement: |-
        $w=\ln(xyz)$
      answerType: region
      answer: "x*y*z>0"
      coordinates:
        [x, y, z]
      hints:
        - "The product $xyz$ must be positive. How many of the three numbers can be negative?"
      solution: "The logarithm needs $xyz>0$. A product of three numbers is positive when all three are positive, or when exactly two are negative. The domain is made of four of the eight octants."
      note: |-
        The sheet prints this function as $z=\ln(xyz)$. The output is called $w$ here because $z$ is also a variable.
    - id: dom-09
      statement: |-
        $w=\sqrt x+\sqrt y+\sqrt z$
      answerType: region
      answer: "x>=0 and y>=0 and z>=0"
      coordinates:
        [x, y, z]
      hints:
        - Each of the three roots gives its own condition.
      solution: |-
        Each root needs a non-negative argument: $x\ge0$, $y\ge0$, $z\ge0$. The domain is the first octant, including the three coordinate planes.
      note: |-
        The sheet prints this function as $z=\sqrt x+\sqrt y+\sqrt z$. The output is called $w$ here because $z$ is also a variable.
    - id: dom-10
      statement: |-
        $w=\arcsin x+\arcsin y+\arcsin z$
      answerType: region
      answer: "x^2<=1 and y^2<=1 and z^2<=1"
      coordinates:
        [x, y, z]
      hints:
        - "The arcsine is defined for arguments between $-1$ and $1$."
      solution: |-
        Each arcsine needs its argument in $[-1,1]$: $-1\le x\le1$, $-1\le y\le1$, $-1\le z\le1$. The domain is the closed cube of edge $2$ centred at the origin.
    - id: dom-11
      statement: |-
        $w=\sqrt{x^2+y^2+z^2-4}+\sqrt{4-x^2-y^2-z^2}$
      answerType: region
      answer: "x^2+y^2+z^2=4"
      coordinates:
        [x, y, z]
      hints:
        - "Write both conditions with $s=x^2+y^2+z^2$ and see what they say together."
      solution: |-
        The first root needs $x^2+y^2+z^2\ge4$ and the second needs $x^2+y^2+z^2\le4$. Both hold only when $x^2+y^2+z^2=4$. The domain is the sphere of radius $2$ (its surface only, not the inside).
