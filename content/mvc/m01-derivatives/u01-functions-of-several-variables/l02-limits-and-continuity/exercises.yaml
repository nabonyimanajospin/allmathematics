- id: limits
  task: "Evaluate each limit, or show that it does not exist."
  format: "Type a number or an exact expression. If the limit does not exist, type `DNE` or `does not exist`."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: lim-01
      statement: |-
        $\displaystyle\lim_{(x,y)\to(0,2)}\frac{\sin xy}{x}$
      answerType: number
      answer: "2"
      hints:
        - |-
          Write $\dfrac{\sin xy}{x}=y\cdot\dfrac{\sin xy}{xy}$ and use $\dfrac{\sin u}{u}\to1$.
      solution: |-
        $\dfrac{\sin xy}{x}=y\cdot\dfrac{\sin xy}{xy}$. As $(x,y)\to(0,2)$ we have $u=xy\to0$, so $\dfrac{\sin u}{u}\to1$, and $y\to2$. The limit is $2\cdot1=2$.
      verify:
        - expr: "limit(sin(x*2)/x, x, 0)"
          equals: "2"
    - id: lim-02
      statement: |-
        $\displaystyle\lim_{(x,y)\to(\infty,k)}\left(1+\frac yx\right)^x$
      answerType: expression
      answer: "e^k"
      variables:
        [k]
      hints:
        - |-
          Write $\left(1+\dfrac yx\right)^x=\left[\left(1+\dfrac yx\right)^{x/y}\right]^{y}$ and recall $\left(1+\dfrac1n\right)^n\to e$.
      solution: |-
        With $n=\dfrac xy$ we get $\left(1+\dfrac yx\right)^x=\left[\left(1+\dfrac1n\right)^n\right]^y$. As $x\to\infty$ with $y\to k$ (and $k\neq0$), $n\to\infty$ and $\left(1+\dfrac1n\right)^n\to e$, while $y\to k$. The limit is $e^k$. For $k=0$ the expression equals $1=e^0$ as well.
      verify:
        - expr: "limit((1+k/x)^x, x, oo)"
          equals: "e^k"
    - id: lim-03
      statement: |-
        $\displaystyle\lim_{(x,y)\to(\infty,\infty)}\frac{x+y}{x^2+y^2}$
      answerType: number
      answer: "0"
      hints:
        - |-
          For $x,y>0$ compare $x+y$ with $2\max(x,y)$ and $x^2+y^2$ with $\max(x,y)^2$.
      solution: |-
        Take $x,y>0$ and let $M=\max(x,y)$. Then $x+y\le2M$ and $x^2+y^2\ge M^2$, so $0<\dfrac{x+y}{x^2+y^2}\le\dfrac{2}{M}\to0$. By the squeeze principle the limit is $0$.
      verify:
        - expr: "limit((x+x)/(x^2+x^2), x, oo)"
          equals: "0"
    - id: lim-04
      statement: |-
        $\displaystyle\lim_{(x,y)\to(0,0)}\frac{x}{x+y}$
      answerType: number
      answer: "@dne"
      hints:
        - "Try the path $y=0$, then the path $x=0$."
      solution: |-
        Along $y=0$ (with $x\neq0$): $\dfrac{x}{x+0}=1$, so the values tend to $1$. Along $x=0$ (with $y\neq0$): $\dfrac{0}{y}=0$, so the values tend to $0$. Two paths give two different numbers, so the limit does not exist.
    - id: lim-05
      statement: |-
        $\displaystyle\lim_{(x,y)\to(0,0)}\frac{x^2-y^2}{x^2+y^2}$
      answerType: number
      answer: "@dne"
      hints:
        - "Compare the values along the $x$-axis and along the $y$-axis."
      solution: |-
        Along the $x$-axis ($y=0$): $\dfrac{x^2}{x^2}=1$. Along the $y$-axis ($x=0$): $\dfrac{-y^2}{y^2}=-1$. The two paths give $1$ and $-1$, so the limit does not exist.
    - id: lim-06
      statement: |-
        $\displaystyle\lim_{(x,y)\to(0,0)}(x^2+y^2)\sin\frac1{xy}$
      answerType: number
      answer: "0"
      hints:
        - "The sine is always between $-1$ and $1$. Use the squeeze principle."
      solution: |-
        Because $\left|\sin\dfrac1{xy}\right|\le1$, we have $\left|(x^2+y^2)\sin\dfrac1{xy}\right|\le x^2+y^2$. The bound $x^2+y^2$ tends to $0$, so by the squeeze principle the limit is $0$. (The function is not defined on the axes, but the limit is taken over the points where it is defined.)
- id: discontinuities
  task: Find the set of points of the plane at which the function is not continuous. Count the points where the formula is not defined.
  format: "Type the conditions on the variables, for example `x > 0 and y <= 2`. Use `<=` and `>=` for ≤ and ≥, and the words `and` / `or` to combine conditions. The words true (all points) and false (no point) are accepted."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: dis-01
      statement: |-
        $z=\sqrt{9-x^2-y^2}$
      answerType: region
      answer: "x^2+y^2>9"
      coordinates:
        [x, y]
      hints:
        - A formula is continuous wherever it is defined. Find where it is not defined.
      solution: |-
        $\sqrt{9-x^2-y^2}$ is a composition of continuous functions, so it is continuous at every point where it is defined, the disc $x^2+y^2\le9$. It is not defined at the points with $x^2+y^2>9$: these are the points of discontinuity.
    - id: dis-02
      statement: |-
        $z=\ln\sqrt{x^2+y^2}$
      answerType: region
      answer: "x=0 and y=0"
      coordinates:
        [x, y]
      hints:
        - A formula is continuous wherever it is defined. Find where it is not defined.
      solution: |-
        The logarithm needs $\sqrt{x^2+y^2}>0$, that is $(x,y)\neq(0,0)$. Everywhere else the function is continuous. The only point of discontinuity is the origin.
    - id: dis-03
      statement: |-
        $z=\dfrac{1}{(x-y)^2}$
      answerType: region
      answer: "x=y"
      coordinates:
        [x, y]
      hints:
        - A formula is continuous wherever it is defined. Find where it is not defined.
      solution: "A quotient is continuous where its denominator is not zero. $(x-y)^2=0$ on the line $y=x$, where the function is not defined. The points of discontinuity form the line $y=x$."
    - id: dis-04
      statement: |-
        $z=\dfrac{1}{\sqrt{1-x^2-y^2}}$
      answerType: region
      answer: "x^2+y^2>=1"
      coordinates:
        [x, y]
      hints:
        - A formula is continuous wherever it is defined. Find where it is not defined.
      solution: |-
        The function is defined, and continuous, where $1-x^2-y^2>0$, the open unit disc. It is not defined where $x^2+y^2\ge1$: on the unit circle (zero denominator) and outside it (negative radicand).
    - id: dis-05
      statement: |-
        $z=\dfrac{1}{\sqrt{1-x^2}+\sqrt{1-y^2}}$
      answerType: region
      answer: "x^2>1 or y^2>1 or (x^2=1 and y^2=1)"
      coordinates:
        [x, y]
      hints:
        - A formula is continuous wherever it is defined. Find where it is not defined.
      solution: |-
        The roots need $|x|\le1$ and $|y|\le1$, so the function is undefined outside the closed square. Inside the square the denominator is $\ge0$ and it is zero only if both roots are zero, that is $x^2=1$ and $y^2=1$: the four corners $(\pm1,\pm1)$. The points of discontinuity are the points outside the square and the four corners.
    - id: dis-06
      statement: |-
        $z=\dfrac{2}{1-x^2-y^2}$
      answerType: region
      answer: "x^2+y^2=1"
      coordinates:
        [x, y]
      hints:
        - A formula is continuous wherever it is defined. Find where it is not defined.
      solution: "The denominator is zero when $x^2+y^2=1$. The function is a quotient of polynomials, hence continuous everywhere else. The points of discontinuity form the unit circle."
