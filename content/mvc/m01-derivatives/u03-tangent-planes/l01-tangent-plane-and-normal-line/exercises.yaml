    - id: tan-01a
      statement: "Tangent plane to the surface $z=3x^2+2y^2-11$ at $P(2,1,3)$."
      answerType: equation
      answer: "12*x + 4*y - z - 25=0"
      coordinates:
        [x, y, z]
      hints:
        - "Write the surface as $F(x,y,z)=0$ and compute $(F_x,F_y,F_z)$ at the point; they are the coefficients of the plane."
      solution: |-
        The surface is the graph $z=f(x,y)$ with $f=\,$3 x^{2} + 2 y^{2} - 11$\,$, so $f_x=12$ and $f_y=4$ at the point. The tangent plane is $z-3=f_x\,(x-2)+f_y\,(y-1)$.

        The tangent plane is $$12 x + 4 y - z - 25=0$$ (any non-zero multiple of this equation describes the same plane).
