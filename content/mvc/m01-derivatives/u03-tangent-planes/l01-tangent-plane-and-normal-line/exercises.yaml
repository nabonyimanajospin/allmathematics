    - id: tan-05a
      statement: |-
        Tangent plane to the ellipsoid $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}+\dfrac{z^2}{c^2}=1$ at a point $P(x_0,y_0,z_0)$ of the surface.
      answerType: equation
      answer: "x*x0/a^2 + y*y0/b^2 + z*z0/c^2 - 1 = 0"
      variables:
        [a, b, c, x0, y0, z0]
      coordinates:
        [x, y, z]
      hints:
        - |-
          Take $F=\dfrac{x^2}{a^2}\pm\dfrac{y^2}{b^2}\pm\dfrac{z^2}{c^2}-1$ and compute $F_x,F_y,F_z$ at $P$. At the end use the fact that $P$ lies on the surface to simplify the constant term.
      solution: |-
        With $F=\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}+\dfrac{z^2}{c^2}-1$ we get $(F_x,F_y,F_z)=\left(\dfrac{2x_0}{a^2},\,\dfrac{2y_0}{b^2},\,\dfrac{2z_0}{c^2}\right)$ at $P$. The tangent plane is $F_x(x-x_0)+F_y(y-y_0)+F_z(z-z_0)=0$; dividing by $2$ gives

        $$\dfrac{x_0(x-x_0)}{a^2}+\dfrac{y_0(y-y_0)}{b^2}+\dfrac{z_0(z-z_0)}{c^2}=0.$$

        Because $P$ is on the surface, $\dfrac{x_0^2}{a^2}+\dfrac{y_0^2}{b^2}+\dfrac{z_0^2}{c^2}=1$, so the constant term equals $-1$ and the plane is

        $$\dfrac{x_0\,x}{a^2}+\dfrac{y_0\,y}{b^2}+\dfrac{z_0\,z}{c^2}=1.$$
