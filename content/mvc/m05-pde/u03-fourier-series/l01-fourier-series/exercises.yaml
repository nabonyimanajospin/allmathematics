    - id: fs-01
      statement: |-
        The coefficient $b_1$ of the Fourier series of $f(x)=x$ on $]-\pi,\pi[$.
      answerType: expression
      answer: "2"
      hints:
        - "Use the parity of $f$ to avoid half of the computation."
      solution: |-
        The function is odd, so $b_n=\dfrac{2}{\pi}\int_0^\pi x\sin nx\,dx=\dfrac{2(-1)^{n+1}}{n}$.
