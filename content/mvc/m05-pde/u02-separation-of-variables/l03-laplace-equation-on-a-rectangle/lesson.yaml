id: mvc-m05-u02-l03
title: Laplace's equation on a rectangle
estMinutes: 45
version: 1
status: draft
skills:
  - laplace-equation
objectives:
  - Set up a Dirichlet problem on a rectangle.
  - Separate the variables and obtain the solutions $\sin\dfrac{n\pi x}{a}\sinh\dfrac{n\pi y}{a}$.
sections:
  - id: problem
    type: concept
    title: Steady temperature in a plate
    body: |
      A plate occupies the rectangle $0\le x\le a$, $0\le y\le b$. When its temperature no longer changes with time, $u_t=0$ and the heat equation $u_t=k(u_{xx}+u_{yy})$ becomes **Laplace's equation**

      $$u_{xx}+u_{yy}=0.$$

      A **Dirichlet problem** prescribes $u$ on the boundary. Here three sides are kept at $0$ and the top is heated according to a profile $f$:

      $$u(0,y)=u(a,y)=0,\qquad u(x,0)=0,\qquad u(x,b)=f(x).$$

  - id: solution
    type: theorem
    name: Product solutions
    statement: |
      The products $u=X(x)Y(y)$ that satisfy Laplace's equation and the three zero conditions are the multiples of

      $$\sin\dfrac{n\pi x}{a}\,\sinh\dfrac{n\pi y}{a},\qquad n=1,2,3,\dots$$

      If $f(x)=\sum b_n\sin\dfrac{n\pi x}{a}$ (a finite sum), the solution is

      $$u(x,y)=\sum\dfrac{b_n}{\sinh\dfrac{n\pi b}{a}}\,\sin\dfrac{n\pi x}{a}\,\sinh\dfrac{n\pi y}{a}.$$
    proof: |
      Substituting $u=XY$: $X''Y+XY''=0$, so $\dfrac{X''}{X}=-\dfrac{Y''}{Y}=-\lambda$. The conditions $X(0)=X(a)=0$ give $\lambda_n=\left(\dfrac{n\pi}{a}\right)^2$ and $X_n=\sin\dfrac{n\pi x}{a}$ as before. Then $Y''=\lambda_nY$, so $Y=A\cosh\dfrac{n\pi y}{a}+B\sinh\dfrac{n\pi y}{a}$, and $u(x,0)=0$ forces $A=0$. Finally $u(x,b)=\sum c_n\sinh\dfrac{n\pi b}{a}\sin\dfrac{n\pi x}{a}=f(x)$ gives $c_n=\dfrac{b_n}{\sinh(n\pi \dfrac{b}{a})}$.
    more: |
      **Why hyperbolic functions.** The sign of $\lambda$ is fixed by the $x$-direction; in $y$ the equation $Y''=\lambda_nY$ has exponential, not oscillating, solutions. This is the difference with the wave equation, where both directions oscillate.

  - id: ex-one-mode
    type: example
    title: A single sine on the top
    problem: |
      Solve the Dirichlet problem on $0\le x\le\pi$, $0\le y\le1$ with $u=0$ on the other three sides and $u(x,1)=\sin x$.
    steps:
      - |
        $a=\pi$, $b=1$ and $f=\sin x$ is the mode $n=1$ with $b_1=1$.
      - text: |
          $u(x,y)=\dfrac{\sin x\,\sinh y}{\sinh1}$.
        why: |
          The product $\sin x\sinh y$ already satisfies the equation and the zero conditions; dividing by $\sinh1$ makes its value on the line $y=1$ equal to $\sin x$.
    answer: |
      $u(x,y)=\dfrac{\sin x\,\sinh y}{\sinh1}$.
    verify:
      - expr: "diff(sin(x)*sinh(y)/sinh(1), x, 2) + diff(sin(x)*sinh(y)/sinh(1), y, 2)"
        equals: "0"
      - expr: "sin(x)*sinh(1)/sinh(1)"
        equals: "sin(x)"

  - id: ex-two-modes
    type: example
    title: A mode of higher order
    problem: |
      Solve the problem on $0\le x\le1$, $0\le y\le2$ with $u(x,2)=2\sin\pi x$ and $u=0$ on the other sides.
    steps:
      - |
        $a=1$, $b=2$, mode $n=1$ with coefficient $2$: the product is $\sin\pi x\,\sinh\pi y$ and its value at $y=2$ is $\sin\pi x\,\sinh2\pi$.
      - |
        $u(x,y)=\dfrac{2\sin\pi x\,\sinh\pi y}{\sinh2\pi}$.
    answer: |
      $u(x,y)=\dfrac{2\sin\pi x\,\sinh\pi y}{\sinh2\pi}$.
    verify:
      - expr: "diff(2*sin(pi*x)*sinh(pi*y)/sinh(2*pi), x, 2) + diff(2*sin(pi*x)*sinh(pi*y)/sinh(2*pi), y, 2)"
        equals: "0"

  - id: chk-two
    type: check
    prompt: |
      On $0\le x\le\pi$, $0\le y\le1$, find the solution of Laplace's equation with $u=0$ on three sides and $u(x,1)=3\sin2x$.
    answerType: expression
    variables: [x, y]
    answer: "3*sin(2*x)*sinh(2*y)/sinh(2)"
    hints:
      - |
        Mode $n=2$ with $a=\pi$: $\sin2x\sinh2y$. Divide by its value at $y=1$.
    explanation: |
      $u=\dfrac{3\sin2x\,\sinh2y}{\sinh2}$.

  - id: chk-harmonic
    type: check
    prompt: |
      Find the number $k$ for which $u=x^3+k\,xy^2$ is a solution of $u_{xx}+u_{yy}=0$.
    answerType: number
    answer: "-3"
    hints:
      - |
        $u_{xx}=6x$ and $u_{yy}=2kx$.
    explanation: |
      $6x+2kx=0$ for all $x$ gives $k=-3$.

  - id: summary
    type: summary
    points:
      - |
        Laplace's equation $u_{xx}+u_{yy}=0$ describes equilibrium; a Dirichlet problem prescribes $u$ on the boundary.
      - |
        On $[0,a]\times[0,b]$ with the top heated, the modes are $\sin\dfrac{n\pi x}{a}\sinh\dfrac{n\pi y}{a}$, and $b_n$ is divided by $\sinh\dfrac{n\pi b}{a}$.
