      statement: |-
        A rod of length $\pi$ with $k=2$ has its ends at $0$ and the initial temperature $f(x)=3 \sin{\left(x \right)}$. Find $u(x,t)$.
      answerType: expression
      answer: "3*exp(-2*t)*sin(x)"
      variables:
