    - id: mp-it-8
      statement: |-
        Evaluate $\displaystyle\int_0^1\!\!\int_x^1\sin\left(y^2\right)dy\,dx$ by changing the order of integration.
      answerType: expression
      answer: "1/2 - cos(1)/2"
      hints:
        - |-
          The region is $0\le x\le y\le1$. Integrate in $x$ first: $x$ runs from $0$ to $y$.
      solution: |-
