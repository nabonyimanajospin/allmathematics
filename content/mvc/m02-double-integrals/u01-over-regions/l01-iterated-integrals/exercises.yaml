- id: double-integrals
  task: Evaluate the following double integrals.
  format: "Type an exact value such as `2/9` or `pi/8`. If the integral does not converge, type `diverges`."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: dbl-01
      statement: |-
        $\displaystyle\iint_D\frac{dx\,dy}{\sqrt{(1-x^2)(1-y^2)}}$, $\ D:\ 0\le x\le1,\ 0\le y\le1$
      answerType: expression
      answer: "pi^2/4"
      hints:
        - "The integrand is a product of a function of $x$ and a function of $y$ over a rectangle."
      solution: |-
        Over a rectangle, a product of a function of $x$ and a function of $y$ integrates as a product:

        $$\iint_D=\int_0^1\dfrac{dx}{\sqrt{1-x^2}}\cdot\int_0^1\dfrac{dy}{\sqrt{1-y^2}}=\left(\arcsin x\Big|_0^1\right)^2=\left(\dfrac\pi2\right)^2=\dfrac{\pi^2}{4}.$$

        The integrand is unbounded near $x=1$ and $y=1$, but each factor is an integrable (improper) integral, so the double integral converges.
      verify:
        - expr: "integrate(1/sqrt(1-x^2), x, 0, 1)"
          equals: pi/2
    - id: dbl-02
      statement: |-
        $\displaystyle\iint_D\frac{dx\,dy}{x^2+y^2}$, $\ D:\ 0\le x\le2,\ 0\le y\le x$
      answerType: number
      answer: "@dne"
      hints:
        - "Integrate in $y$ first, then look carefully at what is left in $x$ near $0$."
      solution: |-
        Inner integral: $\displaystyle\int_0^x\frac{dy}{x^2+y^2}=\frac1x\arctan\frac yx\Big|_0^x=\frac{\pi}{4x}$.

        Outer integral: $\displaystyle\int_0^2\frac{\pi}{4x}\,dx=\frac\pi4\ln x\Big|_0^2$, which is infinite because $\ln x\to-\infty$ as $x\to0^+$.

        The integral **diverges**: it has no finite value. The integrand is not bounded near the origin, which is a corner of $D$.
      verify:
        - expr: "integrate(1/(x^2+y^2), y, 0, x)"
          equals: "pi/(4*x)"
      note: |-
        This exercise has a trap: it looks like a routine iterated integral, but it does not converge. Answer with `diverges`.
    - id: dbl-03
      statement: |-
        $\displaystyle\iint_D(x^2+y^2)\,dx\,dy$, $\ D:\ 0\le x\le1,\ x\le y\le\sqrt x$
      answerType: number
      answer: "3/35"
      hints:
        - |-
          Integrate in $y$ from $x$ to $\sqrt x$ first; the result is a function of $x$.
      solution: |-
        Inner integral: $\displaystyle\int_x^{\sqrt x}(x^2+y^2)\,dy=\left[x^2y+\dfrac{y^3}{3}\right]_x^{\sqrt x}=x^{\frac{5}{2}} + \frac{x^{\frac{3}{2}}}{3} - \frac{4 x^{3}}{3}$.

        Outer integral: $\displaystyle\int_0^1\left(x^{\frac{5}{2}} + \frac{x^{\frac{3}{2}}}{3} - \frac{4 x^{3}}{3}\right)dx=\frac{3}{35}$.
      verify:
        - expr: "integrate(integrate(x^2+y^2, y, x, sqrt(x)), x, 0, 1)"
          equals: "3/35"
    - id: dbl-04
      statement: |-
        $\displaystyle\iint_D(x-y)\,dx\,dy$, $\ D$ bounded by $y=2-x^2$ and $y=2x-1$
      answerType: number
      answer: "64/15"
      hints:
        - "Find where the parabola and the line meet. On the region, the parabola is above the line."
      solution: |-
        The curves meet where $2-x^2=2x-1$, that is $x^2+2x-3=0$, so $x=-3$ or $x=1$. Between them the parabola is above the line, so $D:\ -3\le x\le1,\ 2x-1\le y\le2-x^2$.

        Inner integral: $\displaystyle\int_{2x-1}^{2-x^2}(x-y)\,dy=- \frac{x^{4}}{2} - x^{3} + 2 x^{2} + x - \frac{3}{2}$.

        Outer integral: $\displaystyle\int_{-3}^{1}\left(- \frac{x^{4}}{2} - x^{3} + 2 x^{2} + x - \frac{3}{2}\right)dx=\frac{64}{15}$.
      verify:
        - expr: "integrate(integrate(x-y, y, 2*x-1, 2-x^2), x, -3, 1)"
          equals: "64/15"
    - id: dbl-05
      statement: |-
        $\displaystyle\iint_D\sin(x+y)\,dx\,dy$, $\ D$ bounded by $x=0$, $y=\dfrac\pi2$, $y=x$
      answerType: number
      answer: "1"
      hints:
        - |-
          $D$ is the triangle with vertices $(0,0)$, $\left(0,\frac\pi2\right)$, $\left(\frac\pi2,\frac\pi2\right)$: $0\le x\le\dfrac\pi2$, $x\le y\le\dfrac\pi2$.
      solution: |-
        The region is the triangle $0\le x\le\dfrac\pi2$, $x\le y\le\dfrac\pi2$.

        Inner integral: $\displaystyle\int_x^{\frac{\pi}{2}}\sin(x+y)\,dy=\sin{\left(x \right)} + \cos{\left(2 x \right)}$.

        Outer integral: $\displaystyle\int_0^{\frac{\pi}{2}}\left(\sin{\left(x \right)} + \cos{\left(2 x \right)}\right)dx=1$.
      verify:
        - expr: "integrate(integrate(sin(x+y), y, x, pi/2), x, 0, pi/2)"
          equals: "1"
    - id: dbl-06
      statement: |-
        $\displaystyle\iint_D x\,dx\,dy$, $\ D$ the triangle $ABC$ with $A(2,3)$, $B(7,2)$, $C(4,5)$
      answerType: number
      answer: "26"
      hints:
        - |-
          For $f=x$, $\iint_D x\,dA=(\text{area of }D)\cdot(x\text{-coordinate of the centroid})$. Or split $D$ at $x=4$.
      solution: |-
        Use the centroid: for $f=x$, $\iint_D x\,dA=\text{area}(D)\cdot\bar x$, where $\bar x$ is the $x$-coordinate of the centroid.

        Area: $\dfrac12\left|\crossp{\overrightarrow{AB}}{\overrightarrow{AC}}\right|$ with $\overrightarrow{AB}=(5,-1)$ and $\overrightarrow{AC}=(2,2)$ gives $\dfrac12|5\cdot2-(-1)\cdot2|=6$. Centroid: $\bar x=\dfrac{2+7+4}3=\dfrac{13}3$. Therefore $\iint_Dx\,dA=6\cdot\dfrac{13}3=26$.
