- id: riemann
  task: Riemann sums.
  format: "Type an exact value such as `7/2`."
  items:
    - id: rs-01
      statement: |-
        Compute the midpoint Riemann sum of $f(x,y)=xy$ over $[0,4]\times[0,2]$ with $2\times2$ equal rectangles ($2$ in the $x$ direction, $2$ in the $y$ direction).
      answerType: number
      answer: "16"
      hints:
        - |-
          Each rectangle has area $\Delta A=2$. Evaluate $f$ at the centre of each rectangle and add.
      solution: |-
        The centres give the values $\frac{1}{2}, \frac{3}{2}, \frac{3}{2}, \frac{9}{2}$; their sum is $8$, times $\Delta A=2$ gives $16$.
    - id: rs-02
      statement: |-
        Compute the midpoint Riemann sum of $f(x,y)=x^2+y$ over $[0,3]\times[0,2]$ with $3\times2$ equal rectangles ($3$ in the $x$ direction, $2$ in the $y$ direction).
      answerType: number
      answer: "47/2"
      hints:
        - |-
          Each rectangle has area $\Delta A=1$. Evaluate $f$ at the centre of each rectangle and add.
      solution: |-
        The centres give the values $\frac{3}{4}, \frac{7}{4}, \frac{11}{4}, \frac{15}{4}, \frac{27}{4}, \frac{31}{4}$; their sum is $\frac{47}{2}$, times $\Delta A=1$ gives $\frac{47}{2}$.
    - id: rs-03
      statement: |-
        Compute the midpoint Riemann sum of $f(x,y)=4-x-y$ over $[0,2]\times[0,2]$ with $2\times2$ equal rectangles ($2$ in the $x$ direction, $2$ in the $y$ direction).
      answerType: number
      answer: "8"
      hints:
        - |-
          Each rectangle has area $\Delta A=1$. Evaluate $f$ at the centre of each rectangle and add.
      solution: |-
        The centres give the values $3, 2, 2, 1$; their sum is $8$, times $\Delta A=1$ gives $8$.
    - id: rs-04
      statement: |-
        Compute the Riemann sum of $f(x,y)=x+2y$ over $[0,2]\times[0,2]$ with the four unit squares, taking the **lower left corner** of each square as the sample point.
      answerType: number
      answer: "6"
      hints:
        - "The lower left corners are $(0,0)$, $(1,0)$, $(0,1)$, $(1,1)$ and each square has area $1$."
      solution: "$f$ takes the values $0, 2, 1, 3$, so $S=6$."
    - id: rs-05
      statement: |-
        Compute the exact value of $\displaystyle\iint_R(x^2+y^2)\,dA$ over $R=[0,3]\times[0,2]$.
      answerType: number
      answer: "26"
      hints:
        - "Integrate first in $y$ from $0$ to $2$, then in $x$ from $0$ to $3$."
      solution: |-
        $\int_0^3\!\!\int_0^2(x^2+y^2)\,dy\,dx=\int_0^3\left(2x^2+\dfrac83\right)dx=26$.
- id: properties
  task: Properties of the double integral.
  format: Type a number.
  items:
    - id: pr-01
      statement: |-
        Over a region $D$: $\displaystyle\iint_Df\,dA=4$ and $\displaystyle\iint_Dg\,dA=-1$. Find $\displaystyle\iint_D(3f+2g)\,dA$.
      answerType: number
      answer: "10"
      hints:
        - Use linearity of the integral.
      solution: |-
        $3\cdot4+2\cdot(-1)=10$.
    - id: pr-02
      statement: |-
        The region $D$ is split into two regions $D_1$, $D_2$ that do not overlap. If $\displaystyle\iint_Df\,dA=15$ and $\displaystyle\iint_{D_1}f\,dA=6$, find $\displaystyle\iint_{D_2}f\,dA$.
      answerType: number
      answer: "9"
      hints:
        - "The integrals over $D_1$ and $D_2$ add up to the integral over $D$."
      solution: |-
        $\iint_{D_2}f\,dA=15-6=9$.
    - id: pr-03
      statement: |-
        Use $\displaystyle\iint_D1\,dA$ to find the area of the triangle $D$ with vertices $(0,0)$, $(4,0)$, $(0,3)$. The unit is squ: give the number only.
      answerType: number
      answer: "6"
      hints:
        - |-
          The triangle is $0\le x\le4$, $0\le y\le3-\dfrac34x$.
      solution: |-
        $\int_0^4\!\!\int_0^{3-\frac{3x}{4}}1\,dy\,dx=6$, which is half of $4\cdot3$.
    - id: pr-04
      statement: |-
        On a region $D$ of area $5$ we know $1\le f(x,y)\le3$. Between which numbers is $\displaystyle\iint_Df\,dA$ certainly found?
      answerType: multiple_choice
      answer: "2"
      choices:
        - text: "between $1$ and $3$"
          value: "1"
        - text: "between $5$ and $15$"
          value: "2"
        - text: "between $0$ and $5$"
          value: "3"
      correctIndex: 1
      hints:
        - |-
          Compare $f$ with the constants $1$ and $3$ and use $\iint_Dc\,dA=c\cdot\text{area}$.
      solution: |-
        Since $1\le f\le3$, $\iint_D1\,dA\le\iint_Df\,dA\le\iint_D3\,dA$, that is $5\le\iint_Df\,dA\le15$.
- id: mass
  task: Mass of a plate.
  format: "Type an exact value such as `5/6` or `3*pi`."
  items:
    - id: ms-01
      statement: |-
        Find the mass of the plate $[0,2]\times[0,1]$ with density $\rho(x,y)=x+y$ (give the number only, in kg).
      answerType: number
      answer: "3"
      hints:
        - |-
          $M=\iint_D\rho\,dA$. Describe the region with inequalities first.
      solution: |-
        $M=\iint_D\rho\,dA=3$.
    - id: ms-02
      statement: |-
        Find the mass of the plate $0\le y\le x\le2$ with density $\rho(x,y)=y$ (give the number only, in kg).
      answerType: number
      answer: "4/3"
      hints:
        - |-
          $M=\iint_D\rho\,dA$. Describe the region with inequalities first.
      solution: |-
        $M=\iint_D\rho\,dA=\frac{4}{3}$.
    - id: ms-03
      statement: |-
        Find the mass of the plate between the curves $y=x^2$ and $y=x$ ($0\le x\le1$) with density $\rho(x,y)=1$ (give the number only, in kg).
      answerType: number
      answer: "1/6"
      hints:
        - |-
          $M=\iint_D\rho\,dA$. Describe the region with inequalities first.
      solution: |-
        $M=\iint_D\rho\,dA=\frac{1}{6}$.
    - id: ms-04
      statement: |-
        Find the mass of the disc $x^2+y^2\le4$ with density $\rho(x,y)=x^2+y^2$ (give the number only, in kg).
      answerType: expression
      answer: "8*pi"
      hints:
        - |-
          Use polar coordinates: $x^2+y^2=r^2$ and $dA=r\,dr\,d\theta$.
      solution: |-
        $M=\displaystyle\int_0^{2\pi}\!\!\int_0^2r^2\cdot r\,dr\,d\theta=2\pi\cdot\dfrac{2^4}{4}=8\pi$.
- id: average
  task: Average value.
  format: "Type an exact value such as `7/9` or `3/pi^2`."
  items:
    - id: av-01
      statement: |-
        Find the average value of $f(x,y)=x^2+y^2$ over the square $[0,1]\times[0,1]$.
      answerType: number
      answer: "2/3"
      hints:
        - "The area of the square is $1$."
      solution: |-
        $\iint f\,dA=\dfrac13+\dfrac13=\frac{2}{3}$ and the area is $1$, so the average is $\frac{2}{3}$.
    - id: av-02
      statement: "Find the average value of $f(x,y)=x+y$ over the triangle with vertices $(0,0)$, $(2,0)$, $(0,2)$."
      answerType: number
      answer: "4/3"
      hints:
        - |-
          The area of the triangle is $2$. The region is $0\le x\le2$, $0\le y\le2-x$.
      solution: |-
        $\iint(x+y)\,dA=\frac{8}{3}$ and the area is $2$, so the average is $\frac{4}{3}$.
    - id: av-03
      statement: |-
        Find the average value of $f(x,y)=\sin x\cos y$ over the rectangle $0\le x\le\pi,\ 0\le y\le\dfrac\pi2$.
      answerType: expression
      answer: "4/pi^2"
      hints:
        - |-
          The double integral separates into $\int_0^\pi\sin x\,dx\cdot\int_0^{\frac{\pi}{2}}\cos y\,dy$. The area is $\dfrac{\pi^2}{2}$.
      solution: |-
        $\iint f\,dA=2\cdot1=2$ and the area is $\dfrac{\pi^2}{2}$, so the average is $\frac{4}{\pi^{2}}$.
- id: centre
  task: Centre of mass.
  format: "Type an exact value such as `9/8`."
  items:
    - id: cm-01
      statement: |-
        A plate occupies $[0,2]\times[0,1]$ and has density $\rho(x,y)=x$. Find the $x$-coordinate $\bar x$ of its centre of mass.
      answerType: number
      answer: "4/3"
      hints:
        - |-
          $\bar x=\dfrac1M\iint x\rho\,dA$ with $M=\iint\rho\,dA$.
      solution: |-
        $M=\int_0^2\!\!\int_0^1x\,dy\,dx=2$ and $\iint x\cdot x\,dA=\dfrac83$, so $\bar x=\frac{4}{3}$.
    - id: cm-02
      statement: |-
        For the same plate ($[0,2]\times[0,1]$, $\rho=x$) find the $y$-coordinate $\bar y$ of its centre of mass.
      answerType: number
      answer: "1/2"
      hints:
        - |-
          $\bar y=\dfrac1M\iint y\rho\,dA$.
      solution: |-
        $\iint y\cdot x\,dA=2\cdot\dfrac12=1$ and $M=2$, so $\bar y=\frac{1}{2}$.
