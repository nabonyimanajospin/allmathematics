  items:
    - id: mp-po-1
      statement: |-
        $\displaystyle\iint_D\left(x^2+y^2\right)dA$, where $D$ is the disc $x^2+y^2\le4$.
      answerType: expression
      answer: "8*pi"
      hints:
        - "Put $x^2+y^2=r^2$."
      solution: |-
        In polar coordinates $dA=r\,dr\,d\theta$. Here $x^2+y^2=r^2$. $\displaystyle\int_{0}^{2 \pi}\!\int_{0}^{2}r^{2}\,r\,dr\,d\theta=8 \pi$.
    - id: mp-po-2
      statement: |-
        $\displaystyle\iint_De^{-(x^2+y^2)}dA$, where $D$ is the disc $x^2+y^2\le1$.
      answerType: expression
      answer: "-pi*exp(-1) + pi"
      hints:
        - |-
          The integrand is $e^{-r^2}$ and $\int re^{-r^2}dr=-\dfrac12e^{-r^2}$.
      solution: |-
        In polar coordinates $dA=r\,dr\,d\theta$. $\displaystyle\int_{0}^{2 \pi}\!\int_{0}^{1}e^{- r^{2}}\,r\,dr\,d\theta=- \frac{\pi}{e} + \pi$.
    - id: mp-po-3
      statement: |-
        $\displaystyle\iint_D\sqrt{x^2+y^2}\,dA$, where $D$ is the annulus $1\le x^2+y^2\le4$.
      answerType: expression
      answer: "14*pi/3"
      hints:
        - |-
          The annulus is $1\le r\le2$, $0\le\theta\le2\pi$.
      solution: |-
        In polar coordinates $dA=r\,dr\,d\theta$. $\displaystyle\int_{0}^{2 \pi}\!\int_{1}^{2}r\,r\,dr\,d\theta=\frac{14 \pi}{3}$.
    - id: mp-po-4
      statement: |-
        $\displaystyle\iint_Dx\,dA$, where $D$ is the half-disc $x^2+y^2\le4,\ x\ge0$.
      answerType: number
      answer: "16/3"
      hints:
        - |-
          The half-disc is $0\le r\le2$, $-\dfrac\pi2\le\theta\le\dfrac\pi2$, and $x=r\cos\theta$.
      solution: |-
        In polar coordinates $dA=r\,dr\,d\theta$. $\displaystyle\int_{- \frac{\pi}{2}}^{\frac{\pi}{2}}\!\int_{0}^{2}r \cos{\left(\theta \right)}\,r\,dr\,d\theta=\frac{16}{3}$.
    - id: mp-po-5
      statement: |-
        $\displaystyle\iint_Dy\,dA$, where $D$ is the quarter of the disc $x^2+y^2\le9$ in the first quadrant.
      answerType: number
      answer: "9"
      hints:
        - |-
          The quarter-disc is $0\le r\le3$, $0\le\theta\le\dfrac\pi2$, and $y=r\sin\theta$.
      solution: |-
        In polar coordinates $dA=r\,dr\,d\theta$. $\displaystyle\int_{0}^{\frac{\pi}{2}}\!\int_{0}^{3}r \sin{\left(\theta \right)}\,r\,dr\,d\theta=9$.
    - id: mp-po-6
      statement: |-
        $\displaystyle\iint_D\dfrac{dA}{1+x^2+y^2}$, where $D$ is the disc $x^2+y^2\le1$.
      answerType: expression
      answer: "pi*ln(2)"
      hints:
        - |-
          $\int\dfrac{r}{1+r^2}dr=\dfrac12\ln\left(1+r^2\right)$.
      solution: |-
        In polar coordinates $dA=r\,dr\,d\theta$. $\displaystyle\int_{0}^{2 \pi}\!\int_{0}^{1}\frac{1}{r^{2} + 1}\,r\,dr\,d\theta=\pi \ln{\left(2 \right)}$.
    - id: mp-po-7
      statement: |-
        Evaluate $\displaystyle\int_0^1\!\!\int_0^{\sqrt{1-x^2}}\left(x^2+y^2\right)dy\,dx$ by changing to polar coordinates.
      answerType: expression
