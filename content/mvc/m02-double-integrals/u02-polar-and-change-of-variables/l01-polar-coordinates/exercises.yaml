    - id: mp-po-9
      statement: |-
        Find the area enclosed by the cardioid $r=1+\cos\theta$ (the unit is squ: give the number only).
      answerType: expression
      answer: "3*pi/2"
      hints:
        - |-
          $A=\dfrac12\int r^2\,d\theta$.
      solution: |-
        $A=\dfrac12\displaystyle\int_{0}^{2 \pi}r^2\,d\theta=\dfrac12\int_{0}^{2 \pi}\left(\cos{\left(\theta \right)} + 1\right)^2d\theta=\frac{3 \pi}{2}$.
    - id: mp-po-10
      statement: |-
        Find the area enclosed by the circle $r=2\cos\theta$ (the unit is squ: give the number only).
      answerType: expression
      answer: pi
      hints:
        - |-
          The circle is traced once for $-\dfrac\pi2\le\theta\le\dfrac\pi2$.
      solution: |-
        $A=\dfrac12\displaystyle\int_{- \frac{\pi}{2}}^{\frac{\pi}{2}}r^2\,d\theta=\dfrac12\int_{- \frac{\pi}{2}}^{\frac{\pi}{2}}\left(2 \cos{\left(\theta \right)}\right)^2d\theta=\pi$.
    - id: mp-po-11
      statement: |-
        Find the volume of the solid under the paraboloid $z=x^2+y^2$ and above the unit disc $x^2+y^2\le1$ (the unit is cu: give the number only).
      answerType: expression
      answer: pi/2
      hints:
        - |-
          $V=\iint_D\left(x^2+y^2\right)dA$ in polar coordinates.
      solution: |-
        $V=\displaystyle\int_0^{2\pi}\!\!\int_0^1r^2\cdot r\,dr\,d\theta=2\pi\cdot\dfrac14=\dfrac\pi2$.
