- id: polar
  task: Evaluate the following double integrals in polar coordinates.
  format: "Type an exact expression such as `a^3/6`."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: pol-01
      statement: |-
        $\displaystyle\iint_Dr\,dr\,d\theta$, $\ D:\ 0\le\theta\le2\pi,\ a\sin\theta\le r\le a$ (with $a>0$)
      answerType: expression
      answer: "pi*a^2/2"
      variables:
        [a]
      hints:
        - |-
          Integrate in $r$ first: $\int_{a\sin\theta}^{a}r\,dr=\dfrac{a^2-a^2\sin^2\theta}{2}$.
      solution: |-
        Inner integral: $\displaystyle\int_{a\sin\theta}^{a}r\,dr=\frac{a^2-a^2\sin^2\theta}{2}=\frac{a^2\cos^2\theta}{2}$.

        Outer integral: $\displaystyle\int_0^{2\pi}\frac{a^2\cos^2\theta}{2}\,d\theta=\frac{a^2}{2}\cdot\pi=\frac{\pi a^2}{2}$, because $\int_0^{2\pi}\cos^2\theta\,d\theta=\pi$.
      verify:
        - expr: "integrate(integrate(r, r, a*sin(t), a), t, 0, 2*pi)"
          equals: "pi*a^2/2"
    - id: pol-02
      statement: |-
        $\displaystyle\iint_Dr^2\sin^2\theta\,dr\,d\theta$, $\ D:\ -\dfrac\pi2\le\theta\le\dfrac\pi2,\ 0\le r\le3\cos\theta$
      answerType: number
      answer: "12/5"
      hints:
        - |-
          Integrate in $r$ first: $\int_0^{3\cos\theta}r^2\,dr=9\cos^3\theta$. Then use $\sin^2\theta\cos^3\theta=\sin^2\theta(1-\sin^2\theta)\cos\theta$.
      solution: |-
        Inner integral: $\displaystyle\int_0^{3\cos\theta}r^2\,dr=\frac{(3\cos\theta)^3}{3}=9\cos^3\theta$.

        Outer integral: $\displaystyle9\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\sin^2\theta\cos^3\theta\,d\theta$. With $s=\sin\theta$ and $ds=\cos\theta\,d\theta$, $\cos^2\theta=1-s^2$, this is $9\int_{-1}^{1}s^2(1-s^2)\,ds=9\left(\dfrac23-\dfrac25\right)=\dfrac{12}{5}$.
      note: |-
        The integrand is taken exactly as printed, $r^2\sin^2\theta$ with $dr\,d\theta$. If the intended integral was $\iint y^2\,dA$ in polar coordinates, the area element $r\,dr\,d\theta$ adds a factor $r$, and the value would be $\dfrac{81\pi}{64}$.
    - id: pol-03
      statement: |-
        $\displaystyle\iint_D\sqrt{x^2+y^2}\,dx\,dy$, $\ D:\ x^2+y^2\le a^2,\ x\ge0,\ y\ge0$ (with $a>0$)
      answerType: expression
      answer: "pi*a^3/6"
      variables:
        [a]
      hints:
        - |-
          Use polar coordinates: $0\le r\le a$, $0\le\theta\le\dfrac\pi2$, $\sqrt{x^2+y^2}=r$, $dA=r\,dr\,d\theta$.
      solution: |-
        The region is a quarter of a disc: $0\le r\le a$, $0\le\theta\le\dfrac\pi2$. With $\sqrt{x^2+y^2}=r$ and $dx\,dy=r\,dr\,d\theta$:

        $$\int_0^{\frac{\pi}{2}}\int_0^{a}r\cdot r\,dr\,d\theta=\dfrac\pi2\cdot\dfrac{a^3}{3}=\dfrac{\pi a^3}{6}.$$
      verify:
        - expr: "integrate(integrate(r*r, r, 0, a), t, 0, pi/2)"
          equals: "pi*a^3/6"
- id: more-polar
  task: |-
