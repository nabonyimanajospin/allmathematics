      solution: |-
        In polar coordinates $dA=r\,dr\,d\theta$. The region is the quarter of the unit disc. $\displaystyle\int_{0}^{\frac{\pi}{2}}\!\int_{0}^{1}r^{2}\,r\,dr\,d\theta=\frac{\pi}{8}$.
    - id: mp-po-8
      statement: |-
