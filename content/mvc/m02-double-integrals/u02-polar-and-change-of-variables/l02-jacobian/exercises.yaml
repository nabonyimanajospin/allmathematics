- id: jacobian
  task: Evaluate with a change of variables.
  format: Type an exact value.
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: jac-01
      statement: |-
        $\displaystyle\iint_D(x+y)^3(x-y)^2\,dx\,dy$, $\ D$ bounded by $x+y=1$, $x-y=1$, $x+y=3$, $x-y=-1$
      answerType: number
      answer: "20/3"
      hints:
        - |-
          Put $u=x+y$ and $v=x-y$. Then $D$ becomes a rectangle, and $dx\,dy=\dfrac12\,du\,dv$.
      solution: |-
        Let $u=x+y$ and $v=x-y$. The region is $1\le u\le3$ and $-1\le v\le1$, a rectangle. Since $x=\dfrac{u+v}2$ and $y=\dfrac{u-v}2$, $\left|\dfrac{\partial(x,y)}{\partial(u,v)}\right|=\dfrac12$, so $dx\,dy=\dfrac12\,du\,dv$.

        $$\iint_D=\dfrac12\int_1^3u^3\,du\int_{-1}^{1}v^2\,dv=\dfrac12\cdot\dfrac{81-1}{4}\cdot\dfrac23=\dfrac{20}{3}.$$
      verify:
        - expr: "integrate(integrate(u^3*v^2/2, v, -1, 1), u, 1, 3)"
          equals: "20/3"
