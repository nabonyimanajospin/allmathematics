        Use the substitution $x=3u\cos v$, $y=2u\sin v$ to find the area of the ellipse $\dfrac{x^2}{9}+\dfrac{y^2}{4}\le1$ (the unit is squ: give the number only).
      answerType: expression
      answer: "6*pi"
      hints:
        - |-
          The ellipse becomes $0\le u\le1$, $0\le v\le2\pi$, and $dA=\left|\dfrac{\partial(x,y)}{\partial(u,v)}\right|du\,dv$.
