- id: areas
  task: Find the area bounded by the given curves.
  format: "Type an exact value such as `5/6` or `pi*r^2`."
  source: "MATH126 exercise sheet, T. Hakizimana"
  items:
    - id: are-01
      statement: |-
        The area bounded by $x=4y-y^2$ and $x+y=6$. The unit is squ: give the number only.
      answerType: number
      answer: "1/6"
      hints:
        - |-
          Find the intersections: $4y-y^2=6-y$. Then see which curve is to the right between them.
      solution: |-
        Intersections: $4y-y^2=6-y$ gives $y^2-5y+6=0$, so $y=2$ or $y=3$. For $2<y<3$ the parabola $x=4y-y^2$ is to the right of the line $x=6-y$ (at $y=\tfrac52$ for example, $\tfrac{15}4>\tfrac72$). Integrate in $x$ first:

        $$A=\int_2^3\int_{6-y}^{4y-y^2}dx\,dy=\int_2^3(-y^2+5y-6)\,dy=\dfrac16.$$
      verify:
        - expr: "integrate(integrate(1, x, 6-y, 4*y-y^2), y, 2, 3)"
          equals: "1/6"
    - id: are-02
      statement: |-
        The area bounded by $x=y^2-2y$ and $x+y=0$. The unit is squ: give the number only.
      answerType: number
      answer: "1/6"
      hints:
        - "The intersections satisfy $y^2-2y=-y$."
      solution: |-
        Intersections: $y^2-2y=-y$ gives $y^2-y=0$, so $y=0$ or $y=1$. For $0<y<1$ the line $x=-y$ is to the right of the parabola (at $y=\tfrac12$: $-\tfrac12>-\tfrac34$). Then

        $$A=\int_0^1\big(-y-(y^2-2y)\big)\,dy=\int_0^1(y-y^2)\,dy=\dfrac12-\dfrac13=\dfrac16.$$
      verify:
        - expr: "integrate(integrate(1, x, y^2-2*y, -y), y, 0, 1)"
          equals: "1/6"
    - id: are-03
      statement: |-
        The area bounded by $y^2=4x$ and $x^2=4y$. The unit is squ: give the number only.
      answerType: number
      answer: "16/3"
      hints:
        - |-
          The curves meet at $(0,0)$ and $(4,4)$. Write them as $y=2\sqrt x$ and $y=\dfrac{x^2}{4}$.
      solution: |-
        The curves meet at $(0,0)$ and $(4,4)$. For $0<x<4$ the curve $y=2\sqrt x$ is above $y=\dfrac{x^2}{4}$. Then

        $$A=\int_0^4\left(2\sqrt x-\dfrac{x^2}{4}\right)dx=\left[\dfrac43x^{\frac{3}{2}}-\dfrac{x^3}{12}\right]_0^4=\dfrac{32}{3}-\dfrac{16}{3}=\dfrac{16}{3}.$$
      verify:
        - expr: "integrate(integrate(1, y, x^2/4, 2*sqrt(x)), x, 0, 4)"
          equals: "16/3"
    - id: are-04
      statement: |-
        The area bounded by $x=4-y^2$ and $x+2y=4$. The unit is squ: give the number only.
      answerType: number
      answer: "4/3"
      hints:
        - |-
          Intersections: $4-y^2=4-2y$. Integrate in $x$ first.
      solution: |-
        Intersections: $4-y^2=4-2y$ gives $y^2-2y=0$, so $y=0$ or $y=2$. For $0<y<2$ the parabola is to the right of the line (at $y=1$: $3>2$). Then

        $$A=\int_0^2\big((4-y^2)-(4-2y)\big)\,dy=\int_0^2(2y-y^2)\,dy=4-\dfrac83=\dfrac43.$$
      verify:
        - expr: "integrate(integrate(1, x, 4-2*y, 4-y^2), y, 0, 2)"
          equals: "4/3"
      note: "On the printed sheet this exercise is numbered 3 a second time; the numbering here continues from the previous exercise."
    - id: are-05
      statement: |-
        The area bounded by $x^2+y^2=4$. The unit is squ: give the number only.
      answerType: expression
      answer: "4*pi"
      hints:
        - |-
          Use polar coordinates: $0\le r\le2$, $0\le\theta\le2\pi$.
      solution: |-
        In polar coordinates the disc is $0\le r\le2$, $0\le\theta\le2\pi$: $A=\displaystyle\int_0^{2\pi}\int_0^2r\,dr\,d\theta=2\pi\cdot2=4\pi$. (This is $\pi R^2$ with $R=2$.)
      verify:
        - expr: "integrate(integrate(r, r, 0, 2), t, 0, 2*pi)"
          equals: "4*pi"
    - id: are-06
      statement: |-
        The area bounded by the ellipse $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$ (with $a,b>0$). The unit is squ: give the number only.
      answerType: expression
      answer: "pi*a*b"
      variables:
        [a, b]
      hints:
        - |-
          Stretch the polar coordinates: $x=ar\cos\theta$, $y=br\sin\theta$. The Jacobian is $abr$.
      solution: |-
        Put $x=ar\cos\theta$ and $y=br\sin\theta$. The ellipse is $r=1$ and the disc is $0\le r\le1$, $0\le\theta\le2\pi$. The Jacobian is $\left|\begin{matrix}a\cos\theta&-ar\sin\theta\\b\sin\theta&br\cos\theta\end{matrix}\right|=abr$. Then

        $$A=\int_0^{2\pi}\int_0^1abr\,dr\,d\theta=ab\cdot\dfrac12\cdot2\pi=\pi ab.$$
      verify:
        - expr: "integrate(integrate(a*b*r, r, 0, 1), t, 0, 2*pi)"
          equals: "pi*a*b"
      note: "On the printed sheet this exercise is numbered 5; the numbering here continues from the previous exercise."
- id: more-area
  task: |-
    More practice: areas between curves.
  format: "Type an exact value such as `11/6` or `e-2`."
  items:
    - id: mp-ar-1
      statement: |-
        Find the area of the region between $y=x^2$ and $y=x+2$. The unit is squ: give the number only.
      answerType: number
      answer: "9/2"
      hints:
        - "Sketch the region, find where the curves meet, and integrate (upper curve) $-$ (lower curve)."
      solution: |-
        They meet where $x^2=x+2$, at $x=-1$ and $x=2$. $A=\displaystyle\int_{-1}^{2}\left(x + 2-\left(x^{2}\right)\right)dx=\frac{9}{2}$.
    - id: mp-ar-2
      statement: |-
        Find the area of the region between $y=x^3$ and $y=x$ for $0\le x\le1$. The unit is squ: give the number only.
      answerType: number
      answer: "1/4"
      hints:
        - "Sketch the region, find where the curves meet, and integrate (upper curve) $-$ (lower curve)."
      solution: |-
        On $[0,1]$ the line is above the cubic. $A=\displaystyle\int_{0}^{1}\left(x-\left(x^{3}\right)\right)dx=\frac{1}{4}$.
    - id: mp-ar-3
      statement: |-
        Find the area of the region bounded by $y=e^x$, $y=1$ and $x=1$. The unit is squ: give the number only.
      answerType: expression
      answer: "-2 + e"
      hints:
        - "Sketch the region, find where the curves meet, and integrate (upper curve) $-$ (lower curve)."
      solution: |-
        The curve $y=e^x$ meets $y=1$ at $x=0$. $A=\displaystyle\int_{0}^{1}\left(e^{x}-\left(1\right)\right)dx=-2 + e$.
    - id: mp-ar-4
      statement: |-
        Find the area of the region bounded by $y=\ln x$, the $x$-axis and the line $x=e$. The unit is squ: give the number only.
      answerType: number
      answer: "1"
      hints:
        - "Sketch the region, find where the curves meet, and integrate (upper curve) $-$ (lower curve)."
      solution: |-
        The curve meets the $x$-axis at $x=1$. $A=\displaystyle\int_{1}^{e}\left(\ln{\left(x \right)}-\left(0\right)\right)dx=1$.
    - id: mp-ar-5
      statement: |-
        Find the area of the region bounded by $y=4-x^2$ and the $x$-axis. The unit is squ: give the number only.
      answerType: number
      answer: "32/3"
      hints:
        - "Sketch the region, find where the curves meet, and integrate (upper curve) $-$ (lower curve)."
      solution: |-
        The parabola meets the axis at $x=\pm2$. $A=\displaystyle\int_{-2}^{2}\left(4 - x^{2}-\left(0\right)\right)dx=\frac{32}{3}$.
    - id: mp-ar-6
      statement: |-
        Find the area of the region between $y=x^2$ and $y=2-x^2$. The unit is squ: give the number only.
      answerType: number
      answer: "8/3"
      hints:
        - "Sketch the region, find where the curves meet, and integrate (upper curve) $-$ (lower curve)."
      solution: |-
        They meet where $x^2=2-x^2$, at $x=\pm1$. $A=\displaystyle\int_{-1}^{1}\left(2 - x^{2}-\left(x^{2}\right)\right)dx=\frac{8}{3}$.
    - id: mp-ar-7
      statement: |-
        Find the area of the region between $y=\sqrt x$ and $y=x^2$. The unit is squ: give the number only.
      answerType: number
      answer: "1/3"
      hints:
        - "Sketch the region, find where the curves meet, and integrate (upper curve) $-$ (lower curve)."
      solution: |-
        They meet at $x=0$ and $x=1$. $A=\displaystyle\int_{0}^{1}\left(\sqrt{x}-\left(x^{2}\right)\right)dx=\frac{1}{3}$.
    - id: mp-ar-8
      statement: |-
        Find the area of the region between $y=\sin x$ and $y=\cos x$ for $0\le x\le\dfrac\pi4$. The unit is squ: give the number only.
      answerType: expression
      answer: "-1 + sqrt(2)"
      hints:
        - "Sketch the region, find where the curves meet, and integrate (upper curve) $-$ (lower curve)."
      solution: |-
        On this interval cosine is above sine. $A=\displaystyle\int_{0}^{\frac{\pi}{4}}\left(\cos{\left(x \right)}-\left(\sin{\left(x \right)}\right)\right)dx=-1 + \sqrt{2}$.
    - id: mp-ar-9
      statement: |-
        Find the area of the region bounded by $x=y^2$ and $x=y+2$. The unit is squ: give the number only.
      answerType: number
      answer: "9/2"
      hints:
        - |-
          Integrate with respect to $y$: the curves meet where $y^2=y+2$.
      solution: |-
        They meet at $y=-1$ and $y=2$. On this interval the line $x=y+2$ is to the right of the parabola, so $A=\displaystyle\int_{-1}^{2}\left(y+2-y^2\right)dy=\dfrac92$.
